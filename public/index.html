,"stage_id":"S05","stage_number":5,"number_in_stage":5,"title":"配列の要素を順に足す","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["for...of","累積"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"配列 scores の点数を合計して 245 と表示したい。【空欄1】に入れるものを答えてください。","code":"const scores = [70, 85, 90];\nlet total = 0;\nfor (const s of __1__) {\n  total += s;\n}\nconsole.log(total);","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["scores"],"quote_insensitive":false}],"expected_output":"245"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"for...of は、配列そのものを渡すと要素を1つずつ取り出してくれるから。","explanation":"for (const s of scores) と書くと、scores の要素 70, 85, 90 が順に s に入ります。total に足していくと 245 です。","common_mistakes":[{"blank":"b1","answer":"scores[0]","reason":"scores[0] は最初の要素 70（数値）で、数値は for...of で順に取り出せないため TypeError になります。配列そのものを書きます。"}],"hint":"of のあとには、取り出し元の配列の名前を書きます。","feedback_correct":"正解！for...of で配列を順に処理できます。","feedback_incorrect":"惜しい！取り出す元の配列そのものを書きましょう。"},{"id":"JS-046","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":6,"title":"includes と indexOf","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["includes","indexOf"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"const colors = [\"赤\", \"青\", \"緑\"];\nconsole.log(colors.includes(\"青\"));\nconsole.log(colors.indexOf(\"緑\"));\nconsole.log(colors.indexOf(\"白\"));","answer":{"expected_output":"true\n2\n-1"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"「青」は含まれて true、「緑」の添字は 2、「白」は見つからず -1 になるから。","explanation":"indexOf は、見つかった最初の位置の添字を返します。見つからないときの -1 は、「その位置はない」という目印として、if の条件などによく使われます。","common_mistakes":[{"answer":"true\n3\n-1","reason":"添字は 0 から始まるので、「緑」は3番目ですが添字は 2 です。"},{"answer":"true\n2\nundefined","reason":"indexOf は、見つからないときに undefined ではなく -1 を返します。"}],"hint":"見つからないときの戻り値は、特別な数値です。","feedback_correct":"正解！見つからないと -1 です。","feedback_incorrect":"惜しい！添字は 0 から数えます。"},{"id":"JS-047","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":7,"title":"const の配列と push","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["const","push"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"const nums = [1, 2]; と宣言した配列に、nums.push(3); を実行するとどうなりますか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"要素が追加される。const は変数への再代入を禁止するだけである"},{"id":"c2","text":"TypeError になる。const の配列は変更できない"},{"id":"c3","text":"新しい配列が作られ、変数 nums がそれを指すように変わる"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"const は再代入を禁止するだけで、配列の中身の変更までは禁止しないから。","explanation":"配列やオブジェクトは「中身を持つ入れ物」で、const の変数はその入れ物を指します。入れ物の中身を変えることはできますが、別の入れ物を指すように再代入することはできません。","wrong_answer_reasons":{"c2":"const が禁止するのは、変数 nums そのものへの再代入（nums = [] など）だけです。配列の中身の変更はできます。","c3":"push は、元の配列そのものに要素を追加します。新しい配列は作られず、nums が指す先も変わりません。"},"hint":"const が禁止しているのは「変数への再代入」です。","feedback_correct":"正解！const でも中身は変更できます。","feedback_incorrect":"惜しい！const が禁止するのは再代入だけです。"},{"id":"JS-048","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":8,"title":"1つ多くまわるループ","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["for","length","NaN","範囲外"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"点数の合計 245 を求めるつもりが、NaN と表示されます。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":"const scores = [70, 85, 90];\nlet total = 0;\nfor (let i = 0; i <= scores.length; i++) {\n  total += scores[i];\n}\nconsole.log(total);","answer":{"target_line":3,"accepted":["for (let i = 0; i < scores.length; i++) {","for (let i = 0; i < scores.length; i++){","for (let i = 0; i <= scores.length - 1; i++) {"],"quote_insensitive":false,"fixed_code":"const scores = [70, 85, 90];\nlet total = 0;\nfor (let i = 0; i < scores.length; i++) {\n  total += scores[i];\n}\nconsole.log(total);","expected_output":"245","buggy_output":"NaN"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"添字は 0〜length - 1 までなので、条件は i < scores.length にする必要があるから。","explanation":"i <= scores.length だと、i が 3 のときも続けます。scores[3] は undefined で、数値に undefined を足すと NaN になります。範囲外の読み取りがエラーにならないので、結果を見て気づく必要があります。","common_mistakes":[{"answer":"for (let i = 0; i <= scores.length; i++) {","reason":"元のコードのままです。i が 3 のとき scores[3] は undefined で、total += undefined が NaN になります。"}],"hint":"最後の添字は length より1つ小さい値です。","feedback_correct":"正解！添字の範囲を正しくしました。","feedback_incorrect":"惜しい！i が最後にいくつになるか確認しましょう。"},{"id":"JS-049","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":9,"title":"slice と join","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["slice","join"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"const a = [1, 2, 3, 4, 5];\nconsole.log(a.slice(1, 3).join(\"-\"));\nconsole.log(a.join(\"\"));","choice_format":"code","choices":[{"id":"c1","text":"2-3-4\n12345"},{"id":"c2","text":"2-3\n12345"},{"id":"c3","text":"1-2\n1,2,3,4,5"}],"answer":{"correct_choice_id":"c2","expected_output":"2-3\n12345"},"grading":{"method":"choice_id"},"rationale":"slice(1, 3) は添字 1 と 2 の要素を取り出し、join(\"\") は区切りなしでつなぐから。","explanation":"slice(開始, 終了) は、開始の位置から、終了の位置の1つ手前までを取り出します（終了は含まれない）。join の引数に何も入れないつなぎ方（\"\"）だと、数字がそのまま並びます。","wrong_answer_reasons":{"c1":"slice(1, 3) の終わりの位置（3）の要素は含まれません。添字 1 と 2 の「2」と「3」だけです。","c3":"slice の開始は添字 1（2つ目の要素）です。また、join(\"\") は空の文字列でつなぐので、カンマは入りません。"},"hint":"slice の終了の位置は含まれません。","feedback_correct":"正解！slice の終了は含まれません。","feedback_incorrect":"惜しい！slice の範囲と、join の区切りを確認しましょう。"},{"id":"JS-050","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":10,"title":"偶数だけを集める","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["配列","push","for...of","%","join"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"配列 nums に整数が入っています。偶数だけを順番に集めて、, でつないだ文字列を console.log で表示するコードを書いてください（偶数がなければ空の行が表示されます）。くり返し（for / while）を使うこと。","code":null,"prefix_code":"const nums = [1, 2, 3, 4, 5, 6];","starter_code":"// nums はあらかじめ用意されています\n","answer_format":"javascript","answer":{"reference_solution":"const evens = [];\nfor (const n of nums) {\n  if (n % 2 === 0) {\n    evens.push(n);\n  }\n}\nconsole.log(evens.join(\",\"));","alternative_solutions":["const evens = [];\nfor (let i = 0; i < nums.length; i++) {\n  if (nums[i] % 2 === 0) evens.push(nums[i]);\n}\nconsole.log(evens.join(\",\"));"],"rejected_examples":[{"code":"console.log(nums.join(\",\"));","reason":"すべての要素を表示しています。偶数だけを集めるには、if で判定して push します。"},{"code":"const evens = [];\nfor (const n of nums) {\n  if (n % 2 === 1) {\n    evens.push(n);\n  }\n}\nconsole.log(evens.join(\",\"));","reason":"n % 2 === 1 は奇数の条件です。偶数は 2 で割った余りが 0 です。"}]},"grading":{"method":"test_cases","engine":"js_worker","tests":[{"kind":"stdout","setup":"const nums = [1, 2, 3, 4, 5, 6];","expected_stdout":"2,4,6\n","visible":true},{"kind":"stdout","setup":"const nums = [2];","expected_stdout":"2\n","visible":false},{"kind":"stdout","setup":"const nums = [1, 3];","expected_stdout":"\n","visible":false},{"kind":"stdout","setup":"const nums = [10, 15, 20];","expected_stdout":"10,20\n","visible":false},{"kind":"stdout","setup":"const nums = [0, 3, -4];","expected_stdout":"0,-4\n","visible":false}],"required_patterns":[],"required_any_patterns":[{"pattern":"\\bfor\\b","message":"for を使ってください"},{"pattern":"\\bwhile\\b","message":"while を使ってください"}],"forbidden_patterns":[],"timeout_sec":3,"normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"for で1つずつ調べ、偶数のときだけ別の配列に push し、最後に join でつなぐから。","explanation":"空の配列 evens を用意し、くり返しの中で n % 2 === 0 のときだけ push します。最後に evens.join(\",\") で文字列にします。偶数がないときは、空の配列の join が空の文字列になります。","hint":"空の配列を用意し、条件に合う要素だけを push します。","feedback_correct":"正解！条件に合う要素だけを集められました。","feedback_incorrect":"惜しい！偶数がないときや、0・負の数のときの結果を確認しましょう。"},{"id":"JS-051","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":1,"title":"プロパティの読み出し","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["オブジェクト","プロパティ","undefined"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"const user = { name: \"Hana\", age: 12 };\nconsole.log(user.name);\nconsole.log(user[\"age\"]);\nconsole.log(user.city);","choice_format":"code","choices":[{"id":"c1","text":"Hana\n12\nundefined"},{"id":"c2","text":"Hana\n12\nエラー"},{"id":"c3","text":"name\nage\nundefined"}],"answer":{"correct_choice_id":"c1","expected_output":"Hana\n12\nundefined"},"grading":{"method":"choice_id"},"rationale":"user.name は \"Hana\"、user[\"age\"] は 12、存在しない city は undefined になるから。","explanation":"ドット記法と角括弧記法は、どちらもプロパティの値を取り出します。存在しないキーを読んでも、エラーにはならず undefined になります。","wrong_answer_reasons":{"c2":"存在しないプロパティを読んでも、エラーにはならず undefined になります。","c3":"user.name は、キーの名前ではなく、そのキーに入っている値を返します。"},"hint":"存在しないキーを読むと、どうなるでしょうか。","feedback_correct":"正解！存在しないプロパティは undefined です。","feedback_incorrect":"惜しい！値を取り出すこと、存在しないキーの扱いを確認しましょう。"},{"id":"JS-052","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":2,"title":"追加・更新・削除","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["プロパティの追加・更新・削除","JSON.stringify"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください。","code":"const user = { name: \"Hana\", age: 12 };\nuser.age = 13;\nuser.city = \"東京\";\ndelete user.name;\nconsole.log(JSON.stringify(user));","answer":{"expected_output":"{\"age\":13,\"city\":\"東京\"}"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"age は更新、city は追加、name は削除されるから。","explanation":"オブジェクトは、代入でプロパティの更新・追加ができ、delete で削除できます。JSON.stringify は、キーも文字列は \" \" で囲んだ JSON という文字列にします。","common_mistakes":[{"answer":"{\"name\":\"Hana\",\"age\":13,\"city\":\"東京\"}","reason":"delete user.name で name のプロパティが削除されます。"},{"answer":"{\"age\":12,\"city\":\"東京\"}","reason":"user.age = 13 で age は 12 から 13 に更新されます。"}],"hint":"1行ずつ、user の中身がどう変わるか書き出しましょう。","feedback_correct":"正解！プロパティの変化を追えました。","feedback_incorrect":"惜しい！更新・追加・削除をそれぞれ確認しましょう。"},{"id":"JS-053","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":3,"title":"変数に入れたキー名で取り出す","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["角括弧記法","ドット記法"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 key に \"age\" が入っています。オブジェクト user の age の値を、変数 key を使って取り出す正しい書き方はどれですか？","code":"const user = { name: \"Hana\", age: 12 };\nconst key = \"age\";","choice_format":"code","choices":[{"id":"c1","text":"user.key"},{"id":"c2","text":"user[key]"},{"id":"c3","text":"user[\"key\"]"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"角括弧の中に変数を書くと、その変数の値がキー名として使われるから。","explanation":"ドット記法の後ろは、そのままプロパティの名前です。変数の値をキー名にしたいときは、角括弧記法 user[key] を使います。Object.keys と組み合わせたくり返しでよく使います。","wrong_answer_reasons":{"c1":"user.key は、key という名前のプロパティを探すので undefined になります。変数の中身は使われません。","c3":"user[\"key\"] も、key という名前のプロパティを探します。変数ではなく文字列 \"key\" だからです。"},"hint":"変数の値をキー名にするには、変数を [ ] の中に入れます。","feedback_correct":"正解！変数をキー名に使うときは角括弧記法です。","feedback_incorrect":"惜しい！ドット記法は、そのままの名前を探します。"},{"id":"JS-054","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":4,"title":"ネストしたプロパティ","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["ネスト"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"book の著者の名前（Taro）を表示します。【空欄1】に入れる式を答えてください。","code":"const book = { title: \"JS入門\", author: { name: \"Taro\" } };\nconsole.log(book.__1__);","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["author.name","author[\"name\"]"],"quote_insensitive":true}],"expected_output":"Taro"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"ネストしたプロパティは、ドットをつなげて奥まで読むから。","explanation":"book.author で author のオブジェクトを取り出し、さらに .name でその中の name を読みます。book.name だと、book 直下に name はないので undefined です。","common_mistakes":[{"blank":"b1","answer":"name","reason":"book の直下には name というプロパティはありません。author の中にあるので、book.author.name と、ドットでつなぎます。"}],"hint":"author の中の name を、ドットでつないで読みます。","feedback_correct":"正解！ドットをつなげて奥まで読みます。","feedback_incorrect":"惜しい！book の直下ではなく、author の中にあります。"},{"id":"JS-055","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":5,"title":"undefined の中身を読むエラー","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["undefined","TypeError","ネスト"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"user の住所の city を表示するはずが、TypeError になります。原因はどれですか？","code":"const user = { name: \"Hana\" };\nconsole.log(user.address.city);","choice_format":"text","choices":[{"id":"c1","text":"city が JavaScript の予約語だから"},{"id":"c2","text":"user.address が undefined なので、その中の city を読めないから"},{"id":"c3","text":"console.log の括弧の書き方が間違っているから"}],"answer":{"correct_choice_id":"c2","fixed_code":"const user = { name: \"Hana\", address: { city: \"東京\" } };\nconsole.log(user.address.city);","expected_output":"東京","buggy_error":"TypeError"},"grading":{"method":"choice_id"},"rationale":"user に address というプロパティがなく undefined になり、その中身を読もうとして TypeError になるから。","explanation":"user.address は undefined です。undefined に対して .city と読もうとすると、読む対象がないため TypeError（Cannot read properties of undefined）になります。address を持たせるか、読む前に存在を確認します。","wrong_answer_reasons":{"c1":"city は、プロパティ名として自由に使える普通の名前で、予約語ではありません。","c3":"console.log の書き方は正しいです。エラーの原因は、読もうとしているプロパティの側にあります。"},"hint":"user に address プロパティはありますか？","feedback_correct":"正解！undefined の中身は読めません。","feedback_incorrect":"惜しい！user.address の値は何か考えてみましょう。"},{"id":"JS-056","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":6,"title":"Object.keys でくり返す","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["Object.keys","for...of","角括弧記法"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください。","code":"const scores = { math: 80, english: 70 };\nlet total = 0;\nfor (const key of Object.keys(scores)) {\n  total += scores[key];\n}\nconsole.log(total);","answer":{"expected_output":"150"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"math と english の2つの値 80 と 70 が足されて 150 になるから。","explanation":"Object.keys(scores) は [\"math\", \"english\"] です。key が math のとき scores[key] は 80、english のとき 70 で、total に足されて 150 になります。","common_mistakes":[{"answer":"80","reason":"くり返しは、キーの数（2回）だけ行われ、math と english の両方が足されます。"},{"answer":"math70","reason":"total は数値で、値を足していきます。キーの文字は足されません。"}],"hint":"key が各回で何になるか、書き出してみましょう。","feedback_correct":"正解！キーと値を取り出して足せました。","feedback_incorrect":"惜しい！くり返しごとの key と scores[key] を追いましょう。"},{"id":"JS-057","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":7,"title":"オブジェクトの配列","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["オブジェクトの配列","length"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"const users = [\n  { name: \"A\", age: 20 },\n  { name: \"B\", age: 17 },\n];\nconsole.log(users[1].name);\nconsole.log(users.length);\nconsole.log(users[0].age + users[1].age);","choice_format":"code","choices":[{"id":"c1","text":"B\n2\n37"},{"id":"c2","text":"A\n2\n37"},{"id":"c3","text":"B\n4\n3720"}],"answer":{"correct_choice_id":"c1","expected_output":"B\n2\n37"},"grading":{"method":"choice_id"},"rationale":"users[1] は2番目の B で、要素数は 2、年齢の合計は 20 + 17 = 37 だから。","explanation":"オブジェクトの配列では、添字で何番目かを選び、ドットでプロパティを読みます。length は配列の要素数なので、プロパティの数は数えません。","wrong_answer_reasons":{"c2":"users[1] は添字 1、つまり2番目のオブジェクトで、name は \"B\" です。","c3":"length は配列の要素数（オブジェクトの数）なので 2 です。age は数値同士の足し算で 37 です。"},"hint":"users[1] は、添字 0 から数えて何番目の要素でしょう？","feedback_correct":"正解！添字とドットを組み合わせて読めました。","feedback_incorrect":"惜しい！添字は 0 から始まります。"},{"id":"JS-058","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":8,"title":"プロパティの存在確認","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["in演算子"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"オブジェクト user に、age というプロパティがあるかどうかを調べる式はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"user.includes(\"age\")"},{"id":"c2","text":"\"age\" in user"},{"id":"c3","text":"user.age()"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"in 演算子は、プロパティの存在を true / false で返すから。","explanation":"\"age\" in user は、user に age というプロパティがあれば true を返します。user.age !== undefined と書いて調べる方法もあります。","wrong_answer_reasons":{"c1":"includes は配列と文字列のメソッドです。オブジェクトにはないので、TypeError になります。","c3":"user.age() は、age の値を「関数」として呼び出そうとします。存在確認ではなく、値が関数でなければ TypeError になります。"},"hint":"「〜の中に」を意味する英単語を使う演算子です。","feedback_correct":"正解！in 演算子で存在確認できます。","feedback_incorrect":"惜しい！オブジェクトには includes がありません。"},{"id":"JS-059","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":9,"title":"数え方のミス","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["オブジェクト","カウント","論理エラー"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"文字の出現回数を数えるつもりが、結果が {\"a\":1,\"b\":0,\"c\":0} になります（正しくは {\"a\":2,\"b\":1,\"c\":1}）。4行目を正しく書き直して入力してください（4行目の内容だけを入力）。","code":"const counts = {};\nfor (const ch of [\"a\", \"b\", \"c\", \"a\"]) {\n  if (counts[ch] === undefined) {\n    counts[ch] = 0;\n  } else {\n    counts[ch] += 1;\n  }\n}\nconsole.log(JSON.stringify(counts));","answer":{"target_line":4,"accepted":["counts[ch] = 1;","counts[ch]=1;","counts[ch] = 1"],"quote_insensitive":false,"fixed_code":"const counts = {};\nfor (const ch of [\"a\", \"b\", \"c\", \"a\"]) {\n  if (counts[ch] === undefined) {\n    counts[ch] = 1;\n  } else {\n    counts[ch] += 1;\n  }\n}\nconsole.log(JSON.stringify(counts));","expected_output":"{\"a\":2,\"b\":1,\"c\":1}","buggy_output":"{\"a\":1,\"b\":0,\"c\":0}"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"初めて出てきた文字は、その時点で1回出現しているので、値を 1 にするから。","explanation":"if の側は「その文字が初めて出てきた」ときに実行されます。0 を入れると、初めの1回が数えられません。1 を入れ、2回目以降は += 1 で増やします。","common_mistakes":[{"answer":"counts[ch] = 0;","reason":"元のコードのままです。初めて出てきた文字は、その時点で1回出ているので、初期値は 1 です。"}],"hint":"初めてその文字が出た時点で、出現回数はいくつですか？","feedback_correct":"正解！初回を 1 として数えました。","feedback_incorrect":"惜しい！「初めて出てきた」とき、すでに1回出ています。"},{"id":"JS-060","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S06","stage_number":6,"number_in_stage":10,"title":"買い物かごの合計金額","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["オブジェクトの配列","for...of","累積"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"配列 cart に、商品のオブジェクト（name・price・count）が入っています。価格 × 個数 の合計金額を console.log で表示するコードを書いてください。くり返し（for / while）を使うこと。","code":null,"prefix_code":"const cart = [{ name: \"りんご\", price: 120, count: 2 }, { name: \"みかん\", price: 80, count: 1 }];","starter_code":"// cart はあらかじめ用意されています\n","answer_format":"javascript","answer":{"reference_solution":"let total = 0;\nfor (const item of cart) {\n  total += item.price * item.count;\n}\nconsole.log(total);","alternative_solutions":["let total = 0;\nfor (let i = 0; i < cart.length; i++) {\n  total = total + cart[i].price * cart[i].count;\n}\nconsole.log(total);"],"rejected_examples":[{"code":"let total = 0;\nfor (const item of cart) {\n  total += item.price;\n}\nconsole.log(total);","reason":"個数（count）を掛けていません。りんごが2個なら、価格を2回足す必要があります。"},{"code":"let total = 0;\nfor (const item of cart) {\n  total += item.price * item.count;\n}","reason":"最後に console.log で合計を表示していません。"}]},"grading":{"method":"test_cases","engine":"js_worker","tests":[{"kind":"stdout","setup":"const cart = [{ name: \"りんご\", price: 120, count: 2 }, { name: \"みかん\", price: 80, count: 1 }];","expected_stdout":"320\n","visible":true},{"kind":"stdout","setup":"const cart = [];","expected_stdout":"0\n","visible":false},{"kind":"stdout","setup":"const cart = [{ name: \"本\", price: 500, count: 1 }];","expected_stdout":"500\n","visible":false},{"kind":"stdout","setup":"const cart = [{ name: \"A\", price: 100, count: 3 }, { name: \"B\", price: 50, count: 2 }, { name: \"C\", price: 200, count: 3 }];","expected_stdout":"1000\n","visible":false}],"required_patterns":[],"required_any_patterns":[{"pattern":"\\bfor\\b","message":"for を使ってください"},{"pattern":"\\bwhile\\b","message":"while を使ってください"}],"forbidden_patterns":[],"timeout_sec":3,"normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"商品ごとに 価格 × 個数 を計算して、合計用の変数に足していくから。","explanation":"cart の要素はオブジェクトなので、item.price と item.count で値を取り出せます。空の cart のときは、くり返しが1回も行われず、合計は 0 のままです。","hint":"合計用の変数を 0 で用意し、各商品の price * count を足します。","feedback_correct":"正解！オブジェクトの配列を集計できました。","feedback_incorrect":"惜しい！個数を掛けているか、空の cart でも動くかを確認しましょう。"},{"id":"JS-061","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":1,"title":"戻り値を計算に使う","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["return","戻り値"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールには何が表示されますか？","code":"function add(a, b) {\n  return a + b;\n}\nconsole.log(add(3, 4) * 2);","choice_format":"code","choices":[{"id":"c1","text":"7"},{"id":"c2","text":"14"},{"id":"c3","text":"add(3, 4) * 2"}],"answer":{"correct_choice_id":"c2","expected_output":"14"},"grading":{"method":"choice_id"},"rationale":"add(3, 4) が 7 を返し、それを2倍して 14 になるから。","explanation":"関数を呼び出した式は、その戻り値に置き換わって計算が進みます。add(3, 4) は 7 になるので、7 * 2 = 14 が console.log に渡されます。","wrong_answer_reasons":{"c1":"add(3, 4) が 7 を返したあと、さらに * 2 が計算されるので 14 になります。","c3":"console.log は式を計算した結果を表示します。コードの文字がそのまま表示されることはありません。"},"hint":"まず add(3, 4) を 7 に置き換えて考えましょう。","feedback_correct":"正解！呼び出しは戻り値に置き換わります。","feedback_incorrect":"惜しい！関数呼び出しの部分を戻り値に置き換えてみましょう。"},{"id":"JS-062","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":2,"title":"return のない関数の戻り値","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["return","undefined","console.log"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"function show(x) {\n  console.log(x);\n}\nconst r = show(5);\nconsole.log(r);","answer":{"expected_output":"5\nundefined"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"show は表示するだけで値を返さないため、r は undefined になるから。","explanation":"show(5) の実行中に 5 が表示されます。しかし return がないので戻り値は undefined になり、r = undefined です。最後の console.log(r) が undefined を表示します。","common_mistakes":[{"answer":"5","reason":"r に入っているのは show の戻り値です。return がないので undefined で、それも console.log で表示されます。"},{"answer":"5\n5","reason":"console.log は表示するだけで、値は返しません。r には 5 ではなく undefined が入ります。"}],"hint":"show は return していません。r には何が入るでしょう？","feedback_correct":"正解！return がないと undefined になります。","feedback_incorrect":"惜しい！r に入る値と、表示のタイミングを分けて考えましょう。"},{"id":"JS-063","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":3,"title":"定義しただけでは動かない","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["関数の定義","関数の呼び出し"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードだけを実行すると、コンソールには何が表示されますか？","code":"function greet() {\n  console.log(\"hi\");\n}","choice_format":"text","choices":[{"id":"c1","text":"hi"},{"id":"c2","text":"SyntaxError が表示される"},{"id":"c3","text":"何も表示されない"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"function は処理に名前を付けて定義するだけで、呼び出すまで実行されないから。","explanation":"関数の定義は「こういう部品を作ります」という宣言です。実行したいときは greet() のように呼び出します。","wrong_answer_reasons":{"c1":"関数は、定義しただけでは実行されません。greet() と呼び出すと、はじめて hi が表示されます。","c2":"書き方は正しいので、エラーにはなりません。"},"hint":"コードの最後に greet() という行はありますか？","feedback_correct":"正解！定義だけでは実行されません。","feedback_incorrect":"惜しい！呼び出しの行があるか確認しましょう。"},{"id":"JS-064","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":4,"title":"アロー関数の記号","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["アロー関数"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"引数を2倍にして返すアロー関数です。8 と表示されるように、【空欄1】に入れる記号を答えてください。","code":"const double = (n) __1__ n * 2;\nconsole.log(double(4));","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["=>"],"quote_insensitive":false}],"expected_output":"8"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"アロー関数は、引数と本体を => でつないで書くから。","explanation":"(n) => n * 2 は、「n を受け取って n * 2 を返す関数」です。{ } がなければ、式の結果がそのまま戻り値になります。","common_mistakes":[{"blank":"b1","answer":"=","reason":"= は代入です。アロー関数の矢印は => と書きます。= だけだと SyntaxError になります。"}],"hint":"等号（=）と大なり記号（>）を組み合わせた、矢印の形の記号です。","feedback_correct":"正解！アロー関数は => で書きます。","feedback_incorrect":"惜しい！矢印の形の記号を入力しましょう。"},{"id":"JS-065","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":5,"title":"デフォルト引数","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["デフォルト引数","**"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"function power(base, exp = 2) {\n  return base ** exp;\n}\nconsole.log(power(3));\nconsole.log(power(2, 5));","choice_format":"code","choices":[{"id":"c1","text":"9\n32"},{"id":"c2","text":"6\n32"},{"id":"c3","text":"9\n10"}],"answer":{"correct_choice_id":"c1","expected_output":"9\n32"},"grading":{"method":"choice_id"},"rationale":"exp を省略すると 2 が使われ、渡すとその値が使われるから。","explanation":"power(3) は exp が省略されたので 2 が入り、3 ** 2 = 9。power(2, 5) は exp = 5 なので 2 ** 5 = 32 です。","wrong_answer_reasons":{"c2":"** は累乗です。power(3) は 3 を2回かける 3 ** 2 = 9 で、3 × 2 = 6 ではありません。","c3":"power(2, 5) は 2 ** 5 = 32 です。足し算の 2 + 5 でも 10 でもありません。"},"hint":"1回目は exp を省略しています。デフォルト値はいくつ？","feedback_correct":"正解！省略するとデフォルト値が使われます。","feedback_incorrect":"惜しい！省略したときの exp の値と、** の意味を見直しましょう。"},{"id":"JS-066","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":6,"title":"合計が1にしかならない","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["return","for","ループ"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"[1, 2, 3] の合計 6 を返す関数のつもりが、1 が返ってきます。原因を正しく直す方法はどれですか？","code":"function total(nums) {\n  let s = 0;\n  for (const n of nums) {\n    s += n;\n    return s;\n  }\n}\nconsole.log(total([1, 2, 3]));","choice_format":"text","choices":[{"id":"c1","text":"let s = 0; の行を for の中に移す"},{"id":"c2","text":"return s; を for の外（ループが終わった後）に書く"},{"id":"c3","text":"return を console.log に変える"}],"answer":{"correct_choice_id":"c2","fixed_code":"function total(nums) {\n  let s = 0;\n  for (const n of nums) {\n    s += n;\n  }\n  return s;\n}\nconsole.log(total([1, 2, 3]));","expected_output":"6","buggy_output":"1"},"grading":{"method":"choice_id"},"rationale":"return は関数をその場で終了するため、ループの中に書くと1回で終わってしまうから。","explanation":"return を実行した時点で関数は終了します。for の中に書くと、1回目の足し算（s = 1）の直後に返ります。return をループの外へ出せば、足し算がすべて終わってから合計が返ります。","wrong_answer_reasons":{"c1":"for の中に移すと、毎回 s が 0 に戻り、合計できません。","c3":"return がなくなると、戻り値は undefined になり、外側の console.log は undefined を表示します。"},"hint":"return を実行すると、その関数はどうなりますか？","feedback_correct":"正解！return の位置が原因でした。","feedback_incorrect":"惜しい！return を実行するとその場で関数が終わることを思い出しましょう。"},{"id":"JS-067","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":7,"title":"スコープ","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["スコープ","ローカル変数","ブロックスコープ"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"let x = 100;\nfunction f() {\n  let x = 10;\n  return x + 1;\n}\nconsole.log(f());\nconsole.log(x);\n{\n  let y = 1;\n}\nconsole.log(typeof y);","answer":{"expected_output":"11\n100\nundefined"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"関数の中の x は外の x と別物で、{ } の中の y は外では存在しないから。","explanation":"f() の中では x = 10 なので 11 を返します。外の x は 100 のままです。let は { } の中だけで有効なので、外から y を使おうとしても、存在しない変数として扱われます（typeof は undefined を返します）。","common_mistakes":[{"answer":"11\n11\nundefined","reason":"関数の中の x は別の変数（ローカル変数）で、外の x の値は書き換わりません。"},{"answer":"101\n100\nnumber","reason":"関数 f の中では x = 10 が使われます。また { } の中の y は、外からは見えません。"}],"hint":"関数の中の x と、外の x は同じものでしょうか？","feedback_correct":"正解！ローカル変数は外に影響しません。","feedback_incorrect":"惜しい！同じ名前でも、スコープが違えば別の変数です。"},{"id":"JS-068","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":8,"title":"map と filter","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["map","filter","コールバック"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"const nums = [1, 2, 3, 4];\nconsole.log(nums.map((n) => n * 2).join(\",\"));\nconsole.log(nums.filter((n) => n % 2 === 0).join(\",\"));","choice_format":"code","choices":[{"id":"c1","text":"2,4,6,8\n2,4"},{"id":"c2","text":"2,4,6,8\n1,3"},{"id":"c3","text":"1,2,3,4\n2,4"}],"answer":{"correct_choice_id":"c1","expected_output":"2,4,6,8\n2,4"},"grading":{"method":"choice_id"},"rationale":"map は各要素を2倍にし、filter は偶数だけを残すから。","explanation":"map は「変換」、filter は「選別」です。どちらも元の配列は変えず、新しい配列を返します。","wrong_answer_reasons":{"c2":"filter は、関数が true を返した要素を集めます。n % 2 === 0 は偶数の条件なので、2 と 4 が残ります。","c3":"map は、各要素を関数の結果に変えた新しい配列を作ります。n * 2 で2倍になるので、元の値のままではありません。"},"hint":"map は変換、filter は条件に合うものだけ残すメソッドです。","feedback_correct":"正解！map は変換、filter は選別です。","feedback_incorrect":"惜しい！map と filter の働きを区別しましょう。"},{"id":"JS-069","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":9,"title":"アロー関数の return 忘れ","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["アロー関数","return"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"add(1, 2) の結果 3 を表示するつもりが、undefined と表示されます。1行目を正しく書き直して入力してください（1行目の内容だけを入力）。","code":"const add = (a, b) => { a + b };\nconsole.log(add(1, 2));","answer":{"target_line":1,"accepted":["const add = (a, b) => a + b;","const add = (a, b) => { return a + b; };","const add = (a, b) => {return a + b;};","const add = (a, b) => (a + b);","const add = (a,b) => a + b;","const add = (a, b) => a + b"],"quote_insensitive":false,"fixed_code":"const add = (a, b) => a + b;\nconsole.log(add(1, 2));","expected_output":"3","buggy_output":"undefined"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"アロー関数で { } を使うときは、return で値を返す必要があるから。","explanation":"=> のあとに { } を書くと、普通の関数と同じ扱いになり、return がなければ undefined が返ります。{ } を外して式だけにするか、{ return a + b; } と書きます。","common_mistakes":[{"answer":"const add = (a, b) => { a + b };","reason":"元のコードのままです。{ } を使うと、return を書かない限り、戻り値は undefined です。"}],"hint":"{ } の中の a + b の結果は、どこに行くでしょう？","feedback_correct":"正解！戻り値を返すようにしました。","feedback_incorrect":"惜しい！{ } を使うときは return が必要です。"},{"id":"JS-070","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S07","stage_number":7,"number_in_stage":10,"title":"平均を返す関数","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["関数","return","配列","for...of"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"数値の配列 numbers を受け取り、平均（合計 ÷ 個数）を返す関数 average(numbers) を作ってください。（表示ではなく return で返すこと。numbers は1つ以上の要素を持ちます）","code":null,"prefix_code":"","starter_code":"function average(numbers) {\n  // ここに書きましょう\n}\n","answer_format":"javascript","answer":{"reference_solution":"function average(numbers) {\n  let total = 0;\n  for (const n of numbers) {\n    total += n;\n  }\n  return total / numbers.length;\n}","alternative_solutions":["const average = (numbers) => {\n  let total = 0;\n  for (let i = 0; i < numbers.length; i++) {\n    total += numbers[i];\n  }\n  return total / numbers.length;\n};","function average(numbers) {\n  return numbers.reduce((a, b) => a + b, 0) / numbers.length;\n}"],"rejected_examples":[{"code":"function average(numbers) {\n  let total = 0;\n  for (const n of numbers) {\n    total += n;\n  }\n  console.log(total / numbers.length);\n}","reason":"console.log は表示するだけで、値を返しません。呼び出し元には undefined が返ります。"},{"code":"function average(numbers) {\n  let total = 0;\n  for (const n of numbers) {\n    total += n;\n    return total / numbers.length;\n  }\n}","reason":"return がループの中にあるので、最初の1要素だけで関数が終わってしまいます。"}]},"grading":{"method":"test_cases","engine":"js_worker","tests":[{"kind":"call","setup":"","call":"average([70, 80, 90])","expected":"80","visible":true},{"kind":"call","setup":"","call":"average([1, 2])","expected":"1.5","visible":true},{"kind":"call","setup":"","call":"average([100])","expected":"100","visible":false},{"kind":"call","setup":"","call":"average([2, 4, 6, 8])","expected":"5","visible":false}],"required_patterns":[],"required_any_patterns":[{"pattern":"function\\s+average|average\\s*=\\s*(\\(|[a-z])","message":"average という名前の関数として書いてください"}],"forbidden_patterns":[],"timeout_sec":3,"normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"合計を個数で割った値を return で返す関数にするから。","explanation":"for...of で合計を求め、numbers.length で割って return します。reduce などで書く別解もありますが、まずは for で書けるようにしましょう。表示（console.log）ではなく return するのがポイントです。","hint":"合計を求めて、個数（numbers.length）で割った値を return します。","feedback_correct":"正解！値を返す関数が書けました。","feedback_incorrect":"惜しい！console.log ではなく return で返しているか確認しましょう。"},{"id":"JS-071","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":1,"title":"DOM とは何か","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["DOM","document"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"DOM の説明として、正しいものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"ブラウザが HTML から作る、要素を木構造で表したデータで、JavaScript から読み書きできる"},{"id":"c2","text":"HTML ファイルそのもので、JavaScript で書き換えると、ファイルの内容も変わる"},{"id":"c3","text":"ページの見た目を指定する、CSS の一種である"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"DOM は、HTML をもとにブラウザが作る要素の木構造で、JavaScript の操作対象になるから。","explanation":"JavaScript でページを変えるとき、HTML ファイルを書き換えているのではなく、ブラウザの中にある DOM を書き換えています。ページを再読み込みすると、元の HTML から DOM が作り直されます。","wrong_answer_reasons":{"c2":"DOM は、ブラウザが HTML を読み取って作る「いま表示しているページのデータ」です。DOM を書き換えても、HTML ファイルは変わりません。","c3":"見た目を指定するのは CSS です。DOM は、ページの構造を JavaScript から操作するためのデータです。"},"hint":"DOM は Document Object Model の略です。何の「モデル」でしょう？","feedback_correct":"正解！DOM はブラウザが作る要素の木構造です。","feedback_incorrect":"惜しい！DOM はファイルではなく、ブラウザの中のデータです。"},{"id":"JS-072","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":2,"title":"querySelector と querySelectorAll","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["querySelector","querySelectorAll","textContent"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次の HTML と JavaScript を組み合わせたページを表示したあと、2つの p 要素の文字を順に並べるとどうなりますか？","code":"document.querySelector(\".note\").textContent = \"X\";\nconst notes = document.querySelectorAll(\".note\");\nnotes[1].textContent = \"Y\";","context_html":"<p class=\"note\">A<\/p>\n<p class=\"note\">B<\/p>","choice_format":"code","choices":[{"id":"c1","text":"XB"},{"id":"c2","text":"XY"},{"id":"c3","text":"XX"}],"check":{"format":"javascript_dom","given_html":"<p class=\"note\">A<\/p>\n<p class=\"note\">B<\/p>","probe":"Array.from(document.querySelectorAll('.note')).map(function (e) { return e.textContent; }).join('')","choice_values":{"c1":"XB","c2":"XY","c3":"XX"}},"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"querySelector は最初の1つ（A）を X に、notes[1] は2つ目（B）を Y に変えるから。","explanation":"querySelector は条件に合う最初の1つ、querySelectorAll は条件に合うすべてを返します。notes[1] は添字 1、つまり2番目の要素です。","wrong_answer_reasons":{"c1":"3行目で、2つ目の要素（添字 1）の文字も Y に書き換えているので、B のままではありません。","c3":"querySelector は最初の1つだけを返します。2つ目は、3行目で notes[1] として別に書き換えています。"},"hint":"1行目と3行目で、書き換わる要素はそれぞれどれでしょう？","feedback_correct":"正解！querySelector は最初の1つ、All は全部です。","feedback_incorrect":"惜しい！1行目は最初の1つ、3行目は2つ目を書き換えています。"},{"id":"JS-073","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":3,"title":"textContent と innerHTML","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["textContent","innerHTML","安全性"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"ユーザーが入力した文字列 userInput を、画面の要素 el に表示します。安全な書き方はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"el.innerHTML = userInput;"},{"id":"c2","text":"el.textContent = userInput;"},{"id":"c3","text":"el.value = userInput;"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"textContent は、入れた文字列を HTML としてではなく、ただの文字として扱うから。","explanation":"innerHTML は HTML として解釈される文字列を入れられるので便利ですが、ユーザーの入力など信頼できない文字列を入れると、攻撃に使われる可能性があります。ただの文字を表示するなら textContent を使います。","wrong_answer_reasons":{"c1":"入力が HTML として解釈されるため、<img onerror=...> のような文字列を入れられると、悪意のあるコードが実行される危険があります。","c3":"value は input などの入力欄の値を扱うプロパティです。一般の要素（p や div など）では、画面に表示されません。"},"hint":"入力された文字が、HTML として解釈されると何が起きるでしょう？","feedback_correct":"正解！文字の表示は textContent が安全です。","feedback_incorrect":"惜しい！HTML として解釈されない方法を選びましょう。"},{"id":"JS-074","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":4,"title":"class を付ける","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["classList","add"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"ボタンに class「active」を付けます。【空欄1】に入れるメソッド名を答えてください。","code":"const btn = document.querySelector(\"#btn\");\nbtn.classList.__1__(\"active\");","context_html":"<button id=\"btn\">送信<\/button>","check":{"format":"javascript_dom","given_html":"<button id=\"btn\">送信<\/button>","expr":"document.querySelector('#btn').classList.contains('active')"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["add","toggle"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"classList.add は、要素に class を追加するメソッドだから。","explanation":"classList には add（追加）、remove（削除）、toggle（なければ追加・あれば削除）、contains（持っているか調べる）があります。この場面では、add でも、まだ class がないので toggle でも同じ結果になります。","common_mistakes":[{"blank":"b1","answer":"remove","reason":"remove は class を取り除くメソッドです。もともと active はないので、何も起きず、class は付きません。"}],"hint":"「追加する」を意味する英単語です。","feedback_correct":"正解！classList.add で class を追加できます。","feedback_incorrect":"惜しい！class を追加するメソッド名を思い出しましょう。"},{"id":"JS-075","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":5,"title":"セレクタの書き間違い","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["querySelector","セレクタ","null"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"id が msg の p 要素の文字を「OK」に書き換えたいのに、TypeError になります。1行目を直したものはどれですか？","code":"const el = document.querySelector(\"#mgs\");\nel.textContent = \"OK\";","context_html":"<p id=\"msg\">未設定<\/p>","choice_format":"code","choices":[{"id":"c1","text":"const el = document.querySelector(\"msg\");"},{"id":"c2","text":"const el = document.querySelector(\".msg\");"},{"id":"c3","text":"const el = document.querySelector(\"#msg\");"}],"check":{"format":"javascript_dom","given_html":"<p id=\"msg\">未設定<\/p>","expr":"document.getElementById('msg').textContent === 'OK'"},"answer":{"correct_choice_id":"c3","fixed_code":"const el = document.querySelector(\"#msg\");\nel.textContent = \"OK\";","target_line":1,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"id を探すセレクタは、# に続けて、HTML の id と同じ綴りで書く必要があるから。","explanation":"querySelector が要素を見つけられないと null を返します。null の textContent を書き換えようとして、TypeError になります。セレクタの綴りと、# （id）・.（class）の違いを確認します。","wrong_answer_reasons":{"c1":"# も . も付けない msg は、<msg> という名前の要素を探します。そのような要素はないので null になり、同じ TypeError が起きます。","c2":". は class を探す書き方です。msg は id なので、見つからずに null になります。"},"hint":"HTML の id は何ですか？ セレクタの綴りと見比べましょう。","feedback_correct":"正解！#id と綴りを合わせます。","feedback_incorrect":"惜しい！id は # で始め、綴りも HTML と同じにします。"},{"id":"JS-076","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":6,"title":"要素を作って追加する","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["createElement","appendChild","for"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次の HTML と JavaScript を組み合わせたページを表示したあと、ul 要素の中に表示される文字を、続けて書いたものを入力してください。","code":"const list = document.querySelector(\"#list\");\nfor (let i = 1; i <= 3; i++) {\n  const li = document.createElement(\"li\");\n  li.textContent = \"項目\" + i;\n  list.appendChild(li);\n}","context_html":"<ul id=\"list\"><\/ul>","check":{"format":"javascript_dom","given_html":"<ul id=\"list\"><\/ul>","probe":"document.getElementById('list').textContent","expected":"項目1項目2項目3"},"answer":{"expected_output":"項目1項目2項目3"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"3回のくり返しで、「項目1」「項目2」「項目3」の li が順に末尾へ追加されるから。","explanation":"createElement で li を作り、textContent で中身を設定し、appendChild で ul の末尾へ追加します。くり返しの中でこれを行うと、データの数だけ要素を追加できます。","common_mistakes":[{"answer":"項目1","reason":"くり返しは3回行われ、そのたびに li が1つずつ追加されます。"},{"answer":"項目3項目2項目1","reason":"appendChild は、親の末尾に追加します。先に追加した項目1が先頭に並びます。"}],"hint":"appendChild は、子要素を末尾に追加します。","feedback_correct":"正解！3つの li が順に追加されました。","feedback_incorrect":"惜しい！くり返しの回数と、追加される順番を確認しましょう。"},{"id":"JS-077","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":7,"title":"入力欄に文字を入れる","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["value","input"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"テキスト入力欄（input）に、Hana という文字を入れます。【空欄1】に入れるプロパティ名を答えてください。","code":"document.querySelector(\"#name\").__1__ = \"Hana\";","context_html":"<input id=\"name\" type=\"text\">","check":{"format":"javascript_dom","given_html":"<input id=\"name\" type=\"text\">","expr":"document.querySelector('#name').value === 'Hana'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["value"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"入力欄の中身は、value プロパティで読み書きするから。","explanation":"p や div の文字は textContent ですが、input・textarea・select の値は value です。ユーザーが入力した文字を読み取るときも、value を使います。","common_mistakes":[{"blank":"b1","answer":"textContent","reason":"input は中身を持たない要素なので、textContent に文字を入れても、入力欄には表示されません（value は変わらないまま）。"}],"hint":"入力欄の「値」を意味する英単語です。","feedback_correct":"正解！入力欄は value で読み書きします。","feedback_incorrect":"惜しい！textContent ではなく、入力欄専用のプロパティを使います。"},{"id":"JS-078","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":8,"title":"style のプロパティ名","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["style","キャメルケース"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"id が box の要素の背景色を赤にしたいのに、コードが動きません。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":"const box = document.querySelector(\"#box\");\nbox.style.background-color = \"red\";","context_html":"<div id=\"box\">箱<\/div>","check":{"format":"javascript_dom","given_html":"<div id=\"box\">箱<\/div>","expr":"getComputedStyle(document.querySelector('#box')).backgroundColor === 'rgb(255, 0, 0)'"},"answer":{"target_line":2,"accepted":["box.style.backgroundColor = \"red\";","box.style.backgroundColor = \"red\"","box.style.background = \"red\";","box.style.backgroundColor=\"red\";"],"quote_insensitive":true,"fixed_code":"const box = document.querySelector(\"#box\");\nbox.style.backgroundColor = \"red\";"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"style のプロパティ名は、ハイフンを取り除いて次の文字を大文字にした形（backgroundColor）で書くから。","explanation":"CSS の background-color は、JavaScript では backgroundColor と書きます。ハイフンのままだと「background 引く color」と解釈され、構文エラーになります。","common_mistakes":[{"answer":"box.style.background-color = \"red\";","reason":"元のコードのままです。ハイフンは引き算として読まれ、SyntaxError になります。"}],"hint":"CSS の名前から、ハイフンを取り除いて、次の文字を大文字にします。","feedback_correct":"正解！style はキャメルケースで書きます。","feedback_incorrect":"惜しい！ハイフンを含む名前は、JavaScript ではそのまま使えません。"},{"id":"JS-079","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":9,"title":"classList の操作","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["classList","toggle"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次の HTML と JavaScript を組み合わせたページを表示したあと、id が box の要素の class は、最終的にどうなりますか？","code":"const box = document.querySelector(\"#box\");\nbox.classList.add(\"on\");\nbox.classList.toggle(\"on\");\nbox.classList.toggle(\"hidden\");","context_html":"<div id=\"box\" class=\"card\"><\/div>","choice_format":"code","choices":[{"id":"c1","text":"card hidden"},{"id":"c2","text":"card on hidden"},{"id":"c3","text":"card on"}],"check":{"format":"javascript_dom","given_html":"<div id=\"box\" class=\"card\"><\/div>","probe":"document.getElementById('box').className","choice_values":{"c2":"card on hidden","c1":"card hidden","c3":"card on"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"on は add のあと toggle で削除され、hidden は toggle で追加されるから。","explanation":"2行目で card on、3行目の toggle(\"on\") で on が外れて card、4行目の toggle(\"hidden\") で hidden が加わり card hidden になります。","wrong_answer_reasons":{"c2":"3行目の toggle(\"on\") で、あった on が取り除かれます。toggle は「あれば削除、なければ追加」です。","c3":"4行目の toggle(\"hidden\") で、hidden が追加されます。また 3行目で on は取り除かれています。"},"hint":"1行ずつ、class の一覧がどう変わるか書き出しましょう。","feedback_correct":"正解！toggle は付け外しを切り替えます。","feedback_incorrect":"惜しい！toggle は、あれば削除、なければ追加です。"},{"id":"JS-080","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S08","stage_number":8,"number_in_stage":10,"title":"配列からリストを作る","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["createElement","appendChild","for...of","DOM操作"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"配列 fruits の要素を、1つずつ li 要素にして、id が list の ul 要素に追加する JavaScript を書いてください（li の中の文字は、配列の要素そのもの。順番もそのまま）。fruits と ul はあらかじめ用意されています。","code":null,"prefix_html":"<ul id=\"list\"><\/ul>\n<script>const fruits = [\"りんご\", \"みかん\", \"ぶどう\"];<\/script>","starter_code":"// fruits と #list はあらかじめ用意されています\n","answer_format":"javascript_dom","answer":{"reference_solution":"const list = document.querySelector(\"#list\");\nfor (const fruit of fruits) {\n  const li = document.createElement(\"li\");\n  li.textContent = fruit;\n  list.appendChild(li);\n}","alternative_solutions":["const list = document.getElementById(\"list\");\nfruits.forEach((fruit) => {\n  const li = document.createElement(\"li\");\n  li.textContent = fruit;\n  list.append(li);\n});","const list = document.querySelector(\"#list\");\nfor (let i = 0; i < fruits.length; i++) {\n  list.innerHTML += \"<li>\" + fruits[i] + \"<\/li>\";\n}"],"rejected_examples":[{"code":"const list = document.querySelector(\"#list\");\nlist.textContent = fruits.join(\", \");","reason":"ul の中に li 要素が作られていません。要素ごとに createElement で li を作って追加します。"},{"code":"const list = document.querySelector(\"#list\");\nconst li = document.createElement(\"li\");\nli.textContent = fruits[0];\nlist.appendChild(li);","reason":"最初の要素だけを追加しています。くり返しで、すべての要素を追加する必要があります。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"li が3つ追加されている","expr":"document.querySelectorAll('#list > li').length === 3","visible":true},{"kind":"page","desc":"li の文字が配列の要素と同じ順番になっている","expr":"Array.from(document.querySelectorAll('#list > li')).map(function (l) { return l.textContent; }).join('|') === 'りんご|みかん|ぶどう'","visible":true},{"kind":"page","desc":"要素が1つだけの配列でも動く","expr":"Array.from(document.querySelectorAll('#list > li')).map(function (l) { return l.textContent; }).join('|') === 'ぱん'","visible":false,"given_html":"<ul id=\"list\"><\/ul>\n<script>const fruits = [\"ぱん\"];<\/script>"},{"kind":"page","desc":"空の配列でも動く（li は0個）","expr":"document.querySelectorAll('#list > li').length === 0 && !!document.getElementById('list')","visible":false,"given_html":"<ul id=\"list\"><\/ul>\n<script>const fruits = [];<\/script>"},{"kind":"page","desc":"5つの要素でも動く","expr":"Array.from(document.querySelectorAll('#list > li')).map(function (l) { return l.textContent; }).join('|') === 'a|b|c|d|e'","visible":false,"given_html":"<ul id=\"list\"><\/ul>\n<script>const fruits = [\"a\",\"b\",\"c\",\"d\",\"e\"];<\/script>"}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"配列の要素ごとに、createElement で li を作り、textContent を設定し、appendChild で ul へ追加するから。","explanation":"くり返しの中で li を作って追加すれば、配列の要素数が変わっても同じコードで動きます。innerHTML に文字列を足していく別解も動きますが、入力が信頼できない場合は textContent を使う方が安全です。","hint":"for...of で fruits を順に取り出し、1つずつ li を作って list に追加します。","feedback_correct":"正解！データから要素を作ってページに追加できました。","feedback_incorrect":"惜しい！配列の要素が1つ・0個のときでも動くか確認しましょう。"},{"id":"JS-081","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":1,"title":"関数を渡す書き方","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["addEventListener","コールバック"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"ボタン btn がクリックされたときに、関数 handle を呼び出したい。正しい書き方はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"btn.addEventListener(\"click\", handle());"},{"id":"c2","text":"btn.addEventListener(click, handle);"},{"id":"c3","text":"btn.addEventListener(\"click\", handle);"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"イベントリスナーには、関数そのものを（呼び出さずに）渡すから。","explanation":"handle は関数そのもの、handle() は関数を呼び出した結果です。addEventListener に渡すのは、「あとで呼んでほしい関数」なので、( ) を付けません。","wrong_answer_reasons":{"c1":"handle() と ( ) を付けると、登録した時点で handle が実行され、その戻り値が渡されます。クリックされても handle は呼ばれません。","c2":"引用符がない click は、変数名と解釈されます。そのような変数はないので ReferenceError になります。イベント名は文字列で書きます。"},"hint":"関数名のあとに ( ) を付けると、何が起こりますか？","feedback_correct":"正解！関数は呼び出さずに渡します。","feedback_incorrect":"惜しい！( ) の有無と、イベント名の引用符を確認しましょう。"},{"id":"JS-082","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":2,"title":"クリックするたびに増えるカウンター","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["addEventListener","クリック","変数の保持"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次の HTML と JavaScript を組み合わせたページで、ボタン（#plus）を3回クリックしたあと、#count に表示されている文字は何ですか？","code":"let count = 0;\nconst plus = document.querySelector(\"#plus\");\nconst out = document.querySelector(\"#count\");\nplus.addEventListener(\"click\", () => {\n  count++;\n  out.textContent = count;\n});","context_html":"<button id=\"plus\">+1<\/button>\n<p id=\"count\">0<\/p>","choice_format":"code","choices":[{"id":"c1","text":"3"},{"id":"c2","text":"0"},{"id":"c3","text":"1"}],"check":{"format":"javascript_dom","given_html":"<button id=\"plus\">+1<\/button>\n<p id=\"count\">0<\/p>","actions":["document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('plus').click()"],"probe":"document.getElementById('count').textContent","choice_values":{"c2":"0","c1":"3","c3":"1"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"クリックのたびにリスナーが呼ばれ、count が 1 ずつ増えて、3回で 3 になるから。","explanation":"addEventListener で登録した関数は、イベントが起きるたびに呼び出されます。count はリスナーの外側で宣言されているので、呼び出しをまたいで値が保たれます。","wrong_answer_reasons":{"c2":"クリックのたびにリスナーが呼ばれ、textContent も書き換えられます。何度か押せば表示は変わります。","c3":"リスナーは、クリックのたびに呼ばれます。1回目で終わりではなく、3回呼ばれるので count は 3 になります。"},"hint":"リスナーは、クリックのたびに何回呼ばれますか？","feedback_correct":"正解！クリックのたびに関数が呼ばれます。","feedback_incorrect":"惜しい！リスナーは、クリックのたびに呼ばれます。"},{"id":"JS-083","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":3,"title":"クリックのイベント名","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["イベント名","click"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"ボタンがクリックされたら、メッセージを表示します。【空欄1】に入れるイベント名を答えてください。","code":"const btn = document.querySelector(\"#btn\");\nbtn.addEventListener(\"__1__\", () => {\n  document.querySelector(\"#msg\").textContent = \"押されました\";\n});","context_html":"<button id=\"btn\">押す<\/button>\n<p id=\"msg\"><\/p>","check":{"format":"javascript_dom","given_html":"<button id=\"btn\">押す<\/button>\n<p id=\"msg\"><\/p>","actions":["document.getElementById('btn').click()"],"expr":"document.getElementById('msg').textContent === '押されました'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["click"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"クリックのイベント名は click だから。","explanation":"イベント名は、click・input・submit のように、on を付けない名前です。HTML の属性 onclick と混同しやすいので注意しましょう。","common_mistakes":[{"blank":"b1","answer":"onclick","reason":"イベント名には on を付けません。\"onclick\" というイベントはなく、クリックしても関数は呼ばれません。"}],"hint":"on は付けません。","feedback_correct":"正解！イベント名は click です。","feedback_incorrect":"惜しい！on を付けない名前を入力しましょう。"},{"id":"JS-084","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":4,"title":"関数を呼び出してしまった","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["addEventListener","関数を渡す"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"ボタンを2回クリックしたら 2 と表示されるはずが、1 と表示されたまま変わりません。7行目を直したものはどれですか？","code":"let count = 0;\nconst out = document.querySelector(\"#count\");\nfunction inc() {\n  count++;\n  out.textContent = count;\n}\ndocument.querySelector(\"#plus\").addEventListener(\"click\", inc());","context_html":"<button id=\"plus\">+1<\/button>\n<p id=\"count\">0<\/p>","choice_format":"code","choices":[{"id":"c1","text":"document.querySelector(\"#plus\").addEventListener(\"click\", \"inc\");"},{"id":"c2","text":"document.querySelector(\"#plus\").addEventListener(\"click\", inc);"},{"id":"c3","text":"document.querySelector(\"#plus\").addEventListener(click, inc);"}],"check":{"format":"javascript_dom","given_html":"<button id=\"plus\">+1<\/button>\n<p id=\"count\">0<\/p>","actions":["document.getElementById('plus').click()","document.getElementById('plus').click()"],"expr":"document.getElementById('count').textContent === '2'"},"answer":{"correct_choice_id":"c2","fixed_code":"let count = 0;\nconst out = document.querySelector(\"#count\");\nfunction inc() {\n  count++;\n  out.textContent = count;\n}\ndocument.querySelector(\"#plus\").addEventListener(\"click\", inc);","target_line":7,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"リスナーには、関数そのもの（inc）を渡す必要があり、inc() だと登録時に1回実行されるだけだから。","explanation":"inc() と書くと、ページを読み込んだ時点で inc が1回実行され、count が 1 になります。クリックしても呼ばれるリスナーが登録されないので、表示が 1 のまま変わりません。","wrong_answer_reasons":{"c1":"引用符で囲むと文字列になります。関数ではない値をリスナーに渡すと、TypeError になります。","c3":"引用符のない click は変数名と解釈され、ReferenceError になります。"},"hint":"読み込んだ直後に、すでに 1 と表示されていませんか？","feedback_correct":"正解！関数は ( ) なしで渡します。","feedback_incorrect":"惜しい！inc() と inc の違いを思い出しましょう。"},{"id":"JS-085","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":5,"title":"e.target は押された要素","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["イベントオブジェクト","e.target","for...of"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次の HTML と JavaScript を組み合わせたページで、2番目のボタン（B）をクリックしたあと、#out に表示されている文字を入力してください。","code":"const buttons = document.querySelectorAll(\"#btns button\");\nfor (const b of buttons) {\n  b.addEventListener(\"click\", (e) => {\n    document.querySelector(\"#out\").textContent = e.target.textContent;\n  });\n}","context_html":"<div id=\"btns\"><button>A<\/button><button>B<\/button><button>C<\/button><\/div>\n<p id=\"out\"><\/p>","check":{"format":"javascript_dom","given_html":"<div id=\"btns\"><button>A<\/button><button>B<\/button><button>C<\/button><\/div>\n<p id=\"out\"><\/p>","actions":["document.querySelectorAll('#btns button')[1].click()"],"probe":"document.getElementById('out').textContent","expected":"B"},"answer":{"expected_output":"B"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"e.target は、クリックされた要素（B のボタン）で、その textContent は B だから。","explanation":"同じ関数を複数の要素に付けても、e.target を見れば、どの要素で起きたイベントかが分かります。e.target.textContent は、そのボタンに書かれた文字です。","common_mistakes":[{"answer":"A","reason":"リスナーは3つのボタンすべてに付いていますが、呼ばれるのはクリックされたボタンのものです。e.target も、クリックされたボタンです。"},{"answer":"button","reason":"e.target.textContent は、要素の名前ではなく、ボタンの中の文字を返します。"}],"hint":"クリックしたのは、どのボタンですか？","feedback_correct":"正解！e.target は、イベントが起きた要素です。","feedback_incorrect":"惜しい！クリックしたボタンの中の文字を答えましょう。"},{"id":"JS-086","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":6,"title":"フォーム送信を止める","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["preventDefault","submit"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"フォームの submit イベントで、ページの移動や再読み込みを止めて、JavaScript だけで処理したい。リスナーの関数の中で呼ぶべきものはどれですか？","code":"form.addEventListener(\"submit\", (e) => {\n  // ここで何を呼ぶ？\n});","choice_format":"code","choices":[{"id":"c1","text":"e.stopPropagation()"},{"id":"c2","text":"e.cancel()"},{"id":"c3","text":"e.preventDefault()"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"preventDefault は、イベントの標準の動作（フォーム送信によるページ移動）を止めるから。","explanation":"preventDefault は「標準の動作を止める」、stopPropagation は「親への伝わりを止める」で、別のものです。送信を JavaScript で処理するときは、最初に preventDefault を呼びます。","wrong_answer_reasons":{"c1":"stopPropagation は、イベントが親要素へ伝わるのを止めるものです。フォーム送信の標準動作（ページ移動）は止まりません。","c2":"e.cancel() というメソッドはありません。呼ぶと TypeError になります。"},"hint":"「標準（デフォルト）の動作を止める」という名前のメソッドです。","feedback_correct":"正解！preventDefault で標準動作を止めます。","feedback_incorrect":"惜しい！標準の動作を止めるメソッド名を思い出しましょう。"},{"id":"JS-087","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":7,"title":"入力された文字を読み取る","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["input イベント","value"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"入力欄に文字を入れるたびに、その内容を #out に表示します。【空欄1】に入れるプロパティ名を答えてください。","code":"document.querySelector(\"#name\").addEventListener(\"input\", (e) => {\n  document.querySelector(\"#out\").textContent = e.target.__1__;\n});","context_html":"<input id=\"name\" type=\"text\">\n<p id=\"out\"><\/p>","check":{"format":"javascript_dom","given_html":"<input id=\"name\" type=\"text\">\n<p id=\"out\"><\/p>","actions":["(function(){var t=document.getElementById('name'); t.value='Hana'; t.dispatchEvent(new Event('input'));})()"],"expr":"document.getElementById('out').textContent === 'Hana'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["value"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"入力欄の中身は、value プロパティで読み取るから。","explanation":"input イベントのたびに e.target.value を読めば、入力途中の文字列をその場で表示できます。文字数のカウントなどにも使えます。","common_mistakes":[{"blank":"b1","answer":"textContent","reason":"input は中身を持たない要素なので、textContent は空のままです。入力された文字は value で読みます。"}],"hint":"入力欄の中身を読み書きするプロパティ名です。","feedback_correct":"正解！入力欄は value で読みます。","feedback_incorrect":"惜しい！textContent ではなく、入力欄専用のプロパティです。"},{"id":"JS-088","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":8,"title":"一覧にまとめてリスナーを付けた","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["querySelectorAll","for...of","TypeError"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"2つのボタン（.btn）のどちらを押しても数が増えるはずが、TypeError になって動きません。正しい直し方はどれですか？","code":"let count = 0;\nconst buttons = document.querySelectorAll(\".btn\");\nbuttons.addEventListener(\"click\", () => {\n  count++;\n  document.querySelector(\"#count\").textContent = count;\n});","context_html":"<button class=\"btn\">A<\/button><button class=\"btn\">B<\/button>\n<p id=\"count\">0<\/p>","choice_format":"text","choices":[{"id":"c1","text":"addEventListener を addEventListeners に変える"},{"id":"c2","text":"querySelectorAll を querySelector に変える"},{"id":"c3","text":"querySelectorAll の結果を for...of で1つずつ取り出し、それぞれに addEventListener を付ける"}],"check":{"format":"javascript_dom","given_html":"<button class=\"btn\">A<\/button><button class=\"btn\">B<\/button>\n<p id=\"count\">0<\/p>","actions":["document.querySelectorAll('.btn')[0].click()","document.querySelectorAll('.btn')[1].click()"],"expr":"document.getElementById('count').textContent === '2'"},"answer":{"correct_choice_id":"c3","fixed_code":"let count = 0;\nconst buttons = document.querySelectorAll(\".btn\");\nfor (const b of buttons) {\n  b.addEventListener(\"click\", () => {\n    count++;\n    document.querySelector(\"#count\").textContent = count;\n  });\n}"},"grading":{"method":"choice_id"},"rationale":"querySelectorAll の結果は要素の一覧で、リスナーは1つずつの要素に付ける必要があるから。","explanation":"addEventListener は、1つの要素に対して呼び出すメソッドです。一覧には付いていないので TypeError になります。for...of で取り出した要素に、それぞれ付けます。","wrong_answer_reasons":{"c1":"addEventListeners というメソッドはありません。呼ぶと、同じく TypeError になります。","c2":"querySelector は最初の1つだけを返すので、エラーは消えますが、2つ目のボタンにはリスナーが付かず、押しても数が増えません。"},"hint":"addEventListener を持っているのは、要素1つひとつです。","feedback_correct":"正解！一覧は、1つずつ取り出して処理します。","feedback_incorrect":"惜しい！一覧そのものには addEventListener がありません。"},{"id":"JS-089","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":9,"title":"イベントのバブリング","type":"predict_output","answer_mode":"choice","difficulty":4,"concepts":["バブリング","イベント委譲"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次の HTML と JavaScript を組み合わせたページで、内側のボタン（#inner）をクリックしたあと、#log に表示される文字はどうなりますか？","code":"const log = document.querySelector(\"#log\");\ndocument.querySelector(\"#outer\").addEventListener(\"click\", () => {\n  log.textContent += \"outer \";\n});\ndocument.querySelector(\"#inner\").addEventListener(\"click\", () => {\n  log.textContent += \"inner \";\n});","context_html":"<div id=\"outer\"><button id=\"inner\">押す<\/button><\/div>\n<p id=\"log\"><\/p>","choice_format":"code","choices":[{"id":"c1","text":"outer inner "},{"id":"c2","text":"inner "},{"id":"c3","text":"inner outer "}],"check":{"format":"javascript_dom","given_html":"<div id=\"outer\"><button id=\"inner\">押す<\/button><\/div>\n<p id=\"log\"><\/p>","actions":["document.getElementById('inner').click()"],"probe":"document.getElementById('log').textContent","choice_values":{"c1":"outer inner ","c3":"inner outer ","c2":"inner "}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"クリックは、内側の要素で処理されたあと、親要素へ伝わるから。","explanation":"これをバブリングといいます。内側 → 外側の順にリスナーが呼ばれます。この性質を使うと、親要素にだけリスナーを付けて、子のクリックをまとめて処理できます（イベント委譲）。","wrong_answer_reasons":{"c1":"イベントは、押された内側の要素から、外側（親）へ向かって順に伝わります。内側の inner が先です。","c2":"子で起きたクリックは、親要素にも伝わります（バブリング）。そのため、親の outer のリスナーも呼ばれます。"},"hint":"クリックされたのは内側のボタンです。そのイベントは、どちらへ伝わりますか？","feedback_correct":"正解！内側から外側へ伝わります。","feedback_incorrect":"惜しい！イベントは、子から親へ伝わります。"},{"id":"JS-090","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S09","stage_number":9,"number_in_stage":10,"title":"カウンターを作る","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["addEventListener","if","DOM操作"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"+1 ボタン（#plus）で数を 1 増やし、-1 ボタン（#minus）で 1 減らし、リセットボタン（#reset）で 0 に戻すカウンターを作ってください。数は #count の文字として表示します。ただし、0 より小さくならないようにすること（0 のときに -1 を押しても 0 のまま）。","code":null,"prefix_html":"<button id=\"minus\">-1<\/button> <span id=\"count\">0<\/span> <button id=\"plus\">+1<\/button>\n<button id=\"reset\">リセット<\/button>","starter_code":"// #plus, #minus, #reset, #count はあらかじめ用意されています\n","answer_format":"javascript_dom","answer":{"reference_solution":"let count = 0;\nconst out = document.querySelector(\"#count\");\nfunction render() {\n  out.textContent = count;\n}\ndocument.querySelector(\"#plus\").addEventListener(\"click\", () => {\n  count++;\n  render();\n});\ndocument.querySelector(\"#minus\").addEventListener(\"click\", () => {\n  if (count > 0) {\n    count--;\n  }\n  render();\n});\ndocument.querySelector(\"#reset\").addEventListener(\"click\", () => {\n  count = 0;\n  render();\n});","alternative_solutions":["let count = 0;\nconst out = document.getElementById(\"count\");\ndocument.getElementById(\"plus\").onclick = () => { count += 1; out.textContent = count; };\ndocument.getElementById(\"minus\").onclick = () => { count = Math.max(0, count - 1); out.textContent = count; };\ndocument.getElementById(\"reset\").onclick = () => { count = 0; out.textContent = count; };"],"rejected_examples":[{"code":"let count = 0;\nconst out = document.querySelector(\"#count\");\ndocument.querySelector(\"#plus\").addEventListener(\"click\", () => { count++; out.textContent = count; });\ndocument.querySelector(\"#minus\").addEventListener(\"click\", () => { count--; out.textContent = count; });\ndocument.querySelector(\"#reset\").addEventListener(\"click\", () => { count = 0; out.textContent = count; });","reason":"0 のときに -1 を押すと、-1 になってしまいます。0 より小さくならないよう、if で確認します。"},{"code":"let count = 0;\nconst out = document.querySelector(\"#count\");\ndocument.querySelector(\"#plus\").addEventListener(\"click\", () => { count++; out.textContent = count; });\ndocument.querySelector(\"#minus\").addEventListener(\"click\", () => { if (count > 0) { count--; } out.textContent = count; });","reason":"リセットボタンの処理がありません。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"+1 を3回押すと 3 になる","expr":"document.getElementById('count').textContent === '3'","visible":true,"actions":["document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('plus').click()"]},{"kind":"page","desc":"+1 を2回、-1 を1回押すと 1 になる","expr":"document.getElementById('count').textContent === '1'","visible":true,"actions":["document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('minus').click()"]},{"kind":"page","desc":"0 のときに -1 を押しても 0 のまま","expr":"document.getElementById('count').textContent === '0'","visible":false,"actions":["document.getElementById('minus').click()"]},{"kind":"page","desc":"+1 を5回押してリセットすると 0 になる","expr":"document.getElementById('count').textContent === '0'","visible":false,"actions":["document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('reset').click()"]},{"kind":"page","desc":"リセットのあとにまた +1 すると 1 になる","expr":"document.getElementById('count').textContent === '1'","visible":false,"actions":["document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('reset').click()","document.getElementById('plus').click()"]}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"3つのボタンにそれぞれイベントリスナーを付け、count を更新して #count に表示し、-1 は 0 より大きいときだけ行うから。","explanation":"データ（count）を更新し、そのあと表示（textContent）を書き換える、という流れです。表示を書き換える処理を render という関数にまとめると、どのボタンの処理からも同じように呼べます。","hint":"count を変数に持ち、各ボタンで更新してから #count の textContent に反映します。","feedback_correct":"正解！動きのあるカウンターが作れました。","feedback_incorrect":"惜しい！0 のときの -1 や、リセットのあとの動きを確認しましょう。"},{"id":"JS-091","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S10","stage_number":10,"number_in_stage":1,"title":"アプリの作り方の基本","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["アプリ設計","データと表示"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"ToDo アプリで「項目を追加したら、画面の一覧も変わる」ようにするとき、基本的な考え方として適切なものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"配列（データ）に項目を追加したら、自動で画面も変わるので、画面側のコードは書かなくてよい"},{"id":"c2","text":"画面の li の数を数えるだけで、データは持たずに作るのが基本である"},{"id":"c3","text":"データを更新したあとに、画面を書き換える処理（render）を呼んで、データと画面をそろえる"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"DOM は自動では更新されないので、データを変えたあとに、表示を書き換える処理を呼ぶ必要があるから。","explanation":"データ（配列など）と表示（DOM）を分けて考えると、「何を覚えるか」と「どう見せるか」を別々に整理できます。更新は、データを変える → 表示を書き換える、の順です。","wrong_answer_reasons":{"c1":"配列を変えても、画面の DOM は自動では変わりません。データを変えたあとに、画面を書き換える処理を呼ぶ必要があります。","c2":"それでも動くアプリは作れますが、規模が大きくなると、画面を見ないとデータが分からず、管理が難しくなります。データを持つ方法が基本です。"},"hint":"DOM は、配列の中身を自動で追いかけてくれるでしょうか？","feedback_correct":"正解！データを変えたら、表示を書き換えます。","feedback_incorrect":"惜しい！データと画面は、自動ではそろいません。"},{"id":"JS-092","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S10","stage_number":10,"number_in_stage":2,"title":"データを変えただけでは画面は変わらない","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["render","データと表示"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次の HTML と JavaScript を組み合わせたページを表示したとき、ul の中の li は、いくつ表示されますか？","code":"const todos = [];\nconst list = document.querySelector(\"#list\");\nfunction render() {\n  list.textContent = \"\";\n  for (const t of todos) {\n    const li = document.createElement(\"li\");\n    li.textContent = t;\n    list.appendChild(li);\n  }\n}\ntodos.push(\"A\");\ntodos.push(\"B\");\nrender();\ntodos.push(\"C\");","context_html":"<ul id=\"list\"><\/ul>","choice_format":"code","choices":[{"id":"c1","text":"3つ"},{"id":"c2","text":"2つ"},{"id":"c3","text":"0個"}],"check":{"format":"javascript_dom","given_html":"<ul id=\"list\"><\/ul>","probe":"document.querySelectorAll('#list > li').length","choice_values":{"c1":3,"c2":2,"c3":0}},"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"render() を呼んだ時点の配列（A と B）が画面になり、そのあとの C は、render を呼び直さない限り反映されないから。","explanation":"配列 todos には最終的に3つの要素がありますが、画面は、最後に render() を呼んだ時点の内容のままです。データを変えたら、もう一度 render() を呼ぶ必要があります。","wrong_answer_reasons":{"c1":"C を追加したのは render() を呼んだあとです。そのあと render を呼んでいないので、画面には反映されません。","c3":"render() は A と B を追加したあとに呼ばれているので、その時点の2つの li が作られています。"},"hint":"最後の todos.push(\"C\") のあとに、render() は呼ばれていますか？","feedback_correct":"正解！render し直さないと画面は変わりません。","feedback_incorrect":"惜しい！画面が更新されるタイミングを追いましょう。"},{"id":"JS-093","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S10","stage_number":10,"number_in_stage":3,"title":"入力値を数値にする","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["Number()","value","型変換"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"2つの入力欄の値を足して、結果を表示します。ボタンを押すと 9 と表示されるように、【空欄1】と【空欄2】に入れる関数名を答えてください（どちらも同じ関数です）。","code":"document.querySelector(\"#calc\").addEventListener(\"click\", () => {\n  const a = __1__(document.querySelector(\"#a\").value);\n  const b = __2__(document.querySelector(\"#b\").value);\n  document.querySelector(\"#result\").textContent = a + b;\n});","context_html":"<input id=\"a\" value=\"4\">\n<input id=\"b\" value=\"5\">\n<button id=\"calc\">足す<\/button>\n<p id=\"result\"><\/p>","check":{"format":"javascript_dom","given_html":"<input id=\"a\" value=\"4\">\n<input id=\"b\" value=\"5\">\n<button id=\"calc\">足す<\/button>\n<p id=\"result\"><\/p>","actions":["document.getElementById('calc').click()"],"expr":"document.getElementById('result').textContent === '9'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["Number","parseFloat","parseInt"],"quote_insensitive":false},{"id":"b2","marker":"__2__","accepted":["Number","parseFloat","parseInt"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"入力欄の value は文字列なので、Number() で数値にしてから足す必要があるから。","explanation":"Number(\"4\") は数値の 4 を返します。数値同士なら + は足し算になり、4 + 5 = 9 です。変換しないと、\"4\" + \"5\" で文字列の連結になり 45 になってしまいます。","common_mistakes":[{"blank":"b1","answer":"String","reason":"String は、値を文字列にする関数です。a が文字列のままなので、a + b は連結になり、45 と表示されます。"}],"hint":"文字列を数値に変える関数です。ステージ2で学びました。","feedback_correct":"正解！入力値は Number() で数値にします。","feedback_incorrect":"惜しい！入力値は文字列です。数値にする関数を使いましょう。"},{"id":"JS-094","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S10","stage_number":10,"number_in_stage":4,"title":"入力欄の値が連結されてしまう","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["Number()","文字列の連結","value"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"2つの入力欄の値（1 と 2）を足して 3 を表示するつもりが、12 と表示されます。正しい直し方はどれですか？","code":"document.querySelector(\"#calc\").addEventListener(\"click\", () => {\n  const a = document.querySelector(\"#a\").value;\n  const b = document.querySelector(\"#b\").value;\n  document.querySelector(\"#result\").textContent = a + b;\n});","context_html":"<input id=\"a\" value=\"1\">\n<input id=\"b\" value=\"2\">\n<button id=\"calc\">計算<\/button>\n<p id=\"result\"><\/p>","choice_format":"text","choices":[{"id":"c1","text":"textContent を value に変える"},{"id":"c2","text":"a と b を Number() で数値にしてから足す"},{"id":"c3","text":"a + b を a - b に変える"}],"check":{"format":"javascript_dom","given_html":"<input id=\"a\" value=\"1\">\n<input id=\"b\" value=\"2\">\n<button id=\"calc\">計算<\/button>\n<p id=\"result\"><\/p>","actions":["document.getElementById('calc').click()"],"expr":"document.getElementById('result').textContent === '3'"},"answer":{"correct_choice_id":"c2","fixed_code":"document.querySelector(\"#calc\").addEventListener(\"click\", () => {\n  const a = Number(document.querySelector(\"#a\").value);\n  const b = Number(document.querySelector(\"#b\").value);\n  document.querySelector(\"#result\").textContent = a + b;\n});"},"grading":{"method":"choice_id"},"rationale":"入力欄の value は文字列なので、+ が連結になっていたから。","explanation":"\"1\" + \"2\" は、足し算ではなく文字列の連結で \"12\" になります。Number() で数値に変換してから足すと、1 + 2 = 3 です。","wrong_answer_reasons":{"c1":"p 要素に value を代入しても、画面の文字は変わりません。原因は、a と b が文字列のままであることです。","c3":"引き算なら、文字列が数値に変換されて計算されますが、結果は -1 で、足し算ではなくなってしまいます。"},"hint":"input の value は、数字を入れても、どんな型でしょう？","feedback_correct":"正解！value は文字列なので、数値に変換します。","feedback_incorrect":"惜しい！a と b の型を確認しましょう。"},{"id":"JS-095","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S10","stage_number":10,"number_in_stage":5,"title":"toggle を2回","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["classList","toggle","click"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。ブラウザ
