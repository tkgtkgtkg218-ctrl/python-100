strip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"in は含まれているかを調べ、[1:3] は1番目から2番目までを取り出すから。","explanation":"\"青\" は colors に含まれているので True。colors[1:3] は番号1（青）と番号2（緑）の2要素で、番号3（黄）は含まれません。リストの表示は文字列に引用符が付いて ['青', '緑'] となります。","common_mistakes":[{"answer":"True\n['青', '緑', '黄']","reason":"スライス [1:3] の終わり（3）は含まれません。1番目と2番目の2つだけです。"},{"answer":"True\n['赤', '青', '緑']","reason":"スライスの開始 1 は「2つ目」です。0 番目の「赤」は含まれません。"}],"hint":"スライスの終わりの番号は含まれません（range と同じです）。","feedback_correct":"正解！スライスの終わりは含まれません。","feedback_incorrect":"惜しい！スライスの開始と終了の意味を見直しましょう。"},{"id":"PY-047","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":7,"title":"最後の要素の番号","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["インデックス","len"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"len(scores) が 3 のリスト scores があります。最後の要素を取り出すインデックスはいくつですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"3"},{"id":"c2","text":"1"},{"id":"c3","text":"2"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"番号は0から始まるので、最後の番号は len - 1 になるから。","explanation":"要素が3つなら番号は 0, 1, 2。最後の番号は「個数 - 1」で 2 です。scores[len(scores) - 1] と書けますし、scores[-1] とも書けます。","wrong_answer_reasons":{"c1":"要素が3つのとき、有効な番号は 0, 1, 2 です。3 は範囲外で IndexError になります。","c2":"1 は2つ目の要素の番号です。3つ並んでいる最後は、もっと後ろです。"},"hint":"0 から数えて3個並べると、最後はいくつ？","feedback_correct":"正解！最後の番号は 個数 - 1 です。","feedback_incorrect":"惜しい！0 から数えて 3 個並べてみましょう。"},{"id":"PY-048","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":8,"title":"ループの範囲が広すぎる","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["IndexError","range","len"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"点数の合計 245 を求めるつもりが IndexError になります。3行目を正しく書き直して入力してください（3行目の内容だけを入力）。","code":"scores = [70, 85, 90]\ntotal = 0\nfor i in range(len(scores) + 1):\n    total += scores[i]\nprint(total)","answer":{"target_line":3,"accepted":["for i in range(len(scores)):","for i in range(0, len(scores)):","for i in range(0,len(scores)):","for i in range(len(scores)) :"],"quote_insensitive":false,"fixed_code":"scores = [70, 85, 90]\ntotal = 0\nfor i in range(len(scores)):\n    total += scores[i]\nprint(total)","expected_output":"245","buggy_error":"IndexError"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"range(len(scores)) は 0〜2 で、有効な番号と一致するから。","explanation":"range(len(scores) + 1) は 0〜3 を作りますが、scores の番号は 0〜2 だけです。i=3 のとき scores[3] が範囲外になり IndexError です。+ 1 を外して range(len(scores)) にします。","common_mistakes":[{"answer":"for i in range(len(scores) + 1):","reason":"元のコードのままです。i が 3 になったとき scores[3] が範囲外になります。"}],"hint":"range の終了の値は含まれません。len(scores) はいくつ？","feedback_correct":"正解！range(len(...)) で番号がぴったり収まります。","feedback_incorrect":"惜しい！i がいくつまで動くかを確認しましょう。"},{"id":"PY-049","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":9,"title":"sum・max・min","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["sum","max","min","print関数"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"data = [3, 9, 4]\nprint(sum(data), max(data), min(data))","choice_format":"code","choices":[{"id":"c1","text":"9 16 3"},{"id":"c2","text":"16 9 3"},{"id":"c3","text":"16 3 9"}],"answer":{"correct_choice_id":"c2","expected_output":"16 9 3"},"grading":{"method":"choice_id"},"rationale":"合計は3+9+4=16、最大値は9、最小値は3で、書いた順に表示されるから。","explanation":"sum は合計 16、max は最大値 9、min は最小値 3 を返します。print にカンマで並べたので、この順番で空白区切りに表示されます。","wrong_answer_reasons":{"c1":"print の引数は左から sum, max, min の順です。最初に出るのは合計の 16 です。","c3":"max は最大値、min は最小値です。順番が逆になっています。"},"hint":"sum → max → min の順に値を求めてから、並べます。","feedback_correct":"正解！組み込み関数を使いこなせています。","feedback_incorrect":"惜しい！sum と max と min それぞれの値を先に求めましょう。"},{"id":"PY-050","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":10,"title":"平均点を求める","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["sum","len","割り算","リスト"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"リスト scores に点数が入っています。平均点（合計 ÷ 人数）を print で表示するコードを書いてください。人数が変わっても正しく動くようにすること。","code":null,"prefix_code":"scores = [70, 80, 90]","starter_code":"# scores はあらかじめ用意されています\n","answer":{"reference_solution":"print(sum(scores) / len(scores))","alternative_solutions":["total = 0\nfor s in scores:\n    total += s\nprint(total / len(scores))","average = sum(scores) / len(scores)\nprint(average)"],"rejected_examples":[{"code":"print(sum(scores))","reason":"合計を人数で割っていないので平均になりません。"},{"code":"print(sum(scores) / 3)","reason":"人数を 3 と決め打ちすると、人数が変わったときに誤った結果になります。len() を使いましょう。"}]},"grading":{"method":"test_cases","tests":[{"kind":"stdout","setup":"scores = [70, 80, 90]","expected_stdout":"80.0\n","visible":true},{"kind":"stdout","setup":"scores = [1, 2]","expected_stdout":"1.5\n","visible":false},{"kind":"stdout","setup":"scores = [100]","expected_stdout":"100.0\n","visible":false},{"kind":"stdout","setup":"scores = [1, 2, 3, 4]","expected_stdout":"2.5\n","visible":false}],"required_ast_nodes":[],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"sum()で合計、len()で人数を求め、割り算すれば平均になるから。","explanation":"平均は 合計 ÷ 個数 です。sum(scores) / len(scores) と書けば、リストの長さが変わっても対応できます。/ の結果は float なので 80.0 のように表示されます。","hint":"合計は sum()、人数は len() で求められます。","feedback_correct":"正解！sum と len で平均が求められました。","feedback_incorrect":"惜しい！人数が変わっても動く式になっていますか？"},{"id":"PY-051","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":1,"title":"定義しただけでは動かない","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["関数の定義","関数の呼び出し"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードだけを実行すると、どうなりますか？","code":"def greet():\n    print(\"hi\")","choice_format":"text","choices":[{"id":"c1","text":"SyntaxError になる"},{"id":"c2","text":"hi と表示される"},{"id":"c3","text":"何も表示されない"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"def は関数を定義するだけで、呼び出さない限り中身は実行されないから。","explanation":"関数の定義は「こういう部品を作ります」という宣言です。実行したいときは greet() のように呼び出します。定義だけのコードはエラーも出ず、何も表示されません。","wrong_answer_reasons":{"c1":"書き方（文法）は正しいので、エラーにはなりません。","c2":"def は関数を「作る」だけで、中身は実行しません。表示するには greet() と呼び出す必要があります。"},"hint":"コードの最後に greet() という行はありますか？","feedback_correct":"正解！定義だけでは実行されません。","feedback_incorrect":"惜しい！呼び出しの行があるかを確認しましょう。"},{"id":"PY-052","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":2,"title":"戻り値を計算に使う","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["戻り値","関数の呼び出し"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、何が表示されますか？","code":"def add(a, b):\n    return a + b\n\nprint(add(3, 4) * 2)","choice_format":"code","choices":[{"id":"c1","text":"14"},{"id":"c2","text":"7"},{"id":"c3","text":"add(3, 4) * 2"}],"answer":{"correct_choice_id":"c1","expected_output":"14"},"grading":{"method":"choice_id"},"rationale":"add(3, 4) が7を返し、それを2倍して14になるから。","explanation":"関数を呼び出した式は、その戻り値に置き換わって計算が進みます。add(3, 4) は 7 になるので、7 * 2 = 14 が print に渡されます。","wrong_answer_reasons":{"c2":"add(3, 4) が 7 を返したあと、さらに * 2 で 14 になります。","c3":"print は式を計算した結果を表示します。コードの文字がそのまま表示されることはありません。"},"hint":"add(3, 4) をまず 7 に置き換えて考えましょう。","feedback_correct":"正解！呼び出しは戻り値に置き換わります。","feedback_incorrect":"惜しい！まず関数呼び出しの部分を戻り値に置き換えてみましょう。"},{"id":"PY-053","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":3,"title":"return のない関数の結果","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["print と return の違い","None"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"def show(x):\n    print(x)\n\nr = show(5)\nprint(r)","answer":{"expected_output":"5\nNone"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"show は表示するだけで値を返さないため、r は None になるから。","explanation":"show(5) の実行中に 5 が表示されます。しかし return がないので戻り値は None で、r = None になります。そのため最後の print(r) が None を表示します。","common_mistakes":[{"answer":"5","reason":"r に入っているのは show の戻り値です。return がないので None で、それも print で表示されます。"},{"answer":"5\n5","reason":"print は表示するだけで、値を返しません。r には 5 ではなく None が入ります。"}],"hint":"show は return していません。r には何が入るでしょう？","feedback_correct":"正解！return がないと None になります。","feedback_incorrect":"惜しい！r に入る値と、表示のタイミングを分けて考えましょう。"},{"id":"PY-054","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":4,"title":"print と return の違い","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["print と return の違い"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"関数の中の print と return の違いとして、正しい説明はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"どちらも結果を画面に表示する命令で、違いはない"},{"id":"c2","text":"print した値は、呼び出し元の変数に受け取って計算に使える"},{"id":"c3","text":"return は値を呼び出し元に返し、print は画面に表示するだけである"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"return は戻り値を渡す仕組み、print は画面表示の仕組みだから。","explanation":"計算結果をあとで使いたいなら return、人間に見せたいなら print です。return した値は print に渡して表示することもできます。","wrong_answer_reasons":{"c1":"return は画面に表示しません。呼び出し元に値を返すだけです。","c2":"print は表示するだけで、値を返しません。受け取れるのは return した値です。"},"hint":"関数の結果を別の計算に使うにはどちらが必要でしょう？","feedback_correct":"正解！役割がまったく違います。","feedback_incorrect":"惜しい！「値を返す」と「表示する」の違いを整理しましょう。"},{"id":"PY-055","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":5,"title":"結果を返す関数","type":"fill_blank","answer_mode":"text","difficulty":3,"concepts":["return","戻り値"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"長方形の面積を返す関数です。print(area(3, 4)) で 12 だけが表示されるように、空欄 __1__ に入れる語を答えてください。","code":"def area(w, h):\n    __1__ w * h\n\nprint(area(3, 4))","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["return"],"quote_insensitive":false}],"expected_output":"12"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"計算結果を呼び出し元に返すには return を使うから。","explanation":"return w * h で面積を返すと、print(area(3, 4)) は返された 12 を表示します。print を使うと関数内で 12 が表示されたうえ、外側の print が None も表示してしまいます。","common_mistakes":[{"blank":"b1","answer":"print","reason":"print だと関数の中で 12 が表示されますが、戻り値は None です。外側の print(area(3, 4)) がさらに None を表示してしまいます。"}],"hint":"結果を「返す」ための語を思い出しましょう。","feedback_correct":"正解！return で結果を返しました。","feedback_incorrect":"惜しい！表示ではなく「返す」語が必要です。"},{"id":"PY-056","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":6,"title":"引数が足りない","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["引数","TypeError","関数の呼び出し"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"add(3, 4) の結果 7 を表示したいのに、TypeError になります。4行目を直したものはどれですか？","code":"def add(a, b):\n    return a + b\n\nprint(add(3))","choice_format":"code","choices":[{"id":"c1","text":"print(add)"},{"id":"c2","text":"print(add(3, 4))"},{"id":"c3","text":"print(add[3, 4])"}],"answer":{"correct_choice_id":"c2","fixed_code":"def add(a, b):\n    return a + b\n\nprint(add(3, 4))","expected_output":"7","buggy_error":"TypeError","target_line":4,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"add は2つの引数 a と b を必要とするので、2つ渡す必要があるから。","explanation":"def add(a, b) は2つの値を受け取る関数です。add(3) だと b が足りないため TypeError になります。add(3, 4) と両方渡せば 7 が返ります。","wrong_answer_reasons":{"c1":"関数名だけでは呼び出されず、関数そのものの情報が表示されます。7 は表示されません。","c3":"関数の呼び出しには丸括弧 ( ) を使います。角括弧は TypeError になります。"},"hint":"def の行の括弧の中にいくつ名前がありますか？","feedback_correct":"正解！引数の数を関数の定義に合わせました。","feedback_incorrect":"惜しい！def の引数の数と、呼び出しの引数の数を比べましょう。"},{"id":"PY-057","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":7,"title":"デフォルト引数","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["デフォルト引数","**"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"def power(base, exp=2):\n    return base ** exp\n\nprint(power(3))\nprint(power(2, 5))","choice_format":"code","choices":[{"id":"c1","text":"6\n32"},{"id":"c2","text":"9\n32"},{"id":"c3","text":"9\n10"}],"answer":{"correct_choice_id":"c2","expected_output":"9\n32"},"grading":{"method":"choice_id"},"rationale":"exp を省略すると2が使われ、渡すとその値が使われるから。","explanation":"power(3) は exp が省略されたので 2 が入り、3 ** 2 = 9。power(2, 5) は exp=5 なので 2 ** 5 = 32 です。","wrong_answer_reasons":{"c1":"** は累乗です。power(3) は 3 を2回かける 3 ** 2 = 9 で、3 * 2 = 6 ではありません。","c3":"power(2, 5) は 2 ** 5 = 32 です。足し算 2 + 5 = 7 でも 10 でもありません。"},"hint":"1回目は exp を省略しています。デフォルト値はいくつ？","feedback_correct":"正解！省略すると初期値が使われます。","feedback_incorrect":"惜しい！省略したときの exp の値と、** の意味を見直しましょう。"},{"id":"PY-058","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":8,"title":"合計が1にしかならない","type":"bug_fix","answer_mode":"choice","difficulty":4,"concepts":["return","インデント","ループ"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"[1, 2, 3] の合計 6 を返す関数のつもりが、1 が返ってきます。原因を正しく直す方法はどれですか？","code":"def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n        return s\n\nprint(total([1, 2, 3]))","choice_format":"text","choices":[{"id":"c1","text":"s = 0 の行を for の中に移す"},{"id":"c2","text":"return を print に変える"},{"id":"c3","text":"return s の字下げを戻し、ループが終わった後に実行されるようにする"}],"answer":{"correct_choice_id":"c3","fixed_code":"def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s\n\nprint(total([1, 2, 3]))","expected_output":"6","buggy_output":"1"},"grading":{"method":"choice_id"},"rationale":"return は関数をその場で終了するため、ループの中に書くと1回で終わってしまうから。","explanation":"return を実行した時点で関数は終了します。for の中に書くと1回目の足し算（s = 1）の直後に return されるので、1 が返ります。return を for と同じ深さに戻せば、ループが全部終わってから合計が返ります。","wrong_answer_reasons":{"c1":"for の中に移すと、毎回 s が 0 に戻り、合計できません。","c2":"return がなくなると戻り値は None になり、外側の print は None を表示します。しかも関数の中で途中経過が表示されてしまいます。"},"hint":"return を実行するとその関数はどうなりますか？ 字下げの深さにも注目しましょう。","feedback_correct":"正解！return の位置（字下げ）が原因でした。","feedback_incorrect":"惜しい！return を実行するとその場で関数が終わることを思い出しましょう。"},{"id":"PY-059","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":9,"title":"ローカル変数と外の変数","type":"predict_output","answer_mode":"text","difficulty":4,"concepts":["ローカル変数","スコープ"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"def f():\n    x = 10\n    return x + 1\n\nx = 100\nprint(f())\nprint(x)","answer":{"expected_output":"11\n100"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"関数の中のxは関数だけで有効なローカル変数で、外のxとは別物だから。","explanation":"f() の中では x = 10 なので 10 + 1 = 11 を返します。外の x は 100 のまま変わらないので、2行目の表示は 100 です。同じ名前でも、関数の中と外は別の変数として扱われます。","common_mistakes":[{"answer":"11\n11","reason":"関数の中の x は別の変数（ローカル変数）で、外の x の値は書き換わりません。"},{"answer":"101\n100","reason":"関数 f の中では x = 10 が使われます。外の x = 100 は見えていません。"}],"hint":"関数の中で作られた x は、関数の外の x と同じものでしょうか？","feedback_correct":"正解！ローカル変数は外に影響しません。","feedback_incorrect":"惜しい！関数の中の x と外の x は別物です。"},{"id":"PY-060","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":10,"title":"偶数判定の関数","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["関数","return","%","比較演算子"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"整数 n を受け取り、偶数なら True、奇数なら False を返す関数 is_even(n) を作ってください。（表示ではなく、return で返すこと）","code":null,"prefix_code":"","starter_code":"def is_even(n):\n    # ここに書きましょう\n","answer":{"reference_solution":"def is_even(n):\n    return n % 2 == 0","alternative_solutions":["def is_even(n):\n    if n % 2 == 0:\n        return True\n    else:\n        return False","def is_even(n):\n    if n % 2 == 1:\n        return False\n    return True"],"rejected_examples":[{"code":"def is_even(n):\n    print(n % 2 == 0)","reason":"print は表示するだけで、値を返していません（None が返ります）。"},{"code":"def is_even(n):\n    return n % 2","reason":"余りの 0 / 1 を返しています。True / False ではなく、しかも偶数のとき 0 になり意図と逆です。"}]},"grading":{"method":"test_cases","tests":[{"kind":"call","setup":"","call":"is_even(4)","expected":"True","visible":true},{"kind":"call","setup":"","call":"is_even(7)","expected":"False","visible":true},{"kind":"call","setup":"","call":"is_even(0)","expected":"True","visible":false},{"kind":"call","setup":"","call":"is_even(-3)","expected":"False","visible":false}],"required_ast_nodes":["FunctionDef"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"2で割った余りが0なら偶数なので、その比較結果をreturnすればよいから。","explanation":"n % 2 == 0 は偶数なら True、奇数なら False になる式です。そのまま return すれば条件分岐も不要です。if を使って True / False を返す書き方も正解です。","hint":"偶数は 2 で割った余りが 0 です。その比較の結果をそのまま返せます。","feedback_correct":"正解！判定を関数にまとめられました。","feedback_incorrect":"惜しい！print ではなく return で True / False を返していますか？"},{"id":"PY-061","course_id":"python-basics-ja","language or は名前が見つからないエラーです。","feedback_incorrect":"惜しい！エラー名が表すミスの種類を確認しましょう。"},{"id":"PY-063","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":3,"title":"文字列を整数に変換して計算","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["型変換","int"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、何が表示されますか？","code":"a = \"5\"\nb = int(a) + 3\nprint(b)","choice_format":"code","choices":[{"id":"c1","text":"53"},{"id":"c2","text":"8"},{"id":"c3","text":"エラーになる"}],"answer":{"correct_choice_id":"c2","expected_output":"8"},"grading":{"method":"choice_id"},"rationale":"int()で文字列\"5\"を整数5に変換してから足すので8になるから。","explanation":"\"5\" は文字列ですが、int(\"5\") は整数 5 を返します。5 + 3 = 8 が b に入ります。もし int() がなければ \"5\" + 3 は TypeError です。","wrong_answer_reasons":{"c1":"int(a) で \"5\" は整数 5 に変換されます。5 + 3 は連結ではなく足し算で 8 です。","c3":"int(a) で整数に変換しているので、整数同士の足し算になりエラーは起きません。"},"hint":"int() は文字列を何に変えますか？","feedback_correct":"正解！int() で整数にしてから足し算しました。","feedback_incorrect":"惜しい！int(a) の結果の型を考えましょう。"},{"id":"PY-064","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":4,"title":"文字列と数値の連結","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["TypeError","型変換","str"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"「年齢は20歳」と表示したいのに TypeError になります。2行目を直したものはどれですか？","code":"age = 20\nprint(\"年齢は\" + age + \"歳\")","choice_format":"code","choices":[{"id":"c1","text":"print(\"年齢は\" + int(age) + \"歳\")"},{"id":"c2","text":"print(\"年齢は\" - age + \"歳\")"},{"id":"c3","text":"print(\"年齢は\" + str(age) + \"歳\")"}],"answer":{"correct_choice_id":"c3","fixed_code":"age = 20\nprint(\"年齢は\" + str(age) + \"歳\")","expected_output":"年齢は20歳","buggy_error":"TypeError","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"数値を str() で文字列にすれば、文字列同士の連結になるから。","explan xceptで受け止めてNoneを返すから。","explanation":"try の中で int(text) を試し、成功すればその値を return します。ValueError が起きたら except でNone を返します。\"3.5\" のような小数の文字列も int() では ValueError になる点に注意です。","hint":"try: の中に return int(text) を書き、except ValueError: で別の値を返します。","feedback_correct":"正解！エラーを受け止めて、安全な関数にできました。","feedback_incorrect":"惜しい！変換できない文字列を渡したときの動作を確認しましょう。"},{"id":"PY-071","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":1,"title":"strip と len","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["strip","len","文字列メソッド"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"s = \" Python \"\nprint(s.strip())\nprint(len(s.strip()))","choice_format":"code","choices":[{"id":"c1","text":"Python\n8"},{"id":"c2","text":" Python \n6"},{"id":"c3","text":"Python\n6"}],"answer":{"correct_choice_id":"c3","expected_output":"Python\n6"},"grading":{"method":"choice_id"},"rationale":"strip()で前後の空白が消え、Python の6文字になるから。","explanation":"s.strip() は前後の空白を除いた \"Python\" を返します。それに len を使うと 6 です。元の s の長さ（空白を含めて8）を求めているわけではありません。","wrong_answer_reasons":{"c1":"len も strip した後の文字列に対して数えます。前後の空白がなくなった Python は 6 文字です。","c2":"strip() は前後の空白を取り除きます。1行目に空白は残りません。"},"hint":"strip() してから len() が呼ばれます。","feedback_correct":"正解！strip の結果に len を使っています。","feedback_incorrect":"惜しい！strip() の結果の文字列が何文字かを数えましょう。"},{"id":"PY-072","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":2,"title":"元の文字列は変わらない","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["文字列メソッド","再代入"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"name = \"taro\"\nname.upper()\nprint(name)\nname = name.upper()\nprint(name)","answer":{"expected_output":"taro\nTARO"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"upper()は新しい文字列を返すだけで、代入し直すまで元の変数は変わらないから。","explanation":"2行目の name.upper() は結果を受け取っていないので、何も起きなかったのと同じです。4行目で name に代入し直して、はじめて name が TARO になります。","common_mistakes":[{"answer":"TARO\nTARO","reason":"name.upper() は大文字の文字列を返すだけで、name 自体は変わりません。結果を代入した後に初めて変わります。"},{"answer":"taro\ntaro","reason":"4行目で name = name.upper() と代入しているので、2回目の表示は大文字になります。"}],"hint":"メソッドが返した新しい文字列は、どこかに代入されていますか？","feedback_correct":"正解！メソッドは元の文字列を変えません。","feedback_incorrect":"惜しい！代入している行とそうでない行を区別しましょう。"},{"id":"PY-073","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":3,"title":"split と join","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["split","join","リスト"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"words = \"a,b,c\".split(\",\")\nprint(len(words))\nprint(\"-\".join(words))","choice_format":"code","choices":[{"id":"c1","text":"5\na-b-c"},{"id":"c2","text":"3\na-b-c"},{"id":"c3","text":"3\na,b,c"}],"answer":{"correct_choice_id":"c2","expected_output":"3\na-b-c"},"grading":{"method":"choice_id"},"rationale":"カンマで分けると3要素のリストになり、joinで-でつなぎ直すから。","explanation":"\"a,b,c\".split(\",\") は [\"a\", \"b\", \"c\"] です。len は 3。\"-\".join(words) は要素の間に - を入れた \"a-b-c\" を作ります。","wrong_answer_reasons":{"c1":"split の結果はリストで、要素は a, b, c の3つです。元の文字列の文字数（カンマを含めて5）ではありません。","c3":"join は \"-\" でつなぐので、カンマではなくハイフンで区切られます。"},"hint":"split の結果はリスト。そのリストの長さと、join でつないだ文字列を考えます。","feedback_correct":"正解！split と join は逆の働きです。","feedback_incorrect":"惜しい！split の結果の要素数と、join の区切り文字を確認しましょう。"},{"id":"PY-074","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":4,"title":"文字列の置き換え","type":"fill_blank","answer_mode":"text","difficulty":3,"concepts":["replace","文字列メソッド"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"「I like Java」の Java を Python に置き換えて「I like Python」と表示したい。空欄 __1__ に入れるメソッド名を答えてください。","code":"text = \"I like Java\"\nprint(text.__1__(\"Java\", \"Python\"))","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["replace"],"quote_insensitive":false}],"expected_output":"I like Python"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"文字列の一部を別の文字列に置き換えるメソッドは replace だから。","explanation":"replace(古い文字列, 新しい文字列) は、見つかった部分をすべて新しい文字列に置き換えた結果を返します。元の text は変わりません。","common_mistakes":[{"blank":"b1","answer":"upper","reason":"upper は大文字にするメソッドです。引数を2つ渡す使い方もできず TypeError になります。"}],"hint":"「置き換える」を英語にすると？","feedback_correct":"正解！replace で置き換えられました。","feedback_incorrect":"惜しい！「置き換える」ためのメソッド名を思い出しましょう。"},{"id":"PY-075","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":5,"title":"辞書から取り出されるもの","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["辞書","キーと値"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"ages = {\"Taro\": 20} という辞書があります。ages[\"Taro\"] で得られる値はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"\"Taro\""},{"id":"c2","text":"{\"Taro\": 20}"},{"id":"c3","text":"20"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"辞書[キー] は、そのキーに結び付いた値を返すから。","explanation":"辞書は「キー → 値」の対応表です。[ ] にキーを渡すとその値が取り出されます。リストが番号で取り出すのに対し、辞書はキーで取り出します。","wrong_answer_reasons":{"c1":"\"Taro\" は「キー」です。[ ] の中にキーを渡すと、そのキーに結び付いた「値」が返ります。","c2":"ages[\"Taro\"] は辞書全体ではなく、キーに対応する値だけを返します。"},"hint":"[ ] の中に書いたのはキーでしょうか、値でしょうか？","feedback_correct":"正解！キーを渡すと値が返ります。","feedback_incorrect":"惜しい！キーと値を区別しましょう。"},{"id":"PY-076","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":6,"title":"存在しないキー","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["KeyError","get"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"在庫 stock に \"grape\" がないとき 0 と表示したいのに、KeyError になります。2行目を直したものはどれですか？","code":"stock = {\"apple\": 3, \"banana\": 5}\nprint(stock[\"grape\"])","choice_format":"code","choices":[{"id":"c1","text":"print(stock.get(\"grape\", 0))"},{"id":"c2","text":"print(stock(\"grape\"))"},{"id":"c3","text":"print(stock[\"grape\", 0])"}],"answer":{"correct_choice_id":"c1","fixed_code":"stock = {\"apple\": 3, \"banana\": 5}\nprint(stock.get(\"grape\", 0))","expected_output":"0","buggy_error":"KeyError","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"get(キー, 初期値) は、キーがなくてもエラーにならず初期値を返すから。","explanation":"辞書[キー] はキーがないと KeyError になります。辞書.get(キー, 初期値) は、キーがあればその値、なければ初期値を返します。事前に in で調べる方法もあります。","wrong_answer_reasons":{"c2":"辞書は関数ではないので丸括弧では呼び出せず、TypeError になります。","c3":"[ ] の中の \"grape\", 0 は1つのキー（組）と見なされ、やはりキーが存在せず KeyError になります。"},"hint":"エラーにならずに「なければ0」を返す辞書のメソッドがあります。","feedback_correct":"正解！get なら安全に取り出せます。","feedback_incorrect":"惜しい！キーがないときも使えるメソッドを探しましょう。"},{"id":"PY-077","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":7,"title":"辞書の追加と上書き","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["辞書の追加","辞書の更新","len"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"ages = {\"Taro\": 20, \"Hana\": 18}\nages[\"Ken\"] = 25\nages[\"Hana\"] = 19\nprint(len(ages))\nprint(ages[\"Hana\"])","answer":{"expected_output":"3\n19"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"新しいキーKenは追加、既存のHanaは上書きされるから。","explanation":"2行目で Ken が新しく加わり要素は3つ。3行目は既存のキー Hana への代入なので上書きとなり、増えません。最終的に要素は3つで、Hana の値は 19 です。","common_mistakes":[{"answer":"3\n18","reason":"ages[\"Hana\"] = 19 で Hana の値は 18 から 19 に更新されます。"},{"answer":"4\n19","reason":"Hana は既にあるキーなので、追加ではなく上書きです。要素数は Taro, Hana, Ken の3つです。"}],"hint":"既にあるキーへの代入は、追加でしょうか、上書きでしょうか。","feedback_correct":"正解！既存キーへの代入は上書きです。","feedback_incorrect":"惜しい！追加と上書きの違いを確認しましょう。"},{"id":"PY-078","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":8,"title":"辞書のペアを順に取り出す","type":"fill_blank","answer_mode":"text","difficulty":4,"concepts":["items","辞書","for"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"在庫の合計個数 8 を求めたい。空欄 __1__ に入れるメソッド名を答えてください（括弧は書かれています）。","code":"stock = {\"apple\": 3, \"banana\": 5}\ntotal = 0\nfor name, count in stock.__1__():\n    total += count\nprint(total)","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["items"],"quote_insensitive":false}],"expected_output":"8"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"キーと値の両方を同時に取り出すメソッドは items() だから。","explanation":"for name, count in stock.items(): とすると、1回ごとに (キー, 値) が name と count に入ります。count を足していけば 3 + 5 = 8 です。","common_mistakes":[{"blank":"b1","answer":"values","reason":"values() は値だけを取り出すので、name, count の2つの変数に分けられず TypeError になります。"}],"hint":"キーと値の「両方」を取り出すメソッドは？","feedback_correct":"正解！items() でペアを取り出せます。","feedback_incorrect":"惜しい！キーと値の両方を取り出せるのはどれでしょう？"},{"id":"PY-079","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":9,"title":"数え方のミス","type":"bug_fix","answer_mode":"text","difficulty":4,"concepts":["辞書","カウント","論理エラー"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"文字の出現回数を数えるつもりが、結果が {'a': 1, 'b': 0, 'c': 0} になります（正しくは {'a': 2, 'b': 1, 'c': 1}）。6行目を正しく書き直して入力してください（6行目の内容だけを入力）。","code":"counts = {}\nfor ch in \"abca\":\n    if ch in counts:\n        counts[ch] += 1\n    else:\n        counts[ch] = 0\nprint(counts)","answer":{"target_line":6,"accepted":["counts[ch] = 1","counts[ch]=1"],"quote_insensitive":false,"fixed_code":"counts = {}\nfor ch in \"abca\":\n    if ch in counts:\n        counts[ch] += 1\n    else:\n        counts[ch] = 1\nprint(counts)","expected_output":"{'a': 2, 'b': 1, 'c': 1}","buggy_output":"{'a': 1, 'b': 0, 'c': 0}"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"初めて出てきた文字は、その時点で1回出現しているので値を 1 にするから。","explanation":"else の部分は「その文字が初めて出てきた」ときに実行されます。このとき 0 を入れると、1回出た分が数えられません。1 を入れ、2回目以降は += 1 で増やします。","common_mistakes":[{"answer":"counts[ch] = 0","reason":"元のコードのままです。初めて出てきた文字は、その時点で1回出ているので、初期値は 1 です。"}],"hint":"初めてその文字が出た時点で、出現回数はいくつでしょう？","feedback_correct":"正解！初回の出現を 1 として数えました。","feedback_incorrect":"惜しい！「初めて出てきた」とき、すでに1回出ています。"},{"id":"PY-080","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":10,"title":"単語の出現回数","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["辞書","split","for","関数","return"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"空白で区切られた英単語の文字列 text を受け取り、単語をキー、出現回数を値にした辞書を返す関数 count_words(text) を作ってください。（text.split() で空白区切りの単語のリストが得られます）","code":null,"prefix_code":"","starter_code":"def count_words(text):\n    # ここに書きましょう\n","answer":{"reference_solution":"def count_words(text):\n    counts = {}\n    for word in text.split():\n        if word in counts:\n            counts[word] += 1\n        else:\n            counts[word] = 1\n    return counts","alternative_solutions":["def count_words(text):\n    counts = {}\n    for word in text.split():\n        counts[word] = counts.get(word, 0) + 1\n    return counts"],"rejected_examples":[{"code":"def count_words(text):\n    counts = {}\n    for word in text.split():\n        counts[word] = 1\n    return counts","reason":"毎回 1 に上書きしており、2回以上出る単語が正しく数えられません。"},{"code":"def count_words(text):\n    return len(text.split())","reason":"辞書ではなく単語の総数を返しています。"}]},"grading":{"method":"test_cases","tests":[{"kind":"call","setup":"","call":"sorted(count_words('a b a').items())","expected":"[('a', 2), ('b', 1)]","visible":true},{"kind":"call","setup":"","call":"sorted(count_words('x').items())","expected":"[('x', 1)]","visible":true},{"kind":"call","setup":"","call":"sorted(count_words('to be or not to be').items())","expected":"[('be', 2), ('not', 1), ('or', 1), ('to', 2)]","visible":false},{"kind":"call","setup":"","call":"count_words('')","expected":"{}","visible":false}],"required_ast_nodes":["FunctionDef","For"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"split()で単語に分け、辞書で既存なら+1、なければ1にして数えるから。","explanation":"ステージ8の例（文字を数える）と同じ考え方で、対象が文字から単語に変わっただけです。get(word, 0) + 1 と書くと if/else を省略できます。最後に counts を return するのを忘れないようにしましょう。","hint":"辞書 counts = {} を用意し、for で単語を1つずつ取り出して数えます。最後に return。","feedback_correct":"正解！データ集計の基本形が書けました。","feedback_incorrect":"惜しい！同じ単語が2回出てきたときの動作を確認しましょう。"},{"id":"PY-081","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":1,"title":"randint の範囲","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["random","randint"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"import random のあと、random.randint(1, 3) を実行しました。結果として起こり得ない値はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"1"},{"id":"c2","text":"3"},{"id":"c3","text":"4"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"randint(1, 3) は1以上3以下の整数だけを返すので、4は返らないから。","explanation":"random.randint(a, b) は a 以上 b 以下（両端を含む）の整数を返します。range(1, 3) のように最後を含まない仕組みとは違う点に注意しましょう。1, 2, 3 のどれかが返り、4 は返りません。","wrong_answer_reasons":{"c1":"randint は最初の値（1）も含みます。1 が返ることはあります。","c2":"randint は最後の値（3）も含みます。range とは違い、3 が返ることもあります。"},"hint":"randint は最後の数も含む、と覚えておきましょう。","feedback_correct":"正解！randint の範囲は両端を含みます。","feedback_incorrect":"惜しい！randint は a 以上 b 以下の整数を返します。"},{"id":"PY-082","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":2,"title":"おみくじの結果を読む","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["if/elif/else","トレース"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"n = 4\nif n >= 9:\n    result = \"大吉\"\nelif n >= 5:\n    result = \"中吉\"\nelse:\n    result = \"小吉\"\nprint(\"結果:\", result)","choice_format":"code","choices":[{"id":"c1","text":"結果: 大吉"},{"id":"c2","text":"結果: 中吉"},{"id":"c3","text":"結果: 小吉"}],"answer":{"correct_choice_id":"c3","expected_output":"結果: 小吉"},"grading":{"method":"choice_id"},"rationale":"4は9以上でも5以上でもないので、elseの小吉になるから。","explanation":"上から順に、n >= 9（False）、n >= 5（False）と調べ、どちらも成立しないので else の小吉が選ばれます。print は \"結果:\" と result の間に空白を入れて表示します。","wrong_answer_reasons":{"c1":"n = 4 は 9 以上ではありません。最初の条件は False です。","c2":"n = 4 は 5 以上ではありません。2つ目の条件も False です。"},"hint":"n = 4 のとき、各条件が True か False かを順に判定しましょう。","feedback_correct":"正解！条件を順に判定できました。","feedback_incorrect":"惜しい！各条件を上から順に True / False で判定しましょう。"},{"id":"PY-083","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":3,"title":"簡易計算機の動き","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["関数","if/elif/else","トレース"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"def calc(a, op, b):\n    if op == \"+\":\n        return a + b\n    elif op == \"-\":\n        return a - b\n    elif op == \"*\":\n        return a * b\n    else:\n        return \"未対応\"\n\nprint(calc(6, \"-\", 4))\nprint(calc(2, \"/\", 5))","answer":{"expected_output":"2\n未対応"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"\"-\"は引き算で2、\"/\"は対応する分岐がなくelseの未対応になるから。","explanation":"1回目は op が \"-\" なので a - b = 2。2回目の op は \"/\" ですが、+, -, * のどれにも一致しないので else の「未対応」が返されます。","common_mistakes":[{"answer":"2\n0.4","reason":"calc には \"/\" の場合の処理がありません。else に進んで「未対応」が返ります。"},{"answer":"10\n未対応","reason":"\"-\" は引き算なので 6 - 4 = 2 です。"}],"hint":"op の値が、どの分岐に一致するかを見ます。","feedback_correct":"正解！op の値で分岐が切り替わります。","feedback_incorrect":"惜しい！op の値がどの分岐に当てはまるか確認しましょう。"},{"id":"PY-084","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":4,"title":"割り算の分岐を追加","type":"fill_blank","answer_mode":"text","difficulty":3,"concepts":["関数","/","//"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"calc 関数に割り算の分岐を追加します。calc(10, \"/\", 4) が 2.5 を返すよう、空欄 __1__ に入れる式を答えてください。","code":"def calc(a, op, b):\n    if op == \"+\":\n        return a + b\n    elif op == \"/\":\n        return __1__\n    else:\n        return \"未対応\"\n\nprint(calc(10, \"/\", 4))","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["a / b","a/b"],"quote_insensitive":false}],"expected_output":"2.5"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"小数を含む割り算の結果が必要なので、/ を使うから。","explanation":"/ は割り切れない場合も小数で結果を返すので 10 / 4 = 2.5。// は切り捨ての商で 2 になってしまいます。変数 a と b を使って書くことで、どんな値でも使える関数になります。","common_mistakes":[{"blank":"b1","answer":"a // b","reason":"// は小数点以下を切り捨てた商なので 2 になります。2.5 にするには / を使います。"}],"hint":"結果が 2.5 になる割り算の記号は / でしたか、// でしたか？","feedback_correct":"正解！変数を使った式で割り算を書けました。","feedback_incorrect":"惜しい！/ と // の違いを見直しましょう。"},{"id":"PY-085","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":5,"title":"合格者を数える","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["for","if","カウント"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、何が表示されますか？","code":"scores = [55, 80, 62, 90, 45]\npassed = 0\nfor s in scores:\n    if s >= 60:\n        passed += 1\nprint(passed)","choice_format":"code","choices":[{"id":"c1","text":"2"},{"id":"c2","text":"5"},{"id":"c3","text":"3"}],"answer":{"correct_choice_id":"c3","expected_output":"3"},"grading":{"method":"choice_id"},"rationale":"60点以上は80、62、90の3人だから。","explanation":"for で1つずつ調べ、s >= 60 のときだけ passed に1を足します。55 → 数えない、80 → 数える、62 → 数える、90 → 数える、45 → 数えない。合計は3です。","wrong_answer_reasons":{"c1":"60点以上は 80, 62, 90 の3つです。62 も 60 以上なので数えます。","c2":"if s >= 60 を満たすものだけ数えます。55 と 45 は数えられません。"},"hint":"1つずつ、60以上かどうかを判定して、数えましょう。","feedback_correct":"正解！条件に合うものだけ数えました。","feedback_incorrect":"惜しい！点数ごとに60以上かを判定してみましょう。"},{"id":"PY-086","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":6,"title":"成績判定の順序","type":"bug_fix","answer_mode":"choice","difficulty":4,"concepts":["elif","条件の順序","論理エラー"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"85点なら \"B\" と表示するはずが \"C\" と表示されます。どう直すのが適切ですか？","code":"score = 85\nif score >= 60:\n    grade = \"C\"\nelif score >= 80:\n    grade = \"B\"\nelse:\n    grade = \"D\"\nprint(grade)","choice_format":"text","choices":[{"id":"c1","text":"条件を厳しい順（80以上、60以上の順）に並べ替える"},{"id":"c2","text":"elif をすべて if に変える"},{"id":"c3","text":"score >= 60 を score == 60 に変える"}],"answer":{"correct_choice_id":"c1","fixed_code":"score = 85\nif score >= 80:\n    grade = \"B\"\nelif score >= 60:\n    grade = \"C\"\nelse:\n    grade = \"D\"\nprint(grade)","expected_output":"B","buggy_output":"C"},"grading":{"method":"choice_id"},"rationale":"if/elifは上から順に調べ、最初に成立した所で終わるので、厳しい条件を先に調べる必要があるから。","explanation":"85 は 60 以上でもあるため、最初の条件で \"C\" になり、80 以上かどうかは調べられません。80 以上を先に調べるように並べ替えると、85 は \"B\"、65 は \"C\" と正しく分けられます。","wrong_answer_reasons":{"c2":"65点のとき、最初の if で C になった後、2つ目の if（80以上）は False なので else の D が実行され、最終的に D になってしまいます。","c3":"== は「ちょうど60」のときだけ成立します。85 を含む大半の点数が当てはまらなくなります。"},"hint":"85 は、最初の条件 score >= 60 を満たしますか？","feedback_correct":"正解！条件の並べ順が重要でした。","feedback_incorrect":"惜しい！上から順に調べ、最初に成立した所で終わることを思い出しましょう。"},{"id":"PY-087","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":7,"title":"買い物かごの合計","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["辞書","リスト","for","累積"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください。","code":"prices = {\"りんご\": 120, \"みかん\": 80}\ncart = [\"りんご\", \"みかん\", \"りんご\"]\ntotal = 0\nfor item in cart:\n    total += prices[item]\nprint(\"合計:\", total)","answer":{"expected_output":"合計: 320"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"りんご120×2とみかん80を足して320になるから。","explanation":"cart の要素を順に取り出し、prices から価格を引いて足します。120 → 200 → 320。りんごは2回出てくるので、2回足されます。","common_mistakes":[{"answer":"合計: 200","reason":"cart にはりんごが2つ入っています。りんごの価格 120 を2回足します。"},{"answer":"合計: 80","reason":"合計は最後の1つ分ではなく、かごの中の全部です。+= で足し込んでいます。"}],"hint":"かごの中身を1つずつ、価格に変えながら足します。","feedback_correct":"正解！辞書とリストを組み合わせて読めました。","feedback_incorrect":"惜しい！かごの中身を1つずつ、価格に置き換えて足してみましょう。"},{"id":"PY-088","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":8,"title":"コードの読み方","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["トレース","コードの読み方"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"見慣れた長めのコードの動きを予想するとき、最も確実な方法はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"全体をざっと眺めて、なんとなくの印象で答える"},{"id":"c2","text":"一番下の行から順に読み進める"},{"id":"c3","text":"変数の値が1行ごとにどう変わるかを書き出して、上から順に追う"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"実行の順に、変数の値を1つずつ確かめるのが最も確実だから。","explanation":"プログラムは上から順に実行され、そのたびに変数の値が変化します。変数名と今の値を書き出しながら追うこと（トレース）が、読み間違いを防ぐ基本の方法です。","wrong_answer_reasons":{"c1":"印象で答えると、条件の境界や繰り返しの回数を間違えやすくなります。","c2":"コードは上から下へ順に実行されます。実行順に追わないと値の変化が分かりません。"},"hint":"コンピューターは、どの順番でコードを実行しますか？","feedback_correct":"正解！値を書き出して追うのが基本です。","feedback_incorrect":"惜しい！実行の順に、値の変化を追う方法を選びましょう。"},{"id":"PY-089","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":9,"title":"4文字以上を数える","type":"bug_fix","answer_mode":"text","difficulty":4,"concepts":["比較演算子","境界値","論理エラー"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"4文字以上の単語の数 2 を求めるつもりが 1 と表示されます。4行目を正しく書き直して入力してください（4行目の内容だけを入力）。","code":"words = [\"cat\", \"tree\", \"horse\", \"dog\"]\ncount = 0\nfor w in words:\n    if len(w) > 4:\n        count += 1\nprint(count)","answer":{"target_line":4,"accepted":["if len(w) >= 4:","if len(w)>=4:","if len(w) > 3:","if len(w)>3:"],"quote_insensitive":false,"fixed_code":"words = [\"cat\", \"tree\", \"horse\", \"dog\"]\ncount = 0\nfor w in words:\n    if len(w) >= 4:\n        count += 1\nprint(count)","expected_output":"2","buggy_output":"1"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"「4文字以上」は4を含むので、>= 4 （または > 3）にする必要があるから。","explanation":"len(w) > 4 は5文字以上です。4文字の tree が数えられません。「以上」は >= を使います。境界の値（ちょうど4）を実際に当てはめて確かめるのが大切です。","common_mistakes":[{"answer":"if len(w) > 4:","reason":"元のコードのままです。「4文字以上」に 4文字ちょうどの tree が含まれていません。"}],"hint":"4文字ちょうどの単語（tree）は、len(w) > 4 を満たしますか？","feedback_correct":"正解！境界値（4文字ちょうど）を含めました。","feedback_incorrect":"惜しい！「以上」と「より大きい」の違いを確認しましょう。"},{"id":"PY-090","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":10,"title":"おみくじ判定関数","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["関数","if/elif/else","境界値","return"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"1〜10 の整数 n を受け取り、結果の文字列を返す関数 fortune(n) を作ってください。9 以上なら \"大吉\"、5 以上 8 以下なら \"中吉\"、それ以外（4 以下）なら \"小吉\" を返します。（ランダムに引く部分は含めず、判定だけを作ります）","code":null,"prefix_code":"","starter_code":"def fortune(n):\n    # ここに書きましょう\n","answer":{"reference_solution":"def fortune(n):\n    if n >= 9:\n        return \"大吉\"\n    elif n >= 5:\n        return \"中吉\"\n    else:\n        return \"小吉\"","alternative_solutions":["def fortune(n):\n    if n < 5:\n        return \"小吉\"\n    elif n < 9:\n        return \"中吉\"\n    return \"大吉\"","def fortune(n):\n    if n >= 9:\n        result = '大吉'\n    elif n >= 5:\n        result = '中吉'\n    else:\n        result = '小吉'\n    return result"],"rejected_examples":[{"code":"def fortune(n):\n    if n > 9:\n        return \"大吉\"\n    elif n > 5:\n        return \"中吉\"\n    else:\n        return \"小吉\"","reason":"境界値が違います。9 や 5 ちょうどのときの結果が仕様と合いません（9 以上、5 以上）。"},{"code":"def fortune(n):\n    if n >= 5:\n        return \"中吉\"\n    elif n >= 9:\n        return \"大吉\"\n    else:\n        return \"小吉\"","reason":"条件の順序が逆です。9 以上でも最初の n >= 5 が成立して中吉になってしまいます。"}]},"grading":{"method":"test_cases","tests":[{"kind":"call","setup":"","call":"fortune(10)","expected":"'大吉'","visible":true},{"kind":"call","setup":"","call":"fortune(9)","expected":"'大吉'","visible":false},{"kind":"call","setup":"","call":"fortune(8)","expected":"'中吉'","visible":true},{"kind":"call","setup":"","call":"fortune(5)","expected":"'中吉'","visible":false},{"kind":"call","setup":"","call":"fortune(4)","expected":"'小吉'","visible":true},{"kind":"call","setup":"","call":"fortune(1)","expected":"'小吉'","visible":false}],"required_ast_nodes":["FunctionDef","If"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"厳しい条件（9以上）から順に調べ、境界の9と5を含めるから。","explanation":"if n >= 9 → elif n >= 5 → else の順に書けば、重なりも漏れもありません。9 と 5 が境界なので、必ずその値で確認します。実際のおみくじでは fortune(random.randint(1, 10)) のように呼び出します。","hint":"厳しい条件（9以上）から順に調べます。境界の 9 と 5 の扱いに注意しましょう。","feedback_correct":"正解！おみくじの判定部分ができました。","feedback_incorrect":"惜しい！境界の値（9 と 5）と、条件を調べる順序を確認しましょう。"},{"id":"PY-091","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":1,"title":"FizzBuzz のかけら","type":"predict_output","answer_mode":"choice","difficulty":4,"concepts":["for","if","%","range"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"for i in range(1, 6):\n    if i % 3 == 0:\n        print(\"Fizz\")\n    else:\n        print(i)","choice_format":"code","choices":[{"id":"c1","text":"1\n2\nFizz\n4\n5"},{"id":"c2","text":"1\n2\nFizz\n4"},{"id":"c3","text":"1\n2\n3\n4\n5"}],"answer":{"correct_choice_id":"c1","expected_output":"1\n2\nFizz\n4\n5"},"grading":{"method":"choice_id"},"rationale":"1〜5のうち3の倍数は3だけで、その回だけFizzが表示されるから。","explanation":"i が 1, 2 のときは余りが 0 でないので数字を表示。i = 3 のとき 3 % 3 == 0 が成立して Fizz。i = 4, 5 は再び数字です。range の終わり 6 は含まれず、5 回繰り返されます。","wrong_answer_reasons":{"c2":"range(1, 6) は 1〜5 です。5 回繰り返すので、最後の 5 も表示されます。","c3":"i が 3 のとき、i % 3 == 0 が成立するので、3 ではなく Fizz が表示されます。"},"hint":"i が 3 のときだけ、条件 i % 3 == 0 が True になります。","feedback_correct":"正解！ループと条件分岐を組み合わせて読めました。","feedback_incorrect":"惜しい！i の値ごとに、条件が True か False か判定しましょう。"},{"id":"PY-092","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":2,"title":"入れ子のループ","type":"predict_output","answer_mode":"text","difficulty":4,"concepts":["入れ子のループ","文字列の連結","range"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"for i in range(1, 4):\n    line = \"\"\n    for j in range(i):\n        line += \"*\"\n    print(line)","answer":{"expected_output":"*\n**\n***"},"grading":{"m zBuzz\"\n・3 の倍数なら \"Fizz\"\n・5 の倍数なら \"Buzz\"\n・それ以外は n を文字列にしたもの（例: 7 なら \"7\"）","code":null,"prefix_code":"","starter_code":"def fizzbuzz(n):\n    # ここに書きましょう\n","answer":{"reference_solution":"def fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    elif n % 3 == 0:\n        return \"Fizz\"\n    elif n % 5 == 0:\n        return \"Buzz\"\n    else:\n        return str(n)","alternative_solutions":["def fizzbuzz(n):\n    if n % 3 == 0 and n % 5 == 0:\n        return \"FizzBuzz\"\n    if n % 3 == 0:\n        return \"Fizz\"\n    if n % 5 == 0:\n        return \"Buzz\"\n    return str(n)"],"rejected_examples":[{"code":"def fizzbuzz(n):\n    if n % 3 == 0:\n        return \"Fizz\"\n    elif n % 5 == 0:\n        return \"Buzz\"\n    elif n % 15 == 0:\n        return \"FizzBuzz\"\n    else:\n        return str(n)","reason":"15 の倍数は先に 3 の倍数に当てはまり Fizz になってしまいます。15 の判定を最初にします。"},{"code":"def fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    elif n % 3 == 0:\n        return \"Fizz\"\n    elif n % 5 == 0:\n        return \"Buzz\"\n    else:\n        return n","reason":"最後の戻り値が整数のままです。文字列にするには str(n) を使います。"}]},"grading":{"method":"test_cases","tests":[{"kind":"call","setup":"","call":"fizzbuzz(15)","expected":"'FizzBuzz'","visible":true},{"kind":"call","setup":"","call":"fizzbuzz(9)","expected":"'Fizz'","visible":true},{"kind":"call","setup":"","call":"fizzbuzz(10)","expected":"'Buzz'","visible":true},{"kind":"call","setup":"","call":"fizzbuzz(7)","expected":"'7'","visible":true},{"kind":"call","setup":"","call":"fizzbuzz(30)","expected":"'FizzBuzz'","visible":false},{"kind":"call","setup":"","call":"fizzbuzz(1)","expected":"'1'","visible":false}],"required_ast_nodes":["FunctionDef","If"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"15の倍数を最初に判定し、3、5の順に調べ、それ以外はstr(n)を返すから。","explanation":"条件の順序が最大のポイントです。15 の倍数は 3 の倍数でも ts":["バブリング","イベント委譲"]},{"question_id":"JS-090","number_in_stage":10,"title":"カウンターを作る","type":"code_write","difficulty":4,"concepts":["addEventListener","if","DOM操作"]}],"clear_condition":{"type":"first_attempt_correct_count","required_correct":7,"total_questions":10,"description":"ステージ内の10問すべてに最後まで回答し、1回目の回答で7問以上正解するとクリア。","stars":{"1":7,"2":9,"3":10},"retry_policy":"不正解でも同じ問題に何度でも再挑戦できる（再挑戦での正解は学習履歴には残るが、クリア判定・星には数えない）。クリアできなかった場合は「ステージをやり直す」で新しい挑戦を始められる。","unlock_next_stage":true},"leads_to":["DOM 操作とイベント処理を組み合わせて、ページで動く簡単なアプリを作ります（ステージ10）"],"unlock_condition":{"type":"stage_cleared","stage_id":"S08"}},{"id":"S10","number":10,"title":"簡単なWebアプリ制作","subtitle":"データと表示を分けて、動くページを組み立てる","learning_goals":["「データを更新する → 画面を書き換える」という流れでアプリを組み立てられる","入力欄の値が文字列であることを意識し、Number() で数値にできる","空の入力など、想定外の入力に対応できる","カウンター・ToDo・タブ切替など、簡単なWebアプリを自分で書ける","ここまでの JavaScript の知識（変数・配列・関数・DOM・イベント）を組み合わせられる"],"prerequisite_knowledge":["ステージ1〜9のすべて（特に配列・関数・DOM 操作・イベント処理）"],"prerequisite_stage_ids":["S09"],"topics":["データ（配列・数）と表示（DOM）を分けて考える","入力値の取得（value）と数値への変換（Number）","空の入力のチェック（trim）","要素の追加と削除（createElement / appendChild / remove）","class や hidden での表示の切り替え","完成したアプリの全体像を読む"],"common_pitfalls":["input の value は、数字を入れても文字列（\"1\" + \"2\" は \"12\"）","配列のデータを変えただけでは、画面は変わらない（render し直す）","空の入力や、スペースだけの入力を忘れる","追加・削除のあとに、件数などの表示を更新し忘れる","一度に全部を作ろうとせず、1つの機能ずつ作って確かめる"],"lesson_id":"LESSON-S10","question_plan":[{"question_id":"JS-091","number_in_stage":1,"title":"アプリの作り方の基本","type":"multiple_choice","difficulty":2,"concepts":["アプリ設計","データと表示"]},{"question_id":"JS-092","number_in_stage":2,"title":"データを変えただけでは画面は変わらない","type":"predict_output","difficulty":3,"concepts":["render","データと表示"]},{"question_id":"JS-093","number_in_stage":3,"title":"入力値を数値にする","type":"fill_blank","difficulty":2,"concepts":["Number()","value","型変換"]},{"question_id":"JS-094","number_in_stage":4,"title":"入力欄の値が連結されてしまう","type":"bug_fix","difficulty":3,"concepts":["Number()","文字列の連結","value"]},{"question_id":"JS-095","number_in_stage":5,"title":"toggle を2回","type":"predict_output","difficulty":2,"concepts":["classList","toggle","click"]},{"question_id":"JS-096","number_in_stage":6,"title":"文字数カウンター","type":"code_write","difficulty":3,"concepts":["input イベント","value","length"]},{"question_id":"JS-097","number_in_stage":7,"title":"ToDo を追加する","type":"code_write","difficulty":4,"concepts":["createElement","appendChild","trim","addEventListener"]},{"question_id":"JS-098","number_in_stage":8,"title":"タブの切り替え","type":"code_write","difficulty":4,"concepts":["dataset","hidden","for...of","イベント処理"]},{"question_id":"JS-099","number_in_stage":9,"title":"完了にして残りを数える","type":"code_write","difficulty":4,"concepts":["classList.toggle","イベント処理","DOM操作"]},{"question_id":"JS-100","number_in_stage":10,"title":"削除ボタンつきの ToDo アプリ","type":"code_write","difficulty":5,"concepts":["DOM操作","イベント処理","関数","createElement","remove"]}],"clear_condition":{"type":"first_attempt_correct_count","required_correct":7,"total_questions":10,"description":"ステージ内の10問すべてに最後まで回答し、1回目の回答で7問以上正解するとクリア。","stars":{"1":7,"2":9,"3":10},"retry_policy":"不正解でも同じ問題に何度でも再挑戦できる（再挑戦での正解は学習履歴には残るが、クリア判定・星には数えない）。クリアできなかった場合は「ステージをやり直す」で新しい挑戦を始められる。","unlock_next_stage":true},"leads_to":["この先は、localStorage での保存、fetch での通信、ファイル分割・モジュール、フレームワークなどへ進めます（このコースでは扱いません）"],"unlock_condition":{"type":"stage_cleared","stage_id":"S09"}}]},"lessons":{"course_id":"javascript-basics-ja","schema_version":"1.1.0","lessons":[{"id":"LESSON-S01","stage_id":"S01","title":"変数とデータ型","intro":"Webページの文章や構造は HTML、見た目は CSS で作ります。そこに「動き」を足すのが JavaScript です。ボタンを押したら表示が変わる、入力内容をチェックする、といったことができます。まずはコードを書いて結果を確かめる基本の道具、console.log と変数から始めましょう。","sections":[{"id":"S01-L1","title":"JavaScript と console.log","read_minutes":3,"body":["JavaScript は、Webブラウザの中で動くプログラミング言語です。HTML がページの構造、CSS が見た目を担当し、JavaScript が動きや計算を担当します（HTML と CSS はプログラミング言語ではなく、それぞれマークアップ言語・スタイルシート言語と呼びます）。","コードを動かす場所は2つあります。1つは HTML の中の <script> タグ、もう1つはブラウザの開発者ツール（多くのブラウザで F12 キー）にある「コンソール」です。このコースの問題では、書いたコードが自動で実行されます。","console.log(値) と書くと、値が開発者ツールのコンソールに表示されます。ページの画面には表示されません。結果を確かめるときの一番基本の道具です。複数の値を , で区切ると、間に空白を入れて1行に表示されます。","// から行末まではコメントで、実行されません。文の終わりには ; （セミコロン）を付けるのが一般的です。JavaScript は大文字と小文字を区別します（console.log は正しく、Console.log はエラーです）。"],"glossary":[{"term":"コンソール","definition":"開発者ツールの中にある、メッセージやエラーを確認する画面。"},{"term":"文","definition":"実行の1つのまとまり。ふつう ; で終える。"},{"term":"コメント","definition":"// で始まる、人間向けのメモ。実行されない。"}],"examples":[{"id":"S01-E1","title":"いちばん短いコード","language":"javascript","code":"console.log(\"Hello\");\nconsole.log(10);\nconsole.log(\"a\", \"b\");","expected_output":"Hello\n10\na b","line_notes":["1行目: 文字列 Hello を表示します（引用符は表示されません）。","2行目: 数値は引用符なしで書けます。","3行目: カンマで区切ると、間に空白を入れて1行に表示されます。"]},{"id":"S01-E2","title":"HTMLの中に書く（script タグ）","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>はじめて<\/title><\/head>\n<body>\n  <p>画面にはこの文章だけが表示されます<\/p>\n  <script>\n    console.log(\"コンソールに表示されます\");\n  <\/script>\n<\/body>\n<\/html>","expected_output":"","line_notes":["6〜8行目: <script> タグの中に JavaScript を書きます。","console.log の結果は画面ではなく、開発者ツールのコンソールに出ます。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","expr":"document.scripts.length === 1 && document.querySelector('p').textContent.includes('画面')"}},{"id":"S01-E3","title":"コメント","language":"javascript","code":"// あいさつを表示する\nconsole.log(\"Hi\"); // 行の途中からでもOK\n// console.log(\"Bye\");","expected_output":"Hi","line_notes":["// 以降は実行されません。3行目のようにコードを一時的に無効にするのにも使えます。"]}]},{"id":"S01-L2","title":"変数とデータ型","read_minutes":3,"body":["変数は、値に付ける名前です。let 名前 = 値; で宣言して値を入れます。あとから値を変えたいときは、let の変数に再び = で代入します。値を変えない変数は const で宣言します。const の変数に再代入するとエラー（TypeError）になります。","変数名には英字・数字・_ ・$ が使えますが、数字で始められません。大文字と小文字は区別されます。単語をつなぐときは userName のように、2語目の頭を大文字にする書き方（キャメルケース）が一般的です。","値には種類（データ型）があります。数値は number、文字列は string（\"\" か '' か `` で囲む）、真偽値は boolean（true / false）です。値がまだ入っていない変数は undefined、「意図的に空」を表す値は null です。","typeof 値 で型を調べられます。\"42\" のように引用符で囲むと数値ではなく文字列です。"],"glossary":[{"term":"変数","definition":"値に付けた名前。"},{"term":"宣言","definition":"let や const で変数を作ること。"},{"term":"データ型","definition":"値の種類。number、string、boolean など。"},{"term":"undefined","definition":"値がまだ入っていないことを表す値。"}],"examples":[{"id":"S01-E4","title":"let と const","language":"javascript","code":"let score = 50;\nscore = 80;\nconst name = \"Hana\";\nconsole.log(score);\nconsole.log(name);","expected_output":"80\nHana","line_notes":["2行目: let の変数には、あとから値を入れ直せます（上書き）。","3行目: const の変数は、あとから変更できません。"]},{"id":"S01-E5","title":"データ型を調べる","language":"javascript","code":"console.log(typeof 42);\nconsole.log(typeof \"42\");\nconsole.log(typeof true);\nlet x;\nconsole.log(x);\nconsole.log(typeof x);\nconsole.log(typeof null);","expected_output":"number\nstring\nboolean\nundefined\nundefined\nobject","line_notes":["2行目: 引用符で囲んだ \"42\" は文字列です。","4〜6行目: 値を入れていない変数は undefined です。","7行目: typeof null が \"object\" になるのは、JavaScript の歴史的な仕様です。null の型は覚えなくても構いません。"]},{"id":"S01-E6","title":"const に再代入するとエラー","language":"javascript","code":"const price = 100;\nprice = 200;","expected_output":"","expected_error":"TypeError","line_notes":["const の変数に再代入すると TypeError（Assignment to constant variable）になります。"]}]}],"common_mistakes":[{"title":"const の変数を書き換える","wrong_code":"const count = 0;\ncount = 1;","why":"const は再代入できず TypeError になります。書き換える変数は let で宣言します。","fix":"let count = 0;"},{"title":"引用符を付け忘れる","wrong_code":"let greeting = Hello;","why":"引用符がない Hello は変数名と見なされ、ReferenceError になります。","fix":"let greeting = \"Hello\";"},{"title":"大文字・小文字の違い","wrong_code":"let userName = \"Hana\";\nconsole.log(username);","why":"userName と username は別の名前です。宣言されていない名前を使うと ReferenceError になります。","fix":"console.log(userName);"},{"title":"同じ名前を二重に宣言する","wrong_code":"let a = 1;\nlet a = 2;","why":"同じスコープで let の同名宣言はできず、SyntaxError になります。2回目は代入だけにします。","fix":"let a = 1;\na = 2;"}],"checkpoints":["JavaScript はブラウザで動くプログラミング言語（HTML・CSS とは役割が違う）","console.log の出力はコンソールに出る","let は再代入できる、const は再代入できない","number / string / boolean / undefined / null","typeof で型を調べられる","大文字と小文字は区別される"],"next_bridge":"変数に値を入れられるようになりました。問題で、コードを読んで結果を予想したり、エラーの原因を探したりしてみましょう。"},{"id":"LESSON-S02","stage_id":"S02","title":"演算子","intro":"変数に入れた値を、計算したり、つなげたり、比べたりするのが演算子です。次のステージの「条件分岐」は、ここで学ぶ比較演算子と論理演算子の結果を使って動きます。","sections":[{"id":"S02-L1","title":"計算・代入・文字列の連結","read_minutes":3,"body":["算術演算子は + - * / % ** です。% は割った余り、** は累乗（べき乗）です。JavaScript の / は小数まで計算する割り算で、7 / 2 は 3.5 になります（整数の商を返す演算子はありません）。掛け算・割り算は足し算・引き算より先に計算され、( ) で順序を変えられます。","x += 5 は x = x + 5 の短い書き方です。-= *= /= も同様で、x++ は x に 1 を足す書き方です。","文字列同士を + でつなぐと、文字列の連結になります。文字列と数値を + でつなぐと、数値が文字列になって連結されます（\"5\" + 3 は \"53\"）。変数を文字列に埋め込むには、バッククォート ` で囲んだテンプレートリテラルの中に ${式} と書くのが読みやすい方法です。"],"glossary":[{"term":"演算子","definition":"+ や * など、計算や比較を表す記号。"},{"term":"代入演算子","definition":"= や += のように、変数に値を入れる演算子。"},{"term":"テンプレートリテラル","definition":"バッククォート（`）で囲み、${ } で値を埋め込める文字列。"}],"examples":[{"id":"S02-E1","title":"いろいろな計算","language":"javascript","code":"console.log(7 + 2);\nconsole.log(7 / 2);\nconsole.log(7 % 2);\nconsole.log(2 ** 3);\nconsole.log(2 + 3 * 4);\nconsole.log((2 + 3) * 4);","expected_output":"9\n3.5\n1\n8\n14\n20","line_notes":["2行目: / は小数も含めた割り算です。","3行目: % は余りです。","5〜6行目: 掛け算が先。( ) で順序を変えられます。"]},{"id":"S02-E2","title":"代入演算子と文字列","language":"javascript","code":"let total = 10;\ntotal += 5;\ntotal++;\nconsole.log(total);\nconst name = \"Hana\";\nconst age = 12;\nconsole.log(\"名前: \" + name);\nconsole.log(`${name}さんは${age}歳です`);\nconsole.log(\"5\" + 3);","expected_output":"16\n名前: Hana\nHanaさんは12歳です\n53","line_notes":["2行目: total = total + 5 と同じ。3行目: ++ は 1 増やします。","8行目: テンプレートリテラルの ${ } の部分が変数の値に置き換わります。","9行目: 文字列と数値の + は連結になるので、結果は 8 ではなく \"53\" です。"]}]},{"id":"S02-L2","title":"比較・論理演算子と型変換","read_minutes":3,"body":["比較演算子は結果が true か false になります。等しいかは === 、等しくないかは !== 、大小は < > <= >= です。= は代入なので、比較には使えません。","== も等しいかを調べますが、型が違うと自動で変換して比べるため、5 == \"5\" が true になるなど分かりにくい結果になります。=== は型も含めて比べるので、基本は === を使います。","論理演算子は && （かつ）、|| （または）、! （否定）です。a && b は両方 true のときだけ true、a || b はどちらか一方でも true なら true です。","- * / を使うと、文字列は数値に自動変換されます（\"10\" / 2 は 5）。数値にできない文字列だと NaN（Not a Number）になります。自分で変換するときは Number(\"10\") を使います。"],"glossary":[{"term":"===","definition":"型も含めて等しいかを調べる比較演算子（厳密等価）。"},{"term":"型変換","definition":"値のデータ型が、自動または Number() などで別の型に変わること。"},{"term":"NaN","definition":"数値として計算できなかったときの値（Not a Number）。typeof は number。"}],"examples":[{"id":"S02-E3","title":"比較と論理演算","language":"javascript","code":"console.log(5 === 5);\nconsole.log(5 === \"5\");\nconsole.log(5 == \"5\");\nconsole.log(5 !== 3);\nconsole.log(3 > 2 && 2 > 5);\nconsole.log(3 > 2 || 2 > 5);\nconsole.log(!true);","expected_output":"true\nfalse\ntrue\ntrue\nfalse\ntrue\nfalse","line_notes":["2行目: 数値の 5 と文字列の \"5\" は、=== では等しくありません。","3行目: == は型を変換して比べるので true になります（分かりにくいため使わないのが基本です）。"]},{"id":"S02-E4","title":"型変換と NaN","language":"javascript","code":"console.log(\"10\" / 2);\nconsole.log(\"abc\" * 2);\nconsole.log(Number(\"10\") + 5);\nconsole.log(\"10\" + 5);\nconsole.log(typeof NaN);","expected_output":"5\nNaN\n15\n105\nnumber","line_notes":["1行目: / は文字列を数値に変換して計算します。","2行目: 数値にできない文字列との計算は NaN になります。","3〜4行目: Number() で数値にすると足し算になり、しないと連結になります。"]}]}],"common_mistakes":[{"title":"= と === の取り違え","wrong_code":"console.log(n = 5);","why":"= は代入です。n に 5 を入れた結果（5）が表示されます。等しいかを調べるには ===。","fix":"console.log(n === 5);"},{"title":"文字列と数値の足し算","wrong_code":"console.log(\"3\" + 4);","why":"文字列と数値を + でつなぐと、連結になり \"34\" になります。計算したいときは Number() で数値にします。","fix":"console.log(Number(\"3\") + 4);"},{"title":"テンプレートリテラルで引用符を使う","wrong_code":"console.log(\"${name}さん\");","why":"\" \" の中では ${ } は展開されず、そのまま表示されます。バッククォート（`）で囲みます。","fix":"console.log(`${name}さん`);"},{"title":"整数の割り算を期待する","wrong_code":"console.log(7 / 2);  // 3 と思い込む","why":"JavaScript の / は小数も計算し、3.5 になります。切り捨てたいときは Math.floor(7 / 2) を使います。","fix":"console.log(Math.floor(7 / 2));"}],"checkpoints":["/ は小数も計算する、% は余り、** は累乗","+= や ++ で変数を更新できる","文字列 + 数値 は連結になる","等しいかは ===（= は代入）","&& は かつ、|| は または、! は否定","数値にできない計算は NaN になる"],"next_bridge":"比較や論理演算の結果は true / false になります。問題で、式の結果を正確に読み取る練習をしましょう。"},{"id":"LESSON-S03","stage_id":"S03","title":"条件分岐","intro":"プログラムは、条件によって動きを変えられます。「80点以上なら合格」「入力が空なら警告を出す」のような判断を、if 文で書きます。Webページでも、フォームのチェックや表示の切り替えで毎日のように使います。","sections":[{"id":"S03-L1","title":"if / else if / else","read_minutes":3,"body":["if (条件) { ... } と書くと、条件が true のときだけ { } の中が実行されます。条件が false のときの処理は else { ... } に書きます。","3つ以上に分けたいときは else if (条件) { ... } を続けます。上から順に調べ、最初に条件が成り立ったブロックだけが実行され、残りは調べません。そのため、厳しい条件（例: 90点以上）から順に書きます。","条件には、ステージ2の比較演算子・論理演算子を使います。「60点以上」は score >= 60、境界の 60 点を含むかどうかは >= と > で変わります。{ } の中の行は、見やすくするために字下げ（インデント）しますが、JavaScript では字下げは動作に影響しません。"],"glossary":[{"term":"条件分岐","definition":"条件によって、実行する処理を切り替えること。"},{"term":"ブロック","definition":"{ } で囲んだ、ひとまとまりの処理。"},{"term":"境界値","definition":"ちょうど切り替わる値（60点以上なら 60 など）。"}],"examples":[{"id":"S03-E1","title":"if と else","language":"javascript","code":"const score = 55;\nif (score >= 60) {\n  console.log(\"合格\");\n} else {\n  console.log(\"不合格\");\n}\nconsole.log(\"終わり\");","expected_output":"不合格\n終わり","line_notes":["2行目: score >= 60 が false なので、else 側が実行されます。","7行目: if 文の外にあるので、常に実行されます。"]},{"id":"S03-E2","title":"else if","language":"javascript","code":"const score = 85;\nif (score >= 90) {\n  console.log(\"A\");\n} else if (score >= 80) {\n  console.log(\"B\");\n} else if (score >= 70) {\n  console.log(\"C\");\n} else {\n  console.log(\"D\");\n}","expected_output":"B","line_notes":["上から順に調べ、score >= 80 が最初に true になるので B を表示して終わります。score >= 70 も true ですが、調べられません。"]}]},{"id":"S03-L2","title":"truthy / falsy・三項演算子・switch","read_minutes":3,"body":["if の条件には、true / false 以外の値も書けます。その場合、値は真偽に変換されます。偽（falsy）として扱われるのは、false、0、\"\"（空文字列）、null、undefined、NaN の6つだけで、それ以外は真（truthy）です。\"0\" や \"false\" のように、中身が空でない文字列は truthy です。","a && b、a || b は、true / false ではなく、どちらかの値そのものを返します。a || b は a が truthy なら a、そうでなければ b を返します（「a がなければ b」の意味で、初期値を決めるときに使います）。a && b は a が falsy なら a、そうでなければ b を返します。","条件 ? 値1 : 値2 は三項演算子で、条件が truthy なら値1、そうでなければ値2になります。短い if / else を1行で書きたいときに使います。","switch (式) { case 値: ... break; default: ... } は、1つの値によって分岐します。case の最後に break を書かないと、次の case の処理も続けて実行されます。"],"glossary":[{"term":"truthy / falsy","definition":"条件に使ったとき、真として扱われる値 / 偽として扱われる値。"},{"term":"三項演算子","definition":"条件 ? A : B の形で、条件によって値を選ぶ演算子。"},{"term":"break","definition":"switch や繰り返しから抜ける文。"}],"examples":[{"id":"S03-E3","title":"falsy な値と || の動き","language":"javascript","code":"if (0) { console.log(\"a\"); } else { console.log(\"b\"); }\nif (\"\") { console.log(\"c\"); } else { console.log(\"d\"); }\nif (\"0\") { console.log(\"e\"); } else { console.log(\"f\"); }\nconsole.log(0 || \"初期値\");\nconsole.log(\"あり\" && \"続き\");","expected_output":"b\nd\ne\n初期値\n続き","line_notes":["1行目: 0 は falsy なので else 側。","3行目: \"0\" は空でない文字列なので truthy です。","4行目: 0 は falsy なので、右の \"初期値\" が返ります。"]},{"id":"S03-E4","title":"三項演算子と switch","language":"javascript","code":"const age = 20;\nconsole.log(age >= 18 ? \"成人\" : \"未成年\");\nconst n = 2;\nswitch (n) {\n  case 1:\n    console.log(\"one\");\n    break;\n  case 2:\n    console.log(\"two\");\n    break;\n  default:\n    console.log(\"other\");\n}","expected_output":"成人\ntwo","line_notes":["2行目: 条件が true なので \"成人\" が選ばれます。","8〜9行目: n が 2 なので two を表示し、break で switch を抜けます。"]}]}],"common_mistakes":[{"title":"if の条件で = を使う","wrong_code":"if (n = 5) { ... }","why":"= は代入です。n に 5 を入れ、その結果（5、truthy）で条件が常に真になります。エラーにならないので気づきにくいミスです。","fix":"if (n === 5) { ... }"},{"title":"else if の順序","wrong_code":"if (score >= 60) {...} else if (score >= 80) {...}","why":"上から順に調べるので、80点以上でも最初の条件が先に成り立ちます。厳しい条件から書きます。","fix":"先に score >= 80 を調べる"},{"title":"switch の break 忘れ","wrong_code":"case 1:\n  console.log(\"one\");\ncase 2:\n  console.log(\"two\");","why":"break がないと、case 1 のあとも続けて case 2 の処理が実行されます。","fix":"各 case の最後に break; を書く"},{"title":"\"0\" は falsy だと思う","wrong_code":"if (\"0\") { ... }","why":"空でない文字列は truthy です。falsy なのは数値の 0 です。","fix":"数値にしたいなら Number(\"0\") を使う"}],"checkpoints":["if / else if / else は上から順に調べ、最初に成り立ったものだけ実行される","厳しい条件から書く。境界値は >= と > で変わる","falsy は false・0・\"\"・null・undefined・NaN","a || b は「a がなければ b」","条件 ? A : B（三項演算子）","switch は case の最後に break"],"next_bridge":"条件分岐は、これから学ぶ繰り返しや関数と組み合わせて使います。まず問題で、条件の順序や境界値を正確に読む練習をしましょう。"},{"id":"LESSON-S04","stage_id":"S04","title":"繰り返し","intro":"同じ処理を何十回、何百回とくり返すのは、コンピューターの得意技です。ページの中の複数の要素を順番に処理したり、リストを1つずつ画面に出したりするときにも使います。","sections":[{"id":"S04-L1","title":"for 文と while 文","read_minutes":3,"body":["for (初期化; 条件; 更新) { ... } は、決まった回数のくり返しに使います。例: for (let i = 0; i < 3; i++) は、i を 0 から始め、i < 3 の間、くり返すたびに i++ で 1 増やします。つまり i は 0, 1, 2 になり、3 回くり返します。i < 3 の 3 自体は含まれません。","while (条件) { ... } は、条件が true の間くり返します。回数が決まっていないときや、条件で終わりを決めたいときに使います。ループの中で、条件に使う変数を変化させないと、条件がずっと true のままになり、終わらなくなります（無限ループ）。","合計を求めるときは、ループの前に let total = 0; と用意し、ループの中で total += i; のように足していきます。"],"glossary":[{"term":"ループ","definition":"同じ処理をくり返す仕組み。"},{"term":"無限ループ","definition":"終わる条件が成り立たず、いつまでも終わらないループ。"},{"term":"累積","definition":"ループの中で値を足し込み、合計などを作ること。"}],"examples":[{"id":"S04-E1","title":"for 文","language":"javascript","code":"for (let i = 0; i < 3; i++) {\n  console.log(i);\n}\nlet total = 0;\nfor (let i = 1; i <= 5; i++) {\n  total += i;\n}\nconsole.log(total);","expected_output":"0\n1\n2\n15","line_notes":["1行目: i は 0 → 1 → 2 と増え、3 になると条件が false になって終わります。","5行目: 1 から 5 まで含めるときは、i <= 5 と書きます。"]},{"id":"S04-E2","title":"while 文","language":"javascript","code":"let count = 3;\nwhile (count > 0) {\n  console.log(count);\n  count--;\n}\nconsole.log(\"発射\");","expected_output":"3\n2\n1\n発射","line_notes":["4行目: count を減らさないと、条件がずっと true のままで無限ループになります。"]}]},{"id":"S04-L2","title":"break・continue・入れ子のループ","read_minutes":3,"body":["break は、その場でループ全体を終了します。continue は、その回の残りの処理を飛ばして、次の回へ進みます。","ループの中にさらにループを書くことができます（入れ子）。外側が 1 回進むたびに、内側のループは最初から最後まで回ります。文字を足し込んで図形を作る、表を作る、といった場面で使います。"],"glossary":[{"term":"break","definition":"ループ全体をその場で終了する。"},{"term":"continue","definition":"その回の残りを飛ばして、次の回へ進む。"},{"term":"入れ子（ネスト）","definition":"ループの中にループを書くこと。"}],"examples":[{"id":"S04-E3","title":"continue と break","language":"javascript","code":"for (let i = 1; i <= 5; i++) {\n  if (i === 3) {\n    continue;\n  }\n  if (i === 5) {\n    break;\n  }\n  console.log(i);\n}","expected_output":"1\n2\n4","line_notes":["i が 3 のとき: continue で console.log を飛ばし、次の回へ。","i が 5 のとき: break でループを終了。5 は表示されません。"]},{"id":"S04-E4","title":"入れ子のループ","language":"javascript","code":"for (let i = 1; i <= 3; i++) {\n  let line = \"\";\n  for (let j = 0; j < i; j++) {\n    line += \"*\";\n  }\n  console.log(line);\n}","expected_output":"*\n**\n***","line_notes":["外側の i が 1, 2, 3 と進むたびに、内側のループが i 回まわり、* を足します。","line は外側のループの回ごとに空文字列に戻ります。"]}]}],"common_mistakes":[{"title":"回数の数え間違い（i < 5）","wrong_code":"for (let i = 1; i < 5; i++)  // 1〜5 のつもり","why":"i < 5 は 5 を含みません（1〜4）。5 まで含めるには i <= 5 と書きます。","fix":"for (let i = 1; i <= 5; i++)"},{"title":"while の更新忘れ","wrong_code":"let n = 3;\nwhile (n > 0) {\n  console.log(n);\n}","why":"n が変わらないので条件がずっと true。ページが固まる無限ループになります。","fix":"ループの中に n--; を書く"},{"title":"合計の初期化忘れ","wrong_code":"let total;\nfor (...) { total += i; }","why":"total が undefined のまま足すと、結果は NaN になります。ループの前に 0 を入れます。","fix":"let total = 0;"},{"title":"continue と break の取り違え","wrong_code":"if (i === 3) { break; }  // 3 だけ飛ばしたい","why":"break は 3 でループ全体が終わります。3 だけ飛ばしたいなら continue です。","fix":"if (i === 3) { continue; }"}],"checkpoints":["for (初期化; 条件; 更新) の3つの役割","i < 3 は 0・1・2 の3回（3 は含まれない）","合計は先に 0 を用意して += で足す","while は条件が true の間くり返す。中で条件の変数を更新する","break は終了、continue は次の回へ","入れ子では、外側が1回進むごとに内側が最初から回る"],"next_bridge":"くり返しは、たくさんのデータに使うと本領を発揮します。まず問題で、回数や範囲を正確に追う練習をしましょう。"},{"id":"LESSON-S05","stage_id":"S05","title":"配列","intro":"100 人分の点数を、100 個の変数に入れるのは大変です。配列を使うと、複数の値を1つの名前でまとめて扱えます。ステージ4の for と組み合わせると、データを順番に処理できます。Webページの中の「リスト」を扱うときにも欠かせません。","sections":[{"id":"S05-L1","title":"配列の基本","read_minutes":3,"body":["配列は、値を [ ] の中に , で区切って並べて作ります。例: const fruits = [\"りんご\", \"みかん\", \"ぶどう\"];。要素は番号（添字）で取り出し、番号は 0 から始まります。最初の要素は fruits[0] です。","fruits.length は要素の数（ここでは 3）で、最後の要素は fruits[fruits.length - 1] です。存在しない番号（fruits[5] など）を読んでも、エラーにはならず undefined になります。","fruits[1] = \"レモン\"; で要素を置き換え、push(値) で末尾に追加、pop() で末尾から取り出して削除します。const で宣言した配列にも、push などで中身を変更できます。const が禁止するのは、変数そのものへの再代入（fruits = [] など）だけです。"],"glossary":[{"term":"配列","definition":"複数の値を順番に並べてまとめたデータ。"},{"term":"要素","definition":"配列の中の1つ1つの値。"},{"term":"添字（インデックス）","definition":"要素の位置を表す番号。0 から始まる。"}],"examples":[{"id":"S05-E1","title":"取り出しと長さ","language":"javascript","code":"const fruits = [\"りんご\", \"みかん\", \"ぶどう\"];\nconsole.log(fruits[0]);\nconsole.log(fruits[fruits.length - 1]);\nconsole.log(fruits.length);\nconsole.log(fruits[5]);","expected_output":"りんご\nぶどう\n3\nundefined","line_notes":["2行目: 添字 0 は最初の要素。","3行目: 最後の要素の添字は length - 1。","5行目: 範囲外はエラーにならず undefined になります。"]},{"id":"S05-E2","title":"置き換え・追加・削除","language":"javascript","code":"const nums = [10, 20, 30];\nnums[1] = 99;\nnums.push(40);\nconst last = nums.pop();\nconsole.log(nums.join(\",\"));\nconsole.log(last);\nconsole.log(nums.length);","expected_output":"10,99,30\n40\n3","line_notes":["4行目: pop() は末尾の要素を取り出して削除し、その値を返します。","5行目: join(\",\") は、要素を , でつないだ文字列にします。"]}]},{"id":"S05-L2","title":"配列を調べる・順に処理する","read_minutes":3,"body":["includes(値) は、その値が含まれているかを true / false で返します。indexOf(値) は、最初に見つかった位置を返し、なければ -1 を返します。slice(開始, 終了) は一部を新しい配列として取り出し、終了の位置の要素は含まれません。","配列の要素を1つずつ処理するには、添字を使う for のほか、for (const x of 配列) { ... } が使えます。for...of は、要素が順に x に入ります。添字で回すときは、i < arr.length と書きます（i <= arr.length だと1つ多くなります）。","console.log に配列をそのまま渡すと、配列全体が表示されます（表示の形式は環境によって少し違います）。このコースの問題では、join で文字列にして表示します。"],"glossary":[{"term":"for...of","definition":"配列などの要素を、1つずつ取り出して処理する繰り返し。"},{"term":"slice","definition":"配列の一部を、新しい配列として取り出すメソッド。終了の位置は含まれない。"}],"examples":[{"id":"S05-E3","title":"includes・indexOf・slice","language":"javascript","code":"const colors = [\"赤\", \"青\", \"緑\", \"黄\"];\nconsole.log(colors.includes(\"青\"));\nconsole.log(colors.indexOf(\"緑\"));\nconsole.log(colors.indexOf(\"白\"));\nconsole.log(colors.slice(1, 3).join(\"-\"));","expected_output":"true\n2\n-1\n青-緑","line_notes":["4行目: 見つからないと -1 です。","5行目: slice(1, 3) は添字 1 と 2 の2つだけ（3 は含まれません）。"]},{"id":"S05-E4","title":"for...of で合計","language":"javascript","code":"const scores = [70, 85, 90];\nlet total = 0;\nfor (const s of scores) {\n  total += s;\n}\nconsole.log(total);\nlet count = 0;\nfor (let i = 0; i < scores.length; i++) {\n  count++;\n}\nconsole.log(count);","expected_output":"245\n3","line_notes":["3行目: scores の要素が1つずつ s に入ります。","8行目: 添字で回すときは i < scores.length と書きます。"]}]}],"common_mistakes":[{"title":"1番目を [1] と思う","wrong_code":"console.log(fruits[1]);  // 最初の要素のつもり","why":"添字は 0 から始まります。fruits[1] は2番目の要素です。","fix":"console.log(fruits[0]);"},{"title":"push を [ ] で書く","wrong_code":"arr.push[4];","why":"push は関数なので ( ) で呼びます。[ ] だと何も追加されず、エラーにもなりません。","fix":"arr.push(4);"},{"title":"i <= arr.length","wrong_code":"for (let i = 0; i <= arr.length; i++)","why":"最後に arr[arr.length]（undefined）まで読んでしまい、合計が NaN になるなどのミスになります。","fix":"for (let i = 0; i < arr.length; i++)"},{"title":"const の配列は変更できないと思う","wrong_code":"const list = [1];\nlist.push(2);  // エラーになると思い込む","why":"const は再代入を禁止するだけで、配列の中身の変更はできます。","fix":"list = [3]; のような再代入が TypeError になる"}],"checkpoints":["添字は 0 から。最後は arr[arr.length - 1]","範囲外の添字は undefined（エラーにならない）","push は末尾に追加、pop は末尾から削除","includes・indexOf（見つからないと -1）・join・slice","for...of で要素を順に取り出せる","const の配列にも push できる"],"next_bridge":"配列で、順番のあるデータを扱えるようになりました。問題で、添字と範囲の扱いを確かめましょう。"},{"id":"LESSON-S06","stage_id":"S06","title":"オブジェクト","intro":"配列は「順番」でデータを並べました。オブジェクトは「名前（キー）」でデータを並べます。「名前は Hana、年齢は 12」のように、1つのものについての複数の情報をまとめられます。Webページの要素の情報や、サーバーから届くデータなど、JavaScript のあらゆる場面で使われます。","sections":[{"id":"S06-L1","title":"オブジェクトの基本","read_minutes":3,"body":["オブジェクトは { } の中に キー: 値 を , で区切って書きます。例: const user = { name: \"Hana\", age: 12 };。値は user.name のようにドット記法で、または user[\"name\"] のように角括弧記法で取り出します。存在しないキーを読むと undefined になります。","変数に入れたキー名で取り出したいときは、角括弧記法を使います。const key = \"age\"; user[key] は 12 ですが、user.key は「key という名前のプロパティ」を探すので undefined になります。","user.age = 13; で更新、user.city = \"東京\"; で追加、delete user.name; で削除です。\"age\" in user で、プロパティがあるかを true / false で調べられます。const のオブジェクトでも、プロパティの変更はできます。","JSON.stringify(オブジェクト) は、オブジェクトを JSON という文字列にします。console.log でオブジェクトの中身を確かめるときに便利です。"],"glossary":[{"term":"オブジェクト","definition":"キーと値のペア（プロパティ）をまとめたデータ。"},{"term":"プロパティ","definition":"オブジェクトの中の、キーと値の1組。"},{"term":"JSON","definition":"データを文字列で表す形式。JSON.stringify でオブジェクトを変換できる。"}],"examples":[{"id":"S06-E1","title":"読み出し","language":"javascript","code":"const user = { name: \"Hana\", age: 12 };\nconsole.log(user.name);\nconsole.log(user[\"age\"]);\nconsole.log(user.city);\nconst key = \"age\";\nconsole.log(user[key]);\nconsole.log(user.key);\nconsole.log(\"age\" in user);","expected_output":"Hana\n12\nundefined\n12\nundefined\ntrue","line_notes":["4行目: 存在しないキーを読むと undefined です。","6行目: 変数のキー名で取り出すには角括弧記法を使います。","7行目: user.key は「key」という名前のプロパティを探すので undefined です。"]},{"id":"S06-E2","title":"追加・更新・削除","language":"javascript","code":"const user = { name: \"Hana\", age: 12 };\nuser.age = 13;\nuser.city = \"東京\";\ndelete user.name;\nconsole.log(JSON.stringify(user));","expected_output":"{\"age\":13,\"city\":\"東京\"}","line_notes":["2行目: 既にあるプロパティは更新されます。","3行目: ないプロパティは追加されます。","4行目: delete でプロパティが削除されます。"]}]},{"id":"S06-L2","title":"ネスト・オブジェクトの配列・Object.keys","read_minutes":3,"body":["オブジェクトの値には、別のオブジェクトや配列も入れられます（ネスト）。book.author.name のように、ドットをつなげて奥まで読みます。途中が undefined だと、その先を読んだときに TypeError（Cannot read properties of undefined）になります。","オブジェクトを要素にもつ配列は、ユーザー一覧や商品一覧によく使われます。users[1].name のように、添字とドットを組み合わせて読みます。","Object.keys(オブジェクト) は、キーの配列を返します。for (const key of Object.keys(obj)) と組み合わせると、すべてのプロパティを順に処理できます。値は obj[key] で取り出します。"],"glossary":[{"term":"ネスト","definition":"入れ物の中に、さらに入れ物を入れること。"},{"term":"Object.keys","definition":"オブジェクトのキーを、配列として返す。"}],"examples":[{"id":"S06-E3","title":"ネストと配列","language":"javascript","code":"const book = { title: \"JS入門\", author: { name: \"Taro\", age: 30 } };\nconsole.log(book.author.name);\nconst users = [{ name: \"A\", age: 20 }, { name: \"B\", age: 17 }];\nconsole.log(users[1].name);\nconsole.log(users.length);\nconsole.log(users[0].age + users[1].age);","expected_output":"Taro\nB\n2\n37","line_notes":["2行目: ドットをつなげて、奥のプロパティを読みます。","4行目: users[1] は2番目のオブジェクトです。"]},{"id":"S06-E4","title":"Object.keys でくり返す","language":"javascript","code":"const scores = { math: 80, english: 70 };\nlet total = 0;\nfor (const key of Object.keys(scores)) {\n  console.log(key + \": \" + scores[key]);\n  total += scores[key];\n}\nconsole.log(total);","expected_output":"math: 80\nenglish: 70\n150","line_notes":["3行目: Object.keys(scores) は [\"math\", \"english\"] です。","4行目: scores[key] で、そのキーの値を取り出します。"]}]}],"common_mistakes":[{"title":"変数のキー名を user.key と書く","wrong_code":"const key = \"age\";\nconsole.log(user.key);","why":"user.key は、key という名前のプロパティを探します。変数の値をキー名にしたいときは user[key]。","fix":"console.log(user[key]);"},{"title":"存在しないプロパティの中身を読む","wrong_code":"console.log(user.address.city);","why":"user.address が undefined なので、その中の city を読もうとして TypeError になります。","fix":"address を持たせる、または存在を確認してから読む"},{"title":"プロパティの確認に includes を使う","wrong_code":"user.includes(\"age\")","why":"includes は配列・文字列のメソッドで、オブジェクトにはありません（TypeError）。in 演算子を使います。","fix":"\"age\" in user"},{"title":"カウントの初期値","wrong_code":"counts[ch] = 0;  // 初めて出てきた文字","why":"初めて出てきた時点で1回出ているので、初期値は 1 です。","fix":"counts[ch] = 1;"}],"checkpoints":["{ キー: 値 } で作り、ドット記法か角括弧記法で読む","変数のキー名は角括弧記法で取り出す","追加・更新は代入、削除は delete、存在確認は in","存在しないプロパティは undefined、その中身を読むと TypeError","Object.keys と for...of で全プロパティを処理できる","オブジェクトの配列は users[0].name のように読む"],"next_bridge":"オブジェクトで、「名前付きのデータ」を扱えるようになりました。問題で、プロパティの読み出しや、ネストした構造の扱いを確かめましょう。"},{"id":"LESSON-S07","stage_id":"S07","title":"関数","intro":"同じ処理を何度も書くのは大変で、間違いのもとです。処理に名前を付けて「部品」にしたものが関数です。ここまで使ってきた console.log や push も関数でした。ページのボタンを押したときの動き（ステージ9）は、関数を渡して書くので、この回の内容が土台になります。","sections":[{"id":"S07-L1","title":"関数を作って呼び出す","read_minutes":3,"body":["function 関数名(引数) { ... } で関数を定義します。定義しただけでは実行されず、関数名(値) と書いて呼び出したときに実行されます。呼び出し時に渡す値を引数といい、関数の中では引数の名前で使えます。","return 値; は、結果を呼び出し元へ返して、関数を終了します。return がない関数の戻り値は undefined です。console.log は画面（コンソール）に表示するだけで、値は返しません。結果を別の計算に使うなら return を使います。","アロー関数 const add = (a, b) => a + b; は、関数を短く書く方法です。{ } で囲んだときは、結果を返すために return が必要です。引数にデフォルト値を決めたいときは、function power(base, exp = 2) のように = で書きます。"],"glossary":[{"term":"関数","definition":"名前を付けた処理のまとまり。"},{"term":"引数","definition":"関数に渡す材料の値。"},{"term":"戻り値","definition":"関数が return で返す結果。"},{"term":"アロー関数","definition":"=> を使った、関数の短い書き方。"}],"examples":[{"id":"S07-E1","title":"引数と戻り値","language":"javascript","code":"function add(a, b) {\n  return a + b;\n}\nconsole.log(add(3, 4));\nconsole.log(add(3, 4) * 2);\nfunction show(x) {\n  console.log(x);\n}\nconst r = show(5);\nconsole.log(r);","expected_output":"7\n14\n5\nundefined","line_notes":["5行目: 呼び出しは戻り値に置き換わって計算が進みます。","9〜10行目: show は何も返さないので、r は undefined です。"]},{"id":"S07-E2","title":"アロー関数とデフォルト引数","language":"javascript","code":"const double = (n) => n * 2;\nconsole.log(double(4));\nconst add = (a, b) => {\n  return a + b;\n};\nconsole.log(add(1, 2));\nfunction power(base, exp = 2) {\n  return base ** exp;\n}\nconsole.log(power(3));\nconsole.log(power(2, 5));","expected_output":"8\n3\n9\n32","line_notes":["1行目: { } がなければ、式の結果がそのまま戻り値になります。","3〜5行目: { } を使うときは return が必要です。","11行目: exp を省略すると、デフォルトの 2 が使われます。"]}]},{"id":"S07-L2","title":"スコープとコールバック","read_minutes":3,"body":["関数の中で宣言した変数は、その関数の中だけで使えます（ローカル変数）。同じ名前の外の変数とは別物で、外の値は変わりません。let / const は { } の中だけで有効な「ブロックスコープ」です。{ } の外から使うと ReferenceError になります。","関数は値として、別の関数に渡せます。渡された関数を、あとで呼び出してもらう仕組みをコールバックといいます。配列のメソッドの forEach（各要素に処理）、map（各要素を変換した新しい配列）、filter（条件に合う要素だけの新しい配列）は、コールバックを受け取ります。","ステージ9のイベント処理でも、「
