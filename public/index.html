こでは red です。"},"hint":"「color: red;」の左側と右側に、それぞれ名前があります。","feedback_correct":"正解！color はプロパティです。","feedback_incorrect":"惜しい！セレクタ・プロパティ・値を区別しましょう。"},{"id":"HC-053","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":3,"title":"文字色を指定するプロパティ","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["color","プロパティ"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"見出し（h1）の文字を赤にします。【空欄1】に入れるプロパティ名を答えてください。","code":"h1 {\n  __1__: red;\n}","context_html":"<h1>見出し<\/h1>","check":{"format":"css","given_html":"<h1>見出し<\/h1>","expr":"getComputedStyle(document.querySelector('h1')).color === 'rgb(255, 0, 0)'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["color"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"文字の色を指定するプロパティは color だから。","explanation":"color は文字色、background-color は背景色です。「background-color」は、ハイフンでつないだ名前で、color とは別のプロパティです。","common_mistakes":[{"blank":"b1","answer":"background-color","reason":"background-color は背景の色を指定するプロパティです。文字の色は color です。"}],"hint":"「色」を意味する英単語です。","feedback_correct":"正解！文字色は color です。","feedback_incorrect":"惜しい！背景色とは別のプロパティです。"},{"id":"HC-054","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":4,"title":"クラスセレクタの対象","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["クラスセレクタ"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、文字が赤くなる段落はどれですか？（R が赤、- が赤でないことを表します）","code":".warn {\n  color: red;\n}","context_html":"<p class=\"warn\">A<\/p>\n<p>B<\/p>\n<p class=\"warn\">C<\/p>","choice_format":"code","choices":[{"id":"c1","text":"A と C（R-R）"},{"id":"c2","text":"A だけ（R--）"},{"id":"c3","text":"A・B・C のすべて（RRR）"}],"check":{"format":"css","given_html":"<p class=\"warn\">A<\/p>\n<p>B<\/p>\n<p class=\"warn\">C<\/p>","probe":"Array.from(document.querySelectorAll('p')).map(function (p) { return getComputedStyle(p).color === 'rgb(255, 0, 0)' ? 'R' : '-'; }).join('')","choice_values":{"c2":"R--","c1":"R-R","c3":"RRR"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":".warn は class=\"warn\" を持つすべての要素に当たり、A と C がそれに該当するから。","explanation":"クラスセレクタは、同じ class が付いた要素を、まとめて選びます。1か所だけを選びたいときは、id セレクタ（#名前）を使います。","wrong_answer_reasons":{"c2":".warn は、class=\"warn\" が付いたすべての要素に当たります。A の他に、C にも当たります。","c3":"B には class=\"warn\" が付いていません。.warn は、その class を持つ要素だけに当たります。"},"hint":"class=\"warn\" が付いているのはどれでしょう？ HTML は、A・B・C の3つの p です。","feedback_correct":"正解！クラスセレクタは、同じ class の要素すべてを選びます。","feedback_incorrect":"惜しい！HTML の class 属性を確認しましょう。"},{"id":"HC-055","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":5,"title":"スタイルの優先順位","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["詳細度","優先順位"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、段落の文字は、何色で表示されますか？","code":"p { color: blue; }\n.c { color: green; }\n#x { color: red; }","context_html":"<p id=\"x\" class=\"c\">文章<\/p>","choice_format":"code","choices":[{"id":"c1","text":"blue（青。一番上に書いたルール）"},{"id":"c2","text":"green（緑。クラスセレクタのルール）"},{"id":"c3","text":"red（赤。id セレクタのルール）"}],"check":{"format":"css","given_html":"<p id=\"x\" class=\"c\">文章<\/p>","probe":"getComputedStyle(document.getElementById('x')).color","choice_values":{"c1":"rgb(0, 0, 255)","c3":"rgb(255, 0, 0)","c2":"rgb(0, 128, 0)"}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"id セレクタ > クラスセレクタ > 要素セレクタの順に、詳細度が高いから。","explanation":"詳細度が違うときは、書く順番に関係なく、詳細度の高いルールが優先されます。同じ詳細度のときだけ、あとに書いたものが優先されます。","wrong_answer_reasons":{"c1":"書く順番より、詳細度の強さが優先されます。要素セレクタ（p）は、最も弱いセレクタです。","c2":"クラスセレクタは、要素セレクタより強いですが、id セレクタには負けます。"},"hint":"この3つのセレクタの強さの順番を思い出しましょう。","feedback_correct":"正解！id セレクタが最も強いです。","feedback_incorrect":"惜しい！セレクタの詳細度を比べましょう。"},{"id":"HC-056","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":6,"title":"宣言の区切り","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["宣言","セミコロン"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"文字を赤、背景を黄色にしたいのに、どちらも効きません。正しい直し方はどれですか？","code":"p { color: red background-color: yellow; }","context_html":"<p>テスト<\/p>","choice_format":"code","choices":[{"id":"c1","text":"p { color: red; background-color: yellow; }"},{"id":"c2","text":"p { color: red, background-color: yellow; }"},{"id":"c3","text":"p { color: red: background-color: yellow; }"}],"check":{"format":"css","given_html":"<p>テスト<\/p>","expr":"getComputedStyle(document.querySelector('p')).color === 'rgb(255, 0, 0)' && getComputedStyle(document.querySelector('p')).backgroundColor === 'rgb(255, 255, 0)'"},"answer":{"correct_choice_id":"c1","fixed_code":"p { color: red; background-color: yellow; }","target_line":1,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"宣言どうしは、セミコロン（;）で区切る必要があるから。","explanation":"; を忘れると、color の値が「red background-color: yellow」という不正な値になり、color の宣言全体が無視されます。background-color の宣言もなくなるため、どちらも効きません。","wrong_answer_reasons":{"c2":"宣言どうしの区切りは、カンマではなく、セミコロン（;）です。カンマでは、値が不正になり、どちらも無視されます。","c3":"コロン（:）は、プロパティと値の間に使う記号です。宣言どうしを区切るのは、セミコロン（;）です。"},"hint":"宣言の終わりに付ける記号は何でしたか？","feedback_correct":"正解！宣言は ; で区切ります。","feedback_incorrect":"惜しい！宣言どうしの区切りの記号を確認しましょう。"},{"id":"HC-057","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":7,"title":"プロパティ名の綴りミス","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["color","綴りミス"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"文字を赤にしたいのに、色が変わりません。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":"p {\n  colour: red;\n}","context_html":"<p>テスト<\/p>","check":{"format":"css","given_html":"<p>テスト<\/p>","expr":"getComputedStyle(document.querySelector('p')).color === 'rgb(255, 0, 0)'"},"answer":{"target_line":2,"accepted":["color: red;","color:red;"],"quote_insensitive":false,"fixed_code":"p {\n  color: red;\n}"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"プロパティ名は color と綴る必要があり、違う綴りはエラーなく無視されるから。","explanation":"CSS には、エラーメッセージがありません。見た目が変わらないときは、プロパティ名の綴りや、値の書き方を確認します。開発者ツールでは、無視された宣言に打ち消し線が付いて分かります。","common_mistakes":[{"answer":"colour: red;","reason":"元のコードのままです。colour というプロパティはありません。CSS は、間違った宣言を、エラーを出さずに無視します。"}],"hint":"CSS のプロパティ名は、英語（アメリカ式）の綴りです。","feedback_correct":"正解！プロパティ名の綴りを直しました。","feedback_incorrect":"惜しい！プロパティ名を確認しましょう。"},{"id":"HC-058","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S06","stage_number":6,"number_in_stage":8,"title":"外部の CSS ファイルを読み込む","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["link","rel","外部CSS"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"style.css を読み込みます。【空欄1】に入れる、rel 属性の値を答えてください。","code":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>CSS<\/title>\n  <link rel=\"__1__\" href=\"style.css\">\n<\/head>\n<body>\n  <p>こんにちは<\/p>\n<\/body>\n<\/html>","check":{"format":"html_document","expr":"document.querySelector('link').rel === 'stylesheet'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["stylesheet"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"外部の CSS ファイルを読み込む link の rel は、stylesheet と書くから。","explanation":"rel（relationship = 関係）には、link 先がこのページとどういう関係かを書きます。CSS ファイルの場合は stylesheet です。href には、ファイルの場所を、相対パスで書きます。","common_mistakes":[{"blank":"b1","answer":"css","reason":"rel の値は、リンク先と、このページの関係を表す決まった語です。スタイルシートは stylesheet と書きます。"}],"hint":"スタイルシートを意味する英単語を、続けて書きます。","feedback_correct":"正解！rel=\"stylesheet\" と書きます。","feedback_incorrect":"惜しい！スタイルシートを表す語を入力しましょう。"},{"id":"HC-059","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":9,"title":"文字色の継承","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["継承","color"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、div の中の段落の文字は、何色で表示されますか？","code":".box {\n  color: green;\n}","context_html":"<div class=\"box\">\n  <p>文章<\/p>\n<\/div>","choice_format":"code","choices":[{"id":"c1","text":"緑。親の .box の color が、p に引き継がれる"},{"id":"c2","text":"黒のまま。p には直接指定していないので、変わらない"},{"id":"c3","text":"エラーになって、何も表示されない"}],"check":{"format":"css","given_html":"<div class=\"box\">\n  <p>文章<\/p>\n<\/div>","probe":"getComputedStyle(document.querySelector('p')).color","choice_values":{"c2":"rgb(0, 0, 0)","c1":"rgb(0, 128, 0)","c3":"error"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"color は継承されるプロパティなので、親の指定が子の p に引き継がれるから。","explanation":"文字に関する多くのプロパティ（color・font-size など）は継承されます。一方、背景色や枠線のように、継承されないプロパティもあります。親に指定すれば、子に1つずつ指定しなくて済みます。","wrong_answer_reasons":{"c2":"color は、親要素の指定が、子要素に引き継がれる（継承される）プロパティです。","c3":"CSS は、エラーにならず、継承も自然に行われます。"},"hint":"color は、子要素にも引き継がれるプロパティです。","feedback_correct":"正解！color は継承されます。","feedback_incorrect":"惜しい！継承の働きを確認しましょう。"},{"id":"HC-060","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":10,"title":"色を付けて見た目を整える","type":"code_write","answer_mode":"code","difficulty":2,"concepts":["セレクタ","color","background-color"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML に、CSS だけで、次の見た目を指定してください（色は名前か #rrggbb で指定します）。\n・h1 の文字色を blue（青）\n・class が lead の段落の背景色を yellow（黄色）\n・すべての p の文字色を #333333","code":null,"prefix_html":"<h1>ようこそ<\/h1>\n<p class=\"lead\">はじめまして。<\/p>\n<p>ここは練習ページです。<\/p>","starter_code":"/* ここに CSS を書きましょう */\n","answer_format":"css","answer":{"reference_solution":"h1 {\n  color: blue;\n}\n.lead {\n  background-color: yellow;\n}\np {\n  color: #333333;\n}","alternative_solutions":["h1 { color: #0000ff; }\np { color: #333; }\np.lead { background-color: #ffff00; }"],"rejected_examples":[{"code":"h1 {\n  color: blue;\n}\n.lead {\n  background-color: yellow;\n}","reason":"すべての p の文字色（#333333）を指定していません。p セレクタで指定します。"},{"code":"h1 {\n  background-color: blue;\n}\n.lead {\n  color: yellow;\n}\np {\n  color: #333333;\n}","reason":"color（文字色）と background-color（背景色）が逆になっています。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"h1 の文字色が青","expr":"getComputedStyle(document.querySelector('h1')).color === 'rgb(0, 0, 255)'","visible":true},{"kind":"page","desc":"class が lead の段落の背景色が黄色","expr":"getComputedStyle(document.querySelector('p.lead')).backgroundColor === 'rgb(255, 255, 0)'","visible":true},{"kind":"page","desc":"すべての p の文字色が #333333","expr":"Array.from(document.querySelectorAll('p')).every(function (p) { return getComputedStyle(p).color === 'rgb(51, 51, 51)'; })","visible":true},{"kind":"page","desc":"lead でない段落の背景色は変わっていない","expr":"getComputedStyle(document.querySelectorAll('p')[1]).backgroundColor === 'rgba(0, 0, 0, 0)'","visible":false},{"kind":"page","desc":"h1 の背景色は変わっていない","expr":"getComputedStyle(document.querySelector('h1')).backgroundColor === 'rgba(0, 0, 0, 0)'","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"要素セレクタ（h1・p）とクラスセレクタ（.lead）で対象を選び、color と background-color で色を指定するから。","explanation":"h1 { color: blue; } で見出しの文字色、.lead { background-color: yellow; } でクラスの背景色、p { color: #333333; } で全段落の文字色を指定します。#333333 は、少し黒に近い灰色です。","hint":"3つのルールを書きます。lead は、クラスセレクタ（.lead）です。","feedback_correct":"正解！色を指定できました。","feedback_incorrect":"惜しい！文字色と背景色を取り違えていないか確認しましょう。"},{"id":"HC-061","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":1,"title":"em・rem・% の計算","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["em","rem","%","font-size"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、3つの p（A・B・C）の文字の大きさは、それぞれ何 px になりますか？（html 要素の文字の大きさは、標準の 16px とします）","code":".outer { font-size: 20px; }\n.e { font-size: 2em; }\n.r { font-size: 2rem; }\n.p { font-size: 150%; }","context_html":"<div class=\"outer\">\n  <p class=\"e\">A<\/p>\n  <p class=\"r\">B<\/p>\n  <p class=\"p\">C<\/p>\n<\/div>","choice_format":"code","choices":[{"id":"c1","text":"A: 40px、B: 40px、C: 30px"},{"id":"c2","text":"A: 20px、B: 32px、C: 20px"},{"id":"c3","text":"A: 40px、B: 32px、C: 30px"}],"check":{"format":"css","given_html":"<div class=\"outer\">\n  <p class=\"e\">A<\/p>\n  <p class=\"r\">B<\/p>\n  <p class=\"p\">C<\/p>\n<\/div>","probe":"['e', 'r', 'p'].map(function (c) { return getComputedStyle(document.querySelector('.' + c)).fontSize; }).join(',')","choice_values":{"c1":"40px,40px,30px","c3":"40px,32px,30px","c2":"20px,32px,20px"}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"em と % は親の 20px が基準、rem は html の 16px が基準だから。","explanation":"2em = 20px × 2 = 40px、2rem = 16px × 2 = 32px、150% = 20px × 1.5 = 30px です。rem は、親の大きさに関係なく、いつも同じ大きさになるので、扱いやすい単位です。","wrong_answer_reasons":{"c1":"rem は、親（.outer）ではなく、html 要素の文字の大きさ（標準の 16px）が基準です。2rem は 32px です。","c2":"em と % は、親（.outer）の 20px に対する倍率なので、2em は 40px、150% は 30px になります。"},"hint":"em と % は親、rem は html 要素が基準です。","feedback_correct":"正解！基準になる要素が、単位ごとに違います。","feedback_incorrect":"惜しい！em・rem・% の基準を確認しましょう。"},{"id":"HC-062","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":2,"title":"太字にする","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["font-weight"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"段落の文字を太字にします。【空欄1】に入れる値を答えてください。","code":"p {\n  font-weight: __1__;\n}","context_html":"<p>こんにちは<\/p>","check":{"format":"css","given_html":"<p>こんにちは<\/p>","expr":"getComputedStyle(document.querySelector('p')).fontWeight === '700'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["bold","700"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"太字は、font-weight の値を bold（または 700）にするから。","explanation":"font-weight は、normal（400）・bold（700）のほか、100〜900 の数値でも指定できます。見出しは、標準で太字になっているので、普通の太さにしたいときは、normal を指定します。","common_mistakes":[{"blank":"b1","answer":"heavy","reason":"heavy という値はありません。無効な値は無視されるので、太字にならず、標準の太さのままです。"}],"hint":"太字を意味する英単語です。","feedback_correct":"正解！font-weight: bold で太字です。","feedback_incorrect":"惜しい！太字を表す値を入力しましょう。"},{"id":"HC-063","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":3,"title":"line-height の計算","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["line-height"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、段落の1行の高さ（line-height の実際の値）は、何 px になりますか？「30px」のように、単位を付けて入力してください。","code":"p {\n  font-size: 20px;\n  line-height: 1.5;\n}","context_html":"<p>こんにちは<\/p>","check":{"format":"css","given_html":"<p>こんにちは<\/p>","probe":"getComputedStyle(document.querySelector('p')).lineHeight","expected":"30px"},"answer":{"expected_output":"30px"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"単位のない line-height は、文字の大きさ（20px）に対する倍率なので、20 × 1.5 = 30px になるから。","explanation":"単位のない数値は、倍率として子要素にも引き継がれるので、子要素の文字の大きさが違っても、それに合った行間になります。本文の行間は、1.5〜1.8 程度が読みやすいとされます。","common_mistakes":[{"answer":"1.5px","reason":"単位のない 1.5 は、px ではなく、文字の大きさに対する倍率です。20px の 1.5倍で、30px になります。"},{"answer":"20px","reason":"文字の大きさ（font-size）と、行の高さ（line-height）は別です。line-height が 1.5 なので、20px の 1.5倍になります。"}],"hint":"単位のない line-height は、何に対する倍率でしょうか？","feedback_correct":"正解！line-height の単位なしは、倍率です。","feedback_incorrect":"惜しい！20px の 1.5倍を計算しましょう。"},{"id":"HC-064","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":4,"title":"文字の大きさに rem を使う理由","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["rem","アクセシビリティ"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"文字の大きさ（font-size）を、px ではなく、rem や em で指定することが推奨される理由として、最も適切なものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"ブラウザの文字サイズの設定を変えた利用者に、追従して大きさが変わるから"},{"id":"c2","text":"px で指定すると、ブラウザの表示が崩れてエラーになるから"},{"id":"c3","text":"rem や em のほうが、常に px より、文字が大きくなるから"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"rem・em は、基準の文字の大きさに対する倍率なので、利用者の設定した文字サイズに追従できるから。","explanation":"視力などの事情で、ブラウザの標準の文字サイズを大きくしている人がいます。px で固定すると、その設定が効かず、読みにくいままになることがあります。","wrong_answer_reasons":{"c2":"px で指定しても、エラーにはなりません。問題は、利用者が文字サイズを変えたときに、追従しにくいことです。","c3":"rem や em は、基準の大きさに対する倍率で、px より大きくなるとは限りません。基準によって変わるので、設定に追従します。"},"hint":"px は「固定」、rem は「基準に対する倍率」です。","feedback_correct":"正解！利用者の設定に追従できます。","feedback_incorrect":"惜しい！px が「固定」であることを考えましょう。"},{"id":"HC-065","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":5,"title":"単位のない font-size","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["font-size","単位"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"段落の文字を 20px にしたいのに、大きさが変わりません。2行目を直したものはどれですか？","code":"p {\n  font-size: 20;\n}","context_html":"<p>こんにちは<\/p>","choice_format":"code","choices":[{"id":"c1","text":"font-size: 20 px;"},{"id":"c2","text":"font-size: \"20px\";"},{"id":"c3","text":"font-size: 20px;"}],"check":{"format":"css","given_html":"<p>こんにちは<\/p>","expr":"getComputedStyle(document.querySelector('p')).fontSize === '20px'"},"answer":{"correct_choice_id":"c3","fixed_code":"p {\n  font-size: 20px;\n}","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"0 以外の数値には、単位（px など）を、数値にくっつけて書く必要があるから。","explanation":"単位がない数値は、無効な値として、宣言ごと無視されます。そのため、エラーにならず、大きさが標準のままになります。","wrong_answer_reasons":{"c1":"数値と単位の間に空白があると、1つの値として読めず、無効になります。単位は、数値にくっつけて書きます。","c2":"値を引用符で囲むと、文字列になります。font-size には、長さの値（20px など）を、そのまま書きます。"},"hint":"数値のあとに、続けて何を書くのでしょう？","feedback_correct":"正解！数値には単位を付けます。","feedback_incorrect":"惜しい！数値と単位の書き方を確認しましょう。"},{"id":"HC-066","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":6,"title":"中央揃え","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["text-align"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"見出しの文字を、水平方向の中央に揃えます。【空欄1】に入れる値を答えてください。","code":"h1 {\n  text-align: __1__;\n}","context_html":"<h1>ようこそ<\/h1>","check":{"format":"css","given_html":"<h1>ようこそ<\/h1>","expr":"getComputedStyle(document.querySelector('h1')).textAlign === 'center'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["center"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"中央揃えの値は center だから。","explanation":"text-align の主な値は、left（左揃え）・center（中央揃え）・right（右揃え）です。日本語では「中央」ですが、CSS の値は center と書きます。","common_mistakes":[{"blank":"b1","answer":"middle","reason":"middle という値はありません。無効な値は無視されるので、標準の左揃えのままです。中央揃えは center です。"}],"hint":"中心を意味する英単語（英国式の綴りではなく）です。","feedback_correct":"正解！text-align: center です。","feedback_incorrect":"惜しい！「真ん中」を表す、CSS の値を入力しましょう。"},{"id":"HC-067","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":7,"title":"子セレクタの対象","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["子セレクタ","子孫セレクタ"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、文字が赤くなる段落は、どれですか？（R が赤、- が赤でないことを表します。上から順に A・B です）","code":"div > p {\n  color: red;\n}","context_html":"<div>\n  <p>A<\/p>\n  <section>\n    <p>B<\/p>\n  <\/section>\n<\/div>","choice_format":"code","choices":[{"id":"c1","text":"A と B の両方（RR）"},{"id":"c2","text":"A だけ（R-）"},{"id":"c3","text":"どちらも赤くならない（--）"}],"check":{"format":"css","given_html":"<div>\n  <p>A<\/p>\n  <section>\n    <p>B<\/p>\n  <\/section>\n<\/div>","probe":"Array.from(document.querySelectorAll('p')).map(function (p) { return getComputedStyle(p).color === 'rgb(255, 0, 0)' ? 'R' : '-'; }).join('')","choice_values":{"c1":"RR","c2":"R-","c3":"--"}},"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"div > p は、div の直接の子の p だけを選び、section の中の p には当たらないから。","explanation":"空白で区切る子孫セレクタ（div p）なら、B も選ばれて RR になります。> で区切る子セレクタは、直接の子に限定します。","wrong_answer_reasons":{"c1":"div > p の > は、直接の子だけを選びます。B は、section の中にあり、div の直接の子ではありません。","c3":"A は div の直接の子の p なので、赤くなります。"},"hint":"B は、div の直接の子ですか？ それとも、section の中ですか？","feedback_correct":"正解！> は、直接の子だけを選びます。","feedback_incorrect":"惜しい！> と空白の違いを確認しましょう。"},{"id":"HC-068","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":8,"title":"見出しをまとめて指定する","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["グループ化","子孫セレクタ"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"h1 と h2 の両方を青くしたいのに、どちらも青くなりません。1行目を正しく書き直して入力してください（1行目の内容をすべて入力）。","code":"h1 h2 {\n  color: blue;\n}","context_html":"<h1>見出し1<\/h1>\n<h2>見出し2<\/h2>","check":{"format":"css","given_html":"<h1>見出し1<\/h1>\n<h2>見出し2<\/h2>","expr":"getComputedStyle(document.querySelector('h1')).color === 'rgb(0, 0, 255)' && getComputedStyle(document.querySelector('h2')).color === 'rgb(0, 0, 255)'"},"answer":{"target_line":1,"accepted":["h1, h2 {","h1,h2 {","h1, h2{","h1,h2{"],"quote_insensitive":false,"fixed_code":"h1, h2 {\n  color: blue;\n}"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"複数のセレクタに同じスタイルを当てるときは、カンマで区切るから。","explanation":"h1 h2 は、h1 要素の中にある h2 だけを選ぶセレクタです。h1 と h2 を並べて書いただけでは、そのような構造のものがないので、何にも当たりません。","common_mistakes":[{"answer":"h1 h2 {","reason":"元のコードのままです。空白は子孫セレクタで、「h1 の中にある h2」という意味になります。並んだ h1 と h2 の両方に当てるには、カンマで区切ります。"}],"hint":"複数のセレクタを並べるときの区切りの記号は何でしょう？","feedback_correct":"正解！カンマでグループ化します。","feedback_incorrect":"惜しい！空白とカンマの意味の違いを確認しましょう。"},{"id":"HC-069","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":9,"title":"疑似クラス :hover","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["疑似クラス",":hover"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の CSS は、どんなときに、リンクの文字を赤くしますか？","code":"a:hover {\n  color: red;\n}","choice_format":"text","choices":[{"id":"c1","text":"リンクを、すでに1回クリックしたことがあるとき"},{"id":"c2","text":"マウスポインターが、リンクの上に乗っているとき"},{"id":"c3","text":"ページを読み込んだ直後の、すべてのリンク"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":":hover は、マウスポインターが乗っている状態を表す疑似クラスだから。","explanation":"疑似クラスは、要素の「状態」に応じてスタイルを当てるための仕組みです。:hover（マウスが乗っている）のほかに、:focus（入力欄などが選ばれている）、:first-child（最初の子）などがあります。","wrong_answer_reasons":{"c1":"クリック済みのリンクを選ぶのは、:visited という別の疑似クラスです。:hover は、マウスが乗っている状態です。","c3":"常に適用するなら、疑似クラスなしの a { color: red; } と書きます。:hover は、マウスが乗っている間だけの指定です。"},"hint":"hover は、「浮かぶ」「乗る」という意味の英単語です。","feedback_correct":"正解！:hover は、マウスが乗っている状態です。","feedback_incorrect":"惜しい！hover の意味を考えましょう。"},{"id":"HC-070","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S07","stage_number":7,"number_in_stage":10,"title":"文字を整えたページ","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["font-size","line-height","text-align","text-decoration","rem"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML に、CSS だけで、次の見た目を指定してください。\n・h1: 文字を中央揃え、文字色を #0044cc、大きさを 2rem\n・class が lead の段落: 大きさを 1.25rem、太字\n・すべての p: 行の高さを、文字の大きさの 1.8 倍（単位なしの数値）\n・a: 下線を消す\n・strong: 文字色を red","code":null,"prefix_html":"<h1>旅の記録<\/h1>\n<p class=\"lead\">京都に行きました。<\/p>\n<p>清水寺で<strong>夕日<\/strong>を見ました。<\/p>\n<a href=\"#\">ページの先頭へ<\/a>","starter_code":"/* ここに CSS を書きましょう */\n","answer_format":"css","answer":{"reference_solution":"h1 {\n  text-align: center;\n  color: #0044cc;\n  font-size: 2rem;\n}\n.lead {\n  font-size: 1.25rem;\n  font-weight: bold;\n}\np {\n  line-height: 1.8;\n}\na {\n  text-decoration: none;\n}\nstrong {\n  color: red;\n}","alternative_solutions":["h1 { text-align: center; color: rgb(0, 68, 204); font-size: 32px; }\np { line-height: 1.8; }\np.lead { font-size: 20px; font-weight: 700; }\na { text-decoration: none; }\np strong { color: #f00; }"],"rejected_examples":[{"code":"h1 {\n  text-align: center;\n  color: #0044cc;\n  font-size: 2rem;\n}\n.lead {\n  font-size: 1.25rem;\n  font-weight: bold;\n}\na {\n  text-decoration: none;\n}\nstrong {\n  color: red;\n}","reason":"すべての p の行の高さ（line-height）を指定していません。p セレクタで 1.8 を指定します。"},{"code":"h1 { text-align: center; color: #0044cc; font-size: 2rem; }\n.lead { font-size: 1.25rem; }\np { line-height: 1.8; }\na { text-decoration: none; }\nstrong { color: red; }","reason":".lead が太字になっていません。font-weight: bold（または 700）も指定します。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"h1: 中央揃え・色 #0044cc・大きさ 2rem（32px）","expr":"(function () { var s = getComputedStyle(document.querySelector('h1')); return s.textAlign === 'center' && s.color === 'rgb(0, 68, 204)' && s.fontSize === '32px'; })()","visible":true},{"kind":"page","desc":".lead: 大きさ 1.25rem（20px）で太字","expr":"(function () { var s = getComputedStyle(document.querySelector('p.lead')); return s.fontSize === '20px' && s.fontWeight === '700'; })()","visible":true},{"kind":"page","desc":"p の行の高さが、文字の大きさの 1.8 倍（16px なら 28.8px）","expr":"getComputedStyle(document.querySelectorAll('p')[1]).lineHeight === '28.8px'","visible":true},{"kind":"page","desc":"a の下線がない","expr":"getComputedStyle(document.querySelector('a')).textDecorationLine === 'none'","visible":true},{"kind":"page","desc":"strong の文字色が赤","expr":"getComputedStyle(document.querySelector('strong')).color === 'rgb(255, 0, 0)'","visible":true},{"kind":"page","desc":".lead の行の高さも、文字の大きさの 1.8 倍（20px なら 36px）","expr":"getComputedStyle(document.querySelector('p.lead')).lineHeight === '36px'","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"色・大きさ・太さ・行間・揃え・装飾のプロパティを、それぞれのセレクタに指定するから。","explanation":"line-height は、単位のない数値（1.8）にすると、文字の大きさが違っても、それぞれに合わせた行間になります。.lead は文字が大きいので、行の高さも 36px になります。a の下線は、text-decoration: none で消せます。","hint":"5つのルールを書きます。line-height は、単位なしの数値です。","feedback_correct":"正解！文字の装飾ができました。","feedback_incorrect":"惜しい！.lead や strong の指定、line-height の値を確認しましょう。"},{"id":"HC-071","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":1,"title":"ボックスモデルの4層","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["ボックスモデル"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"ボックスモデルで、箱の内側から外側へ、正しい順に並んでいるものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"内容（content）→ padding → border → margin"},{"id":"c2","text":"内容（content）→ margin → border → padding"},{"id":"c3","text":"border → 内容（content）→ padding → margin"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"内容の外側に padding、その外に border、さらにその外に margin があるから。","explanation":"覚え方: 「中身 → 内側の余白 → 枠線 → 外側の余白」。背景色が広がるのは、padding の範囲までで、margin には背景色は付きません。","wrong_answer_reasons":{"c2":"margin は、一番外側の余白です。内側の余白（padding）が、内容のすぐ外側にあります。","c3":"枠線（border）は、内容と padding の外側を囲んでいます。内容が、一番内側です。"},"hint":"箱の中身から、外へ向かって、4つの層を順に考えましょう。","feedback_correct":"正解！内容 → padding → border → margin です。","feedback_incorrect":"惜しい！箱の層の順序を確認しましょう。"},{"id":"HC-072","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":2,"title":"箱の見た目の幅","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["ボックスモデル","width","content-box"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、.box の見た目の幅（枠線の外側まで。margin は含まない）は、何 px になりますか？","code":".box {\n  width: 200px;\n  padding: 20px;\n  border: 5px solid black;\n  margin: 10px;\n}","context_html":"<div class=\"box\">箱<\/div>","choice_format":"code","choices":[{"id":"c1","text":"200px"},{"id":"c2","text":"270px"},{"id":"c3","text":"250px"}],"check":{"format":"css","given_html":"<div class=\"box\">箱<\/div>","probe":"document.querySelector('.box').offsetWidth","choice_values":{"c1":200,"c3":250,"c2":270}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"200（内容）+ 20×2（padding）+ 5×2（border）= 250px だから。","explanation":"見た目の幅は、content + 左右の padding + 左右の border です。margin は、まわりとの距離なので、幅には含みません。","wrong_answer_reasons":{"c1":"標準（content-box）では、width は内容だけの幅です。padding と border が、その外側に足されます。","c2":"margin は、箱の外側の余白で、見た目の幅（枠線の外側まで）には含まれません。"},"hint":"左右に、padding と border が付くので、2倍して足します。","feedback_correct":"正解！padding と border が足されます。","feedback_incorrect":"惜しい！width が指す範囲を確認しましょう。"},{"id":"HC-073","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":3,"title":"box-sizing: border-box","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["box-sizing","border-box"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"前の問題の CSS に、box-sizing: border-box; を足しました。見た目の幅（枠線の外側まで）は、何 px になりますか？","code":".box {\n  box-sizing: border-box;\n  width: 200px;\n  padding: 20px;\n  border: 5px solid black;\n  margin: 10px;\n}","context_html":"<div class=\"box\">箱<\/div>","choice_format":"code","choices":[{"id":"c1","text":"200px"},{"id":"c2","text":"250px"},{"id":"c3","text":"160px"}],"check":{"format":"css","given_html":"<div class=\"box\">箱<\/div>","probe":"document.querySelector('.box').offsetWidth","choice_values":{"c2":250,"c1":200,"c3":160}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"border-box では、width が、padding と border を含めた見た目の幅になるから。","explanation":"このとき、内容（content）の幅は、200 − 40 − 10 = 150px に、自動で小さくなります。レイアウトの計算がしやすいので、多くのサイトで、全要素に border-box が指定されています。","wrong_answer_reasons":{"c2":"border-box では、width が padding と border を含む幅になります。250 にはなりません。","c3":"padding と border は、width の中に含まれますが、幅そのものから引かれて見た目が小さくなるわけではありません。見た目の幅は、width のとおりの 200px です（内容の幅が小さくなります）。"},"hint":"border-box は、枠線までを含めた幅になります。","feedback_correct":"正解！border-box では width のとおりの幅です。","feedback_incorrect":"惜しい！border-box の働きを確認しましょう。"},{"id":"HC-074","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":4,"title":"余白の省略記法","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["padding","省略記法"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"上下の padding を 10px、左右の padding を 20px にします。【空欄1】に入れる値を答えてください（半角で、空白で区切って入力）。","code":".box {\n  padding: __1__;\n}","context_html":"<div class=\"box\">箱<\/div>","check":{"format":"css","given_html":"<div class=\"box\">箱<\/div>","expr":"(function () { var s = getComputedStyle(document.querySelector('.box')); return s.paddingTop === '10px' && s.paddingBottom === '10px' && s.paddingLeft === '20px' && s.paddingRight === '20px'; })()"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["10px 20px"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"2つの値の省略記法は、上下 → 左右の順に書くから。","explanation":"1つなら4辺すべて、2つなら上下・左右、3つなら上・左右・下、4つなら上・右・下・左（時計回り）です。margin も同じ書き方です。","common_mistakes":[{"blank":"b1","answer":"20px 10px","reason":"2つの値は、上下 → 左右の順です。「20px 10px」だと、上下が 20px、左右が 10px になります。"}],"hint":"2つの値は、「上下」「左右」の順です。","feedback_correct":"正解！2つの値は上下 → 左右です。","feedback_incorrect":"惜しい！値の順番を確認しましょう。"},{"id":"HC-075","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":5,"title":"上下の margin の相殺","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["margin","相殺"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、段落 A の下端と、段落 B の上端の間隔は、何 px になりますか？数字だけを入力してください。","code":"p {\n  margin: 20px 0;\n  padding: 0;\n}","context_html":"<p class=\"a\">A<\/p>\n<p class=\"b\">B<\/p>","check":{"format":"css","given_html":"<p class=\"a\">A<\/p>\n<p class=\"b\">B<\/p>","probe":"Math.round(document.querySelector('.b').getBoundingClientRect().top - document.querySelector('.a').getBoundingClientRect().bottom)","expected":20},"answer":{"expected_output":"20"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"上下に隣り合う margin は、足し算ではなく、大きいほうの値に重なる（相殺される）から。","explanation":"margin の相殺は、ブロック要素の上下の margin で起こります。左右の margin や、padding では起こりません。段落の間隔が、思ったより狭いときの理由の1つです。","common_mistakes":[{"answer":"40","reason":"上下に隣り合う margin は、足されません。大きいほうの値（ここでは同じ 20px）に重なり、間隔は 20px になります。"},{"answer":"0","reason":"A の下に 20px、B の上に 20px の margin があり、重なって 20px の間隔が空きます。"}],"hint":"20 + 20 ではありません。上下の margin は、重なります。","feedback_correct":"正解！上下の margin は、大きいほうに重なります。","feedback_incorrect":"惜しい！margin の相殺を思い出しましょう。"},{"id":"HC-076","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":6,"title":"中央に寄らない箱","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["margin: auto","width","中央寄せ"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"箱を、画面の中央に置くつもりで margin: 0 auto を指定したのに、幅が広がるだけで、中央に寄った小さな箱になりません。正しい直し方はどれですか？","code":".box {\n  margin: 0 auto;\n}","context_html":"<div class=\"box\">中央<\/div>","choice_format":"text","choices":[{"id":"c1","text":"margin を 0 auto から auto 0 に変える"},{"id":"c2","text":"box に width を指定する（例: width: 300px;）"},{"id":"c3","text":"margin を padding に変える"}],"check":{"format":"css","given_html":"<div class=\"box\">中央<\/div>","expr":"(function () { var r = document.querySelector('.box').getBoundingClientRect(); return r.width === 300 && Math.abs(r.left + r.width / 2 - document.documentElement.clientWidth / 2) < 1; })()"},"answer":{"correct_choice_id":"c2","fixed_code":".box {\n  width: 300px;\n  margin: 0 auto;\n}"},"grading":{"method":"choice_id"},"rationale":"ブロック要素は、width がないと親の幅いっぱいに広がるため、auto の余白が分けられず、中央寄せにならないから。","explanation":"margin: 0 auto は、左右の余白を自動で、同じ大きさにする指定です。余る幅がないと、効果がありません。width（または max-width）で、親より小さい幅を指定します。","wrong_answer_reasons":{"c1":"auto 0 は、上下が auto、左右が 0 です。左右の余白がないので、水平方向の中央寄せにはなりません。","c3":"padding: 0 auto は、padding に auto は使えないので無効です。また、padding は内側の余白で、箱の位置は変わりません。"},"hint":"余りの幅がないと、左右に分けることができません。","feedback_correct":"正解！width を指定して中央寄せにします。","feedback_incorrect":"惜しい！箱の幅はどうなっているでしょう？"},{"id":"HC-077","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":7,"title":"padding と margin の違い","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["padding","margin"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"padding と margin の違いとして、正しい説明はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"padding は枠線の外側、margin は枠線の内側の余白である"},{"id":"c2","text":"padding は枠線の内側の余白で、背景色が付く。margin は枠線の外側の余白で、背景色は付かない"},{"id":"c3","text":"どちらも枠線の内側の余白で、書き方が違うだけである"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"padding は枠線の内側（背景色が付く）、margin は枠線の外側（透明で、他の要素との距離）だから。","explanation":"ボタンの文字の周りの余白は padding、ボタン同士の間隔は margin、のように使い分けます。覚え方は、padding = 詰め物（箱の中）、margin = 余白（箱の外）。","wrong_answer_reasons":{"c1":"反対です。padding が内側、margin が外側です。","c3":"padding は内側、margin は外側で、役割が違います。"},"hint":"背景色が付くのは、どちらの余白でしょう？","feedback_correct":"正解！padding は内側、margin は外側です。","feedback_incorrect":"惜しい！内側と外側を取り違えていませんか？"},{"id":"HC-078","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":8,"title":"表示されない枠線","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["border","省略記法"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"赤い枠線を付けたつもりが、枠線が表示されません。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":".box {\n  border: 2px red;\n}","context_html":"<div class=\"box\">箱<\/div>","check":{"format":"css","given_html":"<div class=\"box\">箱<\/div>","expr":"getComputedStyle(document.querySelector('.box')).borderTopWidth === '2px' && getComputedStyle(document.querySelector('.box')).borderTopColor === 'rgb(255, 0, 0)'"},"answer":{"target_line":2,"accepted":["border: 2px solid red;","border:2px solid red;","border: solid 2px red;","border: 2px red solid;","border: 2px solid red","border: red solid 2px;"],"quote_insensitive":false,"fixed_code":".box {\n  border: 2px solid red;\n}"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"border には、線の種類（solid など）の指定が必要だから。","explanation":"border は、太さ・線の種類・色を、まとめて書く省略記法です。線の種類は、実線（solid）、破線（dashed）、点線（dotted）などです。省略すると、標準が none（なし）になるため、枠線は表示されません。","common_mistakes":[{"answer":"border: 2px red;","reason":"元のコードのままです。線の種類（solid など）がないと、宣言が無効になり、枠線が表示されません。"}],"hint":"線の「種類」を表す語が抜けています。","feedback_correct":"正解！線の種類（solid）が必要です。","feedback_incorrect":"惜しい！border の3つの値を確認しましょう。"},{"id":"HC-079","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":9,"title":"インライン要素の width","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["display","インライン要素","width"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、span 要素に指定した width: 100px; は、どうなりますか？","code":"span {\n  width: 100px;\n}","context_html":"<span class=\"s\">A<\/span>","choice_format":"code","choices":[{"id":"c1","text":"効いて、幅が 100px になる"},{"id":"c2","text":"インライン要素なので、width は無視される"},{"id":"c3","text":"エラーになって、span が表示されない"}],"check":{"format":"css","given_html":"<span class=\"s\">A<\/span>","probe":"document.querySelector('.s').offsetWidth >= 100 ? 'applied' : 'ignored'","choice_values":{"c1":"applied","c2":"ignored","c3":"error"}},"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"インライン要素には、width と height が効かないから。","explanation":"width を効かせたいときは、display: inline-block（文章の流れに並べたいとき）や、display: block を指定します。a 要素をボタンのように大きくしたいときにも、この指定が必要です。","wrong_answer_reasons":{"c1":"span はインライン要素で、width が効きません。幅は、中の文字の幅になります。","c3":"CSS には、エラーで表示が止まる仕組みはありません。効かない指定は、無視されるだけです。"},"hint":"span は、ブロックとインラインのどちらでしたか？","feedback_correct":"正解！インライン要素には width が効きません。","feedback_incorrect":"惜しい！span のデフォルトの display を思い出しましょう。"},{"id":"HC-080","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S08","stage_number":8,"number_in_stage":10,"title":"カードを作る","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["box-sizing","padding","border","margin","border-radius"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML の .card に、CSS だけで、次の見た目を指定してください。\n・枠線を含めた見た目の幅を、ちょうど 300px にする（box-sizing: border-box を使う）\n・padding を 16px、枠線を 1px の実線（色は gray）、角の丸みを 8px にする\n・背景色を lightyellow にする\n・水平方向の中央に寄せる\n・.card の下に、24px の余白を取る","code":null,"prefix_html":"<div class=\"card\">\n  <h2>タイトル<\/h2>\n  <p>本文です。<\/p>\n<\/div>","starter_code":"/* ここに CSS を書きましょう */\n","answer_format":"css","answer":{"reference_solution":".card {\n  box-sizing: border-box;\n  width: 300px;\n  margin: 0 auto 24px;\n  padding: 16px;\n  border: 1px solid gray;\n  border-radius: 8px;\n  background-color: lightyellow;\n}","alternative_solutions":[".card {\n  box-sizing: border-box;\n  width: 300px;\n  padding: 16px;\n  border: 1px solid gray;\n  border-radius: 8px;\n  background: lightyellow;\n  margin-left: auto;\n  margin-right: auto;\n  margin-bottom: 24px;\n}"],"rejected_examples":[{"code":".card {\n  width: 300px;\n  margin: 0 auto 24px;\n  padding: 16px;\n  border: 1px solid gray;\n  border-radius: 8px;\n  background-color: lightyellow;\n}","reason":"box-sizing: border-box がないので、見た目の幅が 300 + 32 + 2 = 334px になります。"},{"code":".card {\n  box-sizing: border-box;\n  width: 300px;\n  padding: 16px;\n  border: 1px solid gray;\n  border-radius: 8px;\n  background-color: lightyellow;\n  margin-bottom: 24px;\n}","reason":"水平方向の中央寄せ（margin の左右を auto にする）がありません。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"見た目の幅がちょうど 300px","expr":"document.querySelector('.card').offsetWidth === 300","visible":true},{"kind":"page","desc":"padding が 16px、枠線が 1px の実線で gray","expr":"(function () { var s = getComputedStyle(document.querySelector('.card')); return s.paddingTop === '16px' && s.paddingLeft === '16px' && s.borderTopWidth === '1px' && s.borderTopStyle === 'solid' && s.borderTopColor === 'rgb(128, 128, 128)'; })()","visible":true},{"kind":"page","desc":"角の丸みが 8px、背景色が lightyellow","expr":"(function () { var s = getComputedStyle(document.querySelector('.card')); return s.borderTopLeftRadius === '8px' && s.backgroundColor === 'rgb(255, 255, 224)'; })()","visible":true},{"kind":"page","desc":"水平方向の中央に寄っている","expr":"(function () { var r = document.querySelector('.card').getBoundingClientRect(); return Math.abs(r.left + r.width / 2 - document.documentElement.clientWidth / 2) < 1; })()","visible":true},{"kind":"page","desc":"下の margin が 24px","expr":"getComputedStyle(document.querySelector('.card')).marginBottom === '24px'","visible":false},{"kind":"page","desc":"内容の幅は 300 − 32 − 2 = 266px","expr":"document.querySelector('.card').clientWidth - 32 === 266","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"box-sizing: border-box と width: 300px で見た目の幅を決め、padding・border・border-radius・background-color・margin で箱を整えるから。","explanation":"border-box にすると、width: 300px が、padding と border を含めた幅になるので、見た目が300pxになります。中央寄せの margin: 0 auto 24px は、上 0・左右 auto・下 24px の省略記法です。","hint":"margin: 0 auto 24px は、上 0・左右 auto・下 24px です。","feedback_correct":"正解！ボックスモデルを使いこなせました。","feedback_incorrect":"惜しい！見た目の幅（border-box）と、中央寄せを確認しましょう。"},{"id":"HC-081","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S09","stage_number":9,"number_in_stage":1,"title":"display: flex を書く場所","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["display: flex","Flexコンテナ"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"3つの div を横一列に並べたい。display: flex は、どの要素に指定しますか？","code":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","choice_format":"text","choices":[{"id":"c1","text":"3つの .item それぞれに指定する"},{"id":"c2","text":"body 要素に指定する"},{"id":"c3","text":"3つを囲んでいる、親の .container に指定する"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"Flexbox は、親（Flex コンテナ）に指定して、その直接の子（Flex アイテム）を並べる仕組みだから。","explanation":"display: flex を指定した要素が Flex コンテナとなり、その直接の子が Flex アイテムになります。孫以降の要素は、Flex アイテムではありません。","wrong_answer_reasons":{"c1":"子（.item）に指定すると、子の中身の並べ方が変わるだけで、3つの子が横に並ぶことにはなりません。並べたい要素の「親」に指定します。","c2":"body に指定すると、body の直接の子（ここでは .container）が、横に並ぶだけです。3つの .item を並べたいなら、それらの直接の親に指定します。"},"hint":"並べたいのは3つの子です。それらを囲んでいるのは？","feedback_correct":"正解！Flexbox は、親に指定します。","feedback_incorrect":"惜しい！並べたい要素の「親」に指定します。"},{"id":"HC-082","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S09","stage_number":9,"number_in_stage":2,"title":"display: flex の並び方","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["display: flex","flex-direction"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、3つのアイテムは、どう並びますか？","code":".container {\n  display: flex;\n}\n.item {\n  width: 50px;\n  height: 50px;\n}","context_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","choice_format":"code","choices":[{"id":"c1","text":"縦に並ぶ（1つずつ改行される）"},{"id":"c2","text":"横一列に並ぶ"},{"id":"c3","text":"1つの場所に重なって表示される"}],"check":{"format":"css","given_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","probe":"(function () { var t = Array.from(document.querySelectorAll('.item')).map(function (e) { return Math.round(e.getBoundingClientRect().top); }); var l = Array.from(document.querySelectorAll('.item')).map(function (e) { return Math.round(e.getBoundingClientRect().left); }); return t.every(function (v) { return v === t[0]; }) ? 'row' : (l.every(function (v) { return v === l[0]; }) ? 'column' : 'other'); })()","choice_values":{"c1":"column","c2":"row","c3":"other"}},"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"Flex コンテナの標準の flex-direction は row（横方向）だから。","explanation":"display: flex がない div は、ブロック要素なので縦に並びます。flex を指定すると、flex-direction の標準（row）の向きに、横一列で並びます。","wrong_answer_reasons":{"c1":"display: flex を指定すると、直接の子は、標準で、横一列（行方向）に並びます。縦に並ぶのは、flex を指定しない div の場合です。","c3":"アイテムは、重なりません。主軸方向（標準は横）に、順番に並びます。"},"hint":"flex-direction の標準の値は row です。","feedback_correct":"正解！標準は横一列です。","feedback_incorrect":"惜しい！flex-direction の標準の向きを確認しましょう。"},{"id":"HC-083","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S09","stage_number":9,"number_in_stage":3,"title":"space-between の並び方","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["justify-content","space-between"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、3つのアイテムは、どのように並びますか？（コンテナの幅は 300px、アイテムの幅は 50px です）","code":".container {\n  display: flex;\n  justify-content: space-between;\n  width: 300px;\n}\n.item {\n  width: 50px;\n  height: 50px;\n}","context_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","choice_format":"code","choices":[{"id":"c1","text":"両端に寄せて並び、アイテムの間が均等に空く"},{"id":"c2","text":"左端に詰めて並ぶ"},{"id":"c3","text":"中央に寄って並ぶ"}],"check":{"format":"css","given_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","probe":"(function () { var c = document.querySelector('.container').getBoundingClientRect(); var it = Array.from(document.querySelectorAll('.item')).map(function (e) { return e.getBoundingClientRect(); }); var gap1 = it[1].left - it[0].right, gap2 = it[2].left - it[1].right; if (Math.round(it[0].left) === Math.round(c.left) && Math.round(it[2].right) === Math.round(c.right) && Math.round(gap1) === Math.round(gap2) && gap1 > 1) return 'between'; if (Math.round(it[0].left) === Math.round(c.left)) return 'start'; return 'other'; })()","choice_values":{"c2":"start","c1":"between","c3":"other"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"space-between は、最初と最後のアイテムを両端に寄せ、間の余白を等しくするから。","explanation":"ここでは、300 − 50×3 = 150px の余りが、アイテムの間の2か所に、75px ずつ分けられます。ナビゲーションバーで、ロゴを左、メニューを右に振り分けるときにもよく使います。","wrong_answer_reasons":{"c2":"左端に詰めて並ぶのは、justify-content の標準の値（flex-start）です。space-between は、両端に寄せて、間を均等にします。","c3":"中央に寄せるのは、justify-content: center です。"},"hint":"space-between は、「間（between）に余白を入れる」という意味です。","feedback_correct":"正解！両端に寄せて、間を均等にします。","feedback_incorrect":"惜しい！space-between の名前の意味を考えましょう。"},{"id":"HC-084","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S09","stage_number":9,"number_in_stage":4,"title":"縦に並べる","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["flex-direction","主軸"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"3つのアイテムを、Flexbox のまま、縦一列に並べます。【空欄1】に入れる値を答えてください。","code":".container {\n  display: flex;\n  flex-direction: __1__;\n}\n.item {\n  width: 50px;\n  height: 50px;\n}","context_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>"," ) < 1; })()"},"answer":{"correct_choice_id":"c3","fixed_code":".container {\n  display: flex;\n  justify-content: center;\n  width: 300px;\n}"},"grading":{"method":"choice_id"},"rationale":"justify-content は、display: flex を指定した親でないと効かないから。","explanation":"justify-content や align-items は、Flexbox（や Grid）のためのプロパティです。display: flex がない親に書いても、エラーにならず、無視されます。","wrong_answer_reasons":{"c1":"align-items は、交差軸（縦）方向の揃え方です。水平方向の中央寄せには、justify-content を使います（その前に、display: flex が必要です）。","c2":"middle という値はありません。無効になり、中央に寄りません。"},"hint":"justify-content が働くには、親がどんな状態である必要があるでしょう？","feedback_correct":"正解！display: flex が必要です。","feedback_incorrect":"惜しい！親の display を確認しましょう。"},{"id":"HC-087","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S09","stage_number":9,"number_in_stage":7,"title":"gap を含めた位置","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["gap"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページで、3つ目のアイテムの左端は、コンテナの左端から何 px の位置にありますか？数字だけを入力してください。","code":".container {\n  display: flex;\n  gap: 10px;\n}\n.item {\n  width: 50px;\n  height: 50px;\n}","context_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","check":{"format":"css","given_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","probe":"Math.round(document.querySelectorAll('.item')[2].getBoundingClientRect().left - document.querySelector('.container').getBoundingClientRect().left)","expected":120},"answer":{"expected_output":"120"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"(50px + 10px) × 2 = 120px になるから。","explanation":"gap は、アイテムの間（ここでは、1つ目と2つ目の間、2つ目と3つ目の間の2か所）に入ります。3つ目の左端は、1つ目（50px）+ gap（10px）+ 2つ目（50px）+ gap（10px）= 120px の位置です。","common_mistakes":[{"answer":"100","reason":"アイテムの間に、gap の 10px が入ります。50 + 50 = 100px に、さらに gap が 2 か所分（20px）加わります。"},{"answer":"110","reason":"gap は、アイテムとアイテムの間の2か所にあります。1か所だけではありません。"}],"hint":"3つ目の左側には、アイテムが2つと、gap が2か所あります。","feedback_correct":"正解！gap は、間の数だけ入ります。","feedback_incorrect":"惜しい！gap が何か所に入るか数えましょう。"},{"id":"HC-088","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S09","stage_number":9,"number_in_stage":8,"title":"display の値の書き間違い","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["display: flex","綴りミス"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"アイテムを横に並べるつもりが、縦のままです。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":".container {\n  display: flexbox;\n}\n.item {\n  width: 50px;\n  height: 50px;\n}","context_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","check":{"format":"css","given_html":"<div class=\"container\">\n  <div class=\"item\">1<\/div>\n  <div class=\"item\">2<\/div>\n  <div class=\"item\">3<\/div>\n<\/div>","expr":"(function () { var t = Array.from(document.querySelectorAll('.item')).map(function (e) { return Math.round(e.getBoundingClientRect().top); }); var l = Array.from(document.querySelectorAll('.item')).map(function (e) { return Math.round(e.getBoundingClientRect().left); }); return t.every(function (v) { return v === t[0]; }) ? 'row' : (l.every(function (v) { return v === l[0]; }) ? 'column' : 'other'); })() === 'row'"},"answer":{"target_line":2,"accepted":["display: flex;","display:flex;","display: flex"],"quote_insensitive":false,"fixed_code":".container {\n  display: flex;\n}\n.item {\n  width: 50px;\n  height: 50px;\n}"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"display の値は、flex _language":"css","stage_id":"S09","stage_number":9,"number_in_stage":10,"title":"3つのカードを横に並べる","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["display: flex","gap","flex","justify-content","align-items"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML の .cards に、CSS だけで、次の見た目を指定してください。\n・.cards の幅を 600px にし、3つの .card を横一列に並べる\n・.card どうしの間隔を 16px にする\n・3つの .card の幅を、すべて等しくして、.cards の幅いっぱいに広げる（flex を使う）\n・.card の中の文字を、水平・垂直とも中央に揃える（.card 自身も、Flexbox にする）\n・.card の高さを 100px にする","code":null,"prefix_html":"<div class=\"cards\">\n  <div class=\"card\">A<\/div>\n  <div class=\"card\">B<\/div>\n  <div class=\"card\">C<\/div>\n<\/div>","starter_code":"/* ここに CSS を書きましょう */\n","answer_format":"css","answer":{"reference_solution":".cards {\n  display: flex;\n  gap: 16px;\n  width: 600px;\n}\n.card {\n  flex: 1;\n  height: 100px;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  background-color: lightblue;\n}","alternative_solutions":[".cards { width: 600px; display: flex; column-gap: 16px; }\n.card { flex: 1 1 0; height: 100px; display: flex; align-items: center; justify-content: center; }"],"rejected_examples":[{"code":".cards {\n  display: flex;\n  width: 600px;\n}\n.card {\n  flex: 1;\n  height: 100px;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}","reason":"カードの間隔（gap）が 16px になっていません。"},{"code":".cards {\n  display: flex;\n  gap: 16px;\n  width: 600px;\n}\n.card {\n  width: 100px;\n  height: 100px;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}","reason":"カードの幅が 100px に固定されていて、.cards の幅いっぱいに広がっていません。flex: 1 で、余った幅を等分します。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"3つのカードが、横一列に並んでいる","expr":"(function () { var t = Array.from(document.querySelectorAll('.card')).map(function (e) { return Math.round(e.getBoundingClientRect().top); }); return t.length === 3 && t.every(function (v) { return v === t[0]; }); })()","visible":true},{"kind":"page","desc":"カードどうしの間隔が 16px","expr":"(function () { var c = Array.from(document.querySelectorAll('.card')).map(function (e) { return e.getBoundingClientRect(); }); return Math.round(c[1].left - c[0].right) === 16 && Math.round(c[2].left - c[1].right) === 16; })()","visible":true},{"kind":"page","desc":"3つのカードの幅が等しく、.cards の幅いっぱいに広がっている","expr":"(function () { var c = Array.from(document.querySelectorAll('.card')).map(function (e) { return e.getBoundingClientRect(); }); var p = document.querySelector('.cards').getBoundingClientRect(); return Math.abs(c[0].width - c[1].width) < 1 && Math.abs(c[1].width - c[2].width) < 1 && Math.abs(c[0].left - p.left) < 1 && Math.abs(c[2].right - p.right) < 1 && Math.round(p.width) === 600; })()","visible":true},{"kind":"page","desc":"カードの高さが 100px","expr":"Math.round(document.querySelector('.card').getBoundingClientRect().height) === 100","visible":true},{"kind":"page","desc":"カードの中の文字が、水平・垂直とも中央にある","expr":"(function () { var el = document.querySelector('.card'); var s = getComputedStyle(el); return s.display === 'flex' && s.justifyContent === 'center' && s.alignItems === 'center'; })()","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"親に display: flex と gap、子に flex: 1 を指定して等分に並べ、子自身も flex にして、中身を中央に揃えるから。","explanation":"flex: 1 を全部のカードに指定すると、間隔（gap）を除いた幅を等分します。カードの中の文字を中央に置くには、カード自身を Flexbox にして、justify-content と align-items を center にします。Flexbox は、入れ子にして使えます。","hint":"親に display: flex と gap。子に flex: 1。子の中身は、子自身を flex にして中央に。","feedback_correct":"正解！Flexbox でカードを並べられました。","feedback_incorrect":"惜しい！間隔・幅・中身の揃えを、1つずつ確認しましょう。"},{"id":"HC-091","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S10","stage_number":10,"number_in_stage":1,"title":"viewport の meta 要素","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["viewport","meta"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"head の中の、次の meta 要素は、何のために書きますか？","code":"<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">","choice_format":"text","choices":[{"id":"c1","text":"ページを、スマホでしか表示できないようにするため"},{"id":"c2","text":"スマホなどで、画面の幅に合わせた大きさでページを表示するため"},{"id":"c3","text":"文字コードを UTF-8 にするため"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"viewport の指定がないと、スマホは、PC 向けの広い幅で表示を作って縮小してしまうから。","explanation":"width=device-width は「表示の幅を、端末の画面の幅にする」、initial-scale=1 は「最初の拡大率は等倍」という意味です。レスポンシブデザインには、欠かせない指定です。","wrong_answer_reasons":{"c1":"PC を含む、どの端末でも見られます。この指定は、スマホでも、画面の幅に合わせて表示させるためのものです。","c3":"文字コードを指定するのは、<meta charset=\"utf-8\"> です。この meta 要素は、表示領域の幅の扱いを指定します。"},"hint":"name=\"viewport\" は、「表示領域」の指定です。","feedback_correct":"正解！画面の幅に合わせて表示します。","feedback_incorrect":"惜しい！charset とは役割が違います。"},{"id":"HC-092","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S10","stage_number":10,"number_in_stage":2,"title":"狭い画面でのメディアクエリ","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["メディアクエリ","min-width"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページを、画面の幅 500px で表示したとき、段落の文字は何色になりますか？","code":"p {\n  color: black;\n}\n@media (min-width: 600px) {\n  p {\n    color: red;\n  }\n}","context_html":"<p>テスト<\/p>","choice_format":"code","choices":[{"id":"c1","text":"赤"},{"id":"c2","text":"文字が表示されない"},{"id":"c3","text":"黒"}],"check":{"format":"css","given_html":"<p>テスト<\/p>","viewport":500,"probe":"getComputedStyle(document.querySelector('p')).color","choice_values":{"c1":"rgb(255, 0, 0)","c3":"rgb(0, 0, 0)","c2":"none"}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"500px は、min-width: 600px の条件を満たさないので、基本の黒のままだから。","explanation":"min-width は「その幅以上」です。画面が 600px 以上のときだけ、メディアクエリの中のルールが適用され、赤になります。それ以外は、基本のルール（黒）です。","wrong_answer_reasons":{"c1":"(min-width: 600px) は、画面の幅が 600px 以上のときの条件です。500px は、600px より狭いので、赤にはなりません。","c2":"メディアクエリの条件に合わなくても、基本のルールは適用され、文字は黒で表示されます。"},"hint":"500 は 600 以上ですか？","feedback_correct":"正解！条件を満たさないので黒のままです。","feedback_incorrect":"惜しい！min-width の意味を確認しましょう。"},{"id":"HC-093","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S10","stage_number":10,"number_in_stage":3,"title":"画面幅 800px のとき","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["メディアクエリ","max-width"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML と CSS を組み合わせたページを、画面の幅 800px で表示したとき、メニュー（.menu）は表示されますか？","code":".menu {\n  display: block;\n}\n@media (max-width: 600px) {\n  .menu {\n    display: none;\n  }\n}","context_html":"<nav class=\"menu\">メニュー<\/nav>","choice_format":"code","choices":[{"id":"c1","text":"表示されない（display: none になる）"},{"id":"c2","text":"画面の幅に関係なく、いつも表示されない"},{"id":"c3","text":"表示される（display: block のまま）"}],"check":{"format":"css","given_html":"<nav class=\"menu\">メニュー<\/nav>","viewport":800,"probe":"getComputedStyle(document.querySelector('.menu')).display","choice_values":{"c3":"block","c1":"none","c2":"x"}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"800px は、max-width: 600px の条件を満たさないので、基本のルールが適用されるから。","explanation":"max-width は「その幅以下」です。スマホのように狭い画面では、メニューを隠して、ボタンで開く、といった作りによく使います。","wrong_answer_reasons":{"c1":"(max-width: 600px) は、画面の幅が 600px 以下のときの条件です。800px は 600px より広いので、条件を満たしません。","c2":"メディアクエリは、条件に合うときだけ適用されます。800px では、基本のルールの display: block が使われます。"},"hint":"800 は 600 以下ですか？","feedback_correct":"正解！max-width は「以下」です。","feedback_incorrect":"惜しい！max-width の意味を確認しましょう。"},{"id":"HC-094","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S10","stage_number":10,"number_in_stage":4,"title":"狭い画面向けの条件","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["max-width","メディアクエリ"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"画面の幅が 600px 以下のとき、段落の文字を赤にします。【空欄1】に入れる条件の名前を答えてください。","code":"@media (__1__: 600px) {\n  p {\n    color: red;\n  }\n}","context_html":"<p>テスト<\/p>","check":{"format":"css","given_html":"<p>テスト<\/p>","viewport":500,"expr":"getComputedStyle(document.querySelector('p')).color === 'rgb(255, 0, 0)'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["max-width"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"「その幅以下」のときの条件は、max-width だから。","explanation":"min-width（以上）と max-width（以下）は、混同しやすい組み合わせです。「スマホ向けに max-width、広い画面向けに min-width」と整理して覚えましょう。","common_mistakes":[{"blank":"b1","answer":"min-width","reason":"min-width は「その幅以上」です。500px は 600px 未満なので条件に当てはまらず、赤になりません。「以下」は max-width です。"}],"hint":"「以下」を表す条件です。","feedback_correct":"正解！max-width は「以下」です。","feedback_incorrect":"惜しい！min と max の意味を確認しましょう。"},{"id":"HC-095","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S10","stage_number":10,"number_in_stage":5,"title":"画面からはみ出す箱","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["max-width","%","レスポンシブ"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"幅 800px の箱が、スマホ（画面幅 400px）で、画面からはみ出してしまいます。画面の幅に収まるようにするには、どうすればよいですか？","code":".photo {\n  width: 800px;\n  height: 100px;\n  background-color: gray;\n}","context_html":"<div class=\"photo\"><\/div>","choice_format":"text","choices":[{"id":"c1","text":"width を、もっと大きい値（1200px など）にする"},{"id":"c2","text":"body に overflow: hidden を指定する"},{"id":"c3","text":"max-width: 100% を追加する"}],"check":{"format":"css","given_html":"<div class=\"photo\"><\/div>","viewport":400,"expr":"document.querySelector('.photo').getBoundingClientRect().width <= document.documentElement.clientWidth"},"answer":{"correct_choice_id":"c3","fixed_code":".photo {\n  width: 800px;\n  max-width: 100%;\n  height: 100px;\n  background-color: gray;\n}"},"grading":{"method":"choice_id"},"rationale":"max-width: 100% は、親の幅を超えないように、上限を決める指定だから。","explanation":"width: 800px だけだと、画面の幅が 800px より狭くても、800px のままです。max-width: 100% を足すと、親の幅（画面の幅）を超えず、狭い画面では、親の幅に縮みます。画像にも、同じ指定を使います。","wrong_answer_reasons":{"c1":"幅を大きくすると、もっとはみ出します。画面より広くならないように、上限を決めます。","c2":"はみ出した部分を隠すだけで、箱は小さくなりません。見える範囲が切れてしまう（内容が見えなくなる）ので、適切な対処ではありません。"},"hint":"親の幅を超えないようにする、上限の指定です。","feedback_correct":"正解！max-width: 100% で上限を決めます。","feedback_incorrect":"惜しい！幅の「上限」を決める指定を使います。"},{"id":"HC-096","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S10","stage_number":10,"number_in_stage":6,"title":"かっこのないメディアクエリ","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["メディアクエリ","構文"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"画面の幅が 600px 以下のときに、段落を赤くするつもりが、画面幅 500px でも赤くなりません。1行目を正しく書き直して入力してください（1行目の内容をすべて入力）。","code":"@media max-width: 600px {\n  p {\n    color: red;\n  }\n}","context_html":"<p>テスト<\/p>","check":{"format":"css","given_html":"<p>テスト<\/p>","viewport":500,"expr":"getComputedStyle(document.querySelector('p')).color === 'rgb(255, 0, 0)'"},"answer":{"target_line":1,"accepted":["@media (max-width: 600px) {","@media (max-width:600px) {","@media (max-width: 600px){","@media (max-width:600px){"],"quote_insensitive":false,"fixed_code":"@media (max-width: 600px) {\n  p {\n    color: red;\n  }\n}"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"メディアクエリの条件は、( ) で囲んで書く必要があるから。","explanation":"@media の条件には、(max-width: 600px) のように、かっこが必要です。かっこがないと、メディアクエリ全体が無効になり、中のルールは、どの画面幅でも適用されません。","common_mistakes":[{"answer":"@media max-width: 600px {","reason":"元のコードのままです <script id="pyworker" type="text/plain">
/* 学習者のコードを実行する Web Worker（Pyodide）。
 * 主スレッド（画面）とは隔離され、DOM・localStorage には触れない。
 * 時間制限は主スレッド側のタイマー＋ Worker の terminate() で行う（pyrunner.js）。 */
let pyodide = null;
const OUTPUT_LIMIT = 64 * 1024; // 標準出力の上限（文字数）

const HELPER = `
import ast, json, sys, builtins, traceback

_ALLOWED_IMPORTS = {"random"}
_real_import = builtins.__import__

def _safe_import(name, globals=None, locals=None, fromlist=(), level=0):
    if name.split(".")[0] not in _ALLOWED_IMPORTS:
        raise ImportError("この学習アプリでは " + name + " は使えません")
    return _real_import(name, globals, locals, fromlist, level)

def _make_ns():
    b = dict(vars(builtins))
    b["__import__"] = _safe_import
    for k in ("open", "input", "exec", "eval", "compile", "breakpoint", "exit", "quit", "help", "memoryview"):
        b.pop(k, None)
    return {"__name__": "__main__", "__builtins__": b}

def static_check(job_json):
    j = json.loads(job_json)
    try:
        tree = ast.parse(j["student"])
    except SyntaxError as e:
        return json.dumps({"ok": False, "message": "構文エラー（%s行目）: %s" % (e.lineno, e.msg)})
    present = {type(n).__name__ for n in ast.walk(tree)}
    missing = [r for r in j["required"] if r not in present]
    if missing:
        return json.dumps({"ok": False, "message": "この問題で使う必要がある書き方が含まれていません: " + ", ".join(missing)})
    if j["any"] and not any(r in present for r in j["any"]):
        return json.dumps({"ok": False, "message": "次のいずれかを使ってください: " + " / ".join(j["any"])})
    return json.dumps({"ok": True})

def _student_line(e, offset):
    tb = e.__traceback__
    line = None
    while tb is not None:
        if tb.tb_frame.f_code.co_filename == "<student>":
            line = tb.tb_lineno - offset
        tb = tb.tb_next
    return line

def run_test(job_json):
    j = json.loads(job_json)
    offset = j["setup"].count("\\n") + 1
    ns = _make_ns()
    try:
        code = compile(j["setup"] + "\\n" + j["student"] + "\\n", "<student>", "exec")
        exec(code, ns)
        if j["kind"] == "call":
            r = eval(compile(j["call"], "<call>", "eval"), ns)
            actual = repr(r)
            ok = actual == repr(ast.literal_eval(j["expected"]))
            return json.dumps({"ok": ok, "actual": actual})
        return json.dumps({"ok": True})
    except SyntaxError as e:
        ln = (e.lineno - offset) if e.lineno else None
        return json.dumps({"ok": False, "error": "SyntaxError: %s%s" % (e.msg, "（%s行目）" % ln if ln and ln > 0 else "")})
    except BaseException as e:
        ln = _student_line(e, offset)
        return json.dumps({"ok": False, "error": "%s: %s%s" % (type(e).__name__, e, "（%s行目）" % ln if ln and ln > 0 else "")})
    finally:
        sys.stdout.flush()
`;

function lockDown() {
  // 学習者コードが js モジュール経由で外部通信できないようにする（core のみ使用するため、初期化後は不要）
  for (const name of ["fetch", "XMLHttpRequest", "WebSocket", "EventSource", "importScripts", "indexedDB", "caches"]) {
    try { Object.defineProperty(self, name, { value: undefined, configurable: false, writable: false }); } catch (e) { /* 無視 */ }
  }
}

self.onmessage = async (ev) => {
  const m = ev.data;
  if (m.type === "init") {
    try {
      importScripts(m.url + "pyodide.js");
      pyodide = await self.loadPyodide({ indexURL: m.url });
      pyodide.runPython(HELPER);
      const py = pyodide.runPython("import sys; sys.version.split()[0]");
      lockDown();
      self.postMessage({ type: "ready", python: py, pyodide: pyodide.version });
    } catch (e) {
      self.postMessage({ type: "initerror", message: String((e && e.message) || e) });
    }
    return;
  }
  if (m.type === "run") {
    let out = "";
    let truncated = false;
    // 前回の実行で出力の途中で打ち切られた場合に、残りの出力が今回に混ざらないよう捨てる
    pyodide.setStdout({ batched: () => {} });
    try { pyodide.runPython("import sys; sys.stdout.flush()"); } catch (e) { /* 無視 */ }
    pyodide.setStdout({
      batched: (s) => {
        if (out.length + s.length + 1 > OUTPUT_LIMIT) { truncated = true; throw new Error("出力が長すぎます（上限 64KB）"); }
        out += s + "\n";
      },
    });
    pyodide.setStderr({ batched: () => {} });
    let res;
    try {
      const fn = pyodide.globals.get(m.op === "static" ? "static_check" : "run_test");
      try { res = JSON.parse(fn(JSON.stringify(m.job))); } finally { fn.destroy(); }
    } catch (e) {
      res = { ok: false, error: String((e && e.message) || e) };
    }
    self.postMessage({ type: "result", id: m.id, res, out, truncated });
  }
};

</script>
<script>
/* 自動採点（docs/05_grading_spec.md の JavaScript 実装）
 * 対応: choice_id / output_compare / accepted_answers
 * 非対応: test_cases（Python の実行環境が必要。試作では自己採点にする） */
const Grader = (function () {
  function normOutput(s) {
    const lines = String(s).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").map((l) => l.trimEnd());
    while (lines.length && lines[lines.length - 1] === "") lines.pop();
    return lines.join("\n");
  }

  function normAnswer(s, quoteInsensitive) {
    let t = String(s).normalize("NFKC").trim();
    if (quoteInsensitive) t = t.replace(/'/g, '"');
    return t;
  }

  /** 回答の形: choice=選択肢ID文字列 / 穴埋め={b1:"..."} / 入力式=文字列 */
  function grade(q, answer) {
    const a = q.answer;
    switch (q.grading.method) {
      case "choice_id":
        return answer === a.correct_choice_id;
      case "output_compare":
        return normOutput(answer) === normOutput(a.expected_output);
      case "accepted_answers":
        if (q.type === "fill_blank") {
          return a.blanks.every((b) => {
            const given = normAnswer(answer[b.id] || "", b.quote_insensitive);
            return b.accepted.some((x) => normAnswer(x, b.quote_insensitive) === given);
          });
        } else {
          const qi = !!a.quote_insensitive;
          const given = normAnswer(answer, qi);
          return a.accepted.some((x) => normAnswer(x, qi) === given);
        }
      default:
        throw new Error("unsupported grading method: " + q.grading.method);
    }
  }

  /** 不正解のとき、既知のよくある誤答に一致すればその理由を返す（なければ null） */
  function matchMistake(q, answer) {
    const list = q.common_mistakes || [];
    for (const m of list) {
      if (q.type === "fill_blank") {
        const b = q.answer.blanks.find((x) => x.id === m.blank);
        if (b && normAnswer(answer[m.blank] || "", b.quote_insensitive) === normAnswer(m.answer, b.quote_insensitive)) return m.reason;
      } else if (q.type === "predict_output") {
        if (normOutput(answer) === normOutput(m.answer)) return m.reason;
      } else if (q.type === "bug_fix") {
        const qi = !!q.answer.quote_insensitive;
        if (normAnswer(answer, qi) === normAnswer(m.answer, qi)) return m.reason;
      }
    }
    return null;
  }

  function isSupported(q) {
    return q.grading.method !== "test_cases";
  }

  return { normOutput, normAnswer, grade, matchMistake, isSupported };
})();

<script>
/* Pyodide を Web Worker で動かし、コード作成問題を test_cases で自動採点する（主スレッド側）。
 * - 初回のみ CDN（jsDelivr, バージョン固定）から Pyodide を読み込む。ネットワークがないと使えない。
 * - テスト1件ごとに新しい名前空間で実行。制限時間を超えたら Worker ごと terminate() して作り直す。 */
const PyRunner = (function () {
  const CDN = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
  const INIT_TIMEOUT_MS = 90000;
  let worker = null;
  let readyP = null;
  let seq = 0;
  const pending = new Map();

  function failAllPending(message) {
    pending.forEach((cb) => cb({ type: "result", res: { ok: false, error: message }, out: "", truncated: false }));
    pending.clear();
  }

  function start() {
    const src = document.getElementById("pyworker").textContent;
    const blobUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    const w = new Worker(blobUrl);
    worker = w;
    readyP = new Promise((resolve, reject) => {
      const timer = setTimeout(() => { w.terminate(); reject(new Error("Python の読み込みがタイムアウトしました")); }, INIT_TIMEOUT_MS);
      w.onmessage = (ev) => {
        const m = ev.data;
        if (m.type === "ready") {
          clearTimeout(timer);
          w.onmessage = (e2) => {
            const r = e2.data;
            if (r.type === "result") { const cb = pending.get(r.id); if (cb) { pending.delete(r.id); cb(r); } }
          };
          resolve({ python: m.python, pyodide: m.pyodide });
        } else if (m.type === "initerror") { clearTimeout(timer); reject(new Error(m.message)); }
      };
      w.onerror = (e) => { clearTimeout(timer); const msg = (e && e.message) || "Worker エラー"; reject(new Error(msg)); failAllPending(msg); };
      w.postMessage({ type: "init", url: CDN });
    });
    readyP.catch(() => { if (worker === w) { worker = null; readyP = null; } });
    return readyP;
  }

  function ready() { return readyP || start(); }

  /** op: "static" | "test"。制限時間超過なら {timeout:true} を返し、Worker を作り直す。 */
  async function run(op, job, timeoutMs) {
    await ready();
    const w = worker;
    const id = ++seq;
    return new Promise((resolve) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        w.terminate();
        if (worker === w) { worker = null; readyP = null; }
        resolve({ timeout: true });
      }, timeoutMs);
      pending.set(id, (m) => { clearTimeout(timer); resolve(m); });
      w.postMessage({ type: "run", id, op, job });
    });
  }

  /** 採点: 静的チェック → 各テスト。onProgress(done, total) は任意。 */
  async function gradeCode(q, student, onProgress) {
    const g = q.grading;
    const limit = (g.timeout_sec || 5) * 1000;
    const sc = await run("static", { student, required: g.required_ast_nodes, any: g.required_any_ast_nodes }, limit);
    if (sc.timeout) return { correct: false, staticMessage: "チェックに時間がかかりすぎました", results: [] };
    if (!sc.res.ok) return { correct: false, staticMessage: sc.res.message, results: [] };
    const results = [];
    for (let i = 0; i < g.tests.length; i++) {
      const t = g.tests[i];
      const r = await run("test", { student, setup: t.setup || "", kind: t.kind, call: t.call || "", expected: t.expected || "" }, limit);
      const row = { t, ok: false, timeout: !!r.timeout, error: null, actual: null, out: "" };
      if (r.timeout) { row.error = "時間切れ（" + g.timeout_sec + "秒）。無限ループになっていないか確認しましょう。"; }
      else {
        row.out = r.out;
        if (r.res.error) row.error = r.res.error;
        else if (t.kind === "stdout") { row.ok = Grader.normOutput(r.out) === Grader.normOutput(t.expected_stdout); row.actual = r.out; }
        else { row.ok = !!r.res.ok; row.actual = r.res.actual; }
        if (r.truncated) row.error = "出力が長すぎます（上限 64KB）";
        if (r.truncated) row.ok = false;
      }
      results.push(row);
      if (onProgress) onProgress(i + 1, g.tests.length);
      if (r.timeout) {
        // 時間切れのたびに Worker の作り直しが必要なので、残りのテストは実行せず不合格として扱う
        for (let k = i + 1; k < g.tests.length; k++) results.push({ t: g.tests[k], ok: false, timeout: false, skipped: true, error: "前のテストが時間切れだったため実行していません", actual: null, out: "" });
        break;
      }
    }
    return { correct: results.every((x) => x.ok), staticMessage: null, results };
  }

  /** 「実行して試す」: 前提コード＋学習者コードを実行し、出力かエラーを返す */
  async function tryRun(q, student) {
    const r = await run("test", { student, setup: q.prefix_code || "", kind: "stdout", call: "", expected: "" }, (q.grading.timeout_sec || 5) * 1000);
    if (r.timeout) return { error: "時間切れ（無限ループの可能性があります）", out: "" };
    return { error: r.res.error || (r.truncated ? "出力が長すぎます（上限 64KB）" : null), out: r.out };
  }

  return { ready, run, gradeCode, tryRun };
})();

if (typeof module !== "undefined") module.exports = PyRunner;
