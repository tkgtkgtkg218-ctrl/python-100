querySelectorAll('.card')).map(function (e) { return Math.round(e.getBoundingClientRect().top); }); return t.length === 3 && t.every(function (v) { return v === t[0]; }); })()"}}]}],"common_mistakes":[{"title":"viewport の meta 要素を書かない","wrong_code":"<head>\n  <meta charset=\"utf-8\">\n  <title>…<\/title>\n<\/head>","why":"スマホでは、PC 向けの広い幅で表示を作って縮小されるため、文字が小さくなります。","fix":"<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"},{"title":"固定の幅で、横にはみ出す","wrong_code":".photo { width: 800px; }","why":"画面が 800px より狭いと、はみ出して、横スクロールになります。","fix":".photo { width: 800px; max-width: 100%; }"},{"title":"メディアクエリのかっこを忘れる","wrong_code":"@media min-width: 600px { … }","why":"条件は、かっこで囲む必要があります。かっこがないと、無効になって無視されます。","fix":"@media (min-width: 600px) { … }"},{"title":"min-width と max-width の取り違え","wrong_code":"@media (min-width: 600px) { …スマホ向け… }","why":"min-width は「その幅以上」です。狭い画面向けに使うなら、max-width（以下）です。","fix":"@media (max-width: 600px) { … }"}],"checkpoints":["viewport の meta 要素で、画面の幅に合わせる","固定の幅ではなく、max-width や % で柔軟に","メディアクエリは @media (min-width: 〇〇px) のようにかっこ付き","min-width は以上、max-width は以下","モバイルファースト: 基本は狭い画面向け、広い画面は min-width で追加","Flexbox（flex-direction・flex-wrap）と組み合わせる"],"next_bridge":"最後のステージです。メディアクエリや max-width を読み解く問題と、ページを1から作る問題があります。ここまで学んだことを、総動員しましょう。"}]},"questions":{"course_id":"htmlcss-basics-ja","schema_version":"1.1.0","question_count":100,"questions":[{"id":"HC-001","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":1,"title":"HTMLの役割","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["HTMLの役割","マークアップ言語"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"HTML の説明として、正しいものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"ページの色や余白など、見た目を指定するスタイルシート言語である"},{"id":"c2","text":"計算や条件分岐を書いて、ページに動きを付けるプログラミング言語である"},{"id":"c3","text":"文章の構造や意味を、タグで示すマークアップ言語である"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"HTML は、タグで文章の構造と意味を表すマークアップ言語だから。","explanation":"Webページは、HTML（構造と意味）、CSS（見た目）、JavaScript（動き）の3つで作ります。それぞれの役割が違うので、「HTML でデザインを変える」「HTML で計算する」とは言いません。","wrong_answer_reasons":{"c1":"それは CSS の説明です。HTML は見た目ではなく、「どこが見出しで、どこが段落か」といった構造と意味を表します。","c2":"それは JavaScript の説明です。HTML には計算や条件分岐の仕組みはなく、プログラミング言語とは区別されます。"},"hint":"HTML の M は Markup（目印を付ける）の M です。","feedback_correct":"正解！HTML は構造と意味を表すマークアップ言語です。","feedback_incorrect":"惜しい！見た目は CSS、動きは JavaScript の担当です。"},{"id":"HC-002","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":2,"title":"終了タグ","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["要素","終了タグ"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の p 要素で、<\/p> の部分は何と呼びますか？","code":"<p>こんにちは<\/p>","choice_format":"text","choices":[{"id":"c1","text":"開始タグ"},{"id":"c2","text":"属性"},{"id":"c3","text":"終了タグ"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"内容のあとに書き、/ が付いたタグが終了タグだから。","explanation":"p 要素は、開始タグ <p>、内容「こんにちは」、終了タグ <\/p> でできています。「開始タグ」「内容」「終了タグ」をまとめたものが要素です。","wrong_answer_reasons":{"c1":"開始タグは、内容の前にある <p> の部分です。<\/p> のように / が付くのは終了タグです。","c2":"属性は、開始タグの中に 名前=\"値\" の形で書く追加情報です。ここには属性は書かれていません。"},"hint":"/ が付いているのは、開始・終了のどちらでしょう？","feedback_correct":"正解！<\/p> は終了タグです。","feedback_incorrect":"惜しい！内容のあとの、/ が付いたタグを何と呼ぶか思い出しましょう。"},{"id":"HC-003","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":3,"title":"タブに表示される文字","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["title要素","head"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML をブラウザで開いたとき、ブラウザのタブ（ページのタイトル）に表示される文字列はどれですか？","code":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>ぼくのページ<\/title>\n<\/head>\n<body>\n  <h1>ようこそ<\/h1>\n<\/body>\n<\/html>","choice_format":"code","choices":[{"id":"c1","text":"ぼくのページ"},{"id":"c2","text":"ようこそ"},{"id":"c3","text":"ja"}],"check":{"format":"html_document","probe":"document.title","choice_values":{"c2":"ようこそ","c1":"ぼくのページ","c3":"ja"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"タブに表示されるのは head の中の title 要素の内容だから。","explanation":"title 要素は、ブラウザのタブ、ブックマーク、検索結果に表示されます。body の中の h1 とは別物なので、両方を適切に書きます。","wrong_answer_reasons":{"c2":"「ようこそ」は body の中の h1 要素で、ページの本文の見出しです。タブに出るのは title 要素の内容です。","c3":"ja は html 要素の lang 属性の値で、文書の言語を示すだけです。画面にもタブにも表示されません。"},"hint":"タブに出る文字は、head と body のどちらに書かれていますか？","feedback_correct":"正解！タブには title 要素の内容が表示されます。","feedback_incorrect":"惜しい！title 要素の内容を探しましょう。"},{"id":"HC-004","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":4,"title":"文字コードの指定","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["meta charset","属性"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"文字コードを UTF-8 と指定する meta 要素です。【空欄1】に入れるものを答えてください（半角で入力）。","code":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"__1__\">\n  <title>テスト<\/title>\n<\/head>\n<body>\n  <p>こんにちは<\/p>\n<\/body>\n<\/html>","check":{"format":"html_document","expr":"document.querySelector('meta[charset]') !== null && document.querySelector('meta[charset]').getAttribute('charset').toLowerCase() === 'utf-8'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["UTF-8","utf-8"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"現在のWebの標準の文字コードは UTF-8 で、charset 属性にその名前を書くから。","explanation":"meta 要素の charset 属性で、HTML ファイルの文字コードをブラウザに伝えます。指定がファイルの実際の文字コードと違うと、文字化けの原因になります。UTF-8 は大文字・小文字どちらで書いても構いません。","common_mistakes":[{"blank":"b1","answer":"Shift_JIS","reason":"文字コードは、現在のWebでは UTF-8 を指定するのが標準です。ファイル自体も UTF-8 で保存します。"}],"hint":"現在のWebで標準的に使われる文字コードの名前です。","feedback_correct":"正解！charset=\"utf-8\" と指定します。","feedback_incorrect":"惜しい！UTF-8 と入力してみましょう。"},{"id":"HC-005","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":5,"title":"doctype がない文書","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["文書型宣言","標準モード"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML は、ブラウザが古い互換モードで表示してしまいます。標準モードで表示されるようにする直し方はどれですか？","code":"<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>テスト<\/title>\n<\/head>\n<body>\n  <p>こんにちは<\/p>\n<\/body>\n<\/html>","choice_format":"text","choices":[{"id":"c1","text":"文書の1行目に <!doctype html> を書く"},{"id":"c2","text":"head の中に <!doctype html> を書く"},{"id":"c3","text":"html の後ろに <!-- html5 --> というコメントを書く"}],"check":{"format":"html_document","expr":"document.compatMode === 'CSS1Compat'"},"answer":{"correct_choice_id":"c1","fixed_code":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>テスト<\/title>\n<\/head>\n<body>\n  <p>こんにちは<\/p>\n<\/body>\n<\/html>"},"grading":{"method":"choice_id"},"rationale":"<!doctype html> を文書の先頭に書くと、ブラウザが標準モードで表示するから。","explanation":"doctype がないと、ブラウザは古いページとの互換のために「互換モード」で表示し、余白や大きさの計算が標準とずれることがあります。必ず1行目に <!doctype html> を書きます。","wrong_answer_reasons":{"c2":"文書型宣言は文書の一番最初に書くものです。head の中に書いても有効にならず、互換モードのままです。","c3":"コメントは表示されないメモで、文書型宣言の代わりにはなりません。"},"hint":"文書型宣言は、文書のどこに書くものでしたか？","feedback_correct":"正解！<!doctype html> を1行目に書きます。","feedback_incorrect":"惜しい！文書型宣言は一番先頭に書きます。"},{"id":"HC-006","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":6,"title":"閉じ忘れた見出し","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["終了タグ","入れ子"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"p 要素が h1 要素の中に入ってしまっています。1行目を正しく書き直して入力してください（1行目の内容だけを入力）。","code":"<h1>見出し\n<p>本文<\/p>","check":{"format":"html_body","expr":"document.querySelector('p').parentElement.tagName === 'BODY'"},"answer":{"target_line":1,"accepted":["<h1>見出し<\/h1>"],"quote_insensitive":false,"fixed_code":"<h1>見出し<\/h1>\n<p>本文<\/p>"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"h1 の終了タグ <\/h1> を書いて、見出しを閉じる必要があるから。","explanation":"終了タグを忘れると、ブラウザはどこで終わるか推測するため、p 要素が h1 の内側に入ってしまいます。本文が見出しの一部になってしまうので、要素は必ず閉じます。","common_mistakes":[{"answer":"<h1>見出し<h1>","reason":"終了タグには / が必要です。/ がないと、もう1つ h1 を開始したことになってしまいます。"}],"hint":"見出しの内容のあとに、何を書けば要素が閉じますか？","feedback_correct":"正解！終了タグで h1 を閉じました。","feedback_incorrect":"惜しい！開始タグ <h1> に対応する終了タグを書きましょう。"},{"id":"HC-007","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":7,"title":"属性名と属性値","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["属性","lang"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の html 要素の開始タグで、lang=\"ja\" の部分を何と呼びますか？","code":"<html lang=\"ja\">","choice_format":"text","choices":[{"id":"c1","text":"要素"},{"id":"c2","text":"終了タグ"},{"id":"c3","text":"属性"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"開始タグの中に 名前=\"値\" の形で書く追加情報は、属性と呼ぶから。","explanation":"lang が属性名、\"ja\" が属性値です。この属性は、文書が日本語で書かれていることを示し、読み上げソフトや翻訳機能が利用します。","wrong_answer_reasons":{"c1":"要素は、開始タグ・内容・終了タグ全体のまとまりです。lang=\"ja\" はその開始タグの中の一部です。","c2":"終了タグは <\/html> のように / が付くタグです。lang=\"ja\" は開始タグの中に書く追加情報です。"},"hint":"名前=\"値\" の形で、開始タグの中に書かれています。","feedback_correct":"正解！lang=\"ja\" は属性です。","feedback_incorrect":"惜しい！開始タグの中の 名前=\"値\" は何と呼ぶでしょう？"},{"id":"HC-008","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":8,"title":"コメントの中の要素","type":"predict_output","answer_mode":"text","difficulty":1,"concepts":["コメント"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML をブラウザで表示したとき、画面に表示される p 要素（段落）はいくつですか？数字で入力してください。","code":"<p>A<\/p>\n<!-- <p>B<\/p> -->\n<p>C<\/p>","check":{"format":"html_body","probe":"document.querySelectorAll('p').length","expected":2},"answer":{"expected_output":"2"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"コメントの中の B は表示されず、A と C の2つだけが表示されるから。","explanation":"<!-- ... --> の内側は、ブラウザに無視されます。一時的にある部分を非表示にしたいとき、その部分をコメントにする使い方がよくあります。","common_mistakes":[{"answer":"3","reason":"<!-- と --> で囲んだ部分はコメントです。コメントの中の <p>B<\/p> は、要素としても扱われず、表示されません。"},{"answer":"1","reason":"コメントになっているのは B だけです。A と C の p 要素は表示されます。"}],"hint":"<!-- と --> で囲まれた部分はどう扱われるでしょう。","feedback_correct":"正解！コメントの中は表示されません。","feedback_incorrect":"惜しい！コメントになっている部分を除いて数えましょう。"},{"id":"HC-009","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":9,"title":"空白と改行の表示","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["空白の扱い","br"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML は、ソースの中で空白を多く入れ、途中で改行しています。ブラウザの表示では、この空白と改行はどう扱われますか？","code":"<p>こんにちは     世界\n   です<\/p>","choice_format":"code","choices":[{"id":"c1","text":"ソースに書いたとおり、空白や改行がそのまま表示される"},{"id":"c2","text":"空白と改行がすべて取り除かれ、文字がつながって表示される"},{"id":"c3","text":"連続する空白や改行は、1つの空白にまとめて表示される"}],"check":{"format":"html_body","probe":"(function(){var t=document.querySelector('p').innerText; return /\\s{2,}|\\n/.test(t) ? 'preserved' : 'collapsed';})()","choice_values":{"c1":"preserved","c3":"collapsed","c2":"joined"}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"HTML では、連続する空白や改行は1つの空白としてまとめて表示されるから。","explanation":"ソースの見やすさのために改行や字下げを使っても、表示には影響しません。逆に、表示で改行したいときは、ソースを改行するだけでは足りず、<br> や段落の要素を使います。","wrong_answer_reasons":{"c1":"HTML では、連続する空白や改行は、そのままは表示されません。改行したい場所には <br> や p 要素を使います。","c2":"取り除かれるのではなく、1つの空白に置き換わります。そのため、「世界」と「です」の間にも空白が1つ入ります。"},"hint":"ソースを改行しても、画面で改行されるとは限りません。","feedback_correct":"正解！連続する空白や改行は1つの空白になります。","feedback_incorrect":"惜しい！HTML は連続した空白をまとめて表示します。"},{"id":"HC-010","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S01","stage_number":1,"number_in_stage":10,"title":"最小のHTML文書を書く","type":"code_write","answer_mode":"code","difficulty":2,"concepts":["HTML文書の骨組み","doctype","head","body"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の条件を満たす HTML 文書を書いてください。\n・1行目に文書型宣言\n・html 要素に lang=\"ja\"\n・head の中に、文字コード UTF-8 の meta と、タイトル「マイページ」の title\n・body の中に、内容が「ようこそ」の見出し（h1）","code":null,"starter_code":"<!-- ここに書きましょう -->\n","answer_format":"html_document","answer":{"reference_solution":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>マイページ<\/title>\n<\/head>\n<body>\n  <h1>ようこそ<\/h1>\n<\/body>\n<\/html>","alternative_solutions":["<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<title>マイページ<\/title>\n<meta charset=\"UTF-8\">\n<\/head>\n<body><h1>ようこそ<\/h1><\/body>\n<\/html>"],"rejected_examples":[{"code":"<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>マイページ<\/title>\n<\/head>\n<body>\n  <h1>ようこそ<\/h1>\n<\/body>\n<\/html>","reason":"文書型宣言 <!doctype html> がありません。1行目に書きます。"},{"code":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>ようこそ<\/title>\n<\/head>\n<body>\n  <h1>マイページ<\/h1>\n<\/body>\n<\/html>","reason":"title と h1 の内容が入れ替わっています。title は「マイページ」、h1 は「ようこそ」です。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"文書型宣言があり、標準モードで表示される","expr":"document.compatMode === 'CSS1Compat'","visible":true},{"kind":"page","desc":"html 要素の lang が ja","expr":"document.documentElement.lang === 'ja'","visible":true},{"kind":"page","desc":"meta で文字コードが UTF-8","expr":"(function(){var m=document.querySelector('head > meta[charset]'); return !!m && m.getAttribute('charset').toLowerCase()==='utf-8';})()","visible":true},{"kind":"page","desc":"title が「マイページ」","expr":"document.title === 'マイページ'","visible":true},{"kind":"page","desc":"body に h1「ようこそ」がある","expr":"(function(){var h=document.querySelector('body > h1'); return !!h && h.textContent.trim()==='ようこそ';})()","visible":true}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"doctype・lang・meta charset・title・h1 の5つがそろった骨組みを書くから。","explanation":"どのHTMLファイルも、この骨組みから始めます。head には画面に表示されない情報（文字コードとタイトル）、body には表示する内容（h1）を書きます。タグの大文字・小文字は区別されませんが、小文字で書くのが一般的です。","hint":"doctype → html（lang）→ head（meta, title）→ body（h1）の順に書きます。","feedback_correct":"正解！HTML文書の骨組みが書けました。","feedback_incorrect":"惜しい！5つの条件を1つずつ見直しましょう。"},{"id":"HC-011","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":1,"title":"見出しを使う理由","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["見出し","セマンティクス"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"Webページで h1〜h6 の見出し要素を使う理由として、最も適切なものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"文字を大きく、太く表示するため"},{"id":"c2","text":"文章の構造（どこが題名で、どこが節か）を表すため"},{"id":"c3","text":"ページのタイトルをブラウザのタブに表示するため"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"見出しは、文章の階層構造を表すための要素で、見た目はCSSで決めるから。","explanation":"見出しの階層は、検索エンジンや読み上げソフトが、ページの構造をつかむ手がかりにもなります。見た目のために選ぶのではなく、意味で選びます。","wrong_answer_reasons":{"c1":"見出しの文字がブラウザで大きく表示されるのは標準の見た目にすぎません。文字の大きさは CSS で自由に変えられます。見出しは構造を表すために使います。","c3":"タブに表示されるのは head の中の title 要素です。見出しは、本文の中の構造を表す要素です。"},"hint":"見た目は CSS が担当でした。HTML は何を表すのでしょう？","feedback_correct":"正解！見出しは構造を表す要素です。","feedback_incorrect":"惜しい！見た目ではなく、意味・構造のために使います。"},{"id":"HC-012","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":2,"title":"ブロックとインラインの並び","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["ブロック要素","インライン要素"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML をブラウザで表示したとき、同じ行に横に並ぶのはどれですか？","code":"<span>りんご<\/span><span>みかん<\/span>\n<div>ぶどう<\/div><div>もも<\/div>","choice_format":"code","choices":[{"id":"c1","text":"div 要素の2つ（ぶどうともも）"},{"id":"c2","text":"span 要素の2つ（りんごとみかん）"},{"id":"c3","text":"どの要素も、別々の行になる"}],"check":{"format":"html_body","probe":"(function () { var s = document.querySelectorAll('span'), d = document.querySelectorAll('div'); var sp = s[0].getBoundingClientRect().top === s[1].getBoundingClientRect().top; var dv = d[0].getBoundingClientRect().top === d[1].getBoundingClientRect().top; return sp && !dv ? 'span' : (dv && !sp ? 'div' : 'other'); })()","choice_values":{"c1":"div","c2":"span","c3":"other"}},"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"span はインライン要素なので横に並び、div はブロックレベル要素なので縦に並ぶから。","explanation":"p や div などのブロックレベル要素は、前後で改行されます。span や strong などのインライン要素は、文章の流れの中に並びます。この区別は、あとで CSS でレイアウトを組むときの土台になります。","wrong_answer_reasons":{"c1":"div はブロックレベル要素なので、前後で改行され、1つずつ別の行に並びます。","c3":"span はインライン要素なので、改行されず、文章の流れの中で横に並びます。"},"hint":"span と div は、それぞれブロックとインラインのどちらでしょう？","feedback_correct":"正解！span はインライン、div はブロックです。","feedback_incorrect":"惜しい！ブロックとインラインの表示の違いを思い出しましょう。"},{"id":"HC-013","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":3,"title":"< を文字として表示する","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["文字参照"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML をブラウザで表示したとき、p 要素の中に表示される文字を、そのまま入力してください。","code":"<p>&lt;p&gt;は段落を表します<\/p>","check":{"format":"html_body","probe":"document.querySelector('p').textContent","expected":"<p>は段落を表します"},"answer":{"expected_output":"<p>は段落を表します"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"&lt; は < を、&gt; は > を表す文字参照で、ブラウザが記号に置き換えて表示するから。","explanation":"HTML の中で < や > をそのまま書くと、タグの始まり・終わりと誤解されます。文字として表示したいときは、&lt; &gt; と書きます。& 自体は &amp; です。","common_mistakes":[{"answer":"&lt;p&gt;は段落を表します","reason":"&lt; と &gt; は文字参照です。ブラウザが < と > に置き換えて表示するので、& や ; は表示されません。"},{"answer":"は段落を表します","reason":"&lt;p&gt; は、タグではなく、「<p>」という文字として表示されます。"}],"hint":"&lt; が何を表しているか思い出しましょう。","feedback_correct":"正解！文字参照は記号に置き換えて表示されます。","feedback_incorrect":"惜しい！&lt; と &gt; が何に置き換わるか確認しましょう。"},{"id":"HC-014","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":4,"title":"重要な部分を表す要素","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["strong","セマンティクス"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"文章の中の「重要」という語を、「重要である」という意味を持つ要素で囲みます。【空欄1】【空欄2】に入れる要素名を答えてください（開始タグと終了タグで同じ名前です）。","code":"<p>これは<__1__>重要<\/__2__>なお知らせです。<\/p>","check":{"format":"html_body","expr":"document.querySelector('p > strong') !== null && document.querySelector('p > strong').textContent === '重要'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["strong"],"quote_insensitive":false},{"id":"b2","marker":"__2__","accepted":["strong"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"「重要である」という意味を表す要素は strong だから。","explanation":"strong は重要性、em は強調を表します。b と i は意味を持たず、見た目だけの指定ですが、見た目は CSS で指定するのが基本なので、まず strong と em を選びます。","common_mistakes":[{"blank":"b1","answer":"b","reason":"b は見た目だけ太字にする要素で、「重要」という意味は持ちません。重要性を表したいときは strong を使います。"}],"hint":"「強い」「重要な」を意味する英単語です。","feedback_correct":"正解！strong は重要性を表します。","feedback_incorrect":"惜しい！重要性を表す要素名を思い出しましょう。"},{"id":"HC-015","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":5,"title":"p の中に見出しを入れた","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["ブロック要素","p","入れ子"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"見出し（h2）を段落の中に入れたつもりが、意図と違う構造になっています。どう直すのが適切ですか？","code":"<p>はじめに<h2>見出し<\/h2><\/p>","choice_format":"text","choices":[{"id":"c1","text":"h2 を strong に変える"},{"id":"c2","text":"p を先に閉じて、p と h2 を並べて書く"},{"id":"c3","text":"<\/p> を <\/h2> に書き換える"}],"check":{"format":"html_body","expr":"document.querySelector('h2').parentElement.tagName === 'BODY' && document.querySelectorAll('p').length === 1"},"answer":{"correct_choice_id":"c2","fixed_code":"<p>はじめに<\/p>\n<h2>見出し<\/h2>"},"grading":{"method":"choice_id"},"rationale":"p の中にはブロック要素の h2 を入れられないので、p を閉じてから h2 を並べる必要があるから。","explanation":"h2 の開始タグが現れた時点で、ブラウザは p を自動的に閉じます。その結果、あとの <\/p> は対応する開始タグのない余計なタグとなり、空の p 要素が作られてしまいます。","wrong_answer_reasons":{"c1":"strong はインライン要素なので p の中に入れられますが、見出しではなくなってしまいます。構造が変わるので、直し方としては不適切です。","c3":"h2 はすでに閉じています。閉じ忘れはなく、p が自動で閉じられることが問題なので、並べて書くことが必要です。"},"hint":"p の中に入れられるのは、インライン要素の方でした。","feedback_correct":"正解！p と見出しを並べて書きます。","feedback_incorrect":"惜しい！p の中には見出しを入れられません。"},{"id":"HC-016","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":6,"title":"段落を分ける正しい方法","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["p","br","役割の分担"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"2つの段落の間を空けて、文章を読みやすく表示したい。HTML の書き方として最も適切なものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"段落の間に br を何個も並べる"},{"id":"c2","text":"全角の空白を何個も並べて空ける"},{"id":"c3","text":"段落ごとに p 要素で分け、間隔は CSS で調整する"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"文章のまとまりは p 要素で表し、見た目の間隔は CSS が担当するから。","explanation":"HTML は構造、CSS は見た目、と役割を分けます。段落の間隔は、CSS の margin などで調整します（ステージ8で学びます）。","wrong_answer_reasons":{"c1":"br は、段落の中での改行のための要素です。段落の構造を表せず、読み上げソフトなどにも正しく伝わりません。間隔は CSS で調整します。","c2":"空白の数で見た目を調整する方法は、画面幅や文字の大きさで崩れやすく、構造も表せません。"},"hint":"HTML が担当するのは構造、CSS が担当するのは見た目でした。","feedback_correct":"正解！構造は p、間隔は CSS です。","feedback_incorrect":"惜しい！段落は p 要素で表します。"},{"id":"HC-017","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":7,"title":"br の終了タグ","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["br","空要素"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"2行に分けて表示するつもりが、改行が余分に入ってしまいます。正しく書き直して入力してください（1行目の内容をすべて入力）。","code":"<p>1行目<br>2行目<\/br><\/p>","check":{"format":"html_body","expr":"document.querySelectorAll('br').length === 1"},"answer":{"target_line":1,"accepted":["<p>1行目<br>2行目<\/p>","<p>1行目<br/>2行目<\/p>","<p>1行目<br />2行目<\/p>"],"quote_insensitive":false,"fixed_code":"<p>1行目<br>2行目<\/p>"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"br は空要素で終了タグを書かないため、<\/br> を取り除く必要があるから。","explanation":"<\/br> という終了タグは存在しません。ブラウザは、これを開始タグ <br> とみなして、改行をもう1つ追加します。空要素は、<br> または <br /> のように書きます。","common_mistakes":[{"answer":"<p>1行目<br>2行目<\/br><\/p>","reason":"元のコードのままです。br は空要素なので終了タグがありません。<\/br> は、ブラウザには <br> として扱われ、余分な改行が入ります。"}],"hint":"br は、内容を持たない要素です。終了タグは必要でしょうか？","feedback_correct":"正解！br に終了タグは書きません。","feedback_incorrect":"惜しい！空要素の書き方を確認しましょう。"},{"id":"HC-018","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":8,"title":"見出しの階層","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["見出しの階層"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"ページの見出しを、h1 の次にいきなり h3 を使って書いた。この書き方について、適切なものはどれですか？","code":"<h1>旅の記録<\/h1>\n<h3>1日目<\/h3>","choice_format":"text","choices":[{"id":"c1","text":"階層が飛んでおり、構造が分かりにくくなる。h2 を使うのが適切"},{"id":"c2","text":"問題ない。h3 のほうが小さい文字で見やすいから"},{"id":"c3","text":"エラーになり、ページが表示されなくなる"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"h1 の下の階層は h2 なので、階層を飛ばすと、文章の構造が正しく伝わらなくなるから。","explanation":"見出しは、章 → 節 → 小節のように入れ子になった構造を表します。h1 → h2 → h3 の順に使い、見た目を変えたいときは CSS を使います。","wrong_answer_reasons":{"c2":"文字の大きさは CSS で決められます。見出しの数字は、階層（構造）を表すものなので、見た目で選ぶのは適切ではありません。","c3":"HTML は、書き方が不適切でも、ブラウザが表示しようとします。エラーにはなりませんが、構造として好ましくありません。"},"hint":"見出しの数字は、何を表しているでしょう？","feedback_correct":"正解！見出しの階層を飛ばしません。","feedback_incorrect":"惜しい！見出しの数字は階層を表します。"},{"id":"HC-019","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":9,"title":"最も大きい見出しはどれか","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["見出し","ブラウザの標準スタイル"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML をブラウザの標準の表示で見たとき、文字が最も大きく表示される見出しはどれですか？","code":"<h3>C<\/h3>\n<h1>A<\/h1>\n<h2>B<\/h2>","choice_format":"code","choices":[{"id":"c1","text":"h3（C）"},{"id":"c2","text":"h2（B）"},{"id":"c3","text":"h1（A）"}],"check":{"format":"html_body","probe":"(function () { var hs = ['h1', 'h2', 'h3'].map(function (t) { return parseFloat(getComputedStyle(document.querySelector(t)).fontSize); }); return ['h1', 'h2', 'h3'][hs.indexOf(Math.max.apply(null, hs))]; })()","choice_values":{"c1":"h3","c3":"h1","c2":"h2"}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"標準の表示では、h1 が最も大きく、h6 に向かって小さくなるから。","explanation":"ブラウザの標準のスタイルでは、h1 が最も大きく、h6 が最も小さく表示されます。ただし、これは見た目の標準にすぎず、CSS で変更できます。","wrong_answer_reasons":{"c1":"書かれた順ではなく、番号で大きさが決まります。標準の表示では、数字が小さいほど大きく表示されます。","c2":"h2 は h1 の次に大きく、最も大きいのは h1 です。"},"hint":"書かれている順番ではなく、見出しの数字に注目しましょう。","feedback_correct":"正解！標準では h1 が最も大きく表示されます。","feedback_incorrect":"惜しい！見出しの数字と大きさの関係を確認しましょう。"},{"id":"HC-020","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S02","stage_number":2,"number_in_stage":10,"title":"見出しと段落でページを書く","type":"code_write","answer_mode":"code","difficulty":2,"concepts":["見出し","p","strong","文書の構造"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の内容を、適切な要素で書いてください（body の中身だけを書きます）。\n・見出し1「旅の記録」\n・段落「京都に行きました。」\n・見出し2「1日目」\n・段落「清水寺で夕日を見ました。」（「夕日」だけを strong で囲む）\n・見出し2「2日目」\n・段落「奈良で鹿に会いました。」","code":null,"starter_code":"<!-- ここに書きましょう -->\n","answer_format":"html_body","answer":{"reference_solution":"<h1>旅の記録<\/h1>\n<p>京都に行きました。<\/p>\n<h2>1日目<\/h2>\n<p>清水寺で<strong>夕日<\/strong>を見ました。<\/p>\n<h2>2日目<\/h2>\n<p>奈良で鹿に会いました。<\/p>","alternative_solutions":["<h1>旅の記録<\/h1><p>京都に行きました。<\/p><h2>1日目<\/h2><p>清水寺で<strong>夕日<\/strong>を見ました。<\/p><h2>2日目<\/h2><p>奈良で鹿に会いました。<\/p>"],"rejected_examples":[{"code":"<h1>旅の記録<\/h1>\n<p>京都に行きました。<\/p>\n<h2>1日目<\/h2>\n<p>清水寺で夕日を見ました。<\/p>\n<h2>2日目<\/h2>\n<p>奈良で鹿に会いました。<\/p>","reason":"「夕日」が strong で囲まれていません。重要な語を strong で囲みます。"},{"code":"<h1>旅の記録<\/h1>\n京都に行きました。<br><br>\n<h2>1日目<\/h2>\n清水寺で<strong>夕日<\/strong>を見ました。<br><br>\n<h2>2日目<\/h2>\n奈良で鹿に会いました。","reason":"段落を p 要素で書いていません。文章のまとまりは p で表し、br で間を空けないようにします。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"body の直下の要素の並びが、h1・p・h2・p・h2・p になっている","expr":"Array.from(document.body.children).map(function (e) { return e.tagName; }).join(',') === 'H1,P,H2,P,H2,P'","visible":true},{"kind":"page","desc":"見出しの文字が正しい（h1「旅の記録」、h2「1日目」「2日目」）","expr":"document.querySelector('h1').textContent.trim() === '旅の記録' && Array.from(document.querySelectorAll('h2')).map(function (h) { return h.textContent.trim(); }).join('|') === '1日目|2日目'","visible":true},{"kind":"page","desc":"2つ目の段落に、strong で囲んだ「夕日」がある","expr":"(function () { var s = document.querySelectorAll('p > strong'); return s.length === 1 && s[0].textContent === '夕日' && s[0].parentElement.textContent.indexOf('清水寺') >= 0; })()","visible":true},{"kind":"page","desc":"段落の文章が正しい","expr":"Array.from(document.querySelectorAll('p')).map(function (p) { return p.textContent.trim(); }).join('|') === '京都に行きました。|清水寺で夕日を見ました。|奈良で鹿に会いました。'","visible":false},{"kind":"page","desc":"br を使わずに段落を分けている","expr":"document.querySelectorAll('br').length === 0","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"見出しと段落を意味に合わせて使い分け、重要な語を strong で囲むから。","explanation":"h1 → h2 → h2 の階層で見出しを書き、文章のまとまりを p で書きます。strong は、強調したい語だけを囲みます（p の中のインライン要素）。段落の間を br で空けないことも大切です。","hint":"h1、p、h2、p、h2、p の順に並べます。strong は p の中に入れます。","feedback_correct":"正解！文章の構造を要素で表せました。","feedback_incorrect":"惜しい！要素の並びと、strong の位置を確認しましょう。"},{"id":"HC-021","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":1,"title":"href の役割","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["a要素","href"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"a 要素の href 属性は、何を指定するものですか？","code":"<a href=\"https://example.com/\">サンプル<\/a>","choice_format":"text","choices":[{"id":"c1","text":"リンクをクリックしたときに移動する先（リンク先）"},{"id":"c2","text":"画面に表示されるリンクの文字"},{"id":"c3","text":"リンクの文字の色"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"href は、リンク先のアドレスを指定する属性だから。","explanation":"a 要素は、内容（表示される文字）と、href 属性（リンク先）でできています。href がない a 要素は、リンクとして働きません。","wrong_answer_reasons":{"c2":"画面に表示される文字は、a 要素の内容（開始タグと終了タグの間）です。href は、移動先を指定する属性です。","c3":"文字の色は CSS で指定します。href は、リンク先の指定です。"},"hint":"Hypertext REFerence（参照先）の略です。","feedback_correct":"正解！href はリンク先を指定します。","feedback_incorrect":"惜しい！href が何を指定するか確認しましょう。"},{"id":"HC-022","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":2,"title":"相対パスの書き方","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["相対パス","img"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次のフォルダ構成で、index.html から images フォルダの cat.png を表示する img 要素の src は、どれが正しいですか？\n\nsite/\n├ index.html\n└ images/\n   └ cat.png","code":null,"choice_format":"code","choices":[{"id":"c1","text":"<img src=\"images/cat.png\" alt=\"ねこ\">"},{"id":"c2","text":"<img src=\"../images/cat.png\" alt=\"ねこ\">"},{"id":"c3","text":"<img src=\"/images/cat.png\" alt=\"ねこ\">"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"index.html と同じ階層にある images フォルダの中を、そのまま images/cat.png と書けるから。","explanation":"相対パスは、いま書いている HTML ファイルの場所が基準です。同じフォルダなら cat.png、1つ下なら images/cat.png、1つ上なら ../cat.png のように書きます。","wrong_answer_reasons":{"c2":"../ は「1つ上のフォルダ」を指します。index.html は site フォルダにあり、そこから見て images は同じ階層にあるので、../ は不要です。","c3":"先頭の / は、サイトの一番上（ルート）を基準にした書き方です。site フォルダがサイトの最上位でない場合は、別の場所を指してしまいます。相対パスで書くのが確実です。"},"hint":"index.html から見て、images フォルダはどこにありますか？","feedback_correct":"正解！同じ階層なら、フォルダ名から書き始めます。","feedback_incorrect":"惜しい！index.html から見た位置を確認しましょう。"},{"id":"HC-023","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":3,"title":"../ で指すリンク先","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["相対パス","../"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML で、base 要素は、このページのアドレスが https://example.com/blog/post1.html であることを表しています（相対パスの基準を示す要素です）。リンク「概要」をクリックすると、どのアドレスへ移動しますか？","code":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\">\n  <base href=\"https://example.com/blog/post1.html\">\n  <title>記事<\/title>\n<\/head>\n<body>\n  <a href=\"../about.html\">概要<\/a>\n<\/body>\n<\/html>","choice_format":"code","choices":[{"id":"c1","text":"https://example.com/blog/about.html"},{"id":"c2","text":"https://example.com/blog/post1.html/about.html"},{"id":"c3","text":"https://example.com/about.html"}],"check":{"format":"html_document","probe":"document.querySelector('a').href","choice_values":{"c1":"https://example.com/blog/about.html","c3":"https://example.com/about.html","c2":"https://example.com/blog/post1.html/about.html"}},"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"基準は blog フォルダで、../ はその1つ上（example.com の最上位）なので、そこの about.html を指すから。","explanation":"ファイルの場所（フォルダ）から、../ で1つ上へ戻り、about.html を探します。ページの URL が https://example.com/blog/post1.html なら、基準になるのは blog フォルダです。","wrong_answer_reasons":{"c1":"../ は、1つ上のフォルダを指します。blog フォルダの1つ上は example.com の最上位なので、blog の中の about.html ではありません。","c2":"post1.html はファイルで、フォルダではありません。相対パスは、ファイルがあるフォルダ（blog）が基準です。"},"hint":"相対パスの基準は、ファイル名の前の「フォルダ」です。","feedback_correct":"正解！../ は1つ上のフォルダです。","feedback_incorrect":"惜しい！基準のフォルダから、1つ上へ戻って考えましょう。"},{"id":"HC-024","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":4,"title":"画像の代替テキスト","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["alt"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"画像に「窓辺で寝ているねこ」という代替テキストを付けます。【空欄1】に入れる属性名を答えてください。","code":"<img src=\"cat.jpg\" __1__=\"窓辺で寝ているねこ\">","check":{"format":"html_body","expr":"document.querySelector('img').getAttribute('alt') === '窓辺で寝ているねこ'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["alt"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"img の代替テキストを指定する属性は alt だから。","explanation":"alt は alternative（代わりの）の略です。画像が読み込めなかったときに表示される文字や、読み上げソフトが読む文字として使われます。","common_mistakes":[{"blank":"b1","answer":"title","reason":"title は、マウスを乗せたときに出る補足ですが、画像の代替テキストではありません。画像が表示できないときや、読み上げでは alt が使われます。"}],"hint":"alternative（代わりの）の略です。","feedback_correct":"正解！alt は代替テキストです。","feedback_incorrect":"惜しい！画像の代わりになる文字を指定する属性です。"},{"id":"HC-025","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":5,"title":"alt の役割","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["alt","アクセシビリティ"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"img 要素の alt 属性の説明として、最も適切なものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"画像が表示できないときや、読み上げソフトで読み上げられる、代替テキスト"},{"id":"c2","text":"画像の上にマウスを置いたときに出る、吹き出しの文字"},{"id":"c3","text":"画像のファイル名を、画面に表示するための文字"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"alt は、画像を見られない場合に、画像の代わりに内容を伝える文字だから。","explanation":"画像が読み込めない、画像が見えない、読み上げを使っている、などの場合に、alt が画像の代わりになります。検索エンジンも、画像の内容を知る手がかりにします。","wrong_answer_reasons":{"c2":"マウスを置いたときに出る文字は、title 属性で指定するものです。alt は、画像の代わりとなる文字です。","c3":"alt は、ファイル名ではなく、画像の内容を言葉で説明するための文字です。"},"hint":"alternative は「代わりの」という意味です。","feedback_correct":"正解！alt は代替テキストです。","feedback_incorrect":"惜しい！alt は、画像の代わりに内容を伝える文字です。"},{"id":"HC-026","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":6,"title":"新しいタブで開くリンクの安全性","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["target","rel","セキュリティ"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"外部サイトを新しいタブで開くリンクです。安全のために、rel 属性を付けたいとき、正しく書いたものはどれですか？","code":"<a href=\"https://example.com/\" target=\"_blank\">外部サイト<\/a>","choice_format":"code","choices":[{"id":"c1","text":"<a href=\"https://example.com/\" target=\"_blank\" rel=\"noopener noreferrer\">外部サイト<\/a>"},{"id":"c2","text":"<a href=\"https://example.com/\" target=\"_blank\" rel=\"external\">外部サイト<\/a>"},{"id":"c3","text":"<a href=\"https://example.com/\" target=\"_blank\" nofollow>外部サイト<\/a>"}],"check":{"format":"html_body","expr":"document.querySelector('a').relList.contains('noopener')"},"answer":{"correct_choice_id":"c1","fixed_code":"<a href=\"https://example.com/\" target=\"_blank\" rel=\"noopener noreferrer\">外部サイト<\/a>","target_line":1,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"target=\"_blank\" のリンクには、rel=\"noopener noreferrer\" を付けると、元のページを守れるから。","explanation":"新しいタブで開いたページから、元のページを操作されてしまう危険を防ぐのが noopener です。noreferrer は、リンク元のアドレスを相手に伝えないための指定です。","wrong_answer_reasons":{"c2":"rel=\"external\" は、外部サイトへのリンクであることを表すだけで、元のページを守る働きはありません。noopener が必要です。","c3":"nofollow は、rel 属性の値として書くもので、単独の属性としては存在しません。また、noopener の代わりにもなりません。"},"hint":"rel の値として、2つの語をスペースで区切って書きます。","feedback_correct":"正解！rel=\"noopener noreferrer\" を付けます。","feedback_incorrect":"惜しい！元のページを守る値を選びましょう。"},{"id":"HC-027","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":7,"title":"画像の表示サイズ","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["img","width","height"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の img 要素の画像ファイル（src の中身）は、本来の大きさが 1×1 ピクセルの、とても小さな画像です（画像のデータを src に直接書いています）。ブラウザは、この画像を、どの大きさで表示しますか？","code":"<img src=\"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7\" alt=\"点\" width=\"120\" height=\"80\">","choice_format":"code","choices":[{"id":"c1","text":"幅120px × 高さ80px の大きさで表示される"},{"id":"c2","text":"本来の大きさの 1×1 ピクセルのまま表示される"},{"id":"c3","text":"width と height が大きすぎるので、表示されない"}],"check":{"format":"html_body","probe":"(function () { var r = document.querySelector('img').getBoundingClientRect(); return Math.round(r.width) + 'x' + Math.round(r.height); })()","choice_values":{"c2":"1x1","c1":"120x80","c3":"0x0"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"width と height 属性を指定すると、画像は、その大きさで表示されるから。","explanation":"あらかじめ大きさを指定しておくと、画像の読み込み前から場所が確保され、読み込み後に周りの文章が動いてしまう（レイアウトのずれ）のを防げます。ただし、本来の大きさと違う値を指定すると、画像は拡大・縮小されます。","wrong_answer_reasons":{"c2":"width と height を指定すると、画像は、その大きさに拡大（または縮小）されて表示されます。本来の大きさのままにはなりません。","c3":"width と height は、大きくても指定したとおりの大きさで表示されます。画像の本来の大きさと違うと、引き伸ばされてぼやけるので、画像に合わせた大きさにするのが基本です。"},"hint":"width と height は、「表示する大きさ」を指定する属性でした。","feedback_correct":"正解！指定した大きさで表示されます。","feedback_incorrect":"惜しい！width と height 属性の働きを思い出しましょう。"},{"id":"HC-028","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":8,"title":"リンク先を指定する属性","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["href","src"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"a 要素のリンク先を指定します。【空欄1】に入れる属性名を答えてください。","code":"<a __1__=\"https://example.com/\">サンプル<\/a>","check":{"format":"html_body","expr":"document.querySelector('a').getAttribute('href') === 'https://example.com/'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["href"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"リンク先は href 属性で指定するから。","explanation":"href（リンク先）と src（画像などの読み込み元）は、似ているので間違えやすい属性です。「リンクは href、画像は src」と覚えましょう。","common_mistakes":[{"blank":"b1","answer":"src","reason":"src は、img などで、画像ファイルの場所を指定する属性です。リンク先は href で指定します。"}],"hint":"a 要素のリンク先の属性です。","feedback_correct":"正解！リンク先は href です。","feedback_incorrect":"惜しい！img の src と混同していませんか？"},{"id":"HC-029","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":9,"title":"ページ内リンクが動かない","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["ページ内リンク","id"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"「第2章へ」をクリックしても、第2章の見出しへ移動しません。1行目を正しく書き直して入力してください（1行目の内容をすべて入力）。","code":"<a href=\"#section2\">第2章へ<\/a>\n<h2 id=\"sec2\">第2章<\/h2>","check":{"format":"html_body","expr":"document.getElementById(document.querySelector('a').getAttribute('href').slice(1)) !== null"},"answer":{"target_line":1,"accepted":["<a href=\"#sec2\">第2章へ<\/a>","<a href='#sec2'>第2章へ<\/a>"],"quote_insensitive":true,"fixed_code":"<a href=\"#sec2\">第2章へ<\/a>\n<h2 id=\"sec2\">第2章<\/h2>"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"ページ内リンクの # のあとは、移動先の要素の id と、まったく同じ文字にする必要があるから。","explanation":"href=\"#section2\" は、id が section2 の要素を探します。h2 の id は sec2 なので、見つからず、移動しません。id の綴りを、リンク側と移動先で合わせます。","common_mistakes":[{"answer":"<a href=\"#section2\">第2章へ<\/a>","reason":"元のコードのままです。# のあとの文字が、移動先の id（sec2）と一致していません。"}],"hint":"# のあとの文字と、h2 の id を見比べましょう。","feedback_correct":"正解！id と # のあとの文字を合わせます。","feedback_incorrect":"惜しい！移動先の id を確認しましょう。"},{"id":"HC-030","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S03","stage_number":3,"number_in_stage":10,"title":"リンクと画像を使ったページ","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["a要素","img","alt","target","rel","ページ内リンク"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の内容を HTML で書いてください（body の中身だけ）。\n・見出し1「ねこ図鑑」（id は top）\n・段落「詳しくは」のあとに、「ねこの解説サイト」というリンク（リンク先は https://example.com/cats、新しいタブで開き、安全のための rel も付ける）\n・画像（ファイルは images/cat.jpg、代替テキストは「窓辺で寝ているねこ」、幅300、高さ200）\n・段落の中に、ページの先頭（見出し1）へ戻る「ページの先頭へ」というページ内リンク","code":null,"starter_code":"<!-- ここに書きましょう -->\n","answer_format":"html_body","answer":{"reference_solution":"<h1 id=\"top\">ねこ図鑑<\/h1>\n<p>詳しくは<a href=\"https://example.com/cats\" target=\"_blank\" rel=\"noopener noreferrer\">ねこの解説サイト<\/a><\/p>\n<img src=\"images/cat.jpg\" alt=\"窓辺で寝ているねこ\" width=\"300\" height=\"200\">\n<p><a href=\"#top\">ページの先頭へ<\/a><\/p>","alternative_solutions":["<h1 id=\"top\">ねこ図鑑<\/h1>\n<p>詳しくは<a target=\"_blank\" rel=\"noreferrer noopener\" href=\"https://example.com/cats\">ねこの解説サイト<\/a><\/p>\n<p><img alt=\"窓辺で寝ているねこ\" src=\"images/cat.jpg\" height=\"200\" width=\"300\"><\/p>\n<p><a href=\"#top\">ページの先頭へ<\/a><\/p>"],"rejected_examples":[{"code":"<h1 id=\"top\">ねこ図鑑<\/h1>\n<p>詳しくは<a href=\"https://example.com/cats\" target=\"_blank\">ねこの解説サイト<\/a><\/p>\n<img src=\"images/cat.jpg\" alt=\"窓辺で寝ているねこ\" width=\"300\" height=\"200\">\n<p><a href=\"#top\">ページの先頭へ<\/a><\/p>","reason":"新しいタブで開くリンクに、rel=\"noopener noreferrer\" がありません。"},{"code":"<h1 id=\"top\">ねこ図鑑<\/h1>\n<p>詳しくは<a href=\"https://example.com/cats\" target=\"_blank\" rel=\"noopener noreferrer\">ねこの解説サイト<\/a><\/p>\n<img src=\"images/cat.jpg\" width=\"300\" height=\"200\">\n<p><a href=\"#top\">ページの先頭へ<\/a><\/p>","reason":"img に alt 属性がありません。画像の内容を言葉で説明する代替テキストを書きます。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"見出し1「ねこ図鑑」の id が top","expr":"(function () { var h = document.querySelector('h1'); return !!h && h.id === 'top' && h.textContent.trim() === 'ねこ図鑑'; })()","visible":true},{"kind":"page","desc":"外部リンクのリンク先と文字が正しい","expr":"(function () { var a = document.querySelector('a[href=\"https://example.com/cats\"]'); return !!a && a.textContent.trim() === 'ねこの解説サイト'; })()","visible":true},{"kind":"page","desc":"外部リンクが新しいタブで開き、rel に noopener と noreferrer がある","expr":"(function () { var a = document.querySelector('a[href=\"https://example.com/cats\"]'); return !!a && a.target === '_blank' && a.relList.contains('noopener') && a.relList.contains('noreferrer'); })()","visible":true},{"kind":"page","desc":"画像の src・alt・大きさが正しい","expr":"(function () { var i = document.querySelector('img'); return !!i && i.getAttribute('src') === 'images/cat.jpg' && i.alt === '窓辺で寝ているねこ' && i.getAttribute('width') === '300' && i.getAttribute('height') === '200'; })()","visible":true},{"kind":"page","desc":"ページ内リンクが #top を指し、移動先が存在する","expr":"(function () { var a = document.querySelector('a[href=\"#top\"]'); return !!a && a.textContent.trim() === 'ページの先頭へ' && !!document.getElementById('top'); })()","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"a 要素の href・target・rel と、img 要素の src・alt・width・height を、それぞれ正しく書くから。","explanation":"リンクは href、画像は src。新しいタブで開くリンクには rel=\"noopener noreferrer\"、画像には必ず alt を付けます。ページ内リンクは、移動先の id と、# のあとの文字を合わせます。","hint":"リンクは href、画像は src。ページ内リンクの移動先は id で決まります。","feedback_correct":"正解！リンクと画像を使ったページが書けました。","feedback_incorrect":"惜しい！条件を1つずつ見直しましょう。"},{"id":"HC-031","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":1,"title":"ul と ol の使い分け","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["ol","ul","li"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"料理の「手順（1. 卵を割る、2. かき混ぜる、…）」を HTML で表すとき、最も適切な要素はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"ul と li"},{"id":"c2","text":"ol と li"},{"id":"c3","text":"p を並べて、手で番号を書く"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"順序に意味のある項目の並びは、ol で表すから。","explanation":"買い物リストのように順序に意味がないなら ul、手順やランキングのように順序に意味があるなら ol を選びます。見た目（丸か番号か）は CSS でも変えられるので、意味で選びます。","wrong_answer_reasons":{"c1":"ul は、順序に意味のないリストです。手順のように、順序に意味がある場合は ol を使います。","c3":"番号を手で書くと、項目を足したときに番号を付け直す必要があります。順序のあるリストなら、ol がその番号を自動で付けます。"},"hint":"手順は、順番が大事です。","feedback_correct":"正解！順序があるなら ol です。","feedback_incorrect":"惜しい！順序に意味があるかで選びます。"},{"id":"HC-032","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":2,"title":"リストの標準の記号","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["ul","ol","標準スタイル"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML をブラウザの標準の表示で見たとき、項目の先頭にどんな記号が付きますか？（list-style-type の値）","code":"<ul>\n  <li>りんご<\/li>\n<\/ul>\n<ol>\n  <li>卵を割る<\/li>\n<\/ol>","choice_format":"code","choices":[{"id":"c1","text":"ul は黒い丸（●）、ol は番号（1.）"},{"id":"c2","text":"ul は番号（1.）、ol は黒い丸（●）"},{"id":"c3","text":"どちらにも記号は付かない"}],"check":{"format":"html_body","probe":"getComputedStyle(document.querySelector('ul > li')).listStyleType + ',' + getComputedStyle(document.querySelector('ol > li')).listStyleType","choice_values":{"c2":"decimal,disc","c1":"disc,decimal","c3":"none,none"}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"標準のスタイルでは、ul の項目には黒い丸、ol の項目には番号が付くから。","explanation":"この記号は、CSS の list-style-type で変えられます（例: none で記号なし）。意味（順序の有無）は変わらないので、見た目だけ変えたいときも、ul と ol を意味で選びます。","wrong_answer_reasons":{"c2":"反対です。順序のない ul に黒い丸、順序のある ol に番号が付きます。","c3":"li の先頭に付く記号は、ブラウザの標準のスタイルで決まります。標準では、ul に丸、ol に番号が付きます。"},"hint":"順序のない ul と、順序のある ol で、記号が違います。","feedback_correct":"正解！ul は丸、ol は番号です。","feedback_incorrect":"惜しい！ul と ol の標準の記号を確認しましょう。"},{"id":"HC-033","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":3,"title":"番号の開始位置","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["ol","start属性"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"ol の番号を 3 から始めます。【空欄1】に入れる属性名を答えてください。","code":"<ol __1__=\"3\">\n  <li>卵を割る<\/li>\n  <li>かき混ぜる<\/li>\n<\/ol>","check":{"format":"html_body","expr":"document.querySelector('ol').start === 3"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["start"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"ol の番号の開始位置は、start 属性で指定するから。","explanation":"start=\"3\" とすると、最初の項目が 3. になります。リストが前のページから続いているときなどに使います。","common_mistakes":[{"blank":"b1","answer":"begin","reason":"begin という属性はありません。ol の番号の開始位置は、start 属性で指定します。"}],"hint":"「開始」を意味する英単語です。","feedback_correct":"正解！start 属性で開始番号を指定します。","feedback_incorrect":"惜しい！「始める」を意味する属性名です。"},{"id":"HC-034","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":4,"title":"リストの外に出た li","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["li","ul"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"2つの項目を、リストとして書いたつもりが、li がリストの中に入っていません。正しい直し方はどれですか？","code":"<li>りんご<\/li>\n<li>みかん<\/li>","choice_format":"text","choices":[{"id":"c1","text":"li を p に変える"},{"id":"c2","text":"2つの li を、ul で囲む"},{"id":"c3","text":"li を div で囲む"}],"check":{"format":"html_body","expr":"document.querySelectorAll('li').length === 2 && Array.from(document.querySelectorAll('li')).every(function (l) { return l.parentElement.tagName === 'UL'; })"},"answer":{"correct_choice_id":"c2","fixed_code":"<ul>\n  <li>りんご<\/li>\n  <li>みかん<\/li>\n<\/ul>"},"grading":{"method":"choice_id"},"rationale":"li は、ul（または ol）の直接の子でなければならないから。","explanation":"li は、リストの項目を表す要素で、単独では使えません。順序のないリストなら ul、順序のあるリストなら ol で囲みます。","wrong_answer_reasons":{"c1":"p に変えると、リストの項目ではなく、段落になります。項目が並んでいるという構造が失われます。","c3":"li の親は、ul か ol でなければなりません。div で囲んでも、リストにはなりません。"},"hint":"li の親になれる要素は何でしょう？","feedback_correct":"正解！li は ul か ol の中に入れます。","feedback_incorrect":"惜しい！li を囲む要素を考えましょう。"},{"id":"HC-035","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":5,"title":"入れ子のリストの書き方","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["リストの入れ子"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"「果物」の項目の中に、「りんご」を入れ子にしたリストを書くとき、正しい書き方はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"<ul>\n  <li>果物<\/li>\n  <ul><li>りんご<\/li><\/ul>\n<\/ul>"},{"id":"c2","text":"<ul>\n  <li>果物\n    <ul><li>りんご<\/li><\/ul>\n  <\/li>\n<\/ul>"},{"id":"c3","text":"<ul>\n  <li>果物<\/li>\n  <li><li>りんご<\/li><\/li>\n<\/ul>"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"入れ子のリストは、親の li の内容の一部として、li の中に書くから。","explanation":"「果物」という項目の下位に「りんご」がある、という構造なので、「果物」の li の中に ul を入れます。ul の直下に ul を置く書き方は、HTML の規則に反します。","wrong_answer_reasons":{"c1":"ul の直接の子には、ul を置けません。ul の直接の子は li だけです。入れ子のリストは、li の中に入れます。","c3":"li の中に li を直接入れることはできません。li の項目は、ul や ol の直接の子にします。"},"hint":"入れ子の ul は、どの要素の中に入りますか？","feedback_correct":"正解！入れ子のリストは li の中に書きます。","feedback_incorrect":"惜しい！ul の直接の子になれるのは li だけです。"},{"id":"HC-036","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":6,"title":"入れ子のリストの li の数","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["リストの入れ子","li"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML には、li 要素が全部でいくつありますか？数字で入力してください。","code":"<ul>\n  <li>A\n    <ul>\n      <li>B<\/li>\n      <li>C<\/li>\n    <\/ul>\n  <\/li>\n  <li>D<\/li>\n<\/ul>","check":{"format":"html_body","probe":"document.querySelectorAll('li').length","expected":4},"answer":{"expected_output":"4"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"外側の li が A と D の2つ、入れ子の中の li が B と C の2つで、合わせて4つだから。","explanation":"入れ子のリストの中の li も、それぞれが1つの項目です。ul の外側と内側で、合計の数は変わりません。","common_mistakes":[{"answer":"2","reason":"外側の ul の li は2つ（A と D）ですが、入れ子の ul の中にも li（B と C）があります。すべて数えます。"},{"answer":"3","reason":"入れ子のリストの中にも、li が2つあります。A・B・C・D の4つです。"}],"hint":"A・B・C・D と、4つの項目があります。","feedback_correct":"正解！入れ子の中の li も数えます。","feedback_incorrect":"惜しい！入れ子の中にある li も数えましょう。"},{"id":"HC-037","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":7,"title":"ナビゲーションを表す要素","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["nav"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"サイトのメニュー（リンクの並び）を、ナビゲーションを表す要素で囲みます。【空欄1】【空欄2】に入れる要素名を答えてください（開始タグと終了タグで同じ名前です）。","code":"<__1__>\n  <a href=\"index.html\">ホーム<\/a>\n  <a href=\"about.html\">概要<\/a>\n<\/__2__>","check":{"format":"html_body","expr":"document.querySelectorAll('nav > a').length === 2"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["nav"],"quote_insensitive":false},{"id":"b2","marker":"__2__","accepted":["nav"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"ナビゲーションを表す要素は nav だから。","explanation":"nav は navigation の略です。メニューのように、他のページや同じページ内の主要な場所へ移動するためのリンクのまとまりに使います。","common_mistakes":[{"blank":"b1","answer":"menu","reason":"menu という要素は、ナビゲーションを表すものとしては使えません。ナビゲーションには nav を使います。"}],"hint":"navigation の略です。","feedback_correct":"正解！nav はナビゲーションです。","feedback_incorrect":"惜しい！navigation の略を考えましょう。"},{"id":"HC-038","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":8,"title":"閉じ忘れた li","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["li","終了タグ"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"2つの項目のリストのはずが、空の項目が増えてしまい、li が3つになっています。2行目を正しく書き直して入力してください（2行目の内容をすべて入力）。","code":"<ul>\n  <li>りんご<li>\n  <li>みかん<\/li>\n<\/ul>","check":{"format":"html_body","expr":"document.querySelectorAll('li').length === 2"},"answer":{"target_line":2,"accepted":["<li>りんご<\/li>"],"quote_insensitive":false,"fixed_code":"<ul>\n  <li>りんご<\/li>\n  <li>みかん<\/li>\n<\/ul>"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"終了タグには / が必要で、/ を忘れると新しい li が始まってしまうから。","explanation":"<li> を2つ続けて書くと、2つ目の <li> は新しい項目の開始になります。そのため、空の li が1つ増えます。終了タグ <\/li> を書きます。","common_mistakes":[{"answer":"<li>りんご<li>","reason":"元のコードのままです。終了タグには / が必要です。/ がないと、新しい li の開始になり、空の項目ができます。"}],"hint":"終了タグと開始タグの違いは、何でしたか？","feedback_correct":"正解！終了タグには / を付けます。","feedback_incorrect":"惜しい！終了タグの書き方を確認しましょう。"},{"id":"HC-039","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":9,"title":"main 要素の役割","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["main","セマンティクス"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"main 要素の説明として、正しいものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"ページの先頭に必ず置く、ロゴやメニューを表す要素である"},{"id":"c2","text":"内容を持たない、デザイン用の区切りの要素である"},{"id":"c3","text":"そのページの主要な内容を表す要素で、1ページに1つだけ使う"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"main は、そのページの中心となる内容を表し、1ページに1つだけ使うから。","explanation":"ヘッダーやフッター、サイドバーなどの共通部分は、main の外に置きます。読み上げソフトの利用者が、「本文へ移動」という操作で、main に直接移れる利点もあります。","wrong_answer_reasons":{"c1":"ページの頭の部分は header、メニューは nav です。main は、ロゴやメニューを除いた、ページの主要な内容を囲みます。","c2":"意味を持たない、デザイン用の区切りは div です。main は、「ここが主要な内容」という意味を持つ要素です。"},"hint":"「主要な」を意味する英単語です。","feedback_correct":"正解！main は主要な内容を表します。","feedback_incorrect":"惜しい！header・nav・div との違いを確認しましょう。"},{"id":"HC-040","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S04","stage_number":4,"number_in_stage":10,"title":"構造の要素でページを組み立てる","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["header","nav","main","footer","ul","li","article"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の構造のページを、適切な要素で書いてください（body の中身だけを書きます）。\n・header の中に、見出し1「ぼくのサイト」と、nav（その中に ul・li・a で、「ホーム」→ index.html、「概要」→ about.html、「連絡先」→ contact.html のメニュー）\n・main の中に、article（その中に見出し2「はじめまして」と、段落「ようこそ。」）\n・footer の中に、段落「© 2026 ぼくのサイト」","code":null,"starter_code":"<!-- ここに書きましょう -->\n","answer_format":"html_body","answer":{"reference_solution":"<header>\n  <h1>ぼくのサイト<\/h1>\n  <nav>\n    <ul>\n      <li><a href=\"index.html\">ホーム<\/a><\/li>\n      <li><a href=\"about.html\">概要<\/a><\/li>\n      <li><a href=\"contact.html\">連絡先<\/a><\/li>\n    <\/ul>\n  <\/nav>\n<\/header>\n<main>\n  <article>\n    <h2>はじめまして<\/h2>\n    <p>ようこそ。<\/p>\n  <\/article>\n<\/main>\n<footer>\n  <p>© 2026 ぼくのサイト<\/p>\n<\/footer>","alternative_solutions":["<header><h1>ぼくのサイト<\/h1><nav><ul><li><a href=\"index.html\">ホーム<\/a><\/li><li><a href=\"about.html\">概要<\/a><\/li><li><a href=\"contact.html\">連絡先<\/a><\/li><\/ul><\/nav><\/header>\n<main><article><h2>はじめまして<\/h2><p>ようこそ。<\/p><\/article><\/main>\n<footer><p>© 2026 ぼくのサイト<\/p><\/footer>"],"rejected_examples":[{"code":"<div class=\"header\">\n  <h1>ぼくのサイト<\/h1>\n  <div class=\"nav\">\n    <a href=\"index.html\">ホーム<\/a>\n    <a href=\"about.html\">概要<\/a>\n    <a href=\"contact.html\">連絡先<\/a>\n  <\/div>\n<\/div>\n<div class=\"main\">\n  <h2>はじめまして<\/h2>\n  <p>ようこそ。<\/p>\n<\/div>\n<div class=\"footer\"><p>© 2026 ぼくのサイト<\/p><\/div>","reason":"div だけで書かれていて、header・nav・main・footer などの意味を持つ要素を使っていません。"},{"code":"<header>\n  <h1>ぼくのサイト<\/h1>\n  <nav>\n    <li><a href=\"index.html\">ホーム<\/a><\/li>\n    <li><a href=\"about.html\">概要<\/a><\/li>\n    <li><a href=\"contact.html\">連絡先<\/a><\/li>\n  <\/nav>\n<\/header>\n<main>\n  <article><h2>はじめまして<\/h2><p>ようこそ。<\/p><\/article>\n<\/main>\n<footer><p>© 2026 ぼくのサイト<\/p><\/footer>","reason":"li が ul で囲まれていません。メニューは、ul と li の中にリンクを入れて書きます。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"body の直下が、header・main・footer の順になっている","expr":"Array.from(document.body.children).map(function (e) { return e.tagName; }).join(',') === 'HEADER,MAIN,FOOTER'","visible":true},{"kind":"page","desc":"header の中に、見出し1「ぼくのサイト」と nav がある","expr":"(function () { var h = document.querySelector('header > h1'); return !!h && h.textContent.trim() === 'ぼくのサイト' && !!document.querySelector('header > nav'); })()","visible":true},{"kind":"page","desc":"nav の中に ul があり、3つの li に、正しいリンクが入っている","expr":"(function () { var a = document.querySelectorAll('nav > ul > li > a'); return a.length === 3 && a[0].getAttribute('href') === 'index.html' && a[1].getAttribute('href') === 'about.html' && a[2].getAttribute('href') === 'contact.html' && a[0].textContent.trim() === 'ホーム' && a[1].textContent.trim() === '概要' && a[2].textContent.trim() === '連絡先'; })()","visible":true},{"kind":"page","desc":"main の中に article があり、見出し2と段落がある","expr":"(function () { var a = document.querySelector('main > article'); return !!a && a.querySelector('h2').textContent.trim() === 'はじめまして' && a.querySelector('p').textContent.trim() === 'ようこそ。'; })()","visible":true},{"kind":"page","desc":"footer の中に段落がある","expr":"(function () { var p = document.querySelector('footer > p'); return !!p && p.textContent.trim() === '© 2026 ぼくのサイト'; })()","visible":true},{"kind":"page","desc":"main はページに1つだけ","expr":"document.querySelectorAll('main').length === 1","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"header・nav・main・article・footer と、リスト（ul・li）を意味に合わせて使って、ページの構造を表すから。","explanation":"ページの頭を header、メニューを nav、主要な内容を main、足を footer で表します。メニューは、リンクが並んでいるので ul と li で書くのが一般的です。ここで作った骨組みに、CSS で見た目を付けていきます。","hint":"header → main → footer の順。メニューは ul・li・a の入れ子です。","feedback_correct":"正解！意味のある要素でページの骨組みが書けました。","feedback_incorrect":"惜しい！要素の入れ子と、リンクの内容を確認しましょう。"},{"id":"HC-041","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":1,"title":"パスワードを送るときの method","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["form","method","GET","POST"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"会員登録フォームで、パスワードなどの入力内容を送信します。method 属性の値として、より適切なものはどれですか？","code":"<form action=\"/register\" method=\"___\">\n  ...\n<\/form>","choice_format":"text","choices":[{"id":"c1","text":"get（入力内容が、アドレスの末尾に付いて送られる）"},{"id":"c2","text":"post（入力内容が、アドレスに現れずに送られる）"},{"id":"c3","text":"send（送信専用の値）"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"登録などデータを送る処理では、入力内容がアドレスに現れない post を使うから。","explanation":"GET は、検索のように、同じアドレスにアクセスしたら同じ結果になる処理向きです。POST は、登録・ログイン・注文のように、データを送る処理向きです。ただし post にしても、通信の暗号化（https）をしなければ、内容は守られません。","wrong_answer_reasons":{"c1":"GET は、入力内容がアドレス（URL）に現れ、履歴や共有されるリンクに残ってしまいます。パスワードや登録の処理には向きません。","c3":"method の値は get と post（と dialog）で、send という値はありません。"},"hint":"アドレス（URL）にパスワードが出てしまうと、どうなるでしょう？","feedback_correct":"正解！データを送る処理には post を使います。","feedback_incorrect":"惜しい！入力内容がアドレスに出る方法は避けます。"},{"id":"HC-042","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":2,"title":"label と入力欄の関連付け","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["label","for","id"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"label の文字をクリックしたら、入力欄が選ばれるようにします。【空欄1】に入れる属性名を答えてください。","code":"<label __1__=\"name\">お名前<\/label>\n<input id=\"name\" type=\"text\" name=\"name\">","check":{"format":"html_body","expr":"document.querySelector('label').control === document.querySelector('input')"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["for"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"label の for 属性に、関連付けたい input の id を書くから。","explanation":"for と id が一致していると、label をクリックしたときに入力欄が選ばれます。スマホで押しにくい小さな入力欄（checkbox など）でも、文字をタップすれば操作できるようになります。","common_mistakes":[{"blank":"b1","answer":"id","reason":"label 自身に id を付けても、入力欄とは関連付けられません。for に、入力欄の id を書きます。"}],"hint":"「〜のための」を意味する英単語です。","feedback_correct":"正解！label の for と input の id を合わせます。","feedback_incorrect":"惜しい！label の属性名を思い出しましょう。"},{"id":"HC-043","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":3,"title":"同じ name の radio","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["radio","name属性"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML を表示したとき、チェックされた状態の radio は、いくつありますか？","code":"<input type=\"radio\" name=\"size\" value=\"s\" checked> S\n<input type=\"radio\" name=\"size\" value=\"m\" checked> M\n<input type=\"radio\" name=\"size\" value=\"l\"> L","choice_format":"code","choices":[{"id":"c1","text":"2つ（S と M の両方）"},{"id":"c2","text":"1つ（M だけ）"},{"id":"c3","text":"0個（どれも選ばれない）"}],"check":{"format":"html_body","probe":"document.querySelectorAll('input:checked').length","choice_values":{"c1":2,"c2":1,"c3":0}},"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"同じ name の radio は1つのグループで、1つしか選べないため、最後の checked だけが有効になるから。","explanation":"radio は「いくつかの中から1つだけ選ぶ」入力欄です。name をそろえることで、ブラウザがグループとして扱います。複数を選べる入力欄が必要なときは、checkbox を使います。","wrong_answer_reasons":{"c1":"radio は、name が同じものが1つのグループで、グループの中で選べるのは1つだけです。2つ checked が書かれていても、最後のものだけが選ばれます。","c3":"checked の属性は有効です。同じグループの中では、最後に checked が書かれた M が選ばれます。"},"hint":"radio は、同じ name の中で、いくつ選べるでしょう？","feedback_correct":"正解！radio は name でグループ化されます。","feedback_incorrect":"惜しい！同じ name の radio の性質を確認しましょう。"},{"id":"HC-044","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":4,"title":"2つ選べてしまう radio","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["radio","name属性"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"サイズを1つだけ選ぶ radio のはずが、S と M の両方がチェックされてしまいます。正しい直し方はどれですか？","code":"<input type=\"radio\" name=\"s\" checked> S\n<input type=\"radio\" name=\"m\" checked> M","choice_format":"text","choices":[{"id":"c1","text":"2つの radio の name を、同じ値にそろえる"},{"id":"c2","text":"type を checkbox に変える"},{"id":"c3","text":"checked を取り除く"}],"check":{"format":"html_body","expr":"document.querySelectorAll('input[type=radio]:checked').length === 1"},"answer":{"correct_choice_id":"c1","fixed_code":"<input type=\"radio\" name=\"size\" checked> S\n<input type=\"radio\" name=\"size\" checked> M"},"grading":{"method":"choice_id"},"rationale":"radio は、name を同じにすると、1つのグループとして、1つしか選べなくなるから。","explanation":"name が s と m で違うので、それぞれが別のグループ（選択肢が1つだけのグループ）になっています。name を size のように、同じ値にそろえます。","wrong_answer_reasons":{"c2":"checkbox は、複数を同時に選べる入力欄です。「1つだけ選ぶ」という目的には合いません。","c3":"name が違うままだと、別々のグループなので、あとで両方を選べてしまいます。グループにするために、name をそろえる必要があります。"},"hint":"radio がグループになる条件は何でしたか？","feedback_correct":"正解！name をそろえてグループにします。","feedback_incorrect":"惜しい！radio のグループを決める属性を確認しましょう。"},{"id":"HC-045","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":5,"title":"入力チェックの結果","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["required","入力チェック"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次のフォームで、メールアドレスを何も入力せずに送信しようとしたとき、ブラウザの入力チェックを通りますか？（通れば true、通らなければ false）","code":"<form>\n  <input type=\"email\" name=\"mail\" required>\n<\/form>","check":{"format":"html_body","probe":"document.querySelector('form').checkValidity()","expected":false},"answer":{"expected_output":"false"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"required の入力欄が空のままなので、入力チェックを通らないから。","explanation":"required を付けた入力欄が空のとき、ブラウザは送信を止めて、「このフィールドを入力してください」のようなメッセージを表示します。ただし、この確認は、ブラウザ側だけのチェックです。","common_mistakes":[{"answer":"true","reason":"required は必須の指定です。空のままだと入力チェックに通らず、送信できません（未入力のメッセージが出ます）。"}],"hint":"required は、何を指定する属性でしたか？","feedback_correct":"正解！required が空だと通りません。","feedback_incorrect":"惜しい！required の意味を確認しましょう。"},{"id":"HC-046","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":6,"title":"メールアドレス用の入力欄","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["input type","email"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"メールアドレスを入力する欄を作ります。【空欄1】に入れる type の値を答えてください。","code":"<input type=\"__1__\" name=\"mail\">","check":{"format":"html_body","expr":"document.querySelector('input').type === 'email'"},"answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["email"],"quote_insensitive":false}]},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"メールアドレス用の入力欄の type は email だから。","explanation":"type=\"email\" にすると、形式のチェックが行われ、スマホではメールアドレス向けのキーボードが表示されます。存在しない type を書くと、ただの text として扱われます。","common_mistakes":[{"blank":"b1","answer":"mail","reason":"mail という type はありません。存在しない type は、text として扱われ、メールアドレスの形式チェックなどが行われません。"}],"hint":"電子メールを意味する英単語です。","feedback_correct":"正解！type=\"email\" を指定します。","feedback_incorrect":"惜しい！type の値を確認しましょう。"},{"id":"HC-047","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":7,"title":"引用符のない属性値","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["属性値","引用符","placeholder"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"ヒントとして「ここに 名前を入力」を表示したいのに、途中で切れてしまいます。正しく書き直して入力してください（1行目の内容をすべて入力）。","code":"<input type=\"text\" name=\"user\" placeholder=ここに 名前を入力>","check":{"format":"html_body","expr":"document.querySelector('input').getAttribute('placeholder') === 'ここに 名前を入力'"},"answer":{"target_line":1,"accepted":["<input type=\"text\" name=\"user\" placeholder=\"ここに 名前を入力\">","<input type=\"text\" name=\"user\" placeholder=\"ここに 名前を入力\" >"],"quote_insensitive":true,"fixed_code":"<input type=\"text\" name=\"user\" placeholder=\"ここに 名前を入力\">"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"空白を含む属性値は、引用符で囲まないと、空白の位置で値が終わってしまうから。","explanation":"引用符がないと、placeholder の値は「ここに」だけになり、「名前を入力」は、別の（意味のない）属性として扱われます。属性値は、常に引用符で囲む習慣をつけましょう。","common_mistakes":[{"answer":"<input type=\"text\" name=\"user\" placeholder=ここに 名前を入力>","reason":"元のコードのままです。属性値に空白が含まれるときは、引用符で囲まないと、空白で値が切れてしまいます。"}],"hint":"属性値は、何で囲んで書くのでしたか？","feedback_correct":"正解！属性値は引用符で囲みます。","feedback_incorrect":"惜しい！空白を含む値は、引用符が必要です。"},{"id":"HC-048","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":8,"title":"select の最初の選択","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["select","option","selected"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の HTML を表示したとき、select で最初に選ばれている値（value）は何ですか？","code":"<select name=\"area\">\n  <option value=\"tokyo\">東京<\/option>\n  <option value=\"osaka\" selected>大阪<\/option>\n  <option value=\"fukuoka\">福岡<\/option>\n<\/select>","choice_format":"code","choices":[{"id":"c1","text":"osaka（selected が付いた選択肢）"},{"id":"c2","text":"tokyo（一番上の選択肢）"},{"id":"c3","text":"何も選ばれていない（空）"}],"check":{"format":"html_body","probe":"document.querySelector('select').value","choice_values":{"c2":"tokyo","c1":"osaka","c3":""}},"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"selected 属性が付いた option が、最初に選ばれた状態になるから。","explanation":"option の value が送信される値、内容の文字（東京・大阪…）が画面に表示される文字です。この例では、「大阪」が最初に選ばれており、送信される値は osaka です。","wrong_answer_reasons":{"c2":"selected 属性が付いている option があるときは、そちらが最初に選ばれます。何も付いていなければ、一番上になります。","c3":"select は、必ずどれかの option が選ばれた状態になります（selected がなければ最初のもの）。"},"hint":"selected が付いているのは、どの option でしょう？","feedback_correct":"正解！selected の option が最初に選ばれます。","feedback_incorrect":"惜しい！selected 属性を探しましょう。"},{"id":"HC-049","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":9,"title":"name 属性の役割","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["name属性","フォーム送信"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の入力欄で、name=\"email\" は、どんな役割を持ちますか？","code":"<input type=\"email\" name=\"email\">","choice_format":"text","choices":[{"id":"c1","text":"入力欄の中に、薄い文字で表示されるヒント"},{"id":"c2","text":"フォームを送信するとき、この入力欄の値につく項目名"},{"id":"c3","text":"入力欄の見た目（幅や色）を決める名前"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"name は、フォームの送信時に、入力された値の項目名として使われるから。","explanation":"送信されるデータは、「項目名=入力値」の組になります。name がない入力欄の値は、送信されません。","wrong_answer_reasons":{"c1":"入力欄の中に表示されるヒントは placeholder 属性です。","c3":"見た目は CSS で決めます。name は、送信するデータの項目名です。"},"hint":"フォームを送信すると、サーバーには、「何を」「どの値で」届くでしょう？","feedback_correct":"正解！name は項目名です。","feedback_incorrect":"惜しい！送信されるデータの項目名を指定する属性です。"},{"id":"HC-050","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"html","stage_id":"S05","stage_number":5,"number_in_stage":10,"title":"会員登録フォームを書く","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["form","input","label","select","textarea","required","button"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の仕様の会員登録フォームを書いてください（body の中身だけを書きます）。入力欄の id や label の for は、自由に決めて構いませんが、すべての入力欄に label を関連付けてください。\n・form（action は /register、method は post）\n・お名前: type が text、name が username、必須\n・メールアドレス: type が email、name が email、必須\n・パスワード: type が password、name が password\n・地域: select（name が area）、選択肢は 東京・大阪・福岡 の3つ\n・コメント: textarea（name が message）\n・「利用規約に同意する」: checkbox（name が agree、必須）\n・送信ボタン: button（type が submit、文字は「登録」）","code":null,"starter_code":"<!-- ここに書きましょう -->\n","answer_format":"html_body","answer":{"reference_solution":"<form action=\"/register\" method=\"post\">\n  <p>\n    <label for=\"username\">お名前<\/label>\n    <input id=\"username\" type=\"text\" name=\"username\" required>\n  <\/p>\n  <p>\n    <label for=\"email\">メールアドレス<\/label>\n    <input id=\"email\" type=\"email\" name=\"email\" required>\n  <\/p>\n  <p>\n    <label for=\"password\">パスワード<\/label>\n    <input id=\"password\" type=\"password\" name=\"password\">\n  <\/p>\n  <p>\n    <label for=\"area\">地域<\/label>\n    <select id=\"area\" name=\"area\">\n      <option value=\"tokyo\">東京<\/option>\n      <option value=\"osaka\">大阪<\/option>\n      <option value=\"fukuoka\">福岡<\/option>\n    <\/select>\n  <\/p>\n  <p>\n    <label for=\"message\">コメント<\/label>\n    <textarea id=\"message\" name=\"message\"><\/textarea>\n  <\/p>\n  <p>\n    <label><input type=\"checkbox\" name=\"agree\" required> 利用規約に同意する<\/label>\n  <\/p>\n  <button type=\"submit\">登録<\/button>\n<\/form>","alternative_solutions":["<form method=\"POST\" action=\"/register\">\n<label>お名前 <input type=\"text\" name=\"username\" required><\/label>\n<label>メールアドレス <input type=\"email\" name=\"email\" required><\/label>\n<label>パスワード <input type=\"password\" name=\"password\"><\/label>\n<label>地域 <select name=\"area\"><option>東京<\/option><option>大阪<\/option><option>福岡<\/option><\/select><\/label>\n<label>コメント <textarea name=\"message\"><\/textarea><\/label>\n<label><input type=\"checkbox\" name=\"agree\" required>利用規約に同意する<\/label>\n<button type=\"submit\">登録<\/button>\n<\/form>"],"rejected_examples":[{"code":"<form action=\"/register\" method=\"post\">\n  <label>お名前<\/label> <input type=\"text\" name=\"username\" required>\n  <label>メールアドレス<\/label> <input type=\"text\" name=\"email\" required>\n  <label>パスワード<\/label> <input type=\"password\" name=\"password\">\n  <select name=\"area\"><option>東京<\/option><option>大阪<\/option><option>福岡<\/option><\/select>\n  <textarea name=\"message\"><\/textarea>\n  <input type=\"checkbox\" name=\"agree\" required> 利用規約に同意する\n  <button type=\"submit\">登録<\/button>\n<\/form>","reason":"label が、入力欄に関連付けられていません（for と id、または label で囲む書き方が必要です）。また、メールアドレスの type が email になっていません。"},{"code":"<form action=\"/register\" method=\"get\">\n  <p><label for=\"u\">お名前<\/label><input id=\"u\" type=\"text\" name=\"username\" required><\/p>\n  <p><label for=\"e\">メールアドレス<\/label><input id=\"e\" type=\"email\" name=\"email\" required><\/p>\n  <p><label for=\"p\">パスワード<\/label><input id=\"p\" type=\"password\" name=\"password\"><\/p>\n  <p><label for=\"a\">地域<\/label><select id=\"a\" name=\"area\"><option>東京<\/option><option>大阪<\/option><option>福岡<\/option><\/select><\/p>\n  <p><label for=\"m\">コメント<\/label><textarea id=\"m\" name=\"message\"><\/textarea><\/p>\n  <p><label><input type=\"checkbox\" name=\"agree\" required>利用規約に同意する<\/label><\/p>\n  <button type=\"submit\">登録<\/button>\n<\/form>","reason":"method が get になっています。会員登録のようなデータを送る処理では、post を指定します。"}]},"grading":{"method":"test_cases","engine":"page","tests":[{"kind":"page","desc":"form の action が /register、method が post","expr":"(function () { var f = document.querySelector('form'); return !!f && f.getAttribute('action') === '/register' && f.method === 'post'; })()","visible":true},{"kind":"page","desc":"お名前: text・name が username・必須","expr":"(function () { var i = document.querySelector('input[name=username]'); return !!i && i.type === 'text' && i.required; })()","visible":true},{"kind":"page","desc":"メールアドレス: email・name が email・必須","expr":"(function () { var i = document.querySelector('input[name=email]'); return !!i && i.type === 'email' && i.required; })()","visible":true},{"kind":"page","desc":"パスワード: password・name が password","expr":"(function () { var i = document.querySelector('input[name=password]'); return !!i && i.type === 'password'; })()","visible":true},{"kind":"page","desc":"地域: select に、東京・大阪・福岡の3つの option がある","expr":"(function () { var s = document.querySelector('select[name=area]'); return !!s && Array.from(s.options).map(function (o) { return o.textContent.trim(); }).join('|') === '東京|大阪|福岡'; })()","visible":true},{"kind":"page","desc":"コメント: textarea（name が message）がある","expr":"!!document.querySelector('textarea[name=message]')","visible":true},{"kind":"page","desc":"同意: checkbox・name が agree・必須","expr":"(function () { var i = document.querySelector('input[name=agree]'); return !!i && i.type === 'checkbox' && i.required; })()","visible":true},{"kind":"page","desc":"送信ボタン: type が submit で、文字が「登録」","expr":"(function () { var b = document.querySelector('button[type=submit]'); return !!b && b.textContent.trim() === '登録'; })()","visible":true},{"kind":"page","desc":"すべての入力欄に、label が関連付けられている","expr":"(function () { var els = document.querySelectorAll('input[name], select[name], textarea[name]'); return els.length === 6 && Array.from(els).every(function (e) { return e.labels && e.labels.length >= 1; }); })()","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":4},"rationale":"form・input の type・name・required・label・select・textarea・button を、仕様どおりに書くから。","explanation":"label は、for と id で関連付ける書き方と、label の中に入力欄を入れて囲む書き方のどちらでも関連付けられます。必須項目は required、メールアドレスは type=\"email\"、送信は button の type=\"submit\" と、HTML の属性だけで、入力チェックの仕組みも作れます。","hint":"label は for と id、または label で囲んで関連付けます。必須は required。","feedback_correct":"正解！会員登録フォームが書けました。","feedback_incorrect":"惜しい！入力欄の種類・name・必須・label の関連付けを確認しましょう。"},{"id":"HC-051","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":1,"title":"CSS とは","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["CSSの役割","スタイルシート言語"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"CSS の説明として、正しいものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"ページの色・余白・配置など、見た目を指定するスタイルシート言語である"},{"id":"c2","text":"文章の構造をタグで表すマークアップ言語である"},{"id":"c3","text":"計算や条件分岐でページを動かすプログラミング言語である"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"CSS は、HTML で書いた構造に、見た目を与えるスタイルシート言語だから。","explanation":"HTML（構造）・CSS（見た目）・JavaScript（動き）は、それぞれ別の役割です。同じ HTML でも、CSS を変えれば、まったく違う見た目にできます。","wrong_answer_reasons":{"c2":"それは HTML の説明です。CSS は、構造に対して見た目を指定します。","c3":"それは JavaScript の説明です。CSS には、計算や条件分岐でページを動かす仕組みはありません。"},"hint":"CSS は Cascading Style Sheets の略です。Style（様式・見た目）に注目しましょう。","feedback_correct":"正解！CSS は見た目を指定します。","feedback_incorrect":"惜しい！HTML・CSS・JavaScript の役割を整理しましょう。"},{"id":"HC-052","course_id":"htmlcss-basics-ja","language":"html-css","code_language":"css","stage_id":"S06","stage_number":6,"number_in_stage":2,"title":"CSS の用語","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["セレクタ","プロパティ","値"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。HTML（マークアップ言語）と CSS（スタイルシート言語）だけを扱い、JavaScript は使わない。","prompt":"次の CSS のルールで、color の部分は、何と呼びますか？","code":"h1 {\n  color: red;\n}","choice_format":"text","choices":[{"id":"c1","text":"セレクタ"},{"id":"c2","text":"プロパティ"},{"id":"c3","text":"値"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"color は、変えたい見た目の項目で、プロパティと呼ぶから。","explanation":"h1 がセレクタ、{ } の中が宣言ブロック、color がプロパティ、red が値です。「color: red;」の1組を、宣言と呼びます。","wrong_answer_reasons":{"c1":"セレクタは、スタイルを適用する対象を選ぶ部分で、ここでは h1 です。","c3":"値は、プロパティに指定する内容で、こ
