クリックされたらこの関数を呼んで」と、関数を渡します。このとき、関数名のあとに ( ) を付けない点に注意します。fn は関数そのもの、fn() は関数を呼び出した結果です。"],"glossary":[{"term":"ローカル変数","definition":"関数やブロックの中だけで有効な変数。"},{"term":"コールバック","definition":"あとで呼び出してもらうために、別の関数に渡す関数。"},{"term":"map / filter","definition":"配列の各要素を変換する / 条件に合う要素を選ぶメソッド。"}],"examples":[{"id":"S07-E3","title":"スコープ","language":"javascript","code":"let x = 100;\nfunction f() {\n  let x = 10;\n  return x + 1;\n}\nconsole.log(f());\nconsole.log(x);\n{\n  let y = 1;\n}\nconsole.log(typeof y);","expected_output":"11\n100\nundefined","line_notes":["3行目: 関数の中の x は別の変数です。外の x は変わりません。","10行目: y は { } の中だけの変数なので、外では存在しません（typeof は undefined を返します）。"]},{"id":"S07-E4","title":"map・filter・forEach","language":"javascript","code":"const nums = [1, 2, 3, 4];\nconsole.log(nums.map((n) => n * 2).join(\",\"));\nconsole.log(nums.filter((n) => n % 2 === 0).join(\",\"));\nnums.forEach((n) => {\n  console.log(\"値: \" + n);\n});","expected_output":"2,4,6,8\n2,4\n値: 1\n値: 2\n値: 3\n値: 4","line_notes":["2行目: map は、各要素を2倍にした新しい配列を返します。","3行目: filter は、関数が true を返した要素だけを集めます。","4行目: forEach は、各要素に対して関数を呼び出します（戻り値は使いません）。"]}]}],"common_mistakes":[{"title":"定義しただけで呼び出さない","wrong_code":"function greet() {\n  console.log(\"hi\");\n}","why":"定義だけでは何も起きません。greet() と呼び出します。","fix":"greet();"},{"title":"return の代わりに console.log","wrong_code":"function area(w, h) {\n  console.log(w * h);\n}\nconst x = area(3, 4) + 1;","why":"area は何も返さない（undefined）ので、undefined + 1 は NaN になります。","fix":"console.log を return に変える"},{"title":"アロー関数の { } で return を忘れる","wrong_code":"const add = (a, b) => { a + b };","why":"{ } を使うと、return がないので undefined が返ります。","fix":"const add = (a, b) => a + b;"},{"title":"return をループの中に書く","wrong_code":"for (const n of nums) {\n  s += n;\n  return s;\n}","why":"return でその場で関数が終了し、1回目で終わってしまいます。","fix":"return s; をループの外に書く"}],"checkpoints":["関数は定義だけでは実行されず、関数名() で呼び出す","return は値を返して関数を終了する。なければ undefined","console.log は表示するだけ。値は返さない","アロー関数の { } では return が必要","関数の中の変数は外とは別物（ローカル変数）","map・filter・forEach には関数を渡す（関数名のあとに ( ) は付けない）"],"next_bridge":"関数が使えると、処理を部品として組み合わせられます。問題で、戻り値や return の働きを確かめましょう。"},{"id":"LESSON-S08","stage_id":"S08","title":"DOM操作","intro":"ここからが、JavaScript の本領です。ブラウザは、HTML を読み取ると、ページの内容を「要素の木」のようなデータ（DOM）に作り変えます。JavaScript は、この DOM を書き換えることで、ページの文字・見た目・構造を、あとから変えられます。この回では、「要素を取り出して、書き換える」基本の流れを学びます。","sections":[{"id":"S08-L1","title":"DOM と要素の取得・書き換え","read_minutes":3,"body":["DOM（Document Object Model）は、ブラウザが HTML をもとに作る、要素の木構造のデータです。JavaScript では document というオブジェクトを入り口にして、DOM の要素を読み書きします。DOM を書き換えても、HTML ファイルそのものは変わらず、いま表示しているページだけが変わります。","要素を取り出すには、CSS のセレクタを使います。document.querySelector(\"#title\") は id が title の要素、document.querySelector(\".note\") は class が note の最初の1つです。該当するものすべては document.querySelectorAll(\".note\") で、配列に似た一覧が返ります（添字や for...of で扱えます）。見つからないと null になります。","要素の文字を変えるには textContent を使います。入力欄（input）の中身は value です。textContent に入れた文字列は、HTML ではなく、ただの文字として表示されます。HTML として解釈させる innerHTML は、ユーザーの入力を入れると、悪意のあるコードを実行される危険があるため、文字を入れたいときは textContent を使います。","<script> は、操作したい要素より後ろ（body の最後など）に書きます。ブラウザは HTML を上から順に読むので、要素がまだ作られていない位置のスクリプトからは、その要素を取得できません。"],"glossary":[{"term":"DOM","definition":"ブラウザが HTML から作る、要素の木構造のデータ。JavaScript から読み書きできる。"},{"term":"querySelector","definition":"CSS のセレクタで、最初に見つかった要素を取り出すメソッド。"},{"term":"textContent","definition":"要素の中の文字列。書き換えると画面の文字が変わる。"}],"examples":[{"id":"S08-E1","title":"要素を取り出して書き換える","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>DOM<\/title><\/head>\n<body>\n  <h1 id=\"title\">変更前<\/h1>\n  <p class=\"note\">A<\/p>\n  <p class=\"note\">B<\/p>\n  <script>\n    document.querySelector(\"#title\").textContent = \"変更後\";\n    const notes = document.querySelectorAll(\".note\");\n    notes[1].textContent = \"Bを書き換えた\";\n  <\/script>\n<\/body>\n<\/html>","line_notes":["8行目: id が title の要素の文字を書き換えます。","9〜10行目: class が note の要素を、すべて取り出し、2つ目（添字 1）の文字を書き換えます。","<script> は、要素より後ろに書かれているので、要素を取り出せます。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","expr":"document.getElementById('title').textContent === '変更後' && document.querySelectorAll('.note')[1].textContent === 'Bを書き換えた' && document.querySelectorAll('.note')[0].textContent === 'A'"}},{"id":"S08-E2","title":"入力欄の value","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>value<\/title><\/head>\n<body>\n  <input id=\"name\" type=\"text\">\n  <script>\n    const input = document.querySelector(\"#name\");\n    input.value = \"Hana\";\n    console.log(input.value);\n  <\/script>\n<\/body>\n<\/html>","line_notes":["input の中身は、textContent ではなく value で読み書きします。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","expr":"document.getElementById('name').value === 'Hana'"}}]},{"id":"S08-L2","title":"class・style・要素の追加","read_minutes":3,"body":["要素の class を操作するには classList を使います。classList.add(\"on\") で追加、remove(\"on\") で削除、toggle(\"on\") で「あれば削除、なければ追加」、contains(\"on\") で持っているかを調べます。見た目は CSS で class に書いておき、JavaScript では class を付け外しする方法が、保守しやすい基本の形です。","style プロパティで、直接スタイルを変えることもできます。CSS のプロパティ名のハイフンは取り除き、次の文字を大文字にします（background-color は el.style.backgroundColor）。属性は el.setAttribute(\"href\", \"b.html\") や el.getAttribute(\"href\") で扱います。","要素を新しく作って追加するには、document.createElement(\"li\") で要素を作り、textContent などで中身を設定し、親要素.appendChild(要素) で追加します。要素を削除するには el.remove() です。配列のデータからリストを作るときに、for と組み合わせてよく使います。"],"glossary":[{"term":"classList","definition":"要素の class を操作するための機能。add / remove / toggle / contains。"},{"term":"createElement","definition":"新しい要素を作るメソッド。作っただけでは画面に出ない。"},{"term":"appendChild","definition":"親要素の末尾に、子要素を追加するメソッド。"}],"examples":[{"id":"S08-E3","title":"classList と style","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"utf-8\"><title>class<\/title>\n  <style>.on { color: red; }<\/style>\n<\/head>\n<body>\n  <p id=\"msg\">こんにちは<\/p>\n  <script>\n    const msg = document.querySelector(\"#msg\");\n    msg.classList.add(\"on\");\n    msg.style.fontSize = \"24px\";\n  <\/script>\n<\/body>\n<\/html>","line_notes":["10行目: class を付けると、CSS の .on のルールが適用されて赤くなります。","11行目: style で直接、文字の大きさを変えます（font-size → fontSize）。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","expr":"getComputedStyle(document.getElementById('msg')).color === 'rgb(255, 0, 0)' && getComputedStyle(document.getElementById('msg')).fontSize === '24px'"}},{"id":"S08-E4","title":"要素を作って追加する","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>追加<\/title><\/head>\n<body>\n  <ul id=\"list\"><\/ul>\n  <script>\n    const fruits = [\"りんご\", \"みかん\", \"ぶどう\"];\n    const list = document.querySelector(\"#list\");\n    for (const fruit of fruits) {\n      const li = document.createElement(\"li\");\n      li.textContent = fruit;\n      list.appendChild(li);\n    }\n  <\/script>\n<\/body>\n<\/html>","line_notes":["10行目: li 要素を作ります（まだ画面には出ません）。","11行目: 中身の文字を設定します。","12行目: ul の末尾に追加すると、画面に表示されます。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","expr":"document.querySelectorAll('#list > li').length === 3 && document.querySelector('#list > li:last-child').textContent === 'ぶどう'"}}]}],"common_mistakes":[{"title":"セレクタの typo・# と . の取り違え","wrong_code":"document.querySelector(\"#mgs\").textContent = \"OK\";","why":"該当する要素がないと null が返り、null の textContent に代入しようとして TypeError になります。id は #、class は . です。","fix":"document.querySelector(\"#msg\")"},{"title":"style にハイフン付きの名前","wrong_code":"box.style.background-color = \"red\";","why":"ハイフンは引き算として読まれ、SyntaxError になります。backgroundColor と書きます。","fix":"box.style.backgroundColor = \"red\";"},{"title":"input の値に textContent","wrong_code":"input.textContent = \"Hana\";","why":"input は中身を持たない要素なので、文字は表示されません。value を使います。","fix":"input.value = \"Hana\";"},{"title":"ユーザーの入力を innerHTML に入れる","wrong_code":"el.innerHTML = userInput;","why":"入力が HTML として解釈され、悪意のあるコードが実行される危険があります。","fix":"el.textContent = userInput;"}],"checkpoints":["DOM は HTML から作られる要素の木。書き換えてもファイルは変わらない","querySelector は最初の1つ、querySelectorAll は全部。見つからなければ null","文字は textContent、入力欄は value","classList の add / remove / toggle / contains","style は backgroundColor のようにキャメルケース","createElement → 中身を設定 → appendChild"],"next_bridge":"ページを書き換える方法が分かりました。問題では、実際の HTML と組み合わせたコードを読み、書いてみましょう。ボタンで動かす方法は、次のステージで学びます。"},{"id":"LESSON-S09","stage_id":"S09","title":"イベント処理","intro":"ボタンを押したとき、文字を入力したとき、フォームを送ったとき。ユーザーが何かしたときに動く処理を書くのが「イベント処理」です。前の回で書いた DOM の書き換えを、ユーザーの操作に結びつけると、動きのあるページになります。","sections":[{"id":"S09-L1","title":"addEventListener と関数を渡すこと","read_minutes":3,"body":["要素.addEventListener(\"イベント名\", 関数) で、「そのイベントが起きたら、この関数を呼んでください」とブラウザに頼みます。クリックのイベント名は click です（onclick ではなく、on を付けません）。","関数には、関数名だけを書いて渡します。addEventListener(\"click\", inc) と書くと、クリックされたときにブラウザが inc を呼び出します。inc() と ( ) を付けると、登録する時点で inc が実行され、その戻り値（undefined）が渡されてしまうため、クリックしても何も起きません。","関数は、イベントオブジェクト（慣習で e と書く）を受け取ります。e.target は、イベントが起きた要素です。入力欄の値は e.target.value で読めます。","querySelectorAll の結果（要素の一覧）には、addEventListener を直接呼べません。for...of などで、1つずつ取り出して付けます。"],"glossary":[{"term":"イベント","definition":"クリック、入力、送信など、ユーザーの操作やブラウザの出来事。"},{"term":"イベントリスナー","definition":"イベントが起きたときに呼び出される関数。addEventListener で登録する。"},{"term":"e.target","definition":"イベントが起きた要素。"}],"examples":[{"id":"S09-E1","title":"クリックしたら数を増やす","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>カウンター<\/title><\/head>\n<body>\n  <button id=\"plus\">+1<\/button>\n  <p id=\"count\">0<\/p>\n  <script>\n    let count = 0;\n    const out = document.querySelector(\"#count\");\n    document.querySelector(\"#plus\").addEventListener(\"click\", () => {\n      count++;\n      out.textContent = count;\n    });\n  <\/script>\n<\/body>\n<\/html>","line_notes":["10行目: \"click\" は、クリックのイベント名です。","10〜13行目: クリックのたびに、この関数が呼ばれ、count が1ずつ増えます。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["document.getElementById('plus').click()","document.getElementById('plus').click()","document.getElementById('plus').click()"],"expr":"document.getElementById('count').textContent === '3'"}},{"id":"S09-E2","title":"入力に反応する（input イベント）","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>input<\/title><\/head>\n<body>\n  <input id=\"name\" type=\"text\">\n  <p id=\"out\"><\/p>\n  <script>\n    document.querySelector(\"#name\").addEventListener(\"input\", (e) => {\n      document.querySelector(\"#out\").textContent = \"こんにちは、\" + e.target.value;\n    });\n  <\/script>\n<\/body>\n<\/html>","line_notes":["input イベントは、入力欄の中身が変わるたびに起きます。","e.target は入力欄の要素で、e.target.value が現在の入力内容です。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["(function(){var t=document.getElementById('name'); t.value='Hana'; t.dispatchEvent(new Event('input'));})()"],"expr":"document.getElementById('out').textContent === 'こんにちは、Hana'"}}]},{"id":"S09-L2","title":"いろいろなイベント・preventDefault・バブリング","read_minutes":3,"body":["よく使うイベント: click（クリック）、input（入力のたび）、change（値が確定したとき）、submit（フォームの送信）、keydown（キーを押した）、DOMContentLoaded（HTML の読み込み完了）。","フォームの submit イベントは、そのままだとページを送信先へ移動（または再読み込み）します。それを止めて、JavaScript で処理したいときは、関数の中で e.preventDefault() を呼びます。","子要素で起きたイベントは、親要素へも伝わります（バブリング）。内側の要素のイベントリスナーが先、その外側の要素のものが後に呼ばれます。この性質を使って、親要素1つにリスナーを付け、e.target で「どの子がクリックされたか」を判断する方法をイベント委譲といいます。要素に data-名前=\"値\" という属性を付けておくと、JavaScript では el.dataset.名前 で読めます。"],"glossary":[{"term":"preventDefault","definition":"イベントの標準の動作（フォーム送信によるページ移動など）を止めるメソッド。"},{"term":"バブリング","definition":"子要素で起きたイベントが、親要素へ順に伝わること。"},{"term":"イベント委譲","definition":"親要素にリスナーを付け、e.target で子要素を判断する書き方。"}],"examples":[{"id":"S09-E3","title":"フォームと preventDefault","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>submit<\/title><\/head>\n<body>\n  <form id=\"form\">\n    <input id=\"word\" type=\"text\" value=\"こんにちは\">\n    <button type=\"submit\">送信<\/button>\n  <\/form>\n  <p id=\"msg\"><\/p>\n  <script>\n    document.querySelector(\"#form\").addEventListener(\"submit\", (e) => {\n      e.preventDefault();\n      document.querySelector(\"#msg\").textContent = \"送信: \" + document.querySelector(\"#word\").value;\n    });\n  <\/script>\n<\/body>\n<\/html>","line_notes":["11行目: submit イベントで、ページ移動を止めて（preventDefault）、自分の処理を行います。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["document.getElementById('form').dispatchEvent(new Event('submit', { cancelable: true }))"],"expr":"document.getElementById('msg').textContent === '送信: こんにちは'"}},{"id":"S09-E4","title":"イベント委譲","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>委譲<\/title><\/head>\n<body>\n  <ul id=\"menu\">\n    <li data-name=\"home\">ホーム<\/li>\n    <li data-name=\"about\">概要<\/li>\n    <li data-name=\"contact\">連絡先<\/li>\n  <\/ul>\n  <p id=\"out\"><\/p>\n  <script>\n    document.querySelector(\"#menu\").addEventListener(\"click\", (e) => {\n      document.querySelector(\"#out\").textContent = e.target.dataset.name;\n    });\n  <\/script>\n<\/body>\n<\/html>","line_notes":["ul に1つだけリスナーを付けています。li をクリックすると、バブリングで ul に伝わります。","e.target は実際にクリックされた li で、data-name の値は dataset.name で読めます。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["document.querySelectorAll('#menu li')[1].click()"],"expr":"document.getElementById('out').textContent === 'about'"}}]}],"common_mistakes":[{"title":"関数を渡さず、呼び出してしまう","wrong_code":"btn.addEventListener(\"click\", inc());","why":"inc() は登録の時点で実行され、その戻り値（undefined）が渡されます。クリックしても何も起きません。","fix":"btn.addEventListener(\"click\", inc);"},{"title":"イベント名に on を付ける","wrong_code":"btn.addEventListener(\"onclick\", fn);","why":"イベント名は click です。onclick というイベントはなく、何も起きません。","fix":"btn.addEventListener(\"click\", fn);"},{"title":"一覧にまとめて addEventListener","wrong_code":"document.querySelectorAll(\".btn\").addEventListener(\"click\", fn);","why":"querySelectorAll の結果は要素の一覧で、addEventListener を持っていません（TypeError）。for...of で1つずつ付けます。","fix":"for (const b of buttons) { b.addEventListener(\"click\", fn); }"},{"title":"preventDefault を忘れる","wrong_code":"form.addEventListener(\"submit\", (e) => { ... });","why":"標準の動作（ページ移動・再読み込み）が起き、画面の書き換えが消えてしまいます。","fix":"関数の最初に e.preventDefault();"}],"checkpoints":["addEventListener(\"イベント名\", 関数) で結びつける","関数は渡す（fn）。fn() は呼び出し","イベント名は click・input・submit など（on を付けない）","e.target は起きた要素、入力欄の値は e.target.value","フォーム送信は preventDefault で止める","イベントは子から親へ伝わる（バブリング）"],"next_bridge":"「ユーザーの操作で動く」ページが書けるようになりました。問題で、イベント処理のコードを読み、書いてみましょう。"},{"id":"LESSON-S10","stage_id":"S10","title":"簡単なWebアプリ制作","intro":"最後のステージです。新しい文法はほとんどありません。変数・配列・関数・DOM・イベントを組み合わせて、ページの中で動く小さなアプリを作ります。コツは、いきなり全部を書かず、「何を覚えておくか（データ）」「画面にどう見せるか（表示）」「どの操作で何が起きるか（イベント）」を分けて考えることです。","sections":[{"id":"S10-L1","title":"アプリづくりの考え方","read_minutes":3,"body":["アプリは、「データを更新する → 画面を書き換える」の繰り返しです。例えば、ToDo アプリでは、「項目の一覧」がデータで、画面の li の並びが表示です。データだけを書き換えても、画面は自動では変わりません。データを変えたあと、表示を書き換える処理（render など）を呼ぶ必要があります。","入力欄の value は、数字を入れていても文字列です。そのまま + で足すと連結になるので、計算に使うときは Number(文字列) で数値にします。","ユーザーは、想定外の入力をします。空の入力や、スペースだけの入力は、追加しない、のようにチェックしましょう。文字列の前後の空白は trim() で取り除けます。","作る順番は、(1) 表示だけ作る、(2) 1つのボタンの動きだけ作る、(3) 想定外の入力に対応する、と、少しずつ確かめながら進めるのが安全です。"],"glossary":[{"term":"状態（データ）","definition":"アプリが覚えておく値。数や配列など。"},{"term":"render（描画）","definition":"データをもとに、画面（DOM）を書き換える処理。"},{"term":"trim","definition":"文字列の前後の空白を取り除くメソッド。"}],"examples":[{"id":"S10-E1","title":"入力値は文字列","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>足し算<\/title><\/head>\n<body>\n  <input id=\"a\" value=\"1\">\n  <input id=\"b\" value=\"2\">\n  <button id=\"calc\">足す<\/button>\n  <p id=\"result\"><\/p>\n  <script>\n    document.querySelector(\"#calc\").addEventListener(\"click\", () => {\n      const a = Number(document.querySelector(\"#a\").value);\n      const b = Number(document.querySelector(\"#b\").value);\n      document.querySelector(\"#result\").textContent = a + b;\n    });\n  <\/script>\n<\/body>\n<\/html>","line_notes":["11〜12行目: value は文字列なので、Number() で数値にしてから足します。","Number() を付けないと、\"1\" + \"2\" が \"12\" になります。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["document.getElementById('calc').click()"],"expr":"document.getElementById('result').textContent === '3'"}},{"id":"S10-E2","title":"ToDo の追加（空のチェックつき）","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>ToDo<\/title><\/head>\n<body>\n  <input id=\"todoInput\" type=\"text\">\n  <button id=\"addBtn\">追加<\/button>\n  <ul id=\"todoList\"><\/ul>\n  <script>\n    const input = document.querySelector(\"#todoInput\");\n    const list = document.querySelector(\"#todoList\");\n    document.querySelector(\"#addBtn\").addEventListener(\"click\", () => {\n      const text = input.value.trim();\n      if (text === \"\") {\n        return;\n      }\n      const li = document.createElement(\"li\");\n      li.textContent = text;\n      list.appendChild(li);\n      input.value = \"\";\n    });\n  <\/script>\n<\/body>\n<\/html>","line_notes":["12行目: trim() で前後の空白を取り除きます。","13〜15行目: 空なら何も追加せず、return でこの関数を終わります。","20行目: 追加したあと、入力欄を空に戻します。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["document.getElementById('todoInput').value='牛乳を買う'; document.getElementById('addBtn').click()","document.getElementById('todoInput').value='   '; document.getElementById('addBtn').click()","document.getElementById('todoInput').value='宿題'; document.getElementById('addBtn').click()"],"expr":"document.querySelectorAll('#todoList > li').length === 2 && document.querySelectorAll('#todoList > li')[0].textContent === '牛乳を買う' && document.getElementById('todoInput').value === ''"}}]},{"id":"S10-L2","title":"いろいろなアプリの作り方","read_minutes":3,"body":["タブの切り替えは、「どのパネルを見せるか」を切り替える処理です。各ボタンに data-target=\"p1\" のように、対応するパネルの id を持たせておくと、クリックされたボタンの dataset.target で、見せるパネルが分かります。パネルは hidden 属性（el.hidden = true / false）で、表示と非表示を切り替えられます。","一覧の項目を、クリックで「完了」にするには、classList.toggle(\"done\") を使います。残りの件数などは、クリックのたびに数え直して表示します。項目ごとにリスナーを付けるほか、親要素にまとめて付けて e.target で判断する（イベント委譲）書き方もあります。","削除ボタンつきのリストでは、li の中に button を作り、そのクリックで li.remove() を呼びます。追加と削除のたびに、件数の表示も更新します。","ここから先は、入力内容をブラウザに保存する localStorage、サーバーと通信する fetch、コードを複数ファイルに分けるモジュール、フレームワークなどへ進めます。このコースの範囲は、ここまでです。"],"glossary":[{"term":"dataset","definition":"data-名前=\"値\" という属性を、JavaScript から el.dataset.名前 で読み書きする機能。"},{"term":"remove","definition":"要素を DOM から取り除くメソッド。"}],"examples":[{"id":"S10-E3","title":"タブの切り替え","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>タブ<\/title><\/head>\n<body>\n  <button class=\"tab\" data-target=\"p1\">タブ1<\/button>\n  <button class=\"tab\" data-target=\"p2\">タブ2<\/button>\n  <div id=\"p1\" class=\"panel\">内容1<\/div>\n  <div id=\"p2\" class=\"panel\" hidden>内容2<\/div>\n  <script>\n    const tabs = document.querySelectorAll(\".tab\");\n    const panels = document.querySelectorAll(\".panel\");\n    for (const tab of tabs) {\n      tab.addEventListener(\"click\", () => {\n        for (const p of panels) {\n          p.hidden = p.id !== tab.dataset.target;\n        }\n      });\n    }\n  <\/script>\n<\/body>\n<\/html>","line_notes":["12行目: すべてのタブに、同じ処理のリスナーを付けています。","14〜15行目: クリックされたタブの data-target と同じ id のパネルだけを、表示します。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["document.querySelectorAll('.tab')[1].click()"],"expr":"document.getElementById('p1').hidden === true && document.getElementById('p2').hidden === false"}},{"id":"S10-E4","title":"クリックで完了にして、残りの件数を表示","language":"html","code":"<!doctype html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>完了<\/title><\/head>\n<body>\n  <ul id=\"list\"><li>A<\/li><li>B<\/li><li>C<\/li><\/ul>\n  <p>残り: <span id=\"remaining\">3<\/span>件<\/p>\n  <script>\n    const items = document.querySelectorAll(\"#list li\");\n    const remaining = document.querySelector(\"#remaining\");\n    function update() {\n      let n = 0;\n      for (const li of items) {\n        if (!li.classList.contains(\"done\")) {\n          n++;\n        }\n      }\n      remaining.textContent = n;\n    }\n    for (const li of items) {\n      li.addEventListener(\"click\", () => {\n        li.classList.toggle(\"done\");\n        update();\n      });\n    }\n  <\/script>\n<\/body>\n<\/html>","line_notes":["10〜18行目: done の class がない li を数えて、残りの件数を表示します。","21〜22行目: クリックで done を付け外しし、そのたびに件数を更新します。"],"preview":{"format":"html_document"},"verify":{"format":"html_document","actions":["document.querySelectorAll('#list li')[0].click()","document.querySelectorAll('#list li')[2].click()"],"expr":"document.getElementById('remaining').textContent === '1'"}}]}],"common_mistakes":[{"title":"入力値をそのまま足す","wrong_code":"const a = document.querySelector(\"#a\").value;\nconst b = document.querySelector(\"#b\").value;\nresult.textContent = a + b;","why":"value は文字列なので、\"1\" + \"2\" は \"12\" になります。Number() で数値にします。","fix":"Number(a) + Number(b)"},{"title":"データだけ更新して画面を更新しない","wrong_code":"todos.push(text);  // render() を呼ばない","why":"配列を変えても、画面の DOM は自動では変わりません。","fix":"データを変えたあとに render() を呼ぶ"},{"title":"空の入力を追加してしまう","wrong_code":"const text = input.value;\nconst li = document.createElement(\"li\");","why":"空やスペースだけの入力でも、空の項目が追加されます。trim() で取り除き、空なら return します。","fix":"if (input.value.trim() === \"\") { return; }"},{"title":"削除のあとに件数を更新しない","wrong_code":"del.addEventListener(\"click\", () => { li.remove(); });","why":"項目は消えても、「N件」の表示は古いままです。","fix":"li.remove(); updateTotal();"}],"checkpoints":["データを更新する → 画面を書き換える（render）","input の value は文字列。計算には Number()","空の入力は trim() で確認して無視する","追加・削除のあとは、件数などの表示も更新する","表示の切り替えは hidden や class の付け外し","小さく作って、1つずつ確かめる"],"next_bridge":"JavaScript の最後のステージです。読む問題と、自分でアプリを書く問題があります。1つの機能ずつ、確かめながら作っていきましょう。"}]},"questions":{"course_id":"javascript-basics-ja","schema_version":"1.1.0","question_count":100,"questions":[{"id":"JS-001","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":1,"title":"console.log の出力先","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["console.log","コンソール"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"JavaScript の console.log(\"こんにちは\") を実行すると、どこに表示されますか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"Webページの画面（本文）に文字が表示される"},{"id":"c2","text":"ポップアップのダイアログが開いて表示される"},{"id":"c3","text":"ブラウザの開発者ツールのコンソールに表示される"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"console.log は開発者ツールのコンソールに値を出力する命令だから。","explanation":"console.log は、プログラムの途中の値や結果を確かめるために、コンソールへメッセージを書き出します。ユーザーに見せる画面の表示とは別のものです。","wrong_answer_reasons":{"c1":"ページの画面に表示するには、DOM（ステージ8）を使って要素の中身を書き換えます。console.log の出力は画面には出ません。","c2":"ダイアログを出すのは alert という別の命令です。console.log は静かにコンソールへ出力します。"},"hint":"ユーザー向けの画面ではなく、作る人が確認するための場所です。","feedback_correct":"正解！console.log の出力先はコンソールです。","feedback_incorrect":"惜しい！console.log はページの画面ではなく、コンソールに出力します。"},{"id":"JS-002","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":2,"title":"文字列と数値の表示","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["console.log","文字列","数値"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"console.log(\"A\");\nconsole.log(10);\nconsole.log(\"10\");","choice_format":"code","choices":[{"id":"c1","text":"A\n10\n10"},{"id":"c2","text":"A 10 10"},{"id":"c3","text":"\"A\"\n10\n\"10\""}],"answer":{"correct_choice_id":"c1","expected_output":"A\n10\n10"},"grading":{"method":"choice_id"},"rationale":"console.log は1回ごとに改行し、文字列の引用符は表示しないから。","explanation":"数値の 10 と文字列の \"10\" は型が違いますが、console.log ではどちらも 10 と表示されます。型の違いは typeof で調べられます。","wrong_answer_reasons":{"c2":"console.log は呼ぶたびに改行して次の行へ出力します。3つの console.log は1行にならず、3行になります。","c3":"文字列を console.log に渡すと、引用符は表示されません。引用符は「これは文字列」と JavaScript に伝えるための目印です。"},"hint":"console.log は1回ごとに1行ずつ出力します。引用符は表示されるでしょうか？","feedback_correct":"正解！1回ごとに1行、引用符なしで表示されます。","feedback_incorrect":"惜しい！console.log は1回ごとに改行し、引用符は表示しません。"},{"id":"JS-003","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":3,"title":"let と const の使い分け","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["const","let"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"あとから値を変更しない（再代入しない）変数を宣言するとき、基本的に使うキーワードはどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"let"},{"id":"c2","text":"var"},{"id":"c3","text":"const"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"再代入しない値は const で宣言すると、誤って書き換えるとエラーで気づけるから。","explanation":"const は「定数」のように、あとから別の値を代入できない変数です。まず const で宣言し、値を変える必要があるときだけ let にする、という使い分けが一般的です。","wrong_answer_reasons":{"c1":"let は、あとから値を入れ直したい変数に使います。変更しない変数には、間違って書き換えるのを防げる const が向いています。","c2":"var は古い書き方で、スコープの扱いが分かりにくいため、現在は let と const を使うのが基本です。"},"hint":"「変更しない」を表す英単語 constant の短縮形です。","feedback_correct":"正解！変更しない値は const です。","feedback_incorrect":"惜しい！再代入しない変数には const を使います。"},{"id":"JS-004","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":4,"title":"変数への再代入","type":"predict_output","answer_mode":"text","difficulty":1,"concepts":["let","再代入"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください。","code":"let score = 50;\nscore = 80;\nconsole.log(score);","answer":{"expected_output":"80"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"let の変数に 80 が上書きされ、その値が表示されるから。","explanation":"let で宣言した変数は、あとから = で値を入れ直せます。2行目で 50 が 80 に置き換わるので、3行目では 80 が表示されます。","common_mistakes":[{"answer":"50","reason":"2行目で score に 80 が代入し直されています。let の変数は上書きできます。"},{"answer":"score","reason":"console.log(score) は変数の名前ではなく、中に入っている値を表示します。"}],"hint":"2行目を実行すると、score の中身はどうなりますか？","feedback_correct":"正解！let の変数は上書きできます。","feedback_incorrect":"惜しい！2行目で score に何が入るか確認しましょう。"},{"id":"JS-005","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":5,"title":"const に再代入してしまう","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["const","let","TypeError"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードは TypeError になり、200 が表示されません。200 が表示されるようにする直し方はどれですか？","code":"const price = 100;\nprice = 200;\nconsole.log(price);","choice_format":"text","choices":[{"id":"c1","text":"price = 200 を price == 200 に変える"},{"id":"c2","text":"console.log(price) の後ろの ; を消す"},{"id":"c3","text":"const を let に変える"}],"answer":{"correct_choice_id":"c3","fixed_code":"let price = 100;\nprice = 200;\nconsole.log(price);","expected_output":"200","buggy_error":"TypeError"},"grading":{"method":"choice_id"},"rationale":"再代入したい変数は const ではなく let で宣言する必要があるから。","explanation":"const で宣言した変数は、あとから別の値を入れられません。値を変えたい price は let にします。エラーメッセージの Assignment to constant variable は「定数への代入」という意味です。","wrong_answer_reasons":{"c1":"== は等しいか調べる記号で、値は代入されません。エラーは消えますが、表示されるのは 100 のままです。","c2":"セミコロンは関係ありません。エラーの原因は、const の変数への再代入です。"},"hint":"エラーは2行目です。price は const で宣言されています。","feedback_correct":"正解！変更する変数は let で宣言します。","feedback_incorrect":"惜しい！エラーの原因は const への再代入です。"},{"id":"JS-006","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":6,"title":"typeof で型を調べる","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["typeof","データ型"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"console.log(typeof 42);\nconsole.log(typeof \"42\");\nconsole.log(typeof true);","choice_format":"code","choices":[{"id":"c1","text":"number\nnumber\nboolean"},{"id":"c2","text":"number\nstring\nboolean"},{"id":"c3","text":"number\nstring\nstring"}],"answer":{"correct_choice_id":"c2","expected_output":"number\nstring\nboolean"},"grading":{"method":"choice_id"},"rationale":"42 は number、\"42\" は string、true は boolean だから。","explanation":"見た目が数字でも、引用符で囲むと文字列になります。true と false は引用符なしで書く真偽値です。","wrong_answer_reasons":{"c1":"\"42\" は引用符で囲まれているので、数値ではなく文字列（string）です。","c3":"true は引用符で囲まれていないので文字列ではなく、真偽値（boolean）です。"},"hint":"引用符で囲まれているかどうかに注目しましょう。","feedback_correct":"正解！引用符の有無で型が変わります。","feedback_incorrect":"惜しい！引用符で囲むと文字列、囲まなければ数値や真偽値です。"},{"id":"JS-007","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":7,"title":"文字列を変数に入れる","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["文字列","引用符"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 greeting に文字列 Hello を入れて、コンソールに Hello と表示したい。【空欄1】に入れるものを答えてください。","code":"let greeting = __1__;\nconsole.log(greeting);","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["\"Hello\"","'Hello'","`Hello`"],"quote_insensitive":true}],"expected_output":"Hello"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"文字列は引用符（\"\"・''・``）で囲んで書くから。","explanation":"引用符は「ここからここまでは文字列」という目印です。\"Hello\"、'Hello'、`Hello` のどれでも文字列になります。目印がない Hello は、変数の名前だと解釈されます。","common_mistakes":[{"blank":"b1","answer":"Hello","reason":"引用符がない Hello は変数名と見なされます。そのような変数は宣言されていないので ReferenceError になります。"}],"hint":"文字列を表すには、何で囲みますか？","feedback_correct":"正解！文字列は引用符で囲みます。","feedback_incorrect":"惜しい！引用符も含めて入力してみましょう。"},{"id":"JS-008","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":8,"title":"undefined と null","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["undefined","null"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"let a;\nlet b = null;\nconsole.log(a);\nconsole.log(b);","answer":{"expected_output":"undefined\nnull"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"値を入れていない変数は undefined、null を代入した変数は null になるから。","explanation":"let a; のように値を決めずに宣言すると、a は undefined になります。b = null は「意図的に空にした」ことを表します。どちらも「値がない」状態ですが、別の値です。","common_mistakes":[{"answer":"null\nnull","reason":"値を入れていない変数 a は undefined です。null は、自分で代入したときだけの値です。"},{"answer":"0\n0","reason":"値が入っていない変数は 0 ではなく undefined、null も 0 ではありません。"}],"hint":"a には値を代入していません。","feedback_correct":"正解！undefined と null は別の値です。","feedback_incorrect":"惜しい！値を代入していない変数の中身を考えましょう。"},{"id":"JS-009","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":9,"title":"変数名の大文字・小文字","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["変数名","ReferenceError","大文字小文字"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 userName の値を表示するはずが ReferenceError になります。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":"let userName = \"Hana\";\nconsole.log(username);","answer":{"target_line":2,"accepted":["console.log(userName);","console.log(userName)"],"quote_insensitive":false,"fixed_code":"let userName = \"Hana\";\nconsole.log(userName);","expected_output":"Hana","buggy_error":"ReferenceError"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"変数名は大文字と小文字を区別するため、宣言した名前と同じ綴りで書く必要があるから。","explanation":"ReferenceError: username is not defined は「username という名前は定義されていない」という意味です。宣言したのは userName（N が大文字）なので、同じ綴りで書きます。","common_mistakes":[{"answer":"console.log(username);","reason":"元のコードのままです。username と userName は大文字・小文字が違うので別の名前です。"}],"hint":"宣言した変数名と、使っている変数名を1文字ずつ比べましょう。","feedback_correct":"正解！変数名は大文字・小文字まで同じにします。","feedback_incorrect":"惜しい！宣言した名前と一文字ずつ見比べましょう。"},{"id":"JS-010","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S01","stage_number":1,"number_in_stage":10,"title":"変数を使って表示する","type":"code_write","answer_mode":"code","difficulty":2,"concepts":["let","const","変数","console.log"],"preconditions":"ステージ1〜1で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 city に文字列 \"東京\"、変数 population に数値 14000000 を入れてください。そのあと console.log で city と population を、この順に別々の行に表示してください。変数は let または const で宣言すること。","code":null,"prefix_code":"","starter_code":"// ここに書きましょう\n","answer_format":"javascript","answer":{"reference_solution":"const city = \"東京\";\nconst population = 14000000;\nconsole.log(city);\nconsole.log(population);","alternative_solutions":["let city = '東京';\nlet population = 14000000;\nconsole.log(city);\nconsole.log(population);"],"rejected_examples":[{"code":"console.log(\"東京\");\nconsole.log(14000000);","reason":"変数を使っていません。変数に入れてから、変数を表示するコードにしましょう。"},{"code":"let city = \"東京\";\nlet population = 14000000;\nconsole.log(city, population);","reason":"カンマで区切ると同じ行に空白区切りで表示されます。別々の行にするには console.log を2回使います。"}]},"grading":{"method":"test_cases","engine":"js_worker","tests":[{"kind":"stdout","setup":"","expected_stdout":"東京\n14000000\n","visible":true}],"required_patterns":[{"pattern":"\\b(let|const)\\s+city\\b","message":"city を let か const で宣言してください"},{"pattern":"\\b(let|const)\\s+population\\b","message":"population を let か const で宣言してください"}],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":3,"normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"変数に値を入れ、console.log を2回使えば、1行ずつ表示されるから。","explanation":"let（または const）で変数を2つ宣言して値を入れ、console.log(city); console.log(population); と書きます。console.log は呼び出すたびに改行するので、2行になります。","hint":"変数を2つ宣言してから、console.log を2回使います。","feedback_correct":"正解！変数を使って表示できました。","feedback_incorrect":"惜しい！変数を宣言しているか、別々の行になっているか確認しましょう。"},{"id":"JS-011","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":1,"title":"割り算・余り・累乗","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["算術演算子","%","**"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"console.log(7 / 2);\nconsole.log(7 % 2);\nconsole.log(2 ** 3);","choice_format":"code","choices":[{"id":"c1","text":"3.5\n1\n8"},{"id":"c2","text":"3\n1\n8"},{"id":"c3","text":"3.5\n1\n6"}],"answer":{"correct_choice_id":"c1","expected_output":"3.5\n1\n8"},"grading":{"method":"choice_id"},"rationale":"7 / 2 は 3.5、7 % 2 は余り 1、2 ** 3 は 8 だから。","explanation":"JavaScript の割り算は小数も含めて計算します。余りは %、累乗は ** で求めます。整数の商だけが欲しいときは Math.floor(7 / 2) のように別の方法を使います。","wrong_answer_reasons":{"c2":"JavaScript の / は小数まで計算する割り算なので、7 / 2 は 3 ではなく 3.5 です。","c3":"** は累乗です。2 ** 3 は 2 を3回かける 8 で、2 × 3 の 6 ではありません。"},"hint":"7 を 2 で割ると、商は 3、余りは 1 ですが、/ は小数まで出します。","feedback_correct":"正解！/ は小数まで計算します。","feedback_incorrect":"惜しい！/ と % と ** の意味をもう一度確認しましょう。"},{"id":"JS-012","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":2,"title":"文字列と数値の計算","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["文字列の連結","型変換"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"console.log(\"5\" + 3);\nconsole.log(\"5\" - 3);\nconsole.log(5 + 3);","answer":{"expected_output":"53\n2\n8"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"+ は文字列があると連結、- は数値に変換して引き算になるから。","explanation":"+ は「足し算」と「文字列の連結」の両方に使われるため、片方が文字列だと連結になります。- には連結の意味がないので、文字列は数値に変換されて計算されます。","common_mistakes":[{"answer":"8\n2\n8","reason":"\"5\" + 3 は、文字列と数値の + なので、足し算ではなく連結になり \"53\" です。"},{"answer":"53\n53\n8","reason":"- は連結には使えず、文字列を数値に変換して引き算します。\"5\" - 3 は 2 です。"}],"hint":"+ は、片方が文字列のときどう働くでしょう？ - は？","feedback_correct":"正解！+ は文字列があると連結になります。","feedback_incorrect":"惜しい！+ と - で動きが違う点に注目しましょう。"},{"id":"JS-013","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":3,"title":"テンプレートリテラルの書き方","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["テンプレートリテラル"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 age に 20 が入っています。「私は20歳です」と表示するために、変数を文字列に埋め込む正しい書き方はどれですか？","code":"const age = 20;","choice_format":"code","choices":[{"id":"c1","text":"console.log(`私は${age}歳です`);"},{"id":"c2","text":"console.log(\"私は${age}歳です\");"},{"id":"c3","text":"console.log(`私は{age}歳です`);"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"変数を埋め込めるのは、バッククォートで囲んだ中の ${ } だけだから。","explanation":"テンプレートリテラルは、バッククォート ` で文字列を囲み、${式} の部分に値を埋め込みます。日本語キーボードでは Shift + @ キーで入力できます。","wrong_answer_reasons":{"c2":"ダブルクォート \" \" の中では ${ } は展開されず、「私は${age}歳です」とそのまま表示されます。","c3":"バッククォートは正しいですが、${ } の $ が抜けています。「私は{age}歳です」とそのまま表示されます。"},"hint":"埋め込みには、バッククォートと ${ } の両方が必要です。","feedback_correct":"正解！バッククォートと ${ } の組み合わせです。","feedback_incorrect":"惜しい！囲む記号と、埋め込みの書き方の両方を確認しましょう。"},{"id":"JS-014","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":4,"title":"比較演算子の結果","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["===","==","!=="],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"console.log(5 === \"5\");\nconsole.log(5 == \"5\");\nconsole.log(5 !== 3);","choice_format":"code","choices":[{"id":"c1","text":"true\ntrue\ntrue"},{"id":"c2","text":"false\ntrue\ntrue"},{"id":"c3","text":"false\nfalse\ntrue"}],"answer":{"correct_choice_id":"c2","expected_output":"false\ntrue\ntrue"},"grading":{"method":"choice_id"},"rationale":"=== は型も比べて false、== は型を変換して true、!== は等しくないので true だから。","explanation":"== と === の違いは「型を変換して比べるか」です。== は予想しにくい結果になることがあるため、比較には基本的に === と !== を使います。","wrong_answer_reasons":{"c1":"=== は型も比べます。数値の 5 と文字列の \"5\" は型が違うので false です。","c3":"== は型を自動で変換して比べるので、5 == \"5\" は true になります。だから === を使うのが基本です。"},"hint":"=== は型まで同じかを確認します。","feedback_correct":"正解！=== は型も含めて比べます。","feedback_incorrect":"惜しい！== と === の違いを思い出しましょう。"},{"id":"JS-015","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":5,"title":"変数に足し込む","type":"fill_blank","answer_mode":"text","difficulty":1,"concepts":["代入演算子","+="],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 total に 5 を足して、15 と表示したい。【空欄1】に入れる演算子を答えてください。","code":"let total = 10;\ntotal __1__ 5;\nconsole.log(total);","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["+="],"quote_insensitive":false}],"expected_output":"15"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"+= は、左の変数に右の値を足して代入し直す演算子だから。","explanation":"total += 5 は total = total + 5 と同じです。-= *= /= も同じ考え方です。","common_mistakes":[{"blank":"b1","answer":"=","reason":"= は代入なので、total が 5 に上書きされ、5 と表示されます。足し込むには += を使います。"}],"hint":"「足して代入」の記号です。","feedback_correct":"正解！+= で足し込めます。","feedback_incorrect":"惜しい！= だけだと上書きになります。"},{"id":"JS-016","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":6,"title":"論理演算子","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["&&","||","!"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"console.log(true && false);\nconsole.log(true || false);\nconsole.log(!true);","answer":{"expected_output":"false\ntrue\nfalse"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"&& は両方 true で true、|| は片方が true で true、! は反転するから。","explanation":"&&（かつ）は両方が true のときだけ true です。||（または）は一方でも true なら true です。!（否定）は true と false を入れ替えます。","common_mistakes":[{"answer":"true\ntrue\ntrue","reason":"&& は両方が true のときだけ true、! は true と false を反転します。"},{"answer":"false\ntrue\ntrue","reason":"! は反転するので、!true は false です。"}],"hint":"&& は「かつ」、|| は「または」です。","feedback_correct":"正解！論理演算子を正しく読めています。","feedback_incorrect":"惜しい！&&・||・! の意味を確認しましょう。"},{"id":"JS-017","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":7,"title":"比較したつもりが代入","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["=","===","代入と比較"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 n が 5 かどうかを調べて true と表示したいのに、5 と表示されます。2行目を直したものはどれですか？","code":"let n = 5;\nconsole.log(n = 5);","choice_format":"code","choices":[{"id":"c1","text":"console.log(n == = 5);"},{"id":"c2","text":"console.log(n =< 5);"},{"id":"c3","text":"console.log(n === 5);"}],"answer":{"correct_choice_id":"c3","fixed_code":"let n = 5;\nconsole.log(n === 5);","expected_output":"true","buggy_output":"5","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"等しいかどうかの比較には、代入の = ではなく === を使うから。","explanation":"n = 5 は「n に 5 を代入する」式で、その結果の 5 が表示されていました。n === 5 なら、n が 5 と等しいかを調べ、結果の true が表示されます。","wrong_answer_reasons":{"c1":"== と = の間に空白があると、1つの演算子として読めず SyntaxError になります。","c2":"=< という演算子はありません。「以下」は <= と書きますが、等しいかを調べたいなら ===です。"},"hint":"代入と比較の記号は違います。比較は = を3つです。","feedback_correct":"正解！比較には === を使います。","feedback_incorrect":"惜しい！= は代入、=== が比較です。"},{"id":"JS-018","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":8,"title":"数値にできない計算","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["型変換","NaN"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"console.log(\"10\" / 2);\nconsole.log(\"abc\" * 2);","answer":{"expected_output":"5\nNaN"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"\"10\" は数値に変換されて 5、\"abc\" は数値にできず NaN になるから。","explanation":"/ や * は、文字列を数値に変換して計算します。\"10\" は 10 になりますが、\"abc\" は数値にできないので、計算結果は NaN（数値ではない）です。NaN は何と計算しても NaN になります。","common_mistakes":[{"answer":"5\n0","reason":"数値にできない文字列 \"abc\" との計算は 0 ではなく NaN（Not a Number）になります。"},{"answer":"\"10\" / 2\nNaN","reason":"計算式がそのまま表示されることはありません。\"10\" は数値の 10 に変換され、10 / 2 の結果 5 が表示されます。"}],"hint":"\"abc\" は数値に変換できるでしょうか？","feedback_correct":"正解！数値にできない計算は NaN です。","feedback_incorrect":"惜しい！文字列が数値に変換できるかを考えましょう。"},{"id":"JS-019","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":9,"title":"足し算が連結になる","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["Number()","型変換","文字列の連結"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"a と b を足した 7 を表示するつもりが 34 と表示されます。3行目を正しく書き直して入力してください（3行目の内容だけを入力）。","code":"let a = \"3\";\nlet b = 4;\nconsole.log(a + b);","answer":{"target_line":3,"accepted":["console.log(Number(a) + b);","console.log(Number(a)+b);","console.log(Number(a) + b)","console.log(+a + b);","console.log(b + Number(a));"],"quote_insensitive":false,"fixed_code":"let a = \"3\";\nlet b = 4;\nconsole.log(Number(a) + b);","expected_output":"7","buggy_output":"34"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"a は文字列なので、Number() で数値に変換してから足す必要があるから。","explanation":"\"3\" + 4 は連結で \"34\" になります。Number(a) で数値の 3 にすれば、3 + 4 の足し算で 7 になります。","common_mistakes":[{"answer":"console.log(a + b);","reason":"元のコードのままです。a は文字列なので、+ は足し算ではなく連結になります。"}],"hint":"a の型は文字列です。足し算にするには、どうすればよいでしょう？","feedback_correct":"正解！数値に変換してから足しました。","feedback_incorrect":"惜しい！文字列と数値の + は連結になります。"},{"id":"JS-020","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S02","stage_number":2,"number_in_stage":10,"title":"税込み価格を求める","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["算術演算子","計算の優先順位"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 price に商品の価格、変数 taxPercent に消費税の割合（パーセント、整数）が入っています。税込み価格（price + 税額。税額は price × taxPercent ÷ 100）を console.log で表示するコードを書いてください。","code":null,"prefix_code":"const price = 1000;\nconst taxPercent = 10;","starter_code":"// price と taxPercent はあらかじめ用意されています\n","answer_format":"javascript","answer":{"reference_solution":"console.log(price + price * taxPercent / 100);","alternative_solutions":["const tax = price * taxPercent / 100;\nconsole.log(price + tax);","console.log(price * (100 + taxPercent) / 100);"],"rejected_examples":[{"code":"console.log(price * taxPercent);","reason":"税額だけでなく、さらに price を掛けています。税込み価格は 価格 + 税額 です。"},{"code":"console.log(price + taxPercent);","reason":"taxPercent は割合（パーセント）です。価格に直接足すのではなく、価格 × 割合 ÷ 100 を足します。"}]},"grading":{"method":"test_cases","engine":"js_worker","tests":[{"kind":"stdout","setup":"const price = 1000;\nconst taxPercent = 10;","expected_stdout":"1100\n","visible":true},{"kind":"stdout","setup":"const price = 200;\nconst taxPercent = 50;","expected_stdout":"300\n","visible":false},{"kind":"stdout","setup":"const price = 0;\nconst taxPercent = 10;","expected_stdout":"0\n","visible":false},{"kind":"stdout","setup":"const price = 980;\nconst taxPercent = 10;","expected_stdout":"1078\n","visible":false}],"required_patterns":[],"required_any_patterns":[],"forbidden_patterns":[],"timeout_sec":3,"normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"税額は price × taxPercent ÷ 100 で、それを price に足すと税込み価格になるから。","explanation":"1000 円で 10% なら税額は 1000 × 10 ÷ 100 = 100 で、税込みは 1100 円です。計算は掛け算・割り算が先なので、( ) がなくても税額が先に計算されます。","hint":"税額は price * taxPercent / 100 で求まります。","feedback_correct":"正解！変数を使って税込み価格を求められました。","feedback_incorrect":"惜しい！price と taxPercent を使った式になっているか確認しましょう。"},{"id":"JS-021","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":1,"title":"if と else の動き","type":"predict_output","answer_mode":"text","difficulty":1,"concepts":["if","else","ブロック"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"const score = 55;\nif (score >= 60) {\n  console.log(\"合格\");\n} else {\n  console.log(\"不合格\");\n}\nconsole.log(\"終わり\");","answer":{"expected_output":"不合格\n終わり"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"55 は 60 未満なので else 側が実行され、if 文の外の行は必ず実行されるから。","explanation":"score >= 60 は false なので、else の「不合格」が表示されます。7行目は if / else の { } の外にあるため、結果に関係なく最後に実行されます。","common_mistakes":[{"answer":"不合格","reason":"最後の console.log(\"終わり\") は if 文の外にあるので、条件に関係なく必ず実行されます。"},{"answer":"合格\n終わり","reason":"55 >= 60 は false なので、「合格」は表示されません。"}],"hint":"条件が true か false かを先に決めましょう。{ } の外の行はいつ実行されますか？","feedback_correct":"正解！{ } の外の行は常に実行されます。","feedback_incorrect":"惜しい！条件の結果と、{ } の外の行の扱いを確認しましょう。"},{"id":"JS-022","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":2,"title":"else if は最初に成り立つ所まで","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["else if","条件の順序"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"const score = 85;\nif (score >= 90) {\n  console.log(\"A\");\n} else if (score >= 80) {\n  console.log(\"B\");\n} else if (score >= 70) {\n  console.log(\"C\");\n} else {\n  console.log(\"D\");\n}","choice_format":"code","choices":[{"id":"c1","text":"B\nC"},{"id":"c2","text":"A"},{"id":"c3","text":"B"}],"answer":{"correct_choice_id":"c3","expected_output":"B"},"grading":{"method":"choice_id"},"rationale":"85 >= 90 は false、85 >= 80 が最初に true になり、残りは調べないから。","explanation":"if / else if / else は上から順に条件を調べ、最初に true になったブロックだけを実行します。85 は 70 以上でもありますが、その手前で B が選ばれて終了します。","wrong_answer_reasons":{"c1":"else if は、最初に条件が成り立ったブロックだけを実行します。B を表示したあと、次の条件は調べられません。","c2":"85 >= 90 は false なので、A のブロックは実行されません。"},"hint":"最初に true になる条件を、上から探しましょう。","feedback_correct":"正解！最初に成り立った条件だけが実行されます。","feedback_incorrect":"惜しい！上から順に、最初に true になる所を探しましょう。"},{"id":"JS-023","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":3,"title":"falsy な値","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["truthy / falsy"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のうち、if の条件に使ったとき false（偽）として扱われる値はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"0（数値のゼロ）"},{"id":"c2","text":"\"0\"（文字列のゼロ）"},{"id":"c3","text":"\"false\"（文字列）"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"数値の 0 は falsy で、空でない文字列は truthy だから。","explanation":"falsy は false・0・\"\"（空文字列）・null・undefined・NaN の6つだけです。見た目が 0 や false でも、引用符で囲んだ文字列は truthy です。","wrong_answer_reasons":{"c2":"空でない文字列は、中身が \"0\" でも truthy（真）として扱われます。","c3":"空でない文字列は truthy です。中身が false という文字でも、文字列としては真になります。"},"hint":"引用符で囲まれていない 0 に注目しましょう。","feedback_correct":"正解！数値の 0 は falsy です。","feedback_incorrect":"惜しい！文字列は空でなければ truthy です。"},{"id":"JS-024","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":4,"title":"文字列の真偽","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["truthy / falsy","文字列"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"if (\"\") { console.log(\"A\"); } else { console.log(\"B\"); }\nif (\"0\") { console.log(\"C\"); } else { console.log(\"D\"); }","choice_format":"code","choices":[{"id":"c1","text":"B\nC"},{"id":"c2","text":"B\nD"},{"id":"c3","text":"A\nC"}],"answer":{"correct_choice_id":"c1","expected_output":"B\nC"},"grading":{"method":"choice_id"},"rationale":"空文字列は falsy で B、\"0\" は空でない文字列なので truthy で C だから。","explanation":"空文字列だけが falsy で、\"0\" のような文字は truthy です。入力欄が空かどうかを調べるとき、この性質がよく使われます。","wrong_answer_reasons":{"c2":"\"0\" は空でない文字列なので truthy です。そのため D ではなく C が表示されます。","c3":"空文字列 \"\" は falsy なので、1行目は A ではなく B です。"},"hint":"文字列の真偽は「空かどうか」で決まります。","feedback_correct":"正解！空の文字列だけが falsy です。","feedback_incorrect":"惜しい！\"0\" は空の文字列ではありません。"},{"id":"JS-025","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":5,"title":"三項演算子","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["三項演算子"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"score が 60 以上なら「合格」、そうでなければ「不合格」を表示する三項演算子です。【空欄1】に入れる記号を答えてください。","code":"const score = 70;\nconst label = score >= 60 __1__ \"合格\" : \"不合格\";\nconsole.log(label);","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["?"],"quote_insensitive":false}],"expected_output":"合格"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"三項演算子は 条件 ? 値1 : 値2 の形で書くから。","explanation":"三項演算子は、短い if / else を1つの式で書く方法です。? の前が条件、? と : の間が条件が真のときの値、: の後ろが偽のときの値です。","common_mistakes":[{"blank":"b1","answer":":","reason":"三項演算子は 条件 ? A : B の形です。条件の直後には ? を書き、A と B の区切りに : を書きます。: だけでは SyntaxError になります。"}],"hint":"条件のあとに付ける、疑問を表す記号です。","feedback_correct":"正解！条件 ? A : B の形です。","feedback_incorrect":"惜しい！条件のあとに付ける記号を思い出しましょう。"},{"id":"JS-026","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":6,"title":"条件の並べ順","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["else if","条件の順序"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"85 点なら \"B\" と表示するはずが \"C\" と表示されます。どう直すのが適切ですか？","code":"const score = 85;\nlet grade;\nif (score >= 60) {\n  grade = \"C\";\n} else if (score >= 80) {\n  grade = \"B\";\n} else {\n  grade = \"D\";\n}\nconsole.log(grade);","choice_format":"text","choices":[{"id":"c1","text":"else if をやめて、if を続けて書く"},{"id":"c2","text":"条件を厳しい順（80以上、60以上の順）に並べ替える"},{"id":"c3","text":"score >= 60 を score === 60 に変える"}],"answer":{"correct_choice_id":"c2","fixed_code":"const score = 85;\nlet grade;\nif (score >= 80) {\n  grade = \"B\";\n} else if (score >= 60) {\n  grade = \"C\";\n} else {\n  grade = \"D\";\n}\nconsole.log(grade);","expected_output":"B","buggy_output":"C"},"grading":{"method":"choice_id"},"rationale":"else if は上から順に調べ、最初に成り立ったものだけ実行するので、厳しい条件を先に書く必要があるから。","explanation":"85 は 60 以上でもあるため、最初の条件で \"C\" になり、80 以上かどうかは調べられません。80 以上を先に書けば、85 は \"B\"、65 は \"C\" と正しく分かれます。","wrong_answer_reasons":{"c1":"if を続けると、85 は最初の if で C になったあと、次の if（80以上）でも B になり、最後は B になりますが、65 点では C のあとに else の D が実行されてしまいます。","c3":"=== は「ちょうど60」のときだけ成り立つので、85 を含む多くの点数が当てはまらなくなります。"},"hint":"85 は、最初の条件 score >= 60 を満たしますか？","feedback_correct":"正解！条件は厳しい順に並べます。","feedback_incorrect":"惜しい！上から順に調べ、最初に成り立った所で終わることを思い出しましょう。"},{"id":"JS-027","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":7,"title":"switch の break 忘れ","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["switch","break"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"const n = 2;\nswitch (n) {\n  case 1:\n    console.log(\"one\");\n  case 2:\n    console.log(\"two\");\n  case 3:\n    console.log(\"three\");\n    break;\n  default:\n    console.log(\"other\");\n}","choice_format":"code","choices":[{"id":"c1","text":"two"},{"id":"c2","text":"one\ntwo\nthree"},{"id":"c3","text":"two\nthree"}],"answer":{"correct_choice_id":"c3","expected_output":"two\nthree"},"grading":{"method":"choice_id"},"rationale":"case 2 から実行が始まり、break がないので case 3 も実行され、そこで break するから。","explanation":"switch は、一致した case から実行を始め、break に出会うまで下の case も続けて実行します（フォールスルー）。意図しないときは、各 case の最後に break を書きます。","wrong_answer_reasons":{"c1":"case 2 には break がないので、two を表示したあとも終わらず、次の case 3 の処理も実行されます。","c2":"n は 2 なので case 1 は実行されません。case 2 から始まり、break のある case 3 の最後で止まります。"},"hint":"n === 2 に一致するのは case 2 です。そのあと、break はありますか？","feedback_correct":"正解！break がないと次の case も実行されます。","feedback_incorrect":"惜しい！break のない case の動きを確認しましょう。"},{"id":"JS-028","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":8,"title":"条件に = を書いてしまった","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["=","===","truthy / falsy"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"n は 3 なので「not five」と表示されるはずが、「five」と表示されてしまいます。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":"let n = 3;\nif (n = 5) {\n  console.log(\"five\");\n} else {\n  console.log(\"not five\");\n}","answer":{"target_line":2,"accepted":["if (n === 5) {","if (n === 5){","if(n === 5) {","if (n===5) {"],"quote_insensitive":false,"fixed_code":"let n = 3;\nif (n === 5) {\n  console.log(\"five\");\n} else {\n  console.log(\"not five\");\n}","expected_output":"not five","buggy_output":"five"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"条件では、代入の = ではなく、比較の === を使う必要があるから。","explanation":"if (n = 5) は、n に 5 を代入してから、その値 5 で真偽を判断します。5 は truthy なので、いつも「five」側が実行されます。エラーにならないため見つけにくいミスです。比較は ===。","common_mistakes":[{"answer":"if (n = 5) {","reason":"元のコードのままです。n = 5 は代入で、n に 5 が入り、その結果（5）が truthy になって条件が真になります。"}],"hint":"条件の中では、代入ではなく比較をしたいのです。","feedback_correct":"正解！条件では === で比較します。","feedback_incorrect":"惜しい！= は代入、=== が比較です。"},{"id":"JS-029","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":9,"title":"&& と || が返す値","type":"predict_output","answer_mode":"text","difficulty":4,"concepts":["||","&&","truthy / falsy"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"console.log(0 || \"default\");\nconsole.log(\"a\" && \"b\");\nconsole.log(5 > 3 && \"yes\");","answer":{"expected_output":"default\nb\nyes"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"|| は左が falsy なら右の値、&& は左が truthy なら右の値を返すから。","explanation":"0 || \"default\" は、0 が falsy なので \"default\"。\"a\" && \"b\" は、\"a\" が truthy なので右の \"b\"。5 > 3 は true なので、&& は右の \"yes\" を返します。","common_mistakes":[{"answer":"true\ntrue\ntrue","reason":"&& と || は true / false ではなく、どちらかの値そのものを返します。"},{"answer":"0\na\nfalse","reason":"0 は falsy なので || は右の値を返します。\"a\" は truthy なので && は右の値を返します。"}],"hint":"左の値が truthy か falsy かで、返す値が決まります。","feedback_correct":"正解！&& と || は値そのものを返します。","feedback_incorrect":"惜しい！左の値が真か偽かを先に判断しましょう。"},{"id":"JS-030","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S03","stage_number":3,"number_in_stage":10,"title":"点数から評価を決める","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["if","else if","境界値"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 score に点数が入っています。90 点以上なら \"S\"、80 点以上なら \"A\"、70 点以上なら \"B\"、それ以外なら \"C\" を console.log で表示するコードを if / else if / else で書いてください。","code":null,"prefix_code":"const score = 95;","starter_code":"// score はあらかじめ用意されています\n","answer_format":"javascript","answer":{"reference_solution":"if (score >= 90) {\n  console.log(\"S\");\n} else if (score >= 80) {\n  console.log(\"A\");\n} else if (score >= 70) {\n  console.log(\"B\");\n} else {\n  console.log(\"C\");\n}","alternative_solutions":["if (score < 70) {\n  console.log(\"C\");\n} else if (score < 80) {\n  console.log(\"B\");\n} else if (score < 90) {\n  console.log(\"A\");\n} else {\n  console.log(\"S\");\n}","let result = \"C\";\nif (score >= 70) result = \"B\";\nif (score >= 80) result = \"A\";\nif (score >= 90) result = \"S\";\nconsole.log(result);"],"rejected_examples":[{"code":"if (score >= 70) {\n  console.log(\"B\");\n} else if (score >= 80) {\n  console.log(\"A\");\n} else if (score >= 90) {\n  console.log(\"S\");\n} else {\n  console.log(\"C\");\n}","reason":"条件の順序が逆です。90 点でも最初の score >= 70 が先に成り立って B になってしまいます。厳しい条件から書きます。"},{"code":"if (score > 90) {\n  console.log(\"S\");\n} else if (score > 80) {\n  console.log(\"A\");\n} else if (score > 70) {\n  console.log(\"B\");\n} else {\n  console.log(\"C\");\n}","reason":"境界値が違います。「90点以上」は >= 90 です。90 点ちょうどが S にならず A になってしまいます。"}]},"grading":{"method":"test_cases","engine":"js_worker","tests":[{"kind":"stdout","setup":"const score = 95;","expected_stdout":"S\n","visible":true},{"kind":"stdout","setup":"const score = 85;","expected_stdout":"A\n","visible":true},{"kind":"stdout","setup":"const score = 90;","expected_stdout":"S\n","visible":false},{"kind":"stdout","setup":"const score = 80;","expected_stdout":"A\n","visible":false},{"kind":"stdout","setup":"const score = 70;","expected_stdout":"B\n","visible":false},{"kind":"stdout","setup":"const score = 69;","expected_stdout":"C\n","visible":false},{"kind":"stdout","setup":"const score = 0;","expected_stdout":"C\n","visible":false}],"required_patterns":[],"required_any_patterns":[{"pattern":"\\bif\\b","message":"if を使ってください"},{"pattern":"\\bswitch\\b","message":"switch を使ってください"}],"forbidden_patterns":[],"timeout_sec":3,"normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"厳しい条件から順に調べ、境界の 90・80・70 を含めるために >= を使うから。","explanation":"if / else if は上から順に調べるので、90 以上 → 80 以上 → 70 以上の順に書きます。境界値（ちょうど 90 や 80 の点数）で正しく動くかを必ず確認しましょう。","hint":"厳しい条件（90以上）から順に。「以上」は >= です。","feedback_correct":"正解！境界値も正しく分けられました。","feedback_incorrect":"惜しい！ちょうど 90 点・80 点・70 点のときの結果を確認しましょう。"},{"id":"JS-031","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":1,"title":"for 文の回数","type":"predict_output","answer_mode":"choice","difficulty":1,"concepts":["for","i++"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"for (let i = 0; i < 3; i++) {\n  console.log(i);\n}","choice_format":"code","choices":[{"id":"c1","text":"1\n2\n3"},{"id":"c2","text":"0\n1\n2"},{"id":"c3","text":"0\n1\n2\n3"}],"answer":{"correct_choice_id":"c2","expected_output":"0\n1\n2"},"grading":{"method":"choice_id"},"rationale":"i は 0 から始まり、i < 3 が true の間、0・1・2 を表示するから。","explanation":"for (let i = 0; i < 3; i++) は「i を 0 にして、i が 3 未満の間、くり返し、1 回ごとに i を 1 増やす」という意味です。回数は 3 回で、3 自体は含まれません。","wrong_answer_reasons":{"c1":"i は 1 ではなく 0 から始まっています。初期化の部分 let i = 0 を確認しましょう。","c3":"条件は i < 3 なので、i が 3 になった時点でくり返しは終わり、3 は表示されません。"},"hint":"i の最初の値と、くり返しを続ける条件をそれぞれ確認しましょう。","feedback_correct":"正解！i は 0 から始まり、3 未満の間くり返します。","feedback_incorrect":"惜しい！初期化と条件の部分を確認しましょう。"},{"id":"JS-032","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":2,"title":"3ずつ増やす for 文","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["for","+="],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"for (let i = 1; i <= 10; i += 3) {\n  console.log(i);\n}","answer":{"expected_output":"1\n4\n7\n10"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"i は 1 から 3 ずつ増え、10 以下の間（1, 4, 7, 10）くり返すから。","explanation":"更新の部分は i++ だけでなく、i += 3 のように書くこともできます。1 → 4 → 7 → 10 → 13 となり、13 は条件 i <= 10 を満たさないので終わります。","common_mistakes":[{"answer":"1\n4\n7","reason":"条件は i <= 10 なので、i が 10 のときもくり返します。10 は表示されます。"},{"answer":"1\n2\n3\n4","reason":"更新の部分は i += 3 なので、1回ごとに 3 ずつ増えます。"}],"hint":"1 から 3 ずつ足して、10 以下かどうかを確認しましょう。","feedback_correct":"正解！更新の式で増え方が決まります。","feedback_incorrect":"惜しい！1, 4, 7 … と順に書き出してみましょう。"},{"id":"JS-033","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":3,"title":"for の条件の部分","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["for","条件"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"for (let i = 0; i < 5; i++) { ... } の「i < 5」の部分は、どんな役割ですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"最初に1回だけ実行される、変数の準備"},{"id":"c2","text":"1回のくり返しが終わるごとに実行される、変数の更新"},{"id":"c3","text":"くり返しを続けるかどうかを、毎回判断する条件"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"2番目の部分は、くり返しのたびに調べられる、続行の条件だから。","explanation":"for の ( ) の中は、「初期化; 条件; 更新」の3つの部分です。初期化は最初に1回だけ、条件はくり返しの前に毎回、更新は1回のくり返しの後に毎回実行されます。","wrong_answer_reasons":{"c1":"それは最初の let i = 0 の部分（初期化）です。","c2":"それは最後の i++ の部分（更新）です。"},"hint":"3つの部分は「初期化; 条件; 更新」の順です。","feedback_correct":"正解！2番目は続行の条件です。","feedback_incorrect":"惜しい！3つの部分の順番と役割を確認しましょう。"},{"id":"JS-034","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":4,"title":"while のカウントダウン","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["while","n--"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"let n = 3;\nwhile (n > 0) {\n  console.log(n);\n  n--;\n}","choice_format":"code","choices":[{"id":"c1","text":"3\n2\n1"},{"id":"c2","text":"3\n2\n1\n0"},{"id":"c3","text":"2\n1\n0"}],"answer":{"correct_choice_id":"c1","expected_output":"3\n2\n1"},"grading":{"method":"choice_id"},"rationale":"表示してから n を減らし、n が 0 になると条件が false になって終わるから。","explanation":"n が 3 → 2 → 1 のときに、それぞれ表示されます。表示のあとで n-- されるので、n が 0 になった時点で条件が false になり、0 は表示されずに終了します。","wrong_answer_reasons":{"c2":"n が 0 になると、条件 n > 0 が false になり、くり返しに入りません。0 は表示されません。","c3":"console.log(n) を先に実行してから n を減らすので、最初に表示されるのは 3 です。"},"hint":"n が 0 になったとき、n > 0 は true でしょうか？","feedback_correct":"正解！条件が false になるまでくり返します。","feedback_incorrect":"惜しい！n の値を1回ずつ追いましょう。"},{"id":"JS-035","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":5,"title":"終わらないループ","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["無限ループ","while"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"n を 1 ずつ減らして 0 になったら終わるつもりが、このプログラムは終わりません。原因はどれですか？","code":"let n = 3;\nwhile (n > 0) {\n  n++;\n}\nconsole.log(\"終了\");","choice_format":"text","choices":[{"id":"c1","text":"n++ で n が増え続け、条件がずっと true のままだから"},{"id":"c2","text":"while の条件 n > 0 の書き方が間違っている"},{"id":"c3","text":"最後の console.log が { } の外にあるから"}],"answer":{"correct_choice_id":"c1","fixed_code":"let n = 3;\nwhile (n > 0) {\n  n--;\n}\nconsole.log(\"終了\");","expected_output":"終了","buggy_error":"Timeout"},"grading":{"method":"choice_id"},"rationale":"n が増える方向に更新されるため、n > 0 がいつまでも true だから。","explanation":"n は 3 → 4 → 5 と増え続け、0 以下になりません。n-- に直せば 3 → 2 → 1 → 0 と減って、条件が false になり、ループが終わります。","wrong_answer_reasons":{"c2":"n > 0 は「n が 0 より大きい間」という正しい書き方です。問題は中で n が増えている点です。","c3":"{ } の外にある行は、ループが終わったあとに1回だけ実行される、正しい書き方です。"},"hint":"1回ごとに n はどちらの方向に変わりますか？","feedback_correct":"正解！更新の向きが逆でした。","feedback_incorrect":"惜しい！ループの中で n がどう変わるか注目しましょう。"},{"id":"JS-036","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":6,"title":"合計を求める","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["累積","+="],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"1 から 4 までの合計を求めます。10 と表示されるように、【空欄1】に入れる演算子を答えてください。","code":"let total = 0;\nfor (let i = 1; i <= 4; i++) {\n  total __1__ i;\n}\nconsole.log(total);","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["+="],"quote_insensitive":false}],"expected_output":"10"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"ループの中で total に i を足し込んでいくには、+= を使うから。","explanation":"total += i は total = total + i と同じです。1 + 2 + 3 + 4 = 10 になります。= だと、前の値が消えてしまいます。","common_mistakes":[{"blank":"b1","answer":"=","reason":"= は上書きなので、毎回 total が i に置き換わり、最後は 4 と表示されます。足し込むには += です。"}],"hint":"「足して代入し直す」演算子です。","feedback_correct":"正解！+= で足し込めます。","feedback_incorrect":"惜しい！= だと上書きになります。"},{"id":"JS-037","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":7,"title":"continue と break","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["continue","break"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"for (let i = 1; i <= 5; i++) {\n  if (i === 2) {\n    continue;\n  }\n  if (i === 4) {\n    break;\n  }\n  console.log(i);\n}","answer":{"expected_output":"1\n3"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"2 は continue で飛ばされ、4 で break してループが終わるから。","explanation":"i = 1 は表示。i = 2 は continue で次の回へ。i = 3 は表示。i = 4 で break し、ループそのものが終了します。そのため 1 と 3 だけが表示されます。","common_mistakes":[{"answer":"1\n2\n3","reason":"i が 2 のときは continue で console.log を飛ばすので、2 は表示されません。"},{"answer":"1\n3\n5","reason":"i が 4 のとき break でループ全体が終わるので、5 には到達しません。"}],"hint":"continue は「この回だけ飛ばす」、break は「ループを終える」です。","feedback_correct":"正解！continue と break の違いを理解できています。","feedback_incorrect":"惜しい！i の値ごとに、何が起きるか表に書いてみましょう。"},{"id":"JS-038","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":8,"title":"入れ子のループ","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["入れ子のループ","文字列の連結"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"for (let i = 1; i <= 3; i++) {\n  let line = \"\";\n  for (let j = 0; j < i; j++) {\n    line += \"*\";\n  }\n  console.log(line);\n}","answer":{"expected_output":"*\n**\n***"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"外側の i が 1, 2, 3 と増え、内側で i 個の * が足されるから。","explanation":"i = 1 のとき内側は 1 回で \"*\"、i = 2 のとき 2 回で \"**\"、i = 3 のとき 3 回で \"***\"。line は外側の1回ごとに空文字列に戻り、そのたびに1行表示されます。","common_mistakes":[{"answer":"***\n***\n***","reason":"内側のループの回数は i です。i が 1, 2, 3 と増えるので、* の数も増えます。"},{"answer":"*\n*\n*","reason":"内側のループの中で line に * を足し込むので、i が大きいほど * が増えます。"}],"hint":"外側の i が1つ進むごとに、内側のループは最初から回ります。","feedback_correct":"正解！入れ子のループを正確に追えました。","feedback_incorrect":"惜しい！i ごとに内側が何回まわるかを確認しましょう。"},{"id":"JS-039","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":9,"title":"合計が合わない（範囲のミス）","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["for","オフバイワン","比較演算子"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"1 から 5 までの合計 15 を求めるつもりが、10 と表示されます。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":"let total = 0;\nfor (let i = 1; i < 5; i++) {\n  total += i;\n}\nconsole.log(total);","answer":{"target_line":2,"accepted":["for (let i = 1; i <= 5; i++) {","for (let i = 1; i < 6; i++) {","for (let i = 1; i <= 5; i++){","for (let i = 1; i < 6; i++){"],"quote_insensitive":false,"fixed_code":"let total = 0;\nfor (let i = 1; i <= 5; i++) {\n  total += i;\n}\nconsole.log(total);","expected_output":"15","buggy_output":"10"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"5 まで含めるには、条件を i <= 5（または i < 6）にする必要があるから。","explanation":"i < 5 は、i が 5 になった時点で終わるため、5 を足せません。「以下」を表す <= を使って i <= 5 にします。回数の数え間違いは「オフバイワン」と呼ばれる、よくあるミスです。","common_mistakes":[{"answer":"for (let i = 1; i < 5; i++) {","reason":"元のコードのままです。i < 5 だと 5 は含まれず、1〜4 の合計 10 になります。"}],"hint":"i が 5 のとき、条件 i < 5 は true でしょうか？","feedback_correct":"正解！5 を含める条件にしました。","feedback_incorrect":"惜しい！条件が i = 5 のときに true になるか確認しましょう。"},{"id":"JS-040","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S04","stage_number":4,"number_in_stage":10,"title":"1 から n までの合計","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["for","累積","while"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"変数 n に正の整数が入っています。1 から n までの整数の合計を、くり返し（for または while）を使って求め、console.log で表示するコードを書いてください。","code":null,"prefix_code":"const n = 5;","starter_code":"// n はあらかじめ用意されています\n","answer_format":"javascript","answer":{"reference_solution":"let total = 0;\nfor (let i = 1; i <= n; i++) {\n  total += i;\n}\nconsole.log(total);","alternative_solutions":["let total = 0;\nlet i = 1;\nwhile (i <= n) {\n  total += i;\n  i++;\n}\nconsole.log(total);"],"rejected_examples":[{"code":"let total = 0;\nfor (let i = 1; i < n; i++) {\n  total += i;\n}\nconsole.log(total);","reason":"i < n だと n が足されません。n まで含めるには i <= n です。"},{"code":"console.log(15);","reason":"決まった数値を書くと、n が変わったときに正しい結果になりません。くり返しで求めましょう。"}]},"grading":{"method":"test_cases","engine":"js_worker","tests":[{"kind":"stdout","setup":"const n = 5;","expected_stdout":"15\n","visible":true},{"kind":"stdout","setup":"const n = 1;","expected_stdout":"1\n","visible":false},{"kind":"stdout","setup":"const n = 100;","expected_stdout":"5050\n","visible":false},{"kind":"stdout","setup":"const n = 10;","expected_stdout":"55\n","visible":false}],"required_patterns":[],"required_any_patterns":[{"pattern":"\\bfor\\b","message":"for を使ってください"},{"pattern":"\\bwhile\\b","message":"while を使ってください"}],"forbidden_patterns":[],"timeout_sec":3,"normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"合計用の変数を 0 で用意し、1 から n までくり返して足し込むから。","explanation":"let total = 0; で用意し、i を 1 から n まで動かして total に足します。for の条件は i <= n と書くのがポイントです。n = 1 のときなど、端の値でも確かめましょう。","hint":"合計用の変数を 0 で用意して、ループの中で足し込みます。条件は i <= n です。","feedback_correct":"正解！くり返しで合計を求められました。","feedback_incorrect":"惜しい！n = 1 のとき、n = 5 のときの結果を手計算して比べましょう。"},{"id":"JS-041","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":1,"title":"最初の要素の取り出し方","type":"multiple_choice","answer_mode":"choice","difficulty":1,"concepts":["配列","添字"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"const colors = [\"赤\", \"青\", \"緑\"]; という配列から、最初の要素「赤」を取り出す式はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"colors[1]"},{"id":"c2","text":"colors[0]"},{"id":"c3","text":"colors(0)"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"配列の添字は 0 から始まり、取り出しには [ ] を使うから。","explanation":"colors[0] が「赤」、colors[1] が「青」、colors[2] が「緑」です。プログラミングでは、数え始めを 0 にするのが一般的です。","wrong_answer_reasons":{"c1":"添字は 0 から始まります。colors[1] は2番目の要素「青」です。","c3":"要素の取り出しには [ ] を使います。( ) は関数を呼び出す記号で、colors は関数ではないので TypeError になります。"},"hint":"数え始めは 0 です。","feedback_correct":"正解！最初の要素は [0] です。","feedback_incorrect":"惜しい！添字は 0 から始まり、取り出しには [ ] を使います。"},{"id":"JS-042","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":2,"title":"length と範囲外の添字","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["length","undefined","範囲外"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールにはどう表示されますか？","code":"const nums = [4, 8, 15, 16];\nconsole.log(nums.length);\nconsole.log(nums[nums.length - 1]);\nconsole.log(nums[4]);","choice_format":"code","choices":[{"id":"c1","text":"3\n16\nundefined"},{"id":"c2","text":"4\n16\nエラー"},{"id":"c3","text":"4\n16\nundefined"}],"answer":{"correct_choice_id":"c3","expected_output":"4\n16\nundefined"},"grading":{"method":"choice_id"},"rationale":"要素は4つで、最後の要素は添字 3 の 16、範囲外の添字 4 は undefined になるから。","explanation":"length は要素の数 4 を返します。最後の要素は nums[length - 1] = nums[3] で 16。nums[4] は存在しないので undefined です。","wrong_answer_reasons":{"c1":"length は最後の添字ではなく、要素の数です。要素は4つあるので 4 です。","c2":"範囲外の添字を読んでも、JavaScript ではエラーにならず undefined になります（エラーになる言語もあるので注意）。"},"hint":"添字は 0〜3 までです。4 はどうなるでしょう？","feedback_correct":"正解！範囲外は undefined です。","feedback_incorrect":"惜しい！length は個数、範囲外の添字は undefined です。"},{"id":"JS-043","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":3,"title":"置き換え・追加・削除","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["push","pop","要素の置き換え"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"次のコードを実行したとき、コンソールに表示される内容を入力してください（複数行は改行して入力）。","code":"const nums = [10, 20, 30];\nnums[1] = 99;\nnums.push(40);\nnums.pop();\nconsole.log(nums.join(\",\"));\nconsole.log(nums.length);","answer":{"expected_output":"10,99,30\n3"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"2つ目が 99 に置き換わり、40 を追加したあと pop() で削除されるから。","explanation":"nums は [10, 20, 30] → [10, 99, 30] → [10, 99, 30, 40] → [10, 99, 30] と変わります。join(\",\") で , でつないだ文字列にして表示します。","common_mistakes":[{"answer":"10,20,30\n3","reason":"nums[1] = 99 で、2つ目の要素（添字 1）が 99 に置き換わっています。"},{"answer":"10,99,30,40\n4","reason":"最後の pop() が末尾の 40 を削除しています。"}],"hint":"1行ずつ、配列の中身がどう変わるか書き出しましょう。","feedback_correct":"正解！配列の中身の変化を追えました。","feedback_incorrect":"惜しい！1行ずつ配列の中身を書き出しましょう。"},{"id":"JS-044","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript","stage_id":"S05","stage_number":5,"number_in_stage":4,"title":"push の書き間違い","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["push","メソッド呼び出し"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。ブラウザ上で動く JavaScript（ES2015 以降）を扱い、Node.js 固有の機能や外部ライブラリは使わない。","prompt":"配列 a に 4 を追加して、length の 4 を表示したいのに 3 と表示されます。2行目を直したものはどれですか？","code":"const a = [1, 2, 3];\na.push[4];\nconsole.log(a.length);","choice_format":"code","choices":[{"id":"c1","text":"a.push(4);"},{"id":"c2","text":"a.add(4);"},{"id":"c3","text":"a.push 4;"}],"answer":{"correct_choice_id":"c1","fixed_code":"const a = [1, 2, 3];\na.push(4);\nconsole.log(a.length);","expected_output":"4","buggy_output":"3","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"push はメソッドなので、( ) を付けて呼び出す必要があるから。","explanation":"a.push[4] は「push という値の、添字 4 の要素」を読み出しているだけで、何も追加されません。エラーにもならないので、気づきにくいミスです。呼び出しには ( ) を使います。","wrong_answer_reasons":{"c2":"配列に add というメソッドはありません。a.add is not a function という TypeError になります。","c3":"メソッドを呼び出すときは ( ) が必要です。( ) がないと SyntaxError になります。"},"hint":"関数やメソッドを呼び出すとき、使う記号は [ ] ですか？ ( ) ですか？","feedback_correct":"正解！メソッドは ( ) で呼び出します。","feedback_incorrect":"惜しい！呼び出しに使う記号を確認しましょう。"},{"id":"JS-045","course_id":"javascript-basics-ja","language":"javascript","code_language":"javascript"
