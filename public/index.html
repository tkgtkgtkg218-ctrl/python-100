、文字列にも同じ記号が使えます。","common_mistakes":[{"answer":"Py thon\nPyPy","reason":"+ で連結すると間に空白は入りません。空白が入るのは print にカンマで渡したときです。"},{"answer":"Python\nPy2","reason":"文字列 * 数 は、その回数だけ文字列を繰り返します。"}],"hint":"+ は「つなぐ」、* は「繰り返す」です。空白は入りません。","feedback_correct":"正解！+ は連結、* は繰り返しです。","feedback_incorrect":"惜しい！文字列の + と * の意味を確認しましょう。"},{"id":"PY-017","course_id":"python-basics-ja","language":"python","stage_id":"S02","stage_number":2,"number_in_stage":7,"title":"f文字列に変数を埋め込む","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["f文字列","変数"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"変数 name と age の値を使って「Hanaさんは12歳です」と表示したい。空欄 __1__ と __2__ に入れるものを答えてください。","code":"name = \"Hana\"\nage = 12\nprint(f\"__1__さんは__2__歳です\")","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["{name}"],"quote_insensitive":false},{"id":"b2","marker":"__2__","accepted":["{age}"],"quote_insensitive":false}],"expected_output":"Hanaさんは12歳です"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"f文字列では { } の中に変数名を書くと値に置き換わるから。","explanation":"f\"...\" の中で {name} と書くと、変数 name の値 Hana に置き換わります。波括弧を忘れると、name という文字がそのまま表示されます。","common_mistakes":[{"blank":"b1","answer":"name","reason":"波括弧 { } がないと、name という文字がそのまま表示されます。"},{"blank":"b2","answer":"age","reason":"波括弧 { } がないと、age という文字がそのまま表示されます。"}],"hint":"変数名を { } で囲みます。","feedback_correct":"正解！{変数名} で値を埋め込めます。","feedback_incorrect":"惜しい！波括弧 { } で変数名を囲みましょう。"},{"id":"PY-018","course_id":"python-basics-ja","language":"python","stage_id":"S02","stage_number":2,"number_in_stage":8,"title":"変数名のエラー","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["変数名のルール","SyntaxError"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードは SyntaxError になります。正しい直し方はどれですか？","code":"my score = 80\nprint(my score)","choice_format":"text","choices":[{"id":"c1","text":"80 を引用符で囲む"},{"id":"c2","text":"= を == に変える"},{"id":"c3","text":"my score を my_score のように _ でつなぐ"}],"answer":{"correct_choice_id":"c3","fixed_code":"my_score = 80\nprint(my_score)","expected_output":"80","buggy_error":"SyntaxError"},"grading":{"method":"choice_id"},"rationale":"変数名には空白が使えず、_ でつなぐのが一般的だから。","explanation":"my score は2つの別の名前が並んでいるように見えるため、Python は文法を理解できず SyntaxError になります。単語の区切りには _ を使います。","wrong_answer_reasons":{"c1":"原因は変数名の空白です。80 を文字列にしても、変数名の問題は残ります。","c2":"== は等しいか調べる記号です。ここで必要なのは代入で、問題は変数名にあります。"},"hint":"変数名の中に、使えない文字が入っていませんか？","feedback_correct":"正解！変数名の空白は _ に置き換えます。","feedback_incorrect":"惜しい！エラーの原因は変数名にあります。"},{"id":"PY-019","course_id":"python-basics-ja","language":"python","stage_id":"S02","stage_number":2,"number_in_stage":9,"title":"平均の計算ミス","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["計算の優先順位","括弧"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"a と b の平均を求めるつもりですが、7.0 ではなく 12.0 と表示されます。3行目を正しく書き直して入力してください（3行目の内容だけを入力）。","code":"a = 10\nb = 4\naverage = a + b / 2\nprint(average)","answer":{"target_line":3,"accepted":["average = (a + b) / 2","average=(a + b) / 2","average = (a+b) / 2","average=(a+b) / 2","average = (a + b)/2","average=(a + b)/2","average = (a+b)/2","average=(a+b)/2","average = (b + a) / 2","average=(b + a) / 2","average = (b+a) / 2","average=(b+a) / 2","average = (b + a)/2","average=(b + a)/2","average = (b+a)/2","average=(b+a)/2"],"quote_insensitive":false,"fixed_code":"a = 10\nb = 4\naverage = (a + b) / 2\nprint(average)","expected_output":"7.0","buggy_output":"12.0"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"割り算が足し算より先に計算されるため、足し算を ( ) で囲む必要があるから。","explanation":"a + b / 2 は b / 2 が先に計算され、10 + 2.0 = 12.0 になります。(a + b) / 2 と書けば先に足し算が行われ、14 / 2 = 7.0 です。計算順序を変えたいときは ( ) を使います。","common_mistakes":[{"answer":"average = a + b / 2","reason":"元のコードのままです。割り算が先に計算されるため、足し算を先にするには ( ) が必要です。"}],"hint":"先に足し算してから割るには、どうすればよいでしょう？","feedback_correct":"正解！( ) で足し算を先に計算させました。","feedback_incorrect":"惜しい！割り算が先に計算されている点に注目しましょう。"},{"id":"PY-020","course_id":"python-basics-ja","language":"python","stage_id":"S02","stage_number":2,"number_in_stage":10,"title":"長方形の面積","type":"code_write","answer_mode":"code","difficulty":2,"concepts":["変数","掛け算","print関数"],"preconditions":"ステージ1〜2で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"変数 width（横）と height（縦）に長方形の大きさが入っています。面積（width × height）を print で表示するコードを書いてください。数値を直接書かず、変数を使うこと。","code":null,"prefix_code":"width = 5\nheight = 3","starter_code":"# width と height はあらかじめ用意されています\n","answer":{"reference_solution":"print(width * height)","alternative_solutions":["area = width * height\nprint(area)","print(height * width)","print(width*height)"],"rejected_examples":[{"code":"print(15)","reason":"決まった数値を書くと、width や height が変わったときに正しい結果になりません。変数を使いましょう。"},{"code":"print(width + height)","reason":"面積は縦×横です。足し算ではありません。"}]},"grading":{"method":"test_cases","tests":[{"kind":"stdout","setup":"width = 5\nheight = 3","expected_stdout":"15\n","visible":true},{"kind":"stdout","setup":"width = 7\nheight = 2","expected_stdout":"14\n","visible":false},{"kind":"stdout","setup":"width = 0\nheight = 9","expected_stdout":"0\n","visible":false}],"required_ast_nodes":[],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"変数を使った式なら、値が変わっても正しい面積が表示されるから。","explanation":"print(width * height) のように変数同士をかけ算します。結果をいったん area などの変数に入れてから表示する書き方でも正解です。","hint":"* でかけ算できます。変数名をそのまま式の中に書きましょう。","feedback_correct":"正解！変数を使って面積を計算できました。","feedback_incorrect":"惜しい！変数 width と height を使った式になっていますか？"},{"id":"PY-021","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":1,"title":"等しいかどうかを調べる","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["比較演算子","==","代入との違い"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"変数 x が 10 に等しいかどうかを調べる条件として、正しい書き方はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"x = 10"},{"id":"c2","text":"x == 10"},{"id":"c3","text":"x === 10"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"Python で「等しいか」を調べる比較演算子は == だから。","explanation":"= は右の値を左の変数に入れる代入、== は左右が等しいかを調べる比較です。if x == 10: のように、条件の中では必ず == を使います。","wrong_answer_reasons":{"c1":"= は代入です。条件の中で使うと SyntaxError になります。等しいかを調べるには == を使います。","c3":"=== は他の言語（JavaScript など）の書き方で、Python にはありません。"},"hint":"= を2つ並べる記号です。","feedback_correct":"正解！等しいかどうかは == で調べます。","feedback_incorrect":"惜しい！= は代入、== が「等しい」です。"},{"id":"PY-022","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":2,"title":"以上と等しくない","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["比較演算子","真偽値"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"print(10 >= 10)\nprint(3 != 3)","choice_format":"code","choices":[{"id":"c1","text":"True\nTrue"},{"id":"c2","text":"True\nFalse"},{"id":"c3","text":"False\nFalse"}],"answer":{"correct_choice_id":"c2","expected_output":"True\nFalse"},"grading":{"method":"choice_id"},"rationale":"10 >= 10 は等しいので True、3 != 3 は等しいので False になるから。","explanation":">= は「より大きい、または等しい」です。10 と 10 は等しいので True。!= は「等しくない」ですが、3 と 3 は等しいので結果は False です。","wrong_answer_reasons":{"c1":"3 != 3 は「3 と 3 が等しくない」という主張です。3 と 3 は等しいので、この主張は False です。","c3":">= は「以上」で、等しい場合も含みます。10 >= 10 は True です。"},"hint":">= は「等しい場合を含む」。!= は「等しくないか」を問います。","feedback_correct":"正解！境界（等しい場合）の扱いを押さえました。","feedback_incorrect":"惜しい！>= に「等しい」が含まれる点と、!= の意味を確認しましょう。"},{"id":"PY-023","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":3,"title":"if の外にある行","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["if","else","インデント"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"score = 55\nif score >= 60:\n    print(\"合格\")\nelse:\n    print(\"不合格\")\nprint(\"終わり\")","answer":{"expected_output":"不合格\n終わり"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"55は60未満なのでelse側が実行され、字下げのない最後の行は常に実行されるから。","explanation":"score >= 60 は False なので else の「不合格」が表示されます。6行目は字下げがなく if 文の外なので、条件に関係なく最後に必ず実行されます。インデントが処理の範囲を決めています。","common_mistakes":[{"answer":"不合格","reason":"最後の print(\"終わり\") は字下げされていないので if/else の外にあり、必ず実行されます。"},{"answer":"合格\n終わり","reason":"55 >= 60 は False なので、「合格」は表示されません。"}],"hint":"字下げされていない行は、いつ実行されるでしょう？","feedback_correct":"正解！字下げの有無で実行される範囲が変わります。","feedback_incorrect":"惜しい！条件の結果と、字下げのない行の扱いを確認しましょう。"},{"id":"PY-024","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":4,"title":"elif は最初の1つだけ","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["elif","条件分岐の順序"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、何が表示されますか？","code":"score = 85\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"D\")","choice_format":"code","choices":[{"id":"c1","text":"A"},{"id":"c2","text":"B\nC"},{"id":"c3","text":"B"}],"answer":{"correct_choice_id":"c3","expected_output":"B"},"grading":{"method":"choice_id"},"rationale":"85 >= 90 は False、次の 85 >= 80 が True で、その後の elif は調べないから。","explanation":"if / elif / else は上から順に条件を調べ、最初に True になったブロックだけを実行します。85 は 80 以上なので B を表示して終了です。85 >= 70 も True ですが、調べられません。","wrong_answer_reasons":{"c1":"85 >= 90 は False なので、A のブロックは実行されません。","c2":"elif は上から順に調べ、最初に成立した1つで終了します。B が表示されたあと C の条件は調べられません。"},"hint":"最初に True になった所で、残りは無視されます。","feedback_correct":"正解！最初に成立した1つだけが実行されます。","feedback_incorrect":"惜しい！上から順に、最初に True になる所を探しましょう。"},{"id":"PY-025","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":5,"title":"インデントの役割","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["インデント","ブロック"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"if 文の下の行を字下げ（インデント）する理由として、正しいものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"条件が成り立ったときに実行する範囲を示すため"},{"id":"c2","text":"見た目を整えるだけで、なくても動作は変わらない"},{"id":"c3","text":"その行がコメントとして扱われるため"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"Python は字下げでどの行が if の中かを判断するから。","explanation":"多くの言語では { } で範囲を示しますが、Python は字下げで範囲を表します。字下げされた行が if のブロックで、条件が True のときだけ実行されます。","wrong_answer_reasons":{"c2":"Python ではインデントが文法の一部です。ないとエラーになったり、実行される範囲が変わったりします。","c3":"コメントは # で始めます。字下げされた行は普通に実行されるコードです。"},"hint":"字下げした行と、しない行で実行のされ方がどう変わるか思い出しましょう。","feedback_correct":"正解！インデントは処理の範囲を示します。","feedback_incorrect":"惜しい！インデントは見た目だけではなく文法の一部です。"},{"id":"PY-026","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":6,"title":"条件で = を使っている","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["==","SyntaxError","if"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードは SyntaxError になります。「成人」と表示されるように直したものはどれですか？","code":"age = 18\nif age = 18:\n    print(\"成人\")","choice_format":"code","choices":[{"id":"c1","text":"if age == 18:"},{"id":"c2","text":"if age => 18:"},{"id":"c3","text":"if (age = 18):"}],"answer":{"correct_choice_id":"c1","fixed_code":"age = 18\nif age == 18:\n    print(\"成人\")","expected_output":"成人","buggy_error":"SyntaxError","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"等しいかを調べるには、代入の = ではなく比較の == を使うから。","explanation":"if の条件は True / False になる式でなければならず、代入の = は使えません。等しいかを調べるときは == と書きます。","wrong_answer_reasons":{"c2":"「以上」は >= です。=> という記号は Python にはなく、SyntaxError になります。","c3":"括弧で囲んでも = は代入のままです。条件の中では代入できないので SyntaxError になります。"},"hint":"条件の中は「調べる」場面です。代入と比較の記号はどれでしたか？","feedback_correct":"正解！条件には == を使います。","feedback_incorrect":"惜しい！等しいかを調べる記号は == です。"},{"id":"PY-027","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":7,"title":"else のコロン","type":"bug_fix","answer_mode":"text","difficulty":2,"concepts":["else","コロン","SyntaxError"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードは SyntaxError になります。4行目を正しく書き直して入力してください（4行目の内容だけを入力）。","code":"x = 2\nif x > 3:\n    print(\"big\")\nelse\n    print(\"small\")","answer":{"target_line":4,"accepted":["else:","else :"],"quote_insensitive":false,"fixed_code":"x = 2\nif x > 3:\n    print(\"big\")\nelse:\n    print(\"small\")","expected_output":"small","buggy_error":"SyntaxError"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"if・elif・else の行の末尾にはコロン（:）が必要だから。","explanation":"Python は else の後ろの : を見て「ここからブロックが始まる」と判断します。コロンがないと文法が成り立たず SyntaxError になります。","common_mistakes":[{"answer":"else","reason":"コロン（:）がないままです。if・elif・else の行末には : が必要です。"}],"hint":"if の行の終わりと見比べてみましょう。","feedback_correct":"正解！else の後ろにはコロンが必要です。","feedback_incorrect":"惜しい！if の行の終わりと見比べてみましょう。"},{"id":"PY-028","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":8,"title":"両方の条件を満たすとき","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["and","or","論理演算"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"「18歳以上 かつ チケットを持っている」ときだけ「入場OK」と表示したい。空欄 __1__ に入れる語を答えてください。（この例では、チケットを持っていないので「入場できません」と表示されるのが正しい動作です）","code":"age = 20\nhas_ticket = False\nif age >= 18 __1__ has_ticket:\n    print(\"入場OK\")\nelse:\n    print(\"入場できません\")","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["and"],"quote_insensitive":false}],"expected_output":"入場できません"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"「かつ」は両方が True のときだけ True になる and で表すから。","explanation":"and は2つの条件がどちらも True のときだけ True です。この例では has_ticket が False なので、全体は False になり else 側が実行されます。or なら片方が True で全体が True になってしまい、条件の意図と合いません。","common_mistakes":[{"blank":"b1","answer":"or","reason":"or は「どちらか一方でも True なら True」です。年齢条件が True なので「入場OK」と表示されてしまいます。"}],"hint":"「両方」を満たす必要があるとき、どの語を使うでしょう？","feedback_correct":"正解！「かつ」は and です。","feedback_incorrect":"惜しい！and と or の違いを見直しましょう。"},{"id":"PY-029","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":9,"title":"and・or・not の結果","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["and","or","not","比較演算子"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"a = 5\nprint(a > 3 and a < 10)\nprint(a < 3 or a > 4)\nprint(not a == 5)","answer":{"expected_output":"True\nTrue\nFalse"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"1行目は両方True、2行目は片方True、3行目はTrueの反転でFalseだから。","explanation":"a は 5。1行目: 5 > 3 も 5 < 10 も True なので and は True。2行目: 5 < 3 は False、5 > 4 は True で、or は片方でも True なら True。3行目: a == 5 は True で、not で反転して False です。","common_mistakes":[{"answer":"True\nFalse\nTrue","reason":"2行目は a < 3 が False でも a > 4 が True なので、or 全体は True です。3行目は a == 5 が True なので not で False になります。"},{"answer":"True\nTrue\nTrue","reason":"3行目は not が True を False に反転します。"}],"hint":"1つずつ True / False に置き換えてから、and・or・not を当てはめます。","feedback_correct":"正解！論理演算子を正しく読めています。","feedback_incorrect":"惜しい！式を小さく分けて、True / False に置き換えてみましょう。"},{"id":"PY-030","course_id":"python-basics-ja","language":"python","stage_id":"S03","stage_number":3,"number_in_stage":10,"title":"合否判定","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["if","else","比較演算子","境界値"],"preconditions":"ステージ1〜3で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"変数 score に点数が入っています。60点以上なら「合格」、そうでなければ「不合格」と表示するコードを書いてください。","code":null,"prefix_code":"score = 70","starter_code":"# score はあらかじめ用意されています\n","answer":{"reference_solution":"if score >= 60:\n    print(\"合格\")\nelse:\n    print(\"不合格\")","alternative_solutions":["if score < 60:\n    print(\"不合格\")\nelse:\n    print(\"合格\")","if score >= 60:\n    print('合格')\nelif score < 60:\n    print('不合格')"],"rejected_examples":[{"code":"if score > 60:\n    print(\"合格\")\nelse:\n    print(\"不合格\")","reason":"60点ちょうどが「不合格」になります。60「以上」は >= です。"},{"code":"print(\"合格\")","reason":"常に「合格」と表示されます。条件によって切り替えるには if が必要です。"}]},"grading":{"method":"test_cases","tests":[{"kind":"stdout","setup":"score = 70","expected_stdout":"合格\n","visible":true},{"kind":"stdout","setup":"score = 60","expected_stdout":"合格\n","visible":false},{"kind":"stdout","setup":"score = 59","expected_stdout":"不合格\n","visible":false},{"kind":"stdout","setup":"score = 0","expected_stdout":"不合格\n","visible":false}],"required_ast_nodes":["If"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"境界の60を含めるため >= を使い、if / else で2通りに分けるから。","explanation":"60 以上は score >= 60 と書きます。60 ちょうどのときを間違えやすいので、境界の値を必ず確認しましょう。else を使えば「それ以外」をまとめて書けます。","hint":"60「以上」を表す記号は？ else は「それ以外」です。","feedback_correct":"正解！境界値も正しく扱えました。","feedback_incorrect":"惜しい！60点ちょうどのときの結果を確認しましょう。"},{"id":"PY-031","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":1,"title":"range(3) の中身","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["for","range"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"for i in range(3):\n    print(i)","choice_format":"code","choices":[{"id":"c1","text":"1\n2\n3"},{"id":"c2","text":"0\n1\n2"},{"id":"c3","text":"0\n1\n2\n3"}],"answer":{"correct_choice_id":"c2","expected_output":"0\n1\n2"},"grading":{"method":"choice_id"},"rationale":"range(3) は 0,1,2 の3つの整数を作るから。","explanation":"range(n) は 0 から始まり n の1つ手前まで、合計 n 個の整数を作ります。for はその値を1つずつ i に入れて、字下げした部分を実行します。","wrong_answer_reasons":{"c1":"range(3) は 1 からではなく 0 から始まります。","c3":"range(3) の 3 は「終了」で、その値自体は含まれません。3回繰り返し、i は 0,1,2 です。"},"hint":"range(3) は「3回」繰り返します。始まりはいくつ？","feedback_correct":"正解！range(3) は 0,1,2 です。","feedback_incorrect":"惜しい！range(n) は 0 から始まり、n は含まれません。"},{"id":"PY-032","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":2,"title":"間隔つき range","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["range","間隔(step)"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"for i in range(1, 10, 3):\n    print(i)","answer":{"expected_output":"1\n4\n7"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"1から3ずつ増やし、10未満の値（1, 4, 7）だけが出るから。","explanation":"range(開始, 終了, 間隔) は、開始から間隔ずつ増やし、終了より小さい間だけ値を作ります。1→4→7→10 ですが、10 は終了と同じで含まれないため 7 で終わります。","common_mistakes":[{"answer":"1\n4\n7\n10","reason":"終了の値 10 は含まれません。range(1, 10, 3) は 10 より小さい値だけです。"},{"answer":"1\n3\n5\n7\n9","reason":"3つ目の値 3 は「間隔」で、1 から 3 ずつ増えます（2 ずつではありません）。"}],"hint":"1, 1+3, 1+3+3 ... と書き出し、10 に届いたら止めます。","feedback_correct":"正解！間隔ごとに進み、終了は含みません。","feedback_incorrect":"惜しい！3つ目の数字は「間隔」です。"},{"id":"PY-033","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":3,"title":"条件で繰り返す","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["while","if","for"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"「変数 count が 0 より大きい間」処理を繰り返したいとき、使う文はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"if count > 0:"},{"id":"c2","text":"while count > 0:"},{"id":"c3","text":"for count > 0:"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"条件が True の間繰り返すのは while だから。","explanation":"while 条件: は、条件が True の間、字下げした部分を何度でも実行します。if は1回だけ判断、for は決まった範囲を順に取り出す繰り返しです。","wrong_answer_reasons":{"c1":"if は条件が成り立つかを1回だけ判断します。繰り返しはしません。","c3":"for は range() やリストなどから1つずつ取り出して繰り返す文で、条件式を直接書くことはできません（SyntaxError）。"},"hint":"「〜の間」を表す英単語は？","feedback_correct":"正解！条件が True の間は while です。","feedback_incorrect":"惜しい！「〜の間」繰り返すのは while です。"},{"id":"PY-034","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":4,"title":"2倍の合計","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["累積","range","+="],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください。","code":"total = 0\nfor i in range(1, 5):\n    total += i * 2\nprint(total)","answer":{"expected_output":"20"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"i は1〜4で、2倍した2,4,6,8の合計が20になるから。","explanation":"i が 1,2,3,4 のとき total に 2,4,6,8 が足されます。合計は 2+4+6+8 = 20。range の終了 5 は含まれないことに注意しましょう。","common_mistakes":[{"answer":"30","reason":"range(1, 5) の i は 1,2,3,4 で、5 は含まれません。2+4+6+8 = 20 です。"},{"answer":"10","reason":"足しているのは i ではなく i * 2 です。"}],"hint":"i が変わるたびに total がどう変わるか、表にして追いましょう。","feedback_correct":"正解！ループの中身を正確に追えました。","feedback_incorrect":"惜しい！i の値と、足している式を1回ずつ確認しましょう。"},{"id":"PY-035","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":5,"title":"while のカウントダウン","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["while","ループの更新"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"n = 3\nwhile n > 0:\n    print(n)\n    n -= 1","choice_format":"code","choices":[{"id":"c1","text":"3\n2\n1"},{"id":"c2","text":"3\n2\n1\n0"},{"id":"c3","text":"2\n1\n0"}],"answer":{"correct_choice_id":"c1","expected_output":"3\n2\n1"},"grading":{"method":"choice_id"},"rationale":"print のあとに n を減らし、n が0になると条件が False になるから。","explanation":"n=3 で print(3)、n=2 で print(2)、n=1 で print(1)。そのあと n は 0 になり、n > 0 が False なのでループを終了します。","wrong_answer_reasons":{"c2":"n が 0 になると条件 n > 0 が False になり、ループに入らないので 0 は表示されません。","c3":"print(n) を先に実行してから n を減らすので、最初に表示されるのは 3 です。"},"hint":"n が 0 になったとき、条件 n > 0 はどうなる？","feedback_correct":"正解！条件が False になるまで繰り返されます。","feedback_incorrect":"惜しい！n の値を1回ずつ追い、条件がいつ False になるか確認しましょう。"},{"id":"PY-036","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":6,"title":"終わらないループ","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["無限ループ","while","ループの更新"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"n を1ずつ減らして0になったら終わるつもりですが、このプログラムは終わりません。原因はどれですか？","code":"n = 3\nwhile n > 0:\n    n += 1\nprint(\"終了\")","choice_format":"text","choices":[{"id":"c1","text":"while の条件 n > 0 の書き方が間違っている"},{"id":"c2","text":"n += 1 で n が増え続け、条件がずっと True のままだから"},{"id":"c3","text":"最後の print が字下げされていないから"}],"answer":{"correct_choice_id":"c2","fixed_code":"n = 3\nwhile n > 0:\n    n -= 1\nprint(\"終了\")","expected_output":"終了","buggy_error":"Timeout"},"grading":{"method":"choice_id"},"rationale":"n が増える方向に更新されるため、n > 0 が永遠に True だから。","explanation":"n は 3 → 4 → 5 と増え続け、0 以下になることがありません。条件が False にならないので無限ループです。n -= 1 に直せば 3 → 2 → 1 → 0 となり終了します。","wrong_answer_reasons":{"c1":"n > 0 は「n が 0 より大きい間」という正しい書き方です。問題は中で n が増えている点です。","c3":"字下げのない print は while の外に書かれていて、ループが終わった後に実行されます。これは正しい書き方です。"},"hint":"ループのたびに n はどちらの方向に変わりますか？","feedback_correct":"正解！更新の向きが逆だったのが原因です。","feedback_incorrect":"惜しい！ループの中で n がどう変わるかに注目しましょう。"},{"id":"PY-037","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":7,"title":"while の更新式","type":"fill_blank","answer_mode":"text","difficulty":3,"concepts":["while","ループの更新","+="],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"1 から 4 までの合計を while で求めます。ループが正しく終わるように、空欄 __1__ に入れるコードを答えてください。","code":"total = 0\ni = 1\nwhile i <= 4:\n    total += i\n    __1__\nprint(total)","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["i += 1","i = i + 1","i=i+1","i = 1 + i","i=i + 1","i = i+1","i+=1"],"quote_insensitive":false}],"expected_output":"10"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"i を1増やして i <= 4 がいつか False になるようにする必要があるから。","explanation":"while の条件に使う i をループの中で増やさないと、いつまでも i <= 4 のままで終わりません。i += 1（または i = i + 1）で i を更新します。これで 1+2+3+4 = 10 になります。","common_mistakes":[{"blank":"b1","answer":"i + 1","reason":"i + 1 は計算するだけで、結果を i に入れ直していません。i が変わらず無限ループになります。"}],"hint":"i を 1 だけ増やして、i に入れ直す書き方は？","feedback_correct":"正解！ループの中で i を更新できました。","feedback_incorrect":"惜しい！「計算する」だけでなく「入れ直す」書き方が必要です。"},{"id":"PY-038","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":8,"title":"continue と break","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["break","continue","for"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"for i in range(1, 6):\n    if i == 2:\n        continue\n    if i == 4:\n        break\n    print(i)","answer":{"expected_output":"1\n3"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"2は continue で飛ばされ、4で break してループが終わるから。","explanation":"i=1 は表示。i=2 は continue で次の回へ。i=3 は表示。i=4 で break し、ループ自体が終了。そのため 1 と 3 だけが表示されます。","common_mistakes":[{"answer":"1\n2\n3","reason":"i が 2 のときは continue で print を飛ばすので、2 は表示されません。"},{"answer":"1\n3\n5","reason":"i が 4 になった時点で break によってループ全体が終了し、5 には到達しません。"}],"hint":"continue は「この回だけ飛ばす」、break は「ループを終える」です。","feedback_correct":"正解！continue と break の違いを理解できています。","feedback_incorrect":"惜しい！i の値ごとに、何が起きるか表にして追ってみましょう。"},{"id":"PY-039","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":9,"title":"合計が合わない（範囲のミス）","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["range","終了は含まない","オフバイワン"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"1 から 5 までの合計（15）を求めるつもりが、10 と表示されます。2行目を正しく書き直して入力してください（2行目の内容だけを入力）。","code":"total = 0\nfor i in range(1, 5):\n    total += i\nprint(total)","answer":{"target_line":2,"accepted":["for i in range(1, 6):","for i in range(1,6):","for i in range(6):","for i in range(0, 6):","for i in range(0,6):"],"quote_insensitive":false,"fixed_code":"total = 0\nfor i in range(1, 6):\n    total += i\nprint(total)","expected_output":"15","buggy_output":"10"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"range の終了の値は含まれないので、5 を含めるには終了を 6 にする必要があるから。","explanation":"range(1, 5) は 1,2,3,4 です。5 まで含めたいときは range(1, 6) と、終了を 1 つ大きくします。range(6)（0〜5）でも 0 を足すだけなので合計は 15 です。","common_mistakes":[{"answer":"for i in range(1, 5):","reason":"元のコードのままです。range の終了 5 は含まれないので、1〜4 の合計 10 になります。"}],"hint":"range の2つ目の数字は「ここまで含む」でしたか？","feedback_correct":"正解！終了の値を1つ大きくして5まで含めました。","feedback_incorrect":"惜しい！range の終了の値は含まれません。"},{"id":"PY-040","course_id":"python-basics-ja","language":"python","stage_id":"S04","stage_number":4,"number_in_stage":10,"title":"1 から n までの合計","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["for","range","累積","while"],"preconditions":"ステージ1〜4で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"変数 n に正の整数が入っています。1 から n までの整数の合計を、繰り返し（for または while）を使って求め、print で表示するコードを書いてください。","code":null,"prefix_code":"n = 5","starter_code":"# n はあらかじめ用意されています\n","answer":{"reference_solution":"total = 0\nfor i in range(1, n + 1):\n    total += i\nprint(total)","alternative_solutions":["total = 0\ni = 1\nwhile i <= n:\n    total += i\n    i += 1\nprint(total)","total = 0\nfor i in range(n + 1):\n    total = total + i\nprint(total)"],"rejected_examples":[{"code":"total = 0\nfor i in range(1, n):\n    total += i\nprint(total)","reason":"range の終了は含まれないので n が足されません。n+1 まで進めます。"},{"code":"print(15)","reason":"決まった数値を書くと、n が変わったときに正しい結果になりません。"}]},"grading":{"method":"test_cases","tests":[{"kind":"stdout","setup":"n = 5","expected_stdout":"15\n","visible":true},{"kind":"stdout","setup":"n = 1","expected_stdout":"1\n","visible":false},{"kind":"stdout","setup":"n = 100","expected_stdout":"5050\n","visible":false},{"kind":"stdout","setup":"n = 10","expected_stdout":"55\n","visible":false}],"required_ast_nodes":[],"required_any_ast_nodes":["For","While"],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"合計用の変数を0で用意し、1からnまで繰り返し足すから。","explanation":"total = 0 で用意し、i を 1 から n まで動かして total に足します。range(1, n + 1) と書くのがポイントです。n=1 のときなどの端の値も確認しましょう。","hint":"合計用の変数を 0 で用意して、ループの中で足し込みます。range の終了は n ではなく…？","feedback_correct":"正解！繰り返しで合計を求められました。","feedback_incorrect":"惜しい！n=1 や n=5 のときの結果を、手で計算して比べてみましょう。"},{"id":"PY-041","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":1,"title":"最初の要素の取り出し方","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["リスト","インデックス"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"colors = [\"赤\", \"青\", \"緑\"] というリストから、最初の要素「赤」を取り出す式はどれですか？","code":null,"choice_format":"code","choices":[{"id":"c1","text":"colors[1]"},{"id":"c2","text":"colors(0)"},{"id":"c3","text":"colors[0]"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"リストの番号は0から始まり、取り出しには [ ] を使うから。","explanation":"リストの要素は、先頭を 0 番目として数えます。colors[0] が「赤」、colors[1] が「青」、colors[2] が「緑」です。丸括弧ではなく角括弧を使う点にも注意しましょう。","wrong_answer_reasons":{"c1":"インデックスは 0 から始まります。colors[1] は2番目の要素「青」です。","c2":"要素を取り出すときは角括弧 [ ] を使います。丸括弧 ( ) は関数を呼び出す記号で、TypeError になります。"},"hint":"プログラミングでは、数え始めは 0 です。","feedback_correct":"正解！最初の要素は [0] です。","feedback_incorrect":"惜しい！番号は 0 から始まり、取り出しには [ ] を使います。"},{"id":"PY-042","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":2,"title":"len と負のインデックス","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["len","負のインデックス"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"nums = [4, 8, 15, 16]\nprint(len(nums))\nprint(nums[-1])","choice_format":"code","choices":[{"id":"c1","text":"4\n16"},{"id":"c2","text":"3\n16"},{"id":"c3","text":"4\n4"}],"answer":{"correct_choice_id":"c1","expected_output":"4\n16"},"grading":{"method":"choice_id"},"rationale":"要素は4個で、[-1] は最後の要素16を指すから。","explanation":"len(nums) は要素の数 4 を返します。nums[-1] は最後の要素で 16 です。-1 を使うと、リストの長さに関係なく最後の要素を取り出せます。","wrong_answer_reasons":{"c2":"len() は最後の番号ではなく要素の「数」を返します。要素は4つあるので 4 です。","c3":"[-1] は「最後の要素」です。要素 4 は最初の要素で、最後は 16 です。"},"hint":"len は「何個あるか」、[-1] は「一番後ろ」です。","feedback_correct":"正解！len は個数、[-1] は最後の要素です。","feedback_incorrect":"惜しい！len は個数を返し、-1 は最後の要素を表します。"},{"id":"PY-043","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":3,"title":"置き換えと追加","type":"predict_output","answer_mode":"text","difficulty":2,"concepts":["要素の置き換え","append"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください。","code":"nums = [10, 20, 30]\nnums[1] = 99\nnums.append(40)\nprint(nums)","answer":{"expected_output":"[10, 99, 30, 40]"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"1番目の要素が99に置き換わり、末尾に40が追加されるから。","explanation":"nums[1] = 99 でインデックス1（2つ目）の要素が 20 から 99 に変わります。続いて append(40) で末尾に 40 が加わり、[10, 99, 30, 40] になります。リストを print すると [ ] とカンマ付きの形で表示されます。","common_mistakes":[{"answer":"[10, 20, 30, 40]","reason":"nums[1] = 99 で、1番目（2つ目）の 20 が 99 に置き換わります。"},{"answer":"[10, 99, 30]","reason":"append(40) はリストの末尾に 40 を追加します。"}],"hint":"[1] は2つ目の要素です。append は末尾に追加します。","feedback_correct":"正解！置き換えと追加を区別できました。","feedback_incorrect":"惜しい！1行ずつ、リストの中身がどう変わるか書き出しましょう。"},{"id":"PY-044","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":4,"title":"IndexError の直し方","type":"bug_fix","answer_mode":"choice","difficulty":2,"concepts":["IndexError","インデックス"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"3つ目の要素 3 を表示するつもりが、IndexError になります。エラーなく 3 が表示されるように直した2行目はどれですか？","code":"nums = [1, 2, 3]\nprint(nums[3])","choice_format":"code","choices":[{"id":"c1","text":"print(nums[2])"},{"id":"c2","text":"print(nums[4])"},{"id":"c3","text":"print(nums(3))"}],"answer":{"correct_choice_id":"c1","fixed_code":"nums = [1, 2, 3]\nprint(nums[2])","expected_output":"3","buggy_error":"IndexError","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"3つ目の要素のインデックスは3ではなく2だから。","explanation":"要素が3つのリストで有効な番号は 0, 1, 2 です。3つ目は nums[2]。nums[3] のように要素数以上の番号を指定すると IndexError になります。","wrong_answer_reasons":{"c2":"nums[4] も範囲外です。有効な番号は 0, 1, 2 だけなので IndexError のままです。","c3":"要素の取り出しに丸括弧は使えません。TypeError になります。"},"hint":"3つ目の要素は、0から数えると何番目でしょう？","feedback_correct":"正解！3つ目は [2] です。","feedback_incorrect":"惜しい！0から数えたときの番号を考えましょう。"},{"id":"PY-045","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":5,"title":"リストを順に足す","type":"fill_blank","answer_mode":"text","difficulty":2,"concepts":["for","リスト","累積"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"リスト scores の点数を合計して 245 と表示したい。空欄 __1__ に入れるものを答えてください。","code":"scores = [70, 85, 90]\ntotal = 0\nfor s in __1__:\n    total += s\nprint(total)","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["scores"],"quote_insensitive":false}],"expected_output":"245"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"for はリストそのものを渡すと、要素を1つずつ取り出してくれるから。","explanation":"for s in scores: と書くと、scores の要素 70, 85, 90 が順に s に入ります。total に足していくと 245 になります。","common_mistakes":[{"blank":"b1","answer":"scores[0]","reason":"scores[0] は最初の要素 70（整数）で、整数は for で順に取り出せないため TypeError になります。リスト全体を渡します。"}],"hint":"for のあとには、取り出し元のリストの名前を書きます。","feedback_correct":"正解！リストを for で順に処理できました。","feedback_incorrect":"惜しい！取り出す元のリスト全体を書きましょう。"},{"id":"PY-046","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":6,"title":"in とスライス","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["in演算子","スライス"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"colors = [\"赤\", \"青\", \"緑\", \"黄\"]\nprint(\"青\" in colors)\nprint(colors[1:3])","answer":{"expected_output":"True\n['青', '緑']"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"in は含まれているかを調べ、[1:3] は1番目から2番目までを取り出すから。","explanation":"\"青\" は colors に含まれているので True。colors[1:3] は番号1（青）と番号2（緑）の2要素で、番号3（黄）は含まれません。リストの表示は文字列に引用符が付いて ['青', '緑'] となります。","common_mistakes":[{"answer":"True\n['青', '緑', '黄']","reason":"スライス [1:3] の終わり（3）は含まれません。1番目と2番目の2つだけです。"},{"answer":"True\n['赤', '青', '緑']","reason":"スライスの開始 1 は「2つ目」です。0 番目の「赤」は含まれません。"}],"hint":"スライスの終わりの番号は含まれません（range と同じです）。","feedback_correct":"正解！スライスの終わりは含まれません。","feedback_incorrect":"惜しい！スライスの開始と終了の意味を見直しましょう。"},{"id":"PY-047","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":7,"title":"最後の要素の番号","type":"multiple_choice","answer_mode":"choice","difficulty":2,"concepts":["インデックス","len"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"len(scores) が 3 のリスト scores があります。最後の要素を取り出すインデックスはいくつですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"3"},{"id":"c2","text":"1"},{"id":"c3","text":"2"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"番号は0から始まるので、最後の番号は len - 1 になるから。","explanation":"要素が3つなら番号は 0, 1, 2。最後の番号は「個数 - 1」で 2 です。scores[len(scores) - 1] と書けますし、scores[-1] とも書けます。","wrong_answer_reasons":{"c1":"要素が3つのとき、有効な番号は 0, 1, 2 です。3 は範囲外で IndexError になります。","c2":"1 は2つ目の要素の番号です。3つ並んでいる最後は、もっと後ろです。"},"hint":"0 から数えて3個並べると、最後はいくつ？","feedback_correct":"正解！最後の番号は 個数 - 1 です。","feedback_incorrect":"惜しい！0 から数えて 3 個並べてみましょう。"},{"id":"PY-048","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":8,"title":"ループの範囲が広すぎる","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["IndexError","range","len"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"点数の合計 245 を求めるつもりが IndexError になります。3行目を正しく書き直して入力してください（3行目の内容だけを入力）。","code":"scores = [70, 85, 90]\ntotal = 0\nfor i in range(len(scores) + 1):\n    total += scores[i]\nprint(total)","answer":{"target_line":3,"accepted":["for i in range(len(scores)):","for i in range(0, len(scores)):","for i in range(0,len(scores)):","for i in range(len(scores)) :"],"quote_insensitive":false,"fixed_code":"scores = [70, 85, 90]\ntotal = 0\nfor i in range(len(scores)):\n    total += scores[i]\nprint(total)","expected_output":"245","buggy_error":"IndexError"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"range(len(scores)) は 0〜2 で、有効な番号と一致するから。","explanation":"range(len(scores) + 1) は 0〜3 を作りますが、scores の番号は 0〜2 だけです。i=3 のとき scores[3] が範囲外になり IndexError です。+ 1 を外して range(len(scores)) にします。","common_mistakes":[{"answer":"for i in range(len(scores) + 1):","reason":"元のコードのままです。i が 3 になったとき scores[3] が範囲外になります。"}],"hint":"range の終了の値は含まれません。len(scores) はいくつ？","feedback_correct":"正解！range(len(...)) で番号がぴったり収まります。","feedback_incorrect":"惜しい！i がいくつまで動くかを確認しましょう。"},{"id":"PY-049","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":9,"title":"sum・max・min","type":"predict_output","answer_mode":"choice","difficulty":2,"concepts":["sum","max","min","print関数"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"data = [3, 9, 4]\nprint(sum(data), max(data), min(data))","choice_format":"code","choices":[{"id":"c1","text":"9 16 3"},{"id":"c2","text":"16 9 3"},{"id":"c3","text":"16 3 9"}],"answer":{"correct_choice_id":"c2","expected_output":"16 9 3"},"grading":{"method":"choice_id"},"rationale":"合計は3+9+4=16、最大値は9、最小値は3で、書いた順に表示されるから。","explanation":"sum は合計 16、max は最大値 9、min は最小値 3 を返します。print にカンマで並べたので、この順番で空白区切りに表示されます。","wrong_answer_reasons":{"c1":"print の引数は左から sum, max, min の順です。最初に出るのは合計の 16 です。","c3":"max は最大値、min は最小値です。順番が逆になっています。"},"hint":"sum → max → min の順に値を求めてから、並べます。","feedback_correct":"正解！組み込み関数を使いこなせています。","feedback_incorrect":"惜しい！sum と max と min それぞれの値を先に求めましょう。"},{"id":"PY-050","course_id":"python-basics-ja","language":"python","stage_id":"S05","stage_number":5,"number_in_stage":10,"title":"平均点を求める","type":"code_write","answer_mode":"code","difficulty":3,"concepts":["sum","len","割り算","リスト"],"preconditions":"ステージ1〜5で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"リスト scores に点数が入っています。平均点（合計 ÷ 人数）を print で表示するコードを書いてください。人数が変わっても正しく動くようにすること。","code":null,"prefix_code":"scores = [70, 80, 90]","starter_code":"# scores はあらかじめ用意されています\n","answer":{"reference_solution":"print(sum(scores) / len(scores))","alternative_solutions":["total = 0\nfor s in scores:\n    total += s\nprint(total / len(scores))","average = sum(scores) / len(scores)\nprint(average)"],"rejected_examples":[{"code":"print(sum(scores))","reason":"合計を人数で割っていないので平均になりません。"},{"code":"print(sum(scores) / 3)","reason":"人数を 3 と決め打ちすると、人数が変わったときに誤った結果になります。len() を使いましょう。"}]},"grading":{"method":"test_cases","tests":[{"kind":"stdout","setup":"scores = [70, 80, 90]","expected_stdout":"80.0\n","visible":true},{"kind":"stdout","setup":"scores = [1, 2]","expected_stdout":"1.5\n","visible":false},{"kind":"stdout","setup":"scores = [100]","expected_stdout":"100.0\n","visible":false},{"kind":"stdout","setup":"scores = [1, 2, 3, 4]","expected_stdout":"2.5\n","visible":false}],"required_ast_nodes":[],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"sum()で合計、len()で人数を求め、割り算すれば平均になるから。","explanation":"平均は 合計 ÷ 個数 です。sum(scores) / len(scores) と書けば、リストの長さが変わっても対応できます。/ の結果は float なので 80.0 のように表示されます。","hint":"合計は sum()、人数は len() で求められます。","feedback_correct":"正解！sum と len で平均が求められました。","feedback_incorrect":"惜しい！人数が変わっても動く式になっていますか？"},{"id":"PY-051","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":1,"title":"定義しただけでは動かない","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["関数の定義","関数の呼び出し"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードだけを実行すると、どうなりますか？","code":"def greet():\n    print(\"hi\")","choice_format":"text","choices":[{"id":"c1","text":"SyntaxError になる"},{"id":"c2","text":"hi と表示される"},{"id":"c3","text":"何も表示されない"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"def は関数を定義するだけで、呼び出さない限り中身は実行されないから。","explanation":"関数の定義は「こういう部品を作ります」という宣言です。実行したいときは greet() のように呼び出します。定義だけのコードはエラーも出ず、何も表示されません。","wrong_answer_reasons":{"c1":"書き方（文法）は正しいので、エラーにはなりません。","c2":"def は関数を「作る」だけで、中身は実行しません。表示するには greet() と呼び出す必要があります。"},"hint":"コードの最後に greet() という行はありますか？","feedback_correct":"正解！定義だけでは実行されません。","feedback_incorrect":"惜しい！呼び出しの行があるかを確認しましょう。"},{"id":"PY-052","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":2,"title":"戻り値を計算に使う","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["戻り値","関数の呼び出し"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、何が表示されますか？","code":"def add(a, b):\n    return a + b\n\nprint(add(3, 4) * 2)","choice_format":"code","choices":[{"id":"c1","text":"14"},{"id":"c2","text":"7"},{"id":"c3","text":"add(3, 4) * 2"}],"answer":{"correct_choice_id":"c1","expected_output":"14"},"grading":{"method":"choice_id"},"rationale":"add(3, 4) が7を返し、それを2倍して14になるから。","explanation":"関数を呼び出した式は、その戻り値に置き換わって計算が進みます。add(3, 4) は 7 になるので、7 * 2 = 14 が print に渡されます。","wrong_answer_reasons":{"c2":"add(3, 4) が 7 を返したあと、さらに * 2 で 14 になります。","c3":"print は式を計算した結果を表示します。コードの文字がそのまま表示されることはありません。"},"hint":"add(3, 4) をまず 7 に置き換えて考えましょう。","feedback_correct":"正解！呼び出しは戻り値に置き換わります。","feedback_incorrect":"惜しい！まず関数呼び出しの部分を戻り値に置き換えてみましょう。"},{"id":"PY-053","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":3,"title":"return のない関数の結果","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["print と return の違い","None"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"def show(x):\n    print(x)\n\nr = show(5)\nprint(r)","answer":{"expected_output":"5\nNone"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"show は表示するだけで値を返さないため、r は None になるから。","explanation":"show(5) の実行中に 5 が表示されます。しかし return がないので戻り値は None で、r = None になります。そのため最後の print(r) が None を表示します。","common_mistakes":[{"answer":"5","reason":"r に入っているのは show の戻り値です。return がないので None で、それも print で表示されます。"},{"answer":"5\n5","reason":"print は表示するだけで、値を返しません。r には 5 ではなく None が入ります。"}],"hint":"show は return していません。r には何が入るでしょう？","feedback_correct":"正解！return がないと None になります。","feedback_incorrect":"惜しい！r に入る値と、表示のタイミングを分けて考えましょう。"},{"id":"PY-054","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":4,"title":"print と return の違い","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["print と return の違い"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"関数の中の print と return の違いとして、正しい説明はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"どちらも結果を画面に表示する命令で、違いはない"},{"id":"c2","text":"print した値は、呼び出し元の変数に受け取って計算に使える"},{"id":"c3","text":"return は値を呼び出し元に返し、print は画面に表示するだけである"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"return は戻り値を渡す仕組み、print は画面表示の仕組みだから。","explanation":"計算結果をあとで使いたいなら return、人間に見せたいなら print です。return した値は print に渡して表示することもできます。","wrong_answer_reasons":{"c1":"return は画面に表示しません。呼び出し元に値を返すだけです。","c2":"print は表示するだけで、値を返しません。受け取れるのは return した値です。"},"hint":"関数の結果を別の計算に使うにはどちらが必要でしょう？","feedback_correct":"正解！役割がまったく違います。","feedback_incorrect":"惜しい！「値を返す」と「表示する」の違いを整理しましょう。"},{"id":"PY-055","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":5,"title":"結果を返す関数","type":"fill_blank","answer_mode":"text","difficulty":3,"concepts":["return","戻り値"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"長方形の面積を返す関数です。print(area(3, 4)) で 12 だけが表示されるように、空欄 __1__ に入れる語を答えてください。","code":"def area(w, h):\n    __1__ w * h\n\nprint(area(3, 4))","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["return"],"quote_insensitive":false}],"expected_output":"12"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"計算結果を呼び出し元に返すには return を使うから。","explanation":"return w * h で面積を返すと、print(area(3, 4)) は返された 12 を表示します。print を使うと関数内で 12 が表示されたうえ、外側の print が None も表示してしまいます。","common_mistakes":[{"blank":"b1","answer":"print","reason":"print だと関数の中で 12 が表示されますが、戻り値は None です。外側の print(area(3, 4)) がさらに None を表示してしまいます。"}],"hint":"結果を「返す」ための語を思い出しましょう。","feedback_correct":"正解！return で結果を返しました。","feedback_incorrect":"惜しい！表示ではなく「返す」語が必要です。"},{"id":"PY-056","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":6,"title":"引数が足りない","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["引数","TypeError","関数の呼び出し"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"add(3, 4) の結果 7 を表示したいのに、TypeError になります。4行目を直したものはどれですか？","code":"def add(a, b):\n    return a + b\n\nprint(add(3))","choice_format":"code","choices":[{"id":"c1","text":"print(add)"},{"id":"c2","text":"print(add(3, 4))"},{"id":"c3","text":"print(add[3, 4])"}],"answer":{"correct_choice_id":"c2","fixed_code":"def add(a, b):\n    return a + b\n\nprint(add(3, 4))","expected_output":"7","buggy_error":"TypeError","target_line":4,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"add は2つの引数 a と b を必要とするので、2つ渡す必要があるから。","explanation":"def add(a, b) は2つの値を受け取る関数です。add(3) だと b が足りないため TypeError になります。add(3, 4) と両方渡せば 7 が返ります。","wrong_answer_reasons":{"c1":"関数名だけでは呼び出されず、関数そのものの情報が表示されます。7 は表示されません。","c3":"関数の呼び出しには丸括弧 ( ) を使います。角括弧は TypeError になります。"},"hint":"def の行の括弧の中にいくつ名前がありますか？","feedback_correct":"正解！引数の数を関数の定義に合わせました。","feedback_incorrect":"惜しい！def の引数の数と、呼び出しの引数の数を比べましょう。"},{"id":"PY-057","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":7,"title":"デフォルト引数","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["デフォルト引数","**"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"def power(base, exp=2):\n    return base ** exp\n\nprint(power(3))\nprint(power(2, 5))","choice_format":"code","choices":[{"id":"c1","text":"6\n32"},{"id":"c2","text":"9\n32"},{"id":"c3","text":"9\n10"}],"answer":{"correct_choice_id":"c2","expected_output":"9\n32"},"grading":{"method":"choice_id"},"rationale":"exp を省略すると2が使われ、渡すとその値が使われるから。","explanation":"power(3) は exp が省略されたので 2 が入り、3 ** 2 = 9。power(2, 5) は exp=5 なので 2 ** 5 = 32 です。","wrong_answer_reasons":{"c1":"** は累乗です。power(3) は 3 を2回かける 3 ** 2 = 9 で、3 * 2 = 6 ではありません。","c3":"power(2, 5) は 2 ** 5 = 32 です。足し算 2 + 5 = 7 でも 10 でもありません。"},"hint":"1回目は exp を省略しています。デフォルト値はいくつ？","feedback_correct":"正解！省略すると初期値が使われます。","feedback_incorrect":"惜しい！省略したときの exp の値と、** の意味を見直しましょう。"},{"id":"PY-058","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":8,"title":"合計が1にしかならない","type":"bug_fix","answer_mode":"choice","difficulty":4,"concepts":["return","インデント","ループ"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"[1, 2, 3] の合計 6 を返す関数のつもりが、1 が返ってきます。原因を正しく直す方法はどれですか？","code":"def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n        return s\n\nprint(total([1, 2, 3]))","choice_format":"text","choices":[{"id":"c1","text":"s = 0 の行を for の中に移す"},{"id":"c2","text":"return を print に変える"},{"id":"c3","text":"return s の字下げを戻し、ループが終わった後に実行されるようにする"}],"answer":{"correct_choice_id":"c3","fixed_code":"def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s\n\nprint(total([1, 2, 3]))","expected_output":"6","buggy_output":"1"},"grading":{"method":"choice_id"},"rationale":"return は関数をその場で終了するため、ループの中に書くと1回で終わってしまうから。","explanation":"return を実行した時点で関数は終了します。for の中に書くと1回目の足し算（s = 1）の直後に return されるので、1 が返ります。return を for と同じ深さに戻せば、ループが全部終わってから合計が返ります。","wrong_answer_reasons":{"c1":"for の中に移すと、毎回 s が 0 に戻り、合計できません。","c2":"return がなくなると戻り値は None になり、外側の print は None を表示します。しかも関数の中で途中経過が表示されてしまいます。"},"hint":"return を実行するとその関数はどうなりますか？ 字下げの深さにも注目しましょう。","feedback_correct":"正解！return の位置（字下げ）が原因でした。","feedback_incorrect":"惜しい！return を実行するとその場で関数が終わることを思い出しましょう。"},{"id":"PY-059","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":9,"title":"ローカル変数と外の変数","type":"predict_output","answer_mode":"text","difficulty":4,"concepts":["ローカル変数","スコープ"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"def f():\n    x = 10\n    return x + 1\n\nx = 100\nprint(f())\nprint(x)","answer":{"expected_output":"11\n100"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"関数の中のxは関数だけで有効なローカル変数で、外のxとは別物だから。","explanation":"f() の中では x = 10 なので 10 + 1 = 11 を返します。外の x は 100 のまま変わらないので、2行目の表示は 100 です。同じ名前でも、関数の中と外は別の変数として扱われます。","common_mistakes":[{"answer":"11\n11","reason":"関数の中の x は別の変数（ローカル変数）で、外の x の値は書き換わりません。"},{"answer":"101\n100","reason":"関数 f の中では x = 10 が使われます。外の x = 100 は見えていません。"}],"hint":"関数の中で作られた x は、関数の外の x と同じものでしょうか？","feedback_correct":"正解！ローカル変数は外に影響しません。","feedback_incorrect":"惜しい！関数の中の x と外の x は別物です。"},{"id":"PY-060","course_id":"python-basics-ja","language":"python","stage_id":"S06","stage_number":6,"number_in_stage":10,"title":"偶数判定の関数","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["関数","return","%","比較演算子"],"preconditions":"ステージ1〜6で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"整数 n を受け取り、偶数なら True、奇数なら False を返す関数 is_even(n) を作ってください。（表示ではなく、return で返すこと）","code":null,"prefix_code":"","starter_code":"def is_even(n):\n    # ここに書きましょう\n","answer":{"reference_solution":"def is_even(n):\n    return n % 2 == 0","alternative_solutions":["def is_even(n):\n    if n % 2 == 0:\n        return True\n    else:\n        return False","def is_even(n):\n    if n % 2 == 1:\n        return False\n    return True"],"rejected_examples":[{"code":"def is_even(n):\n    print(n % 2 == 0)","reason":"print は表示するだけで、値を返していません（None が返ります）。"},{"code":"def is_even(n):\n    return n % 2","reason":"余りの 0 / 1 を返しています。True / False ではなく、しかも偶数のとき 0 になり意図と逆です。"}]},"grading":{"method":"test_cases","tests":[{"kind":"call","setup":"","call":"is_even(4)","expected":"True","visible":true},{"kind":"call","setup":"","call":"is_even(7)","expected":"False","visible":true},{"kind":"call","setup":"","call":"is_even(0)","expected":"True","visible":false},{"kind":"call","setup":"","call":"is_even(-3)","expected":"False","visible":false}],"required_ast_nodes":["FunctionDef"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"2で割った余りが0なら偶数なので、その比較結果をreturnすればよいから。","explanation":"n % 2 == 0 は偶数なら True、奇数なら False になる式です。そのまま return すれば条件分岐も不要です。if を使って True / False を返す書き方も正解です。","hint":"偶数は 2 で割った余りが 0 です。その比較の結果をそのまま返せます。","feedback_correct":"正解！判定を関数にまとめられました。","feedback_incorrect":"惜しい！print ではなく return で True / False を返していますか？"},{"id":"PY-061","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":1,"title":"エラーメッセージの読み始め","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["エラーメッセージ","トレースバック"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"エラーが表示されて長いメッセージが出たとき、まず確認すべき場所はどこですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"一番最後の行（エラーの種類と短い説明）"},{"id":"c2","text":"一番最初の行"},{"id":"c3","text":"どこも読まず、コードを書き直す"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"最後の行にエラーの種類と原因の説明が書かれているから。","explanation":"Python のエラーは、最後の行に NameError: name 'x' is not defined のように種類と説明が出ます。途中の行には、エラーが起きたファイルの行番号が出るので、その行を確認します。","wrong_answer_reasons":{"c2":"最初の行は「トレースバック」という見出しで、原因の手がかりは少ないです。まず最後の行を読みます。","c3":"メッセージには原因のヒントが書かれています。読まずに書き直すと、別の間違いを増やしかねません。"},"hint":"エラー名（NameError など）が書かれているのはどこでしょう？","feedback_correct":"正解！まずは最後の行を読みましょう。","feedback_incorrect":"惜しい！エラーの種類と説明は最後の行に出ます。"},{"id":"PY-062","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":2,"title":"NameError の原因","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["NameError"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"NameError: name 'total' is not defined というエラーの原因として、最も適切なものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"0 で割り算をした"},{"id":"c2","text":"total が文字列だった"},{"id":"c3","text":"total という名前の変数がまだ作られていない（代入前の使用やスペルミス）"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"NameError は存在しない名前を使ったときに起きるエラーだから。","explanation":"'total' is not defined は「total という名前が定義されていない」という意味です。変数に代入する前に使った、またはスペルを間違えた（totl など）ときに起こります。","wrong_answer_reasons":{"c1":"0 で割った場合は ZeroDivisionError という別のエラー名になります。","c2":"型が合わない場合は TypeError になります。NameError は名前そのものが見つからないときのエラーです。"},"hint":"not defined = 「定義されていない」。どんなミスで起きるでしょう？","feedback_correct":"正解！NameError は名前が見つからないエラーです。","feedback_incorrect":"惜しい！エラー名が表すミスの種類を確認しましょう。"},{"id":"PY-063","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":3,"title":"文字列を整数に変換して計算","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["型変換","int"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、何が表示されますか？","code":"a = \"5\"\nb = int(a) + 3\nprint(b)","choice_format":"code","choices":[{"id":"c1","text":"53"},{"id":"c2","text":"8"},{"id":"c3","text":"エラーになる"}],"answer":{"correct_choice_id":"c2","expected_output":"8"},"grading":{"method":"choice_id"},"rationale":"int()で文字列\"5\"を整数5に変換してから足すので8になるから。","explanation":"\"5\" は文字列ですが、int(\"5\") は整数 5 を返します。5 + 3 = 8 が b に入ります。もし int() がなければ \"5\" + 3 は TypeError です。","wrong_answer_reasons":{"c1":"int(a) で \"5\" は整数 5 に変換されます。5 + 3 は連結ではなく足し算で 8 です。","c3":"int(a) で整数に変換しているので、整数同士の足し算になりエラーは起きません。"},"hint":"int() は文字列を何に変えますか？","feedback_correct":"正解！int() で整数にしてから足し算しました。","feedback_incorrect":"惜しい！int(a) の結果の型を考えましょう。"},{"id":"PY-064","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":4,"title":"文字列と数値の連結","type":"bug_fix","answer_mode":"choice","difficulty":3,"concepts":["TypeError","型変換","str"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"「年齢は20歳」と表示したいのに TypeError になります。2行目を直したものはどれですか？","code":"age = 20\nprint(\"年齢は\" + age + \"歳\")","choice_format":"code","choices":[{"id":"c1","text":"print(\"年齢は\" + int(age) + \"歳\")"},{"id":"c2","text":"print(\"年齢は\" - age + \"歳\")"},{"id":"c3","text":"print(\"年齢は\" + str(age) + \"歳\")"}],"answer":{"correct_choice_id":"c3","fixed_code":"age = 20\nprint(\"年齢は\" + str(age) + \"歳\")","expected_output":"年齢は20歳","buggy_error":"TypeError","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"数値を str() で文字列にすれば、文字列同士の連結になるから。","explanation":"文字列と整数を + で直接つなぐことはできません。str(age) で \"20\" に変換すれば、\"年齢は\" + \"20\" + \"歳\" と文字列同士になります。f文字列（f\"年齢は{age}歳\"）でも書けます。","wrong_answer_reasons":{"c1":"age はすでに整数です。int() で整数にしても、文字列と整数の + は TypeError のままです。","c2":"- は文字列には使えず、TypeError になります。"},"hint":"+ の両側が同じ型になるように変換します。","feedback_correct":"正解！str() で文字列にそろえました。","feedback_incorrect":"惜しい！+ の両側の型をそろえる必要があります。"},{"id":"PY-065","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":5,"title":"try / except の動き","type":"predict_output","answer_mode":"text","difficulty":4,"concepts":["try/except","ValueError"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください。","code":"try:\n    n = int(\"abc\")\nexcept ValueError:\n    n = 0\nprint(n)","answer":{"expected_output":"0"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"ValueErrorが起きても except で受け止められ、n が 0 になるから。","explanation":"int(\"abc\") は数値にできないため ValueError を起こします。try の中でエラーが起きると except ValueError: の部分に移り、n = 0 が実行されます。最後の print は 0 を表示します。","common_mistakes":[{"answer":"abc","reason":"int(\"abc\") は失敗するため n には何も代入されません。except の中で n が 0 になります。"},{"answer":"ValueError","reason":"エラーは except で受け止められているので、エラーメッセージは表示されず、プログラムも続行します。"}],"hint":"エラーが起きたとき、except の中の処理に移ります。","feedback_correct":"正解！エラーを受け止めて続行できました。","feedback_incorrect":"惜しい！エラーが起きたときの except の動きを確認しましょう。"},{"id":"PY-066","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":6,"title":"受け止めるエラー名","type":"fill_blank","answer_mode":"text","difficulty":4,"concepts":["try/except","ZeroDivisionError"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"0 で割ったときに 0 を返す関数です。空欄 __1__ に入れるエラー名を答えてください。","code":"def safe_div(a, b):\n    try:\n        return a / b\n    except __1__:\n        return 0\n\nprint(safe_div(1, 0))","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["ZeroDivisionError"],"quote_insensitive":false}],"expected_output":"0"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"0で割ったときに起きるエラーの名前は ZeroDivisionError だから。","explanation":"except の後ろには、受け止めたいエラーの名前を書きます。1 / 0 は ZeroDivisionError を起こすので、その名前を書くと return 0 が実行されます。エラー名が違うと受け止められません。","common_mistakes":[{"blank":"b1","answer":"ValueError","reason":"起きるエラーは ZeroDivisionError です。ValueError では受け止められず、プログラムがエラーで止まります。"}],"hint":"0 で割るとどんなエラー名が出ましたか？","feedback_correct":"正解！起きるエラーの名前と合わせました。","feedback_incorrect":"惜しい！「0で割る」ときのエラー名を思い出しましょう。"},{"id":"PY-067","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":7,"title":"括弧の閉じ忘れ","type":"bug_fix","answer_mode":"text","difficulty":3,"concepts":["SyntaxError","括弧"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードは SyntaxError になります。正しく書き直して入力してください（1行目の内容をすべて入力）。","code":"print(\"合計:\", sum([1, 2, 3])","answer":{"target_line":1,"accepted":["print(\"合計:\", sum([1, 2, 3]))","print(\"合計:\", sum([1,2,3]))","print(\"合計:\",sum([1, 2, 3]))"],"quote_insensitive":true,"fixed_code":"print(\"合計:\", sum([1, 2, 3]))","expected_output":"合計: 6","buggy_error":"SyntaxError"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"開き括弧 ( の数と閉じ括弧 ) の数が合っていなかったから。","explanation":"print( と sum( の2つの括弧を開いているので、閉じ括弧も2つ必要です。[ ] の角括弧は閉じていますが、丸括弧が1つ足りません。括弧は開いた数と閉じた数を数えて確認しましょう。","common_mistakes":[{"answer":"print(\"合計:\", sum([1, 2, 3])","reason":"元のコードのままです。開き括弧が2つ（print の ( と sum の (）あるので、閉じ括弧も2つ必要です。"}],"hint":"( をいくつ開いて、) をいくつ閉じていますか？","feedback_correct":"正解！括弧の数がそろいました。","feedback_incorrect":"惜しい！開き括弧と閉じ括弧の数を数えてみましょう。"},{"id":"PY-068","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":8,"title":"エラーが出ないのに結果が違う","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["論理エラー","デバッグ"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"エラーメッセージは出ないのに、計算結果が期待と違うとき、どう考えて調べるのが適切ですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"プログラムの考え方（ロジック）に誤りがあるかもしれないので、print で途中の値を確認する"},{"id":"c2","text":"Python の故障なので、パソコンを再起動する"},{"id":"c3","text":"エラーが出ていないので、間違いはない"}],"answer":{"correct_choice_id":"c1"},"grading":{"method":"choice_id"},"rationale":"文法が正しくても、処理の考え方が間違っていると結果は変わるから。","explanation":"エラーが出ない誤りを「論理エラー」ということがあります。このときは print で途中の変数の値を表示して、想像と実際の値がどこでずれるかを探します。","wrong_answer_reasons":{"c2":"同じコードは何度実行しても同じ結果になります。コードの考え方に原因があると考えるのが基本です。","c3":"エラーが出ないことと結果が正しいことは別です。意図と違う処理を書いていても、文法が正しければエラーにはなりません。"},"hint":"Python は、書かれたとおりに動きます。意図と違うのはどこでしょう？","feedback_correct":"正解！途中の値を確認するのが基本です。","feedback_incorrect":"惜しい！エラーが出ないことと、正しいことは別です。"},{"id":"PY-069","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":9,"title":"合計が足し込まれない","type":"bug_fix","answer_mode":"text","difficulty":4,"concepts":["論理エラー","累積","+="],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"1 から 3 の合計 6 を表示するつもりが 3 と表示されます。3行目を正しく書き直して入力してください（3行目の内容だけを入力）。","code":"total = 0\nfor i in range(1, 4):\n    total = i\nprint(total)","answer":{"target_line":3,"accepted":["total += i","total = total + i","total=total+i","total = i + total","total+=i","total=total + i","total = total+i"],"quote_insensitive":false,"fixed_code":"total = 0\nfor i in range(1, 4):\n    total += i\nprint(total)","expected_output":"6","buggy_output":"3"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"= は上書きなので、足し込むには += を使う必要があるから。","explanation":"total = i は毎回 total を i で置き換えるだけで、最後は 3 になります。total += i（total = total + i）にすると前の値に足していくので、1+2+3 = 6 になります。","common_mistakes":[{"answer":"total = i","reason":"元のコードのままです。= は上書きなので、毎回 i の値に置き換わってしまいます。"}],"hint":"ループのたびに、total の前の値はどうなっていますか？","feedback_correct":"正解！上書きではなく足し込みにしました。","feedback_incorrect":"惜しい！= は上書き、+= は足し込みです。"},{"id":"PY-070","course_id":"python-basics-ja","language":"python","stage_id":"S07","stage_number":7,"number_in_stage":10,"title":"安全に整数へ変換する","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["try/except","ValueError","関数","None"],"preconditions":"ステージ1〜7で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"文字列 text を受け取り、整数に変換できれば整数を、できなければ None を返す関数 to_int(text) を作ってください。try / except を使うこと。","code":null,"prefix_code":"","starter_code":"def to_int(text):\n    # ここに書きましょう\n","answer":{"reference_solution":"def to_int(text):\n    try:\n        return int(text)\n    except ValueError:\n        return None","alternative_solutions":["def to_int(text):\n    try:\n        n = int(text)\n    except ValueError:\n        n = None\n    return n"],"rejected_examples":[{"code":"def to_int(text):\n    return int(text)","reason":"数値にできない文字列で ValueError が発生し、プログラムが止まります。"},{"code":"def to_int(text):\n    return None","reason":"常に None を返しています。変換できる場合は整数を返す必要があります。"}]},"grading":{"method":"test_cases","tests":[{"kind":"call","setup":"","call":"to_int('42')","expected":"42","visible":true},{"kind":"call","setup":"","call":"to_int('abc')","expected":"None","visible":true},{"kind":"call","setup":"","call":"to_int('-5')","expected":"-5","visible":false},{"kind":"call","setup":"","call":"to_int('')","expected":"None","visible":false},{"kind":"call","setup":"","call":"to_int('3.5')","expected":"None","visible":false}],"required_ast_nodes":["Try"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"int()が失敗したときのValueErrorをexceptで受け止めてNoneを返すから。","explanation":"try の中で int(text) を試し、成功すればその値を return します。ValueError が起きたら except でNone を返します。\"3.5\" のような小数の文字列も int() では ValueError になる点に注意です。","hint":"try: の中に return int(text) を書き、except ValueError: で別の値を返します。","feedback_correct":"正解！エラーを受け止めて、安全な関数にできました。","feedback_incorrect":"惜しい！変換できない文字列を渡したときの動作を確認しましょう。"},{"id":"PY-071","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":1,"title":"strip と len","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["strip","len","文字列メソッド"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"s = \" Python \"\nprint(s.strip())\nprint(len(s.strip()))","choice_format":"code","choices":[{"id":"c1","text":"Python\n8"},{"id":"c2","text":" Python \n6"},{"id":"c3","text":"Python\n6"}],"answer":{"correct_choice_id":"c3","expected_output":"Python\n6"},"grading":{"method":"choice_id"},"rationale":"strip()で前後の空白が消え、Python の6文字になるから。","explanation":"s.strip() は前後の空白を除いた \"Python\" を返します。それに len を使うと 6 です。元の s の長さ（空白を含めて8）を求めているわけではありません。","wrong_answer_reasons":{"c1":"len も strip した後の文字列に対して数えます。前後の空白がなくなった Python は 6 文字です。","c2":"strip() は前後の空白を取り除きます。1行目に空白は残りません。"},"hint":"strip() してから len() が呼ばれます。","feedback_correct":"正解！strip の結果に len を使っています。","feedback_incorrect":"惜しい！strip() の結果の文字列が何文字かを数えましょう。"},{"id":"PY-072","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":2,"title":"元の文字列は変わらない","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["文字列メソッド","再代入"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"name = \"taro\"\nname.upper()\nprint(name)\nname = name.upper()\nprint(name)","answer":{"expected_output":"taro\nTARO"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"upper()は nput)は使わない。","prompt":"在庫 stock に \"grape\" がないとき 0 と表示したいのに、KeyError になります。2行目を直したものはどれですか？","code":"stock = {\"apple\": 3, \"banana\": 5}\nprint(stock[\"grape\"])","choice_format":"code","choices":[{"id":"c1","text":"print(stock.get(\"grape\", 0))"},{"id":"c2","text":"print(stock(\"grape\"))"},{"id":"c3","text":"print(stock[\"grape\", 0])"}],"answer":{"correct_choice_id":"c1","fixed_code":"stock = {\"apple\": 3, \"banana\": 5}\nprint(stock.get(\"grape\", 0))","expected_output":"0","buggy_error":"KeyError","target_line":2,"choice_is_replacement_line":true},"grading":{"method":"choice_id"},"rationale":"get(キー, 初期値) は、キーがなくてもエラーにならず初期値を返すから。","explanation":"辞書[キー] はキーがないと KeyError になります。辞書.get(キー, 初期値) は、キーがあればその値、なければ初期値を返します。事前に in で調べる方法もあります。","wrong_answer_reasons":{"c2":"辞書は関数ではないので丸括弧では呼び出せず、TypeError になります。","c3":"[ ] の中の \"grape\", 0 は1つのキー（組）と見なされ、やはりキーが存在せず KeyError になります。"},"hint":"エラーにならずに「なければ0」を返す辞書のメソッドがあります。","feedback_correct":"正解！get なら安全に取り出せます。","feedback_incorrect":"惜しい！キーがないときも使えるメソッドを探しましょう。"},{"id":"PY-077","course_id":"python-basics-ja","language":"python","stage_id":"S08","stage_number":8,"number_in_stage":7,"title":"辞書の追加と上書き","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["辞書の追加","辞書の更新","len"],"preconditions":"ステージ1〜8で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"ages = {\"Taro\": 20, \"Hana\": 18}\nages[\"Ken\"] = 25\nages[\"Hana\"] = 19\nprint(len(ages))\nprint(ages[\"Hana\"])","answer":{"expected_output":"3\n19"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"新しいキーKenは追加、既存のHanaは上書きされるから。","explanation":"2行目で Ken が新しく加わり要素は3つ。3行目は既存のキー Hana への代入なので上書きとなり、増えません。最終的に要素は3つで、Hana の値は 19 です。","common_mistakes":[{"answer":"3\n18","reason":"ages[\"Hana\"] = 19 で Hana の値は 18 から 19 に更新されます。"},{"answer":"4\n19","reason":"Hana は既にあるキーなので、追加ではなく上書きです。要
