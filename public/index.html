"method":"test_cases","tests":[{"kind":"call","setup":"","call":"sorted(count_words('a b a').items())","expected":"[('a', 2), ('b', 1)]","visible":true},{"kind":"call","setup":"","call":"sorted(count_words('x').items())","expected":"[('x', 1)]","visible":true},{"kind":"call","setup":"","call":"sorted(count_words('to be or not to be').items())","expected":"[('be', 2), ('not', 1), ('or', 1), ('to', 2)]","visible":false},{"kind":"call","setup":"","call":"count_words('')","expected":"{}","visible":false}],"required_ast_nodes":["FunctionDef","For"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"split()で単語に分け、辞書で既存なら+1、なければ1にして数えるから。","explanation":"ステージ8の例（文字を数える）と同じ考え方で、対象が文字から単語に変わっただけです。get(word, 0) + 1 と書くと if/else を省略できます。最後に counts を return するのを忘れないようにしましょう。","hint":"辞書 counts = {} を用意し、for で単語を1つずつ取り出して数えます。最後に return。","feedback_correct":"正解！データ集計の基本形が書けました。","feedback_incorrect":"惜しい！同じ単語が2回出てきたときの動作を確認しましょう。"},{"id":"PY-081","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":1,"title":"randint の範囲","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["random","randint"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"import random のあと、random.randint(1, 3) を実行しました。結果として起こり得ない値はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"1"},{"id":"c2","text":"3"},{"id":"c3","text":"4"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"randint(1, 3) は1以上3以下の整数だけを返すので、4は返らないから。","explanation":"random.randint(a, b) は a 以上 b 以下（両端を含む）の整数を返します。range(1, 3) のように最後を含まない仕組みとは違う点に注意しましょう。1, 2, 3 のどれかが返り、4 は返りません。","wrong_answer_reasons":{"c1":"randint は最初の値（1）も含みます。1 が返ることはあります。","c2":"randint は最後の値（3）も含みます。range とは違い、3 が返ることもあります。"},"hint":"randint は最後の数も含む、と覚えておきましょう。","feedback_correct":"正解！randint の範囲は両端を含みます。","feedback_incorrect":"惜しい！randint は a 以上 b 以下の整数を返します。"},{"id":"PY-082","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":2,"title":"おみくじの結果を読む","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["if/elif/else","トレース"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"n = 4\nif n >= 9:\n    result = \"大吉\"\nelif n >= 5:\n    result = \"中吉\"\nelse:\n    result = \"小吉\"\nprint(\"結果:\", result)","choice_format":"code","choices":[{"id":"c1","text":"結果: 大吉"},{"id":"c2","text":"結果: 中吉"},{"id":"c3","text":"結果: 小吉"}],"answer":{"correct_choice_id":"c3","expected_output":"結果: 小吉"},"grading":{"method":"choice_id"},"rationale":"4は9以上でも5以上でもないので、elseの小吉になるから。","explanation":"上から順に、n >= 9（False）、n >= 5（False）と調べ、どちらも成立しないので else の小吉が選ばれます。print は \"結果:\" と result の間に空白を入れて表示します。","wrong_answer_reasons":{"c1":"n = 4 は 9 以上ではありません。最初の条件は False です。","c2":"n = 4 は 5 以上ではありません。2つ目の条件も False です。"},"hint":"n = 4 のとき、各条件が True か False かを順に判定しましょう。","feedback_correct":"正解！条件を順に判定できました。","feedback_incorrect":"惜しい！各条件を上から順に True / False で判定しましょう。"},{"id":"PY-083","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":3,"title":"簡易計算機の動き","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["関数","if/elif/else","トレース"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"def calc(a, op, b):\n    if op == \"+\":\n        return a + b\n    elif op == \"-\":\n        return a - b\n    elif op == \"*\":\n        return a * b\n    else:\n        return \"未対応\"\n\nprint(calc(6, \"-\", 4))\nprint(calc(2, \"/\", 5))","answer":{"expected_output":"2\n未対応"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"\"-\"は引き算で2、\"/\"は対応する分岐がなくelseの未対応になるから。","explanation":"1回目は op が \"-\" なので a - b = 2。2回目の op は \"/\" ですが、+, -, * のどれにも一致しないので else の「未対応」が返されます。","common_mistakes":[{"answer":"2\n0.4","reason":"calc には \"/\" の場合の処理がありません。else に進んで「未対応」が返ります。"},{"answer":"10\n未対応","reason":"\"-\" は引き算なので 6 - 4 = 2 です。"}],"hint":"op の値が、どの分岐に一致するかを見ます。","feedback_correct":"正解！op の値で分岐が切り替わります。","feedback_incorrect":"惜しい！op の値がどの分岐に当てはまるか確認しましょう。"},{"id":"PY-084","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":4,"title":"割り算の分岐を追加","type":"fill_blank","answer_mode":"text","difficulty":3,"concepts":["関数","/","//"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"calc 関数に割り算の分岐を追加します。calc(10, \"/\", 4) が 2.5 を返すよう、空欄 __1__ に入れる式を答えてください。","code":"def calc(a, op, b):\n    if op == \"+\":\n        return a + b\n    elif op == \"/\":\n        return __1__\n    else:\n        return \"未対応\"\n\nprint(calc(10, \"/\", 4))","answer":{"blanks":[{"id":"b1","marker":"__1__","accepted":["a / b","a/b"],"quote_insensitive":false}],"expected_output":"2.5"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true},"rationale":"小数を含む割り算の結果が必要なので、/ を使うから。","explanation":"/ は割り切れない場合も小数で結果を返すので 10 / 4 = 2.5。// は切り捨ての商で 2 になってしまいます。変数 a と b を使って書くことで、どんな値でも使える関数になります。","common_mistakes":[{"blank":"b1","answer":"a // b","reason":"// は小数点以下を切り捨てた商なので 2 になります。2.5 にするには / を使います。"}],"hint":"結果が 2.5 になる割り算の記号は / でしたか、// でしたか？","feedback_correct":"正解！変数を使った式で割り算を書けました。","feedback_incorrect":"惜しい！/ と // の違いを見直しましょう。"},{"id":"PY-085","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":5,"title":"合格者を数える","type":"predict_output","answer_mode":"choice","difficulty":3,"concepts":["for","if","カウント"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、何が表示されますか？","code":"scores = [55, 80, 62, 90, 45]\npassed = 0\nfor s in scores:\n    if s >= 60:\n        passed += 1\nprint(passed)","choice_format":"code","choices":[{"id":"c1","text":"2"},{"id":"c2","text":"5"},{"id":"c3","text":"3"}],"answer":{"correct_choice_id":"c3","expected_output":"3"},"grading":{"method":"choice_id"},"rationale":"60点以上は80、62、90の3人だから。","explanation":"for で1つずつ調べ、s >= 60 のときだけ passed に1を足します。55 → 数えない、80 → 数える、62 → 数える、90 → 数える、45 → 数えない。合計は3です。","wrong_answer_reasons":{"c1":"60点以上は 80, 62, 90 の3つです。62 も 60 以上なので数えます。","c2":"if s >= 60 を満たすものだけ数えます。55 と 45 は数えられません。"},"hint":"1つずつ、60以上かどうかを判定して、数えましょう。","feedback_correct":"正解！条件に合うものだけ数えました。","feedback_incorrect":"惜しい！点数ごとに60以上かを判定してみましょう。"},{"id":"PY-086","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":6,"title":"成績判定の順序","type":"bug_fix","answer_mode":"choice","difficulty":4,"concepts":["elif","条件の順序","論理エラー"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"85点なら \"B\" と表示するはずが \"C\" と表示されます。どう直すのが適切ですか？","code":"score = 85\nif score >= 60:\n    grade = \"C\"\nelif score >= 80:\n    grade = \"B\"\nelse:\n    grade = \"D\"\nprint(grade)","choice_format":"text","choices":[{"id":"c1","text":"条件を厳しい順（80以上、60以上の順）に並べ替える"},{"id":"c2","text":"elif をすべて if に変える"},{"id":"c3","text":"score >= 60 を score == 60 に変える"}],"answer":{"correct_choice_id":"c1","fixed_code":"score = 85\nif score >= 80:\n    grade = \"B\"\nelif score >= 60:\n    grade = \"C\"\nelse:\n    grade = \"D\"\nprint(grade)","expected_output":"B","buggy_output":"C"},"grading":{"method":"choice_id"},"rationale":"if/elifは上から順に調べ、最初に成立した所で終わるので、厳しい条件を先に調べる必要があるから。","explanation":"85 は 60 以上でもあるため、最初の条件で \"C\" になり、80 以上かどうかは調べられません。80 以上を先に調べるように並べ替えると、85 は \"B\"、65 は \"C\" と正しく分けられます。","wrong_answer_reasons":{"c2":"65点のとき、最初の if で C になった後、2つ目の if（80以上）は False なので else の D が実行され、最終的に D になってしまいます。","c3":"== は「ちょうど60」のときだけ成立します。85 を含む大半の点数が当てはまらなくなります。"},"hint":"85 は、最初の条件 score >= 60 を満たしますか？","feedback_correct":"正解！条件の並べ順が重要でした。","feedback_incorrect":"惜しい！上から順に調べ、最初に成立した所で終わることを思い出しましょう。"},{"id":"PY-087","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":7,"title":"買い物かごの合計","type":"predict_output","answer_mode":"text","difficulty":3,"concepts":["辞書","リスト","for","累積"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください。","code":"prices = {\"りんご\": 120, \"みかん\": 80}\ncart = [\"りんご\", \"みかん\", \"りんご\"]\ntotal = 0\nfor item in cart:\n    total += prices[item]\nprint(\"合計:\", total)","answer":{"expected_output":"合計: 320"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"りんご120×2とみかん80を足して320になるから。","explanation":"cart の要素を順に取り出し、prices から価格を引いて足します。120 → 200 → 320。りんごは2回出てくるので、2回足されます。","common_mistakes":[{"answer":"合計: 200","reason":"cart にはりんごが2つ入っています。りんごの価格 120 を2回足します。"},{"answer":"合計: 80","reason":"合計は最後の1つ分ではなく、かごの中の全部です。+= で足し込んでいます。"}],"hint":"かごの中身を1つずつ、価格に変えながら足します。","feedback_correct":"正解！辞書とリストを組み合わせて読めました。","feedback_incorrect":"惜しい！かごの中身を1つずつ、価格に置き換えて足してみましょう。"},{"id":"PY-088","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":8,"title":"コードの読み方","type":"multiple_choice","answer_mode":"choice","difficulty":3,"concepts":["トレース","コードの読み方"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"見慣れた長めのコードの動きを予想するとき、最も確実な方法はどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"全体をざっと眺めて、なんとなくの印象で答える"},{"id":"c2","text":"一番下の行から順に読み進める"},{"id":"c3","text":"変数の値が1行ごとにどう変わるかを書き出して、上から順に追う"}],"answer":{"correct_choice_id":"c3"},"grading":{"method":"choice_id"},"rationale":"実行の順に、変数の値を1つずつ確かめるのが最も確実だから。","explanation":"プログラムは上から順に実行され、そのたびに変数の値が変化します。変数名と今の値を書き出しながら追うこと（トレース）が、読み間違いを防ぐ基本の方法です。","wrong_answer_reasons":{"c1":"印象で答えると、条件の境界や繰り返しの回数を間違えやすくなります。","c2":"コードは上から下へ順に実行されます。実行順に追わないと値の変化が分かりません。"},"hint":"コンピューターは、どの順番でコードを実行しますか？","feedback_correct":"正解！値を書き出して追うのが基本です。","feedback_incorrect":"惜しい！実行の順に、値の変化を追う方法を選びましょう。"},{"id":"PY-089","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":9,"title":"4文字以上を数える","type":"bug_fix","answer_mode":"text","difficulty":4,"concepts":["比較演算子","境界値","論理エラー"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"4文字以上の単語の数 2 を求めるつもりが 1 と表示されます。4行目を正しく書き直して入力してください（4行目の内容だけを入力）。","code":"words = [\"cat\", \"tree\", \"horse\", \"dog\"]\ncount = 0\nfor w in words:\n    if len(w) > 4:\n        count += 1\nprint(count)","answer":{"target_line":4,"accepted":["if len(w) >= 4:","if len(w)>=4:","if len(w) > 3:","if len(w)>3:"],"quote_insensitive":false,"fixed_code":"words = [\"cat\", \"tree\", \"horse\", \"dog\"]\ncount = 0\nfor w in words:\n    if len(w) >= 4:\n        count += 1\nprint(count)","expected_output":"2","buggy_output":"1"},"grading":{"method":"accepted_answers","normalize":["nfkc","strip_outer_whitespace"],"keep_inner_whitespace":true,"scope":"target_line_replacement"},"rationale":"「4文字以上」は4を含むので、>= 4 （または > 3）にする必要があるから。","explanation":"len(w) > 4 は5文字以上です。4文字の tree が数えられません。「以上」は >= を使います。境界の値（ちょうど4）を実際に当てはめて確かめるのが大切です。","common_mistakes":[{"answer":"if len(w) > 4:","reason":"元のコードのままです。「4文字以上」に 4文字ちょうどの tree が含まれていません。"}],"hint":"4文字ちょうどの単語（tree）は、len(w) > 4 を満たしますか？","feedback_correct":"正解！境界値（4文字ちょうど）を含めました。","feedback_incorrect":"惜しい！「以上」と「より大きい」の違いを確認しましょう。"},{"id":"PY-090","course_id":"python-basics-ja","language":"python","stage_id":"S09","stage_number":9,"number_in_stage":10,"title":"おみくじ判定関数","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["関数","if/elif/else","境界値","return"],"preconditions":"ステージ1〜9で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"1〜10 の整数 n を受け取り、結果の文字列を返す関数 fortune(n) を作ってください。9 以上なら \"大吉\"、5 以上 8 以下なら \"中吉\"、それ以外（4 以下）なら \"小吉\" を返します。（ランダムに引く部分は含めず、判定だけを作ります）","code":null,"prefix_code":"","starter_code":"def fortune(n):\n    # ここに書きましょう\n","answer":{"reference_solution":"def fortune(n):\n    if n >= 9:\n        return \"大吉\"\n    elif n >= 5:\n        return \"中吉\"\n    else:\n        return \"小吉\"","alternative_solutions":["def fortune(n):\n    if n < 5:\n        return \"小吉\"\n    elif n < 9:\n        return \"中吉\"\n    return \"大吉\"","def fortune(n):\n    if n >= 9:\n        result = '大吉'\n    elif n >= 5:\n        result = '中吉'\n    else:\n        result = '小吉'\n    return result"],"rejected_examples":[{"code":"def fortune(n):\n    if n > 9:\n        return \"大吉\"\n    elif n > 5:\n        return \"中吉\"\n    else:\n        return \"小吉\"","reason":"境界値が違います。9 や 5 ちょうどのときの結果が仕様と合いません（9 以上、5 以上）。"},{"code":"def fortune(n):\n    if n >= 5:\n        return \"中吉\"\n    elif n >= 9:\n        return \"大吉\"\n    else:\n        return \"小吉\"","reason":"条件の順序が逆です。9 以上でも最初の n >= 5 が成立して中吉になってしまいます。"}]},"grading":{"method":"test_cases","tests":[{"kind":"call","setup":"","call":"fortune(10)","expected":"'大吉'","visible":true},{"kind":"call","setup":"","call":"fortune(9)","expected":"'大吉'","visible":false},{"kind":"call","setup":"","call":"fortune(8)","expected":"'中吉'","visible":true},{"kind":"call","setup":"","call":"fortune(5)","expected":"'中吉'","visible":false},{"kind":"call","setup":"","call":"fortune(4)","expected":"'小吉'","visible":true},{"kind":"call","setup":"","call":"fortune(1)","expected":"'小吉'","visible":false}],"required_ast_nodes":["FunctionDef","If"],"required_any_ast_nodes":[],"timeout_sec":5,"execution":"sandboxed_worker","normalize_stdout":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"]},"rationale":"厳しい条件（9以上）から順に調べ、境界の9と5を含めるから。","explanation":"if n >= 9 → elif n >= 5 → else の順に書けば、重なりも漏れもありません。9 と 5 が境界なので、必ずその値で確認します。実際のおみくじでは fortune(random.randint(1, 10)) のように呼び出します。","hint":"厳しい条件（9以上）から順に調べます。境界の 9 と 5 の扱いに注意しましょう。","feedback_correct":"正解！おみくじの判定部分ができました。","feedback_incorrect":"惜しい！境界の値（9 と 5）と、条件を調べる順序を確認しましょう。"},{"id":"PY-091","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":1,"title":"FizzBuzz のかけら","type":"predict_output","answer_mode":"choice","difficulty":4,"concepts":["for","if","%","range"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行すると、どう表示されますか？","code":"for i in range(1, 6):\n    if i % 3 == 0:\n        print(\"Fizz\")\n    else:\n        print(i)","choice_format":"code","choices":[{"id":"c1","text":"1\n2\nFizz\n4\n5"},{"id":"c2","text":"1\n2\nFizz\n4"},{"id":"c3","text":"1\n2\n3\n4\n5"}],"answer":{"correct_choice_id":"c1","expected_output":"1\n2\nFizz\n4\n5"},"grading":{"method":"choice_id"},"rationale":"1〜5のうち3の倍数は3だけで、その回だけFizzが表示されるから。","explanation":"i が 1, 2 のときは余りが 0 でないので数字を表示。i = 3 のとき 3 % 3 == 0 が成立して Fizz。i = 4, 5 は再び数字です。range の終わり 6 は含まれず、5 回繰り返されます。","wrong_answer_reasons":{"c2":"range(1, 6) は 1〜5 です。5 回繰り返すので、最後の 5 も表示されます。","c3":"i が 3 のとき、i % 3 == 0 が成立するので、3 ではなく Fizz が表示されます。"},"hint":"i が 3 のときだけ、条件 i % 3 == 0 が True になります。","feedback_correct":"正解！ループと条件分岐を組み合わせて読めました。","feedback_incorrect":"惜しい！i の値ごとに、条件が True か False か判定しましょう。"},{"id":"PY-092","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":2,"title":"入れ子のループ","type":"predict_output","answer_mode":"text","difficulty":4,"concepts":["入れ子のループ","文字列の連結","range"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください（複数行は改行して入力）。","code":"for i in range(1, 4):\n    line = \"\"\n    for j in range(i):\n        line += \"*\"\n    print(line)","answer":{"expected_output":"*\n**\n***"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"外側のiが1,2,3と増え、内側でi個の*が足されるから。","explanation":"i = 1 のとき内側は 1 回で \"*\"。i = 2 のとき 2 回で \"**\"。i = 3 のとき 3 回で \"***\"。line は外側のループの回ごとに \"\" に戻されます。表示はそのたびに 1 行です。","common_mistakes":[{"answer":"***\n***\n***","reason":"内側のループの回数は i です。i = 1 なら 1 回、i = 2 なら 2 回と増えていきます。"},{"answer":"*\n*\n*","reason":"内側のループの中で line に * を足し込むので、i が大きくなるほど * が増えます。"}],"hint":"外側の i が 1 回進むごとに、内側のループは最初から回ります。","feedback_correct":"正解！入れ子のループを正確に追えました。","feedback_incorrect":"惜しい！i ごとに内側のループが何回回るか確認しましょう。"},{"id":"PY-093","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":3,"title":"最大値を求める考え方","type":"multiple_choice","answer_mode":"choice","difficulty":4,"concepts":["アルゴリズムの考え方","最大値","for"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"max() を使わずに、リストの最大値を求めるプログラムを作ります。考え方として最も適切なものはどれですか？","code":null,"choice_format":"text","choices":[{"id":"c1","text":"全部足して、個数で割る"},{"id":"c2","text":"最初の要素を暫定の最大値とし、残りの要素と比べて、より大きければ更新する"},{"id":"c3","text":"リストの最後の要素を最大値とみなす"}],"answer":{"correct_choice_id":"c2"},"grading":{"method":"choice_id"},"rationale":"すべての要素を順に比べ、これまでの最大より大きければ更新する方法で最大値が分かるから。","explanation":"定番の方法は、最初の要素を暫定の最大値にして、残りを順に比べることです。大きい値が見つかったら最大値を更新します。最後まで終わったとき、暫定の最大値が本当の最大値です。","wrong_answer_reasons":{"c1":"それは平均を求める方法です。最大値は、値同士を比べて見つけます。","c3":"最後の要素がいつも最大とは限りません。すべての要素を比べる必要があります。"},"hint":"1つずつ比べて、「これまでで一番大きい値」を覚えていくイメージです。","feedback_correct":"正解！暫定の最大値を更新していく方法です。","feedback_incorrect":"惜しい！値同士を比べる方法はどれでしょう？"},{"id":"PY-094","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":4,"title":"最大値を更新する条件","type":"fill_blank","answer_mode":"text","difficulty":4,"concepts":["比較演算子","最大値","for"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"リストの最大値を求めます。空欄 __1__ に入れる比較演算子を答えてください。","code":"nums = [3, 9, 4]\nbiggest = nu  を表示します。しかも足している数も変わりません。"},"hint":"余りが 1 になるのは偶数でしょうか、奇数でしょうか？","feedback_correct":"正解！偶数は余りが0です。","feedback_incorrect":"惜しい！足されている数 1 と 3 に注目しましょう。"},{"id":"PY-096","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":6,"title":"合否のカウント","type":"predict_output","answer_mode":"text","difficulty":4,"concepts":["辞書","関数","for","境界値"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"次のコードを実行したときの表示を入力してください。辞書は print すると {キー: 値, ...} の形で表示されます（文字列のキーは引用符付き）。","code":"def grade_count(scores):\n    result = {\"合格\": 0, \"不合格\": 0}\n    for s in scores:\n        if s >= 60:\n            result[\"合格\"] += 1\n        else:\n            result[\"不合格\"] += 1\n    return result\n\nprint(grade_count([70, 40, 60, 59]))","answer":{"expected_output":"{'合格': 2, '不合格': 2}"},"grading":{"method":"output_compare","normalize":["crlf_to_lf","rstrip_each_line","strip_trailing_blank_lines"],"case_sensitive":true},"rationale":"70と60が合格、40と59が不合格で、それぞれ2人ずつになるから。","explanation":"s が 70 → 合格。40 → 不合格。60 → 60 以上なので合格（境界）。59 → 不合格。結果は 合格 2、不合格 2 です。辞書の表示は元の順序（合格、不合格）のまま {'合格': 2, '不合格': 2} となります。","common_mistakes":[{"answer":"{'合格': 1, '不合格': 3}","reason":"60 点は 60 以上なので合格です。70 と 60 の2人が合格になります。"},{"answer":"{'合格': 3, '不合格': 1}","reason":"59 点は 60 未満なので不合格です。40 と 59 の2人が不合格になります。"}],"hint":"境界の 60 は合格側でしょうか？ 1人ずつ判定して数えましょう。","feedback_correct":"正解！関数・辞書・条件を組み合わせて読めました。","feedback_incorrect":"惜しい！1人ずつ、合格か不合格かを判定してみましょう。"},{"id":"PY-097","course_id":"python-basics-ja","language":"python","stage_id":"S10","stage_number":10,"number_in_stage":7,"title":"FizzBuzz の関数","type":"code_write","answer_mode":"code","difficulty":4,"concepts":["関数","if/elif/else","%","str","条件の順序"],"preconditions":"ステージ1〜10で学習した内容のみを前提とする。import（ステージ9の random のみ例外）と標準入力(input)は使わない。","prompt":"整数 n を受け取り、次の文字列を返す関数 fizzbuzz(n) を作ってください。\n・15 の倍数なら \"FizzBuzz\"\n・3 の倍数なら \"Fizz\"\n・5 の倍数なら \"Buzz\"\n・それ以外は n を文字列にしたもの（例: 7 なら \" <script id="pyworker" type="text/plain">
/* 学習者のコードを実行する Web Worker（Pyodide）。
 * 主スレッド（画面）とは隔離され、DOM・localStorage には触れない。
 * 時間制限は主スレッド側のタイマー＋ Worker の terminate() で行う（pyrunner.js）。 */
let pyodide = null;
const OUTPUT_LIMIT = 64 * 1024; // 標準出力の上限（文字数）

const HELPER = `
import ast, json, sys, builtins, traceback

_ALLOWED_IMPORTS = {"random"}
_real_import = builtins.__import__

def _safe_import(name, globals=None, locals=None, fromlist=(), level=0):
    if name.split(".")[0] not in _ALLOWED_IMPORTS:
        raise ImportError("この学習アプリでは " + name + " は使えません")
    return _real_import(name, globals, locals, fromlist, level)

def _make_ns():
    b = dict(vars(builtins))
    b["__import__"] = _safe_import
    for k in ("open", "input", "exec", "eval", "compile", "breakpoint", "exit", "quit", "help", "memoryview"):
        b.pop(k, None)
    return {"__name__": "__main__", "__builtins__": b}

def static_check(job_json):
    j = json.loads(job_json)
    try:
        tree = ast.parse(j["student"])
    except SyntaxError as e:
        return json.dumps({"ok": False, "message": "構文エラー（%s行目）: %s" % (e.lineno, e.msg)})
    present = {type(n).__name__ for n in ast.walk(tree)}
    missing = [r for r in j["required"] if r not in present]
    if missing:
        return json.dumps({"ok": False, "message": "この問題で使う必要がある書き方が含まれていません: " + ", ".join(missing)})
    if j["any"] and not any(r in present for r in j["any"]):
        return json.dumps({"ok": False, "message": "次のいずれかを使ってください: " + " / ".join(j["any"])})
    return json.dumps({"ok": True})

def _student_line(e, offset):
    tb = e.__traceback__
    line = None
    while tb is not None:
        if tb.tb_frame.f_code.co_filename == "<student>":
            line = tb.tb_lineno - offset
        tb = tb.tb_next
    return line

def run_test(job_json):
    j = json.loads(job_json)
    offset = j["setup"].count("\\n") + 1
    ns = _make_ns()
    try:
        code = compile(j["setup"] + "\\n" + j["student"] + "\\n", "<student>", "exec")
        exec(code, ns)
        if j["kind"] == "call":
            r = eval(compile(j["call"], "<call>", "eval"), ns)
            actual = repr(r)
            ok = actual == repr(ast.literal_eval(j["expected"]))
            return json.dumps({"ok": ok, "actual": actual})
        return json.dumps({"ok": True})
    except SyntaxError as e:
        ln = (e.lineno - offset) if e.lineno else None
        return json.dumps({"ok": False, "error": "SyntaxError: %s%s" % (e.msg, "（%s行目）" % ln if ln and ln > 0 else "")})
    except BaseException as e:
        ln = _student_line(e, offset)
        return json.dumps({"ok": False, "error": "%s: %s%s" % (type(e).__name__, e, "（%s行目）" % ln if ln and ln > 0 else "")})
    finally:
        sys.stdout.flush()
`;

function lockDown() {
  // 学習者コードが js モジュール経由で外部通信できないようにする（core のみ使用するため、初期化後は不要）
  for (const name of ["fetch", "XMLHttpRequest", "WebSocket", "EventSource", "importScripts", "indexedDB", "caches"]) {
    try { Object.defineProperty(self, name, { value: undefined, configurable: false, writable: false }); } catch (e) { /* 無視 */ }
  }
}

self.onmessage = async (ev) => {
  const m = ev.data;
  if (m.type === "init") {
    try {
      importScripts(m.url + "pyodide.js");
      pyodide = await self.loadPyodide({ indexURL: m.url });
      pyodide.runPython(HELPER);
      const py = pyodide.runPython("import sys; sys.version.split()[0]");
      lockDown();
      self.postMessage({ type: "ready", python: py, pyodide: pyodide.version });
    } catch (e) {
      self.postMessage({ type: "initerror", message: String((e && e.message) || e) });
    }
    return;
  }
  if (m.type === "run") {
    let out = "";
    let truncated = false;
    // 前回の実行で出力の途中で打ち切られた場合に、残りの出力が今回に混ざらないよう捨てる
    pyodide.setStdout({ batched: () => {} });
    try { pyodide.runPython("import sys; sys.stdout.flush()"); } catch (e) { /* 無視 */ }
    pyodide.setStdout({
      batched: (s) => {
        if (out.length + s.length + 1 > OUTPUT_LIMIT) { truncated = true; throw new Error("出力が長すぎます（上限 64KB）"); }
        out += s + "\n";
      },
    });
    pyodide.setStderr({ batched: () => {} });
    let res;
    try {
      const fn = pyodide.globals.get(m.op === "static" ? "static_check" : "run_test");
      try { res = JSON.parse(fn(JSON.stringify(m.job))); } finally { fn.destroy(); }
    } catch (e) {
      res = { ok: false, error: String((e && e.message) || e) };
    }
    self.postMessage({ type: "result", id: m.id, res, out, truncated });
  }
};

</script>
<script>
/* 自動採点（docs/05_grading_spec.md の JavaScript 実装）
 * 対応: choice_id / output_compare / accepted_answers
 * 非対応: test_cases（Python の実行環境が必要。試作では自己採点にする） */
const Grader = (function () {
  function normOutput(s) {
    const lines = String(s).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").map((l) => l.trimEnd());
    while (lines.length && lines[lines.length - 1] === "") lines.pop();
    return lines.join("\n");
  }

  function normAnswer(s, quoteInsensitive) {
    let t = String(s).normalize("NFKC").trim();
    if (quoteInsensitive) t = t.replace(/'/g, '"');
    return t;
  }

  /** 回答の形: choice=選択肢ID文字列 / 穴埋め={b1:"..."} / 入力式=文字列 */
  function grade(q, answer) {
    const a = q.answer;
    switch (q.grading.method) {
      case "choice_id":
        return answer === a.correct_choice_id;
      case "output_compare":
        return normOutput(answer) === normOutput(a.expected_output);
      case "accepted_answers":
        if (q.type === "fill_blank") {
          return a.blanks.every((b) => {
            const given = normAnswer(answer[b.id] || "", b.quote_insensitive);
            return b.accepted.some((x) => normAnswer(x, b.quote_insensitive) === given);
          });
        } else {
          const qi = !!a.quote_insensitive;
          const given = normAnswer(answer, qi);
          return a.accepted.some((x) => normAnswer(x, qi) === given);
        }
      default:
        throw new Error("unsupported grading method: " + q.grading.method);
    }
  }

  /** 不正解のとき、既知のよくある誤答に一致すればその理由を返す（なければ null） */
  function matchMistake(q, answer) {
    const list = q.common_mistakes || [];
    for (const m of list) {
      if (q.type === "fill_blank") {
        const b = q.answer.blanks.find((x) => x.id === m.blank);
        if (b && normAnswer(answer[m.blank] || "", b.quote_insensitive) === normAnswer(m.answer, b.quote_insensitive)) return m.reason;
      } else if (q.type === "predict_output") {
        if (normOutput(answer) === normOutput(m.answer)) return m.reason;
      } else if (q.type === "bug_fix") {
        const qi = !!q.answer.quote_insensitive;
        if (normAnswer(answer, qi) === normAnswer(m.answer, qi)) return m.reason;
      }
    }
    return null;
  }

  function isSupported(q) {
    return q.grading.method !== "test_cases";
  }

  return { normOutput, normAnswer, grade, matchMistake, isSupported };
})();

if (typeof module !== "undefined") module.exports = Grader;

</script>
<script>
/* Pyodide を Web Worker で動かし、コード作成問題を test_cases で自動採点する（主スレッド側）。
 * - 初回のみ CDN（jsDelivr, バージョン固定）から Pyodide を読み込む。ネットワークがないと使えない。
 * - テスト1件ごとに新しい名前空間で実行。制限時間を超えたら Worker ごと terminate() して作り直す。 */
const PyRunner = (function () {
  const CDN = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
  const INIT_TIMEOUT_MS = 90000;
  let worker = null;
  let readyP = null;
  let seq = 0;
  const pending = new Map();

  function failAllPending(message) {
    pending.forEach((cb) => cb({ type: "result", res: { ok: false, error: message }, out: "", truncated: false }));
    pending.clear();
  }

  function start() {
    const src = document.getElementById("pyworker").textContent;
    const blobUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    const w = new Worker(blobUrl);
    worker = w;
    readyP = new Promise((resolve, reject) => {
      const timer = setTimeout(() => { w.terminate(); reject(new Error("Python の読み込みがタイムアウトしました")); }, INIT_TIMEOUT_MS);
      w.onmessage = (ev) => {
        const m = ev.data;
        if (m.type === "ready") {
          clearTimeout(timer);
          w.onmessage = (e2) => {
            const r = e2.data;
            if (r.type === "result") { const cb = pending.get(r.id); if (cb) { pending.delete(r.id); cb(r); } }
          };
          resolve({ python: m.python, pyodide: m.pyodide });
        } else if (m.type === "initerror") { clearTimeout(timer); reject(new Error(m.message)); }
      };
      w.onerror = (e) => { clearTimeout(timer); const msg = (e && e.message) || "Worker エラー"; reject(new Error(msg)); failAllPending(msg); };
      w.postMessage({ type: "init", url: CDN });
    });
    readyP.catch(() => { if (worker === w) { worker = null; readyP = null; } });
    return readyP;
  }

  function ready() { return readyP || start(); }

  /** op: "static" | "test"。制限時間超過なら {timeout:true} を返し、Worker を作り直す。 */
  async function run(op, job, timeoutMs) {
    await ready();
    const w = worker;
    const id = ++seq;
    return new Promise((resolve) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        w.terminate();
        if (worker === w) { worker = null; readyP = null; }
        resolve({ timeout: true });
      }, timeoutMs);
      pending.set(id, (m) => { clearTimeout(timer); resolve(m); });
      w.postMessage({ type: "run", id, op, job });
    });
  }

  /** 採点: 静的チェック → 各テスト。onProgress(done, total) は任意。 */
  async function gradeCode(q, student, onProgress) {
    const g = q.grading;
    const limit = (g.timeout_sec || 5) * 1000;
    const sc = await run("static", { student, required: g.required_ast_nodes, any: g.required_any_ast_nodes }, limit);
    if (sc.timeout) return { correct: false, staticMessage: "チェックに時間がかかりすぎました", results: [] };
    if (!sc.res.ok) return { correct: false, staticMessage: sc.res.message, results: [] };
    const results = [];
    for (let i = 0; i < g.tests.length; i++) {
      const t = g.tests[i];
      const r = await run("test", { student, setup: t.setup || "", kind: t.kind, call: t.call || "", expected: t.expected || "" }, limit);
      const row = { t, ok: false, timeout: !!r.timeout, error: null, actual: null, out: "" };
      if (r.timeout) { row.error = "時間切れ（" + g.timeout_sec + "秒）。無限ループになっていないか確認しましょう。"; }
      else {
        row.out = r.out;
        if (r.res.error) row.error = r.res.error;
        else if (t.kind === "stdout") { row.ok = Grader.normOutput(r.out) === Grader.normOutput(t.expected_stdout); row.actual = r.out; }
        else { row.ok = !!r.res.ok; row.actual = r.res.actual; }
        if (r.truncated) row.error = "出力が長すぎます（上限 64KB）";
        if (r.truncated) row.ok = false;
      }
      results.push(row);
      if (onProgress) onProgress(i + 1, g.tests.length);
      if (r.timeout) {
        // 時間切れのたびに Worker の作り直しが必要なので、残りのテストは実行せず不合格として扱う
        for (let k = i + 1; k < g.tests.length; k++) results.push({ t: g.tests[k], ok: false, timeout: false, skipped: true, error: "前のテストが時間切れだったため実行していません", actual: null, out: "" });
        break;
      }
    }
    return { correct: results.every((x) => x.ok), staticMessage: null, results };
  }

  /** 「実行して試す」: 前提コード＋学習者コードを実行し、出力かエラーを返す */
  async function tryRun(q, student) {
    const r = await run("test", { student, setup: q.prefix_code || "", kind: "stdout", call: "", expected: "" }, (q.grading.timeout_sec || 5) * 1000);
    if (r.timeout) return { error: "時間切れ（無限ループの可能性があります）", out: "" };
    return { error: r.res.error || (r.truncated ? "出力が長すぎます（上限 64KB）" : null), out: r.out };
  }

  return { ready, run, gradeCode, tryRun };
})();

if (typeof module !== "undefined") module.exports = PyRunner;

</script>
<script>
/* PWA: Service Worker の登録、インストール案内、更新の通知（https または localhost でのみ有効） */
(function () {
  "use strict";
  const pwa = (window.__pwa = {
    installEvent: null,
    standalone: (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true,
  });
  const notify = () => window.dispatchEvent(new Event("pwa-installable"));
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); pwa.installEvent = e; notify(); });
  window.addEventListener("appinstalled", () => { pwa.installEvent = null; pwa.standalone = true; notify(); });

  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return; // file:// などでは登録しない
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    // 初回インストール（それまで管理するSWがなかった）では通知しない。更新時のみ「更新する」を出す
    if (!hadController) return;
    const b = document.getElementById("update-banner");
    if (b) b.hidden = false;
  });
  const reload = document.getElementById("update-reload");
  if (reload) reload.addEventListener("click", () => location.reload());
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service Worker の登録に失敗しました", e));
  });
})();

<script>
/* Python はじめの100問 — ブラウザ試作
 * 画面: ステージ一覧 / レッスン / 問題回答(+フィードバック) / ステージ結果 / 学習進捗
 * 自動採点: 選択・穴埋め・実行結果の予測・間違い探し。コード作成は自己採点（Python 実行環境が未接続のため）。 */
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const stages = DATA.curriculum.stages;
  const lessonByStage = Object.fromEntries(DATA.lessons.lessons.map((l) => [l.stage_id, l]));
  const questions = DATA.questions.questions;
  const qByStage = {};
  questions.forEach((q) => (qByStage[q.stage_id] = qByStage[q.stage_id] || []).push(q));
  const stageById = Object.fromEntries(stages.map((s) => [s.id, s]));
  const REQUIRED = stages[0].clear_condition.required_correct;
  const STARS = stages[0].clear_condition.stars;
  const TYPE_JA = { multiple_choice: "3択", predict_output: "実行結果の予測", fill_blank: "穴埋め", bug_fix: "間違い探し", code_write: "コード作成" };

  /* ---------- 小さなDOMヘルパー ---------- */
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    kids.flat(Infinity).forEach((c) => {
      if (c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
    return e;
  }
  const para = (t) => h("p", {}, t);
  const link = (href, text, cls) => h("a", { href, class: cls }, text);
  const code = (t) => h("pre", { class: "code" }, h("code", {}, t));

  /* ---------- 進捗の保存（localStorage。使えない環境ではメモリのみ） ---------- */
  const KEY = "pypath.v1";
  let state;
  function fresh() { return { stages: {}, unlockAll: false }; }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { return fresh(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 保存できない環境では無視 */ } }
  state = load();
  function ss(id) {
    if (!state.stages[id]) state.stages[id] = { answers: {}, cleared: false, bestStars: 0, attempts: 1 };
    return state.stages[id];
  }
  const answeredCount = (id) => Object.keys(ss(id).answers).length;
  const correctCount = (id) => Object.values(ss(id).answers).filter((a) => a.firstCorrect).length;
  const starsFor = (n) => (n >= STARS["3"] ? 3 : n >= STARS["2"] ? 2 : n >= STARS["1"] ? 1 : 0);
  function unlocked(s) {
    if (state.unlockAll || s.number === 1) return true;
    return ss("S" + String(s.number - 1).padStart(2, "0")).cleared;
  }

  /* ---------- ルーティング ---------- */
  const app = document.getElementById("app");
  function go(hash) { location.hash = hash; }
  function render() {
    const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
    app.replaceChildren();
    let view;
    try {
      if (parts[0] === "lesson") view = viewLesson(parts[1], parseInt(parts[2] || "0", 10));
      else if (parts[0] === "q") view = viewQuestion(parts[1], parseInt(parts[2] || "1", 10));
      else if (parts[0] === "result") view = viewResult(parts[1]);
      else if (parts[0] === "progress") view = viewProgress();
      else if (parts[0] === "selftest") view = viewSelfTest();
      else view = viewHome();
    } catch (e) {
      view = h("div", { class: "card" }, h("h2", {}, "表示エラー"), para(String(e && e.message || e)), link("#/", "ステージ一覧へ"));
      console.error(e);
    }
    app.append(view);
    window.scrollTo(0, 0);
    document.getElementById("nav-progress").setAttribute("aria-current", parts[0] === "progress" ? "page" : "false");
  }
  window.addEventListener("hashchange", render);
  // インストール可能になったとき（または完了したとき）、ステージ一覧を表示中なら案内を更新する
  window.addEventListener("pwa-installable", () => { if (!location.hash || location.hash === "#/") render(); });

  /* ---------- (1) ステージ一覧 ---------- */
  function viewHome() {
    const total = questions.length;
    const done = stages.reduce((n, s) => n + answeredCount(s.id), 0);
    const cleared = stages.filter((s) => ss(s.id).cleared).length;
    const root = h("div", {});
    root.append(
      h("section", { class: "hero" },
        h("h1", {}, "Python はじめの100問"),
        para("短い教科書を読んで、すぐ問題を解く。10ステージ・全100問。"),
        h("p", { class: "muted" }, "クリア " + cleared + "/10 ステージ ・ 回答済み " + done + "/" + total + " 問")
      )
    );
    const pwa = window.__pwa || {};
    if (!pwa.standalone) {
      if (pwa.installEvent) {
        root.append(h("div", { class: "install" }, h("span", {}, "アプリとしてインストールすると、ホーム画面から開けて、オフラインでも学習できます。"),
          h("button", { class: "btn primary", type: "button", onclick: async () => { const ev = pwa.installEvent; pwa.installEvent = null; ev.prompt(); try { await ev.userChoice; } catch (e) { /* 無視 */ } render(); } }, "インストール")));
      } else if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        root.append(h("div", { class: "install small" }, "iPhone / iPad では、共有ボタン →「ホーム画面に追加」でアプリとして使えます。"));
      }
    }
    const list = h("div", { class: "stage-list" });
    stages.forEach((s) => {
      const open = unlocked(s);
      const n = answeredCount(s.id);
      const st = ss(s.id);
      const status = st.cleared ? "クリア済み" : !open ? "ロック中" : n ? "学習中" : "未着手";
      const card = h(open ? "a" : "div", {
        class: "stage-card" + (open ? "" : " locked") + (st.cleared ? " cleared" : ""),
        href: open ? "#/lesson/" + s.id + "/0" : null,
        "aria-disabled": open ? null : "true",
      },
        h("div", { class: "stage-num" }, String(s.number)),
        h("div", { class: "stage-body" },
          h("div", { class: "stage-title" }, s.title),
          h("div", { class: "muted small" }, s.subtitle),
          h("div", { class: "meter", role: "img", "aria-label": n + "問回答済み/10問" }, h("span", { style: "width:" + n * 10 + "%" })),
          h("div", { class: "small" }, status + " ・ " + n + "/10問" + (!open ? "（ステージ" + (s.number - 1) + "をクリアすると開きます）" : ""))
        ),
        h("div", { class: "stars", "aria-label": "星" + st.bestStars }, "★".repeat(st.bestStars) + "☆".repeat(3 - st.bestStars))
      );
      list.append(card);
    });
    root.append(list);
    const dev = h("label", { class: "dev" },
      h("input", { type: "checkbox", checked: state.unlockAll ? true : null, onchange: (e) => { state.unlockAll = e.target.checked; save(); render(); } }),
      " 開発用: すべてのステージを開く"
    );
    root.append(dev, h("p", { class: "small" }, link("#/selftest", "開発用: コード採点の自己テスト")));
    return root;
  }

  /* ---------- (2) レッスン ---------- */
  function viewLesson(sid, idx) {
    const s = stageById[sid];
    if (!s) return viewHome();
    if (!unlocked(s)) return h("div", { class: "card" }, para("このステージはまだ開いていません。"), link("#/", "ステージ一覧へ"));
    const L = lessonByStage[sid];
    const sec = L.sections[idx];
    if (!sec) return viewLesson(sid, 0);
    const last = idx === L.sections.length - 1;
    const root = h("div", {});
    root.append(crumb(s, "教科書 " + (idx + 1) + "/" + L.sections.length));
    if (idx === 0) root.append(h("div", { class: "card intro" }, h("h3", {}, "この知識が役に立つ理由"), para(L.intro)));
    const c = h("div", { class: "card" }, h("h2", {}, sec.title), h("p", { class: "muted small" }, "読む目安: 約" + sec.read_minutes + "分"));
    sec.body.forEach((p) => c.append(para(p)));
    c.append(h("h3", {}, "用語"), h("dl", {}, sec.glossary.map((g) => [h("dt", {}, g.term), h("dd", {}, g.definition)])));
    sec.examples.forEach((ex) => {
      c.append(h("h3", {}, "コード例: " + ex.title), code(ex.code));
      if (ex.expected_error) c.append(h("div", { class: "out err" }, h("b", {}, "エラーになります: "), ex.expected_error));
      else c.append(h("div", { class: "out" }, h("div", { class: "out-label" }, "実行結果"), h("pre", {}, ex.expected_output)));
      c.append(h("ul", { class: "notes" }, ex.line_notes.map((n) => h("li", {}, n))));
    });
    root.append(c);
    if (last) {
      const m = h("div", { class: "card" }, h("h3", {}, "よくある間違い"));
      L.common_mistakes.forEach((x) =>
        m.append(h("div", { class: "mistake" }, h("b", {}, x.title), code(x.wrong_code), h("p", {}, "理由: " + x.why), h("p", {}, "直し方: " + x.fix)))
      );
      m.append(h("h3", {}, "理解度チェック"), h("ul", { class: "check" }, L.checkpoints.map((x) => h("li", {}, x))), para(L.next_bridge));
      root.append(m);
    }
    const nav = h("div", { class: "actions" });
    if (idx > 0) nav.append(link("#/lesson/" + sid + "/" + (idx - 1), "← 前へ", "btn"));
    if (!last) nav.append(link("#/lesson/" + sid + "/" + (idx + 1), "次へ →", "btn primary"));
    else nav.append(link("#/q/" + sid + "/" + firstUnanswered(sid), "問題を解く →", "btn primary"));
    if (!last) nav.append(link("#/q/" + sid + "/" + firstUnanswered(sid), "レッスンをスキップして問題へ", "btn ghost"));
    root.append(nav);
    return root;
  }
  function firstUnanswered(sid) {
    const a = ss(sid).answers;
    const q = qByStage[sid].find((x) => !a[x.id]);
    return q ? q.number_in_stage : 1;
  }
  function crumb(s, tail) {
    return h("nav", { class: "crumb", "aria-label": "現在地" }, link("#/", "ステージ一覧"), " › ", "ステージ" + s.number + " " + s.title, tail ? " › " + tail : "");
  }

  /* ---------- (3)(4) 問題回答とフィードバック ---------- */
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function record(sid, q, correct, last) {
    const a = ss(sid).answers;
    if (!a[q.id]) a[q.id] = { firstCorrect: correct, tries: 1, last: last };
    else { a[q.id].tries += 1; a[q.id].last = last; }
    save();
    return a[q.id];
  }

  function viewQuestion(sid, no) {
    const s = stageById[sid];
    if (!s) return viewHome();
    if (!unlocked(s)) return h("div", { class: "card" }, para("このステージはまだ開いていません。"), link("#/", "ステージ一覧へ"));
    const q = qByStage[sid][no - 1];
    if (!q) return viewResult(sid);
    const root = h("div", {});
    root.append(crumb(s, "問題 " + no + "/10"));
    root.append(h("div", { class: "meter big", role: "img", "aria-label": no + "問目/10問" }, h("span", { style: "width:" + (no - 1) * 10 + "%" })));

    const card = h("div", { class: "card question" });
    card.append(
      h("div", { class: "qmeta" },
        h("span", { class: "tag" }, q.id),
        h("span", { class: "tag" }, TYPE_JA[q.type]),
        h("span", { class: "tag", title: "難易度" }, "難易度 " + "●".repeat(q.difficulty) + "○".repeat(5 - q.difficulty))
      ),
      h("h2", {}, q.title)
    );
    q.prompt.split("\n").forEach((line) => card.append(line ? para(line.replace(/__(\d+)__/g, "【空欄$1】")) : h("div", { class: "gap" })));

    /* 回答UI（read: 回答の取得, lock: 入力の固定, mark: 結果の装飾） */
    const ui = buildAnswerUI(q);
    card.append(ui.node);

    const hintBox = h("div", { class: "hint", hidden: true }, h("b", {}, "ヒント: "), q.hint);
    const fb = h("div", { class: "feedback", "aria-live": "polite" });
    const actions = h("div", { class: "actions" });
    const hintBtn = h("button", { class: "btn ghost", type: "button", onclick: () => { hintBox.hidden = !hintBox.hidden; } }, "ヒント");
    const lessonBtn = link("#/lesson/" + sid + "/0", "教科書を見る", "btn ghost");
    let submitBtn, fallbackBtn, runBtn;

    function nextTarget() { return no < 10 ? "#/q/" + sid + "/" + (no + 1) : "#/result/" + sid; }

    function showFeedback(correct, info) {
      fb.replaceChildren();
      fb.className = "feedback " + (correct ? "ok" : "ng");
      fb.append(h("div", { class: "verdict" }, h("span", { class: "icon", "aria-hidden": "true" }, correct ? "○" : "×"), correct ? q.feedback_correct : q.feedback_incorrect));
      if (info.note) fb.append(h("p", { class: "small muted" }, info.note));
      if (!correct && info.shown) fb.append(h("div", { class: "answers" }, h("div", {}, h("b", {}, "あなたの回答: "), info.shown), h("div", {}, h("b", {}, "正解: "), info.right)));
      if (correct && info.right) fb.append(h("div", { class: "answers" }, h("div", {}, h("b", {}, "正解: "), info.right)));
      if (info.reason) fb.append(h("div", { class: "reason" }, h("b", {}, "この答えが違う理由: "), info.reason));
      fb.append(h("div", { class: "why" }, h("b", {}, "正解の根拠: "), q.rationale), h("div", { class: "expl" }, h("b", {}, "解説"), para(q.explanation)));
      if (info.extra) fb.append(info.extra);
      const row = h("div", { class: "actions" });
      if (!correct && (info.retry || info.retryFn)) row.append(h("button", { class: "btn", type: "button", onclick: info.retryFn || (() => render()) }, "もう一度挑戦"));
      row.append(link(nextTarget(), no < 10 ? "次の問題へ →" : "結果を見る →", "btn primary"));
      fb.append(row);
      fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    if (q.type === "code_write") {
      /* Pyodide(Web Worker)で test_cases を実行して自動採点。読み込めない環境では自己採点に切り替えられる */
      const status = h("p", { class: "small muted", role: "status" }, "Python を準備しています…（初回のみ数秒かかります）");
      const runOut = h("div", { class: "runout", hidden: true });
      submitBtn = h("button", { class: "btn primary", type: "button", disabled: true, onclick: () => autoGrade() }, "回答する（自動採点）");
      runBtn = h("button", { class: "btn", type: "button", disabled: true, onclick: () => tryIt() }, "実行して試す");
      fallbackBtn = h("button", { class: "btn ghost", type: "button", hidden: true, onclick: () => { fallbackBtn.hidden = true; reveal(); } }, "自己採点に切り替える");
      ui.node.append(status, runOut);
      PyRunner.ready().then((v) => {
        status.textContent = "Python " + v.python + " の準備ができました（Pyodide " + v.pyodide + "）";
        submitBtn.disabled = false; runBtn.disabled = false;
      }).catch((e) => {
        status.textContent = "Python を読み込めませんでした（" + e.message + "）。ネットワークを確認するか、自己採点に切り替えてください。";
        fallbackBtn.hidden = false;
      });

      async function tryIt() {
        runBtn.disabled = true; submitBtn.disabled = true;
        runOut.hidden = false;
        runOut.replaceChildren(h("p", { class: "small muted" }, "実行中…"));
        const r = await PyRunner.tryRun(q, ui.read());
        runOut.replaceChildren(
          h("div", { class: "out" }, h("div", { class: "out-label" }, "実行結果"), h("pre", {}, r.out || (r.error ? "" : "（出力はありません。関数を作る問題では、自分で print(関数名(...)) を書いて試せます）"))),
          r.error ? h("div", { class: "out err" }, h("b", {}, "エラー: "), r.error) : null
        );
        runBtn.disabled = false; submitBtn.disabled = false;
      }

      async function autoGrade() {
        const student = ui.read();
        if (!student.trim()) { fb.className = "feedback"; fb.replaceChildren(h("p", { class: "small muted" }, "コードを書いてから「回答する」を押してください。")); return; }
        submitBtn.disabled = true; runBtn.disabled = true;
        fb.className = "feedback";
        fb.replaceChildren(h("p", { class: "small muted", role: "status" }, "採点しています…"));
        const g = await PyRunner.gradeCode(q, student);
        record(sid, q, g.correct, "code");
        const a = q.answer;
        const rows = h("ul", { class: "tests" });
        let hiddenTotal = 0, hiddenOk = 0;
        g.results.forEach((r, i) => {
          if (!r.t.visible) { hiddenTotal += 1; if (r.ok) hiddenOk += 1; return; }
          const label = r.t.kind === "stdout"
            ? "出力を確かめる" + (r.t.setup ? "（前提: " + r.t.setup.replace(/\n/g, "; ") + "）" : "")
            : r.t.call + " の結果";
          const li = h("li", { class: r.ok ? "t-ok" : "t-ng" }, h("b", {}, (r.ok ? "✓ " : "✗ ") + label));
          if (!r.ok) {
            if (r.error) li.append(h("div", { class: "small" }, "エラー: " + r.error));
            else if (r.t.kind === "stdout") li.append(h("div", { class: "small" }, "期待:"), h("pre", { class: "inline-pre" }, r.t.expected_stdout), h("div", { class: "small" }, "実際:"), h("pre", { class: "inline-pre" }, r.actual || "（出力なし）"));
            else li.append(h("div", { class: "small" }, "期待: " + r.t.expected + " ／ 実際: " + r.actual));
          }
          rows.append(li);
        });
        const detail = h("div", { class: "testdetail" });
        if (g.staticMessage) detail.append(h("div", { class: "out err" }, g.staticMessage));
        if (rows.children.length) detail.append(h("b", {}, "テスト結果"), rows);
        if (hiddenTotal) detail.append(h("p", { class: "small" }, "非公開テスト: " + hiddenOk + "/" + hiddenTotal + " 合格" + (hiddenOk < hiddenTotal ? "（別の入力でも確かめてみましょう。例: 0・1つだけ・大きな値）" : "")));
        detail.append(h("details", {},
          h("summary", {}, g.correct ? "模範解答・別解・よくある不合格例を見る" : "模範解答を見る（見る前に、もう一度自分で考えてみましょう）"),
          h("b", {}, "模範解答"), code(a.reference_solution),
          a.alternative_solutions.length ? [h("b", {}, "別解（これも正解です）"), a.alternative_solutions.map(code)] : null,
          g.correct ? [h("b", {}, "こう書くと不合格になります"), a.rejected_examples.map((r) => h("div", {}, code(r.code), h("p", { class: "small" }, "理由: " + r.reason)))] : null
        ));
        showFeedback(g.correct, {
          extra: detail,
          retryFn: () => { fb.className = "feedback"; fb.replaceChildren(); submitBtn.disabled = false; runBtn.disabled = false; },
        });
        if (g.correct) { ui.lock(); hintBtn.disabled = true; }
        else { submitBtn.disabled = false; runBtn.disabled = false; }
      }

      function reveal() {
        ui.lock();
        submitBtn.disabled = true; runBtn.disabled = true;
        const a = q.answer;
        const wrap = h("div", { class: "feedback selfcheck" },
          h("div", { class: "verdict" }, "模範解答と見比べましょう"),
          h("p", { class: "small muted" }, "この環境では Python を実行できないため、自己採点です。"),
          h("b", {}, "模範解答"), code(a.reference_solution),
          a.alternative_solutions.length ? h("details", {}, h("summary", {}, "別解（これも正解です）"), a.alternative_solutions.map(code)) : null,
          h("details", {}, h("summary", {}, "よくある不合格例"), a.rejected_examples.map((r) => h("div", {}, code(r.code), h("p", { class: "small" }, "理由: " + r.reason)))),
          h("details", {}, h("summary", {}, "テストケース"), h("ul", {}, q.grading.tests.map((t) => h("li", {}, t.visible ? (t.kind === "stdout" ? "出力が " + JSON.stringify(t.expected_stdout) + (t.setup ? "（前提: " + t.setup.replace(/\n/g, "; ") + "）" : "") : t.call + " → " + t.expected) : "（非公開テスト）")))),
          h("div", { class: "why" }, h("b", {}, "正解の根拠: "), q.rationale), h("div", { class: "expl" }, h("b", {}, "解説"), para(q.explanation)),
          h("p", {}, "自分のコードはどうでしたか？"),
          h("div", { class: "actions" },
            h("button", { class: "btn primary", type: "button", onclick: () => selfGrade(true) }, "できた"),
            h("button", { class: "btn", type: "button", onclick: () => selfGrade(false) }, "できなかった"))
        );
        card.append(wrap);
        wrap.scrollIntoView({ block: "nearest", behavior: "smooth" });
        function selfGrade(ok) {
          record(sid, q, ok, "self");
          wrap.querySelector(".actions").replaceWith(h("div", { class: "actions" }, h("span", { class: "muted" }, ok ? "「" + q.feedback_correct + "」" : "「" + q.feedback_incorrect + "」"), link(nextTarget(), no < 10 ? "次の問題へ →" : "結果を見る →", "btn primary")));
        }
      }
    } else {
      submitBtn = h("button", { class: "btn primary", type: "button", onclick: () => submit() }, "回答する");
      function submit() {
        const ans = ui.read();
        if (ans === null) { fb.replaceChildren(h("p", { class: "small muted" }, "答えを入力・選択してから「回答する」を押してください。")); return; }
        const correct = Grader.grade(q, ans);
        record(sid, q, correct, ans);
        ui.lock();
        submitBtn.disabled = true;
        hintBtn.disabled = true;
        const info = ui.describe(ans, correct);
        showFeedback(correct, info);
      }
    }
    actions.append(submitBtn);
    if (runBtn) actions.append(runBtn);
    actions.append(hintBtn, lessonBtn);
    if (fallbackBtn) actions.append(fallbackBtn);
    card.append(hintBox, actions, fb);
    root.append(card);
    return root;
  }

  /* 回答UIを問題の answer_mode / type に応じて作る */
  function buildAnswerUI(q) {
    if (q.answer_mode === "choice") return choiceUI(q);
    if (q.type === "fill_blank") return fillUI(q);
    if (q.type === "predict_output") return predictUI(q);
    if (q.type === "bug_fix") return bugfixTextUI(q);
    if (q.type === "code_write") return codeUI(q);
    throw new Error("unsupported question UI: " + q.id);
  }

  function choiceUI(q) {
    const node = h("div", {});
    if (q.code) node.append(code(q.code));
    const group = h("div", { class: "choices", role: "radiogroup", "aria-label": "選択肢" });
    const letters = ["A", "B", "C"];
    shuffled(q.choices).forEach((c, i) => {
      const input = h("input", { type: "radio", name: "choice", value: c.id });
      group.append(h("label", { class: "choice", "data-id": c.id }, input, h("span", { class: "letter" }, letters[i]),
        h("span", { class: "ctext" + (q.choice_format === "code" || c.text.includes("\n") ? " mono" : "") }, c.text)));
    });
    node.append(group);
    return {
      node,
      read: () => { const r = group.querySelector("input:checked"); return r ? r.value : null; },
      lock: () => group.querySelectorAll("input").forEach((i) => (i.disabled = true)),
      describe: (ans, correct) => {
        group.querySelectorAll(".choice").forEach((l) => {
          if (l.dataset.id === q.answer.correct_choice_id) l.classList.add("right");
          else if (l.dataset.id === ans) l.classList.add("wrong");
        });
        const text = (id) => q.choices.find((c) => c.id === id).text;
        return { shown: text(ans), right: text(q.answer.correct_choice_id), reason: correct ? null : q.wrong_answer_reasons[ans], retry: true };
      },
    };
  }

  function fillUI(q) {
    const node = h("div", {});
    const pre = h("pre", { class: "code fill" });
    const inputs = {};
    q.code.split(/(__\d+__)/).forEach((part) => {
      const m = part.match(/^__(\d+)__$/);
      if (!m) { pre.append(part); return; }
      const id = "b" + m[1];
      const b = q.answer.blanks.find((x) => x.id === id);
      const width = Math.max(6, ...b.accepted.map((x) => x.length)) + 2;
      const input = h("input", { class: "blank", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", style: "width:" + width + "ch", "aria-label": "空欄" + m[1] });
      inputs[id] = input;
      pre.append(input);
    });
    node.append(pre, h("p", { class: "small muted" }, "半角で入力してください（全角は自動で半角として判定します）。"));
    return {
      node,
      read: () => { const v = {}; let any = false; for (const [id, el] of Object.entries(inputs)) { v[id] = el.value; if (el.value.trim()) any = true; } return any ? v : null; },
      lock: () => Object.values(inputs).forEach((i) => (i.disabled = true)),
      describe: (ans, correct) => {
        q.answer.blanks.forEach((b) => {
          const ok = b.accepted.some((x) => Grader.normAnswer(x, b.quote_insensitive) === Grader.normAnswer(ans[b.id] || "", b.quote_insensitive));
          inputs[b.id].classList.add(ok ? "right" : "wrong");
        });
        const fmt = (o) => q.answer.blanks.map((b, i) => "空欄" + (i + 1) + " = " + (o[b.id] === undefined ? "" : o[b.id])).join(" ／ ");
        const rightObj = {};
        q.answer.blanks.forEach((b) => (rightObj[b.id] = b.accepted[0]));
        return { shown: fmt(ans), right: fmt(rightObj) + (q.answer.blanks.some((b) => b.accepted.length > 1) ? "（他の書き方も正解）" : ""), reason: correct ? null : Grader.matchMistake(q, ans), note: correct ? null : null, retry: true };
      },
    };
  }

  function predictUI(q) {
    const node = h("div", {});
    if (q.code) node.append(code(q.code));
    const ta = h("textarea", { class: "answer-ta", rows: Math.min(6, Math.max(2, q.answer.expected_output.split("\n").length + 1)), "aria-label": "実行結果", spellcheck: "false", placeholder: "実行結果を入力（複数行は改行して入力）" });
    node.append(ta, h("p", { class: "small muted" }, "行末の空白や末尾の改行は無視されます。大文字小文字・空白・記号は区別されます。"));
    return {
      node,
      read: () => (ta.value.trim() ? ta.value : null),
      lock: () => (ta.disabled = true),
      describe: (ans, correct) => {
        ta.classList.add(correct ? "right" : "wrong");
        return { shown: h("pre", { class: "inline-pre" }, ans), right: h("pre", { class: "inline-pre" }, q.answer.expected_output), reason: correct ? null : Grader.matchMistake(q, ans), retry: true };
      },
    };
  }

  function bugfixTextUI(q) {
    const node = h("div", {});
    const lines = q.code.split("\n");
    const tl = q.answer.target_line;
    const pre = h("pre", { class: "code fill" });
    let input;
    lines.forEach((ln, i) => {
      if (i + 1 === tl) {
        const indent = ln.match(/^\s*/)[0];
        const width = Math.max(10, ...q.answer.accepted.map((x) => x.length)) + 4;
        input = h("input", { class: "blank wide", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", style: "width:" + width + "ch", "aria-label": tl + "行目を書き直す", value: ln.trim() });
        pre.append(indent, input);
      } else pre.append(ln);
      if (i < lines.length - 1) pre.append("\n");
    });
    node.append(pre, h("p", { class: "small muted" }, tl + "行目だけを書き直してください（字下げは自動で付きます）。"));
    return {
      node,
      read: () => (input.value.trim() ? input.value : null),
      lock: () => (input.disabled = true),
      describe: (ans, correct) => {
        input.classList.add(correct ? "right" : "wrong");
        return { shown: ans, right: q.answer.accepted[0] + (q.answer.accepted.length > 1 ? "（他の書き方も正解）" : ""), reason: correct ? null : Grader.matchMistake(q, ans), retry: true, extra: h("div", {}, h("b", {}, "直したコード全体"), code(q.answer.fixed_code)) };
      },
    };
  }

  function codeUI(q) {
    const node = h("div", {});
    if (q.prefix_code) node.append(h("p", { class: "small muted" }, "あらかじめ用意されているコード（変更不可）:"), code(q.prefix_code));
    const ta = h("textarea", { class: "answer-ta mono", rows: 8, "aria-label": "コード", spellcheck: "false", value: q.starter_code });
    ta.value = q.starter_code;
    node.append(ta);
    return { node, read: () => ta.value, lock: () => (ta.readOnly = true), describe: () => ({}) };
  }

  /* ---------- (5) ステージ結果 ---------- */
  function viewResult(sid) {
    const s = stageById[sid];
    if (!s) return viewHome();
    const st = ss(sid);
    const n = correctCount(sid);
    const done = answeredCount(sid);
    const root = h("div", {});
    root.append(crumb(s, "結果"));
    if (done < 10) {
      root.append(h("div", { class: "card" }, h("h2", {}, "まだ全問に回答していません"), para("回答済み " + done + "/10 問。残りの問題に回答すると結果が出ます。"), link("#/q/" + sid + "/" + firstUnanswered(sid), "続きの問題へ", "btn primary")));
      return root;
    }
    const clear = n >= REQUIRED;
    const stars = starsFor(n);
    if (clear) { st.cleared = true; st.bestStars = Math.max(st.bestStars, stars); save(); }
    const missed = qByStage[sid].filter((q) => !st.answers[q.id].firstCorrect);
    root.append(
      h("div", { class: "card result " + (clear ? "ok" : "ng") },
        h("h2", {}, clear ? "ステージクリア！" : "あと少し！もう一度挑戦しましょう"),
        h("div", { class: "bigstars", "aria-label": "星" + stars }, "★".repeat(stars) + "☆".repeat(3 - stars)),
        h("p", { class: "score" }, "1回目の正解 ", h("b", {}, n + "/10"), " 問"),
        para("クリア条件: 1回目の回答で" + REQUIRED + "問以上正解（★" + STARS["1"] + "問 / ★★" + STARS["2"] + "問 / ★★★" + STARS["3"] + "問）。再挑戦での正解は数えません。"),
        clear && s.number < 10 ? para("次のステージ「" + stages[s.number].title + "」が開きました。") : null
      )
    );
    if (missed.length) {
      root.append(h("div", { class: "card" }, h("h3", {}, "復習しよう（1回目に間違えた問題）"),
        h("ul", { class: "missed" }, missed.map((q) => h("li", {}, link("#/q/" + sid + "/" + q.number_in_stage, q.number_in_stage + ". " + q.title), h("span", { class: "muted small" }, " — " + q.concepts.join("、")))))));
    }
    const actions = h("div", { class: "actions" });
    if (clear && s.number < 10) actions.append(link("#/lesson/S" + String(s.number + 1).padStart(2, "0") + "/0", "次のステージへ →", "btn primary"));
    actions.append(
      h("button", { class: "btn" + (clear ? "" : " primary"), type: "button", onclick: () => {
        if (!confirm("このステージの回答をリセットして、最初からやり直しますか？（クリア済みの記録は残ります）")) return;
        st.answers = {}; st.attempts += 1; save(); go("#/lesson/" + sid + "/0");
      } }, "このステージをやり直す"),
      link("#/", "ステージ一覧へ", "btn ghost")
    );
    root.append(actions);
    return root;
  }

  /* ---------- 開発用: コード作成の採点テスト（#/selftest） ----------
   * 13問それぞれについて、模範解答・別解は合格、初期コード・不合格例は不合格になることを Pyodide 上で確認する。 */
  function viewSelfTest() {
    const root = h("div", {}, h("h1", {}, "コード採点の自己テスト"), para("Pyodide 上で、全コード作成問題の模範解答・別解・不合格例・初期コードを採点して、期待どおりの結果になるかを確認します。"));
    const status = h("p", { role: "status" }, "Python を準備しています…");
    const table = h("table", { class: "tbl" }, h("thead", {}, h("tr", {}, ["問題", "ケース", "期待", "結果", "判定"].map((t) => h("th", {}, t)))));
    const tb = h("tbody", {});
    table.append(tb);
    const summary = h("p", { class: "score", id: "selftest-summary" });
    const timeoutBtn = h("button", { class: "btn", type: "button", disabled: true }, "時間切れ・禁止機能のテストも実行（約10秒）");
    const extra = h("div", { id: "selftest-extra" });
    root.append(status, summary, h("div", { class: "scroll" }, table), h("div", { class: "actions" }, timeoutBtn), extra);
    const add = (q, name, expect, got, ok) =>
      tb.append(h("tr", { class: ok ? "" : "t-ng" }, h("td", {}, q), h("td", {}, name), h("td", {}, expect ? "合格" : "不合格"), h("td", {}, got ? "合格" : "不合格"), h("td", {}, ok ? "OK" : "NG")));
    (async () => {
      let info;
      try { info = await PyRunner.ready(); } catch (e) { status.textContent = "Python を読み込めませんでした: " + e.message; return; }
      status.textContent = "Python " + info.python + "（Pyodide " + info.pyodide + "）で実行中…";
      let n = 0, bad = 0;
      for (const q of questions.filter((x) => x.type === "code_write")) {
        const cases = [["初期コード", q.starter_code, false], ["模範解答", q.answer.reference_solution, true]]
          .concat(q.answer.alternative_solutions.map((c, i) => ["別解" + (i + 1), c, true]))
          .concat(q.answer.rejected_examples.map((r, i) => ["不合格例" + (i + 1), r.code, false]));
        for (const [name, code, expect] of cases) {
          const g = await PyRunner.gradeCode(q, code);
          n += 1; if (g.correct !== expect) bad += 1;
          add(q.id, name, expect, g.correct, g.correct === expect);
        }
      }
      status.textContent = "Python " + info.python + "（Pyodide " + info.pyodide + "）";
      summary.textContent = "結果: " + n + " 件中 " + (n - bad) + " 件が期待どおり（NG " + bad + " 件）";
      timeoutBtn.disabled = false;
    })();
    timeoutBtn.addEventListener("click", async () => {
      timeoutBtn.disabled = true;
      extra.replaceChildren(para("実行中…"));
      const q = questions.find((x) => x.id === "PY-040");
      const q10 = questions.find((x) => x.id === "PY-010");
      const cases = [
        ["無限ループは時間切れで不合格", q, "n = 0\nwhile True:\n    n += 1\nfor i in range(1):\n    pass", (g) => !g.correct && g.results.some((r) => r.timeout)],
        ["時間切れの後も正しいコードは合格", q, q.answer.reference_solution, (g) => g.correct],
        ["import os は禁止", q10, "import os\nprint('こんにちは')\nprint('Python')", (g) => !g.correct && g.results.some((r) => /ImportError/.test(r.error || ""))],
        ["open は使えない", q10, "open('x')\nprint('こんにちは')\nprint('Python')", (g) => !g.correct],
        ["import js（外部通信の入口）は禁止", q10, "import js\nprint('こんにちは')\nprint('Python')", (g) => !g.correct],
        ["大量出力は64KBで打ち切り", q10, "for i in range(10**7):\n    print('x' * 100)", (g) => !g.correct && g.results.some((r) => /長すぎ/.test(r.error || ""))],
        ["random は使える", q10, "import random\nprint('こんにちは')\nprint('Python')", (g) => g.correct],
        ["テストごとに新しい名前空間（前のテストの状態を持ち越さない）", questions.find((x) => x.id === "PY-060"), "calls = []\ndef is_even(n):\n    calls.append(n)\n    return n % 2 == 0 and len(calls) == 1", (g) => g.correct],
      ];
      const t2 = h("table", { class: "tbl" }, h("thead", {}, h("tr", {}, ["確認項目", "判定"].map((t) => h("th", {}, t)))));
      let bad = 0;
      for (const [name, qq, code, check] of cases) {
        const g = await PyRunner.gradeCode(qq, code);
        const ok = !!check(g); if (!ok) bad += 1;
        t2.append(h("tr", { class: ok ? "" : "t-ng" }, h("td", {}, name), h("td", {}, ok ? "OK" : "NG")));
      }
      extra.replaceChildren(h("p", { class: "score", id: "selftest-extra-summary" }, "安全性・制限の確認: " + (cases.length - bad) + "/" + cases.length + " 件OK"), h("div", { class: "scroll" }, t2));
    });
    return root;
  }

  /* ---------- (6) 学習進捗 ---------- */
  function viewProgress() {
    const root = h("div", {});
    root.append(h("h1", {}, "学習進捗"));
    const done = stages.reduce((n, s) => n + answeredCount(s.id), 0);
    const right = stages.reduce((n, s) => n + correctCount(s.id), 0);
    root.append(h("div", { class: "card" },
      h("p", {}, "クリアしたステージ: ", h("b", {}, stages.filter((s) => ss(s.id).cleared).length + "/10")),
      h("p", {}, "回答済みの問題: ", h("b", {}, done + "/100"), "　1回目の正答率: ", h("b", {}, done ? Math.round((right / done) * 100) + "%" : "—"))));
    const tbl = h("table", { class: "tbl" }, h("thead", {}, h("tr", {}, ["ステージ", "回答", "1回目の正解", "星", "状態"].map((t) => h("th", {}, t)))));
    const tb = h("tbody", {});
    stages.forEach((s) => {
      const st = ss(s.id);
      tb.append(h("tr", {}, h("td", {}, link(unlocked(s) ? "#/lesson/" + s.id + "/0" : "#/", s.number + ". " + s.title)), h("td", {}, answeredCount(s.id) + "/10"), h("td", {}, answeredCount(s.id) ? correctCount(s.id) + "/" + answeredCount(s.id) : "—"), h("td", {}, "★".repeat(st.bestStars) || "—"), h("td", {}, st.cleared ? "クリア" : unlocked(s) ? "学習可" : "ロック")));
    });
    tbl.append(tb);
    root.append(h("div", { class: "card" }, h("h3", {}, "ステージ別"), h("div", { class: "scroll" }, tbl)));
    const conc = {};
    questions.forEach((q) => {
      const a = ss(q.stage_id).answers[q.id];
      if (!a) return;
      q.concepts.forEach((c) => { conc[c] = conc[c] || { t: 0, r: 0 }; conc[c].t += 1; if (a.firstCorrect) conc[c].r += 1; });
    });
    const rows = Object.entries(conc).sort((x, y) => x[1].r / x[1].t - y[1].r / y[1].t || y[1].t - x[1].t);
    const weak = rows.filter(([, v]) => v.r < v.t).slice(0, 6);
    root.append(h("div", { class: "card" }, h("h3", {}, "復習のおすすめ（1回目に間違えた概念）"),
      weak.length ? h("ul", {}, weak.map(([k, v]) => h("li", {}, k + "（" + v.r + "/" + v.t + "）"))) : para(rows.length ? "間違えた概念はありません。" : "問題に回答すると、ここに表示されます。")));
    root.append(h("div", { class: "actions" }, h("button", { class: "btn ghost danger", type: "button", onclick: () => {
      if (!confirm("学習の記録をすべて消します。よろしいですか？")) return;
      state = fresh(); save(); go("#/"); render();
    } }, "学習データを消去")));
    return root;
  }

  render();
})();

</script>
